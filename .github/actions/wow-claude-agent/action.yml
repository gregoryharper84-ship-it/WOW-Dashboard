name: WOW Claude Agent Runner
description: Governed Anthropic/Claude Code runner for WOW V17 engineering fallback.

inputs:
  anthropic_api_key:
    description: Anthropic API key for fallback engineering.
    required: false
  claude_code_oauth_token:
    description: Claude Code OAuth token fallback authentication.
    required: false
  permission_profile:
    description: :read-only or :workspace
    required: false
    default: ":read-only"
  prompt:
    description: Agent prompt.
    required: true
  output_schema:
    description: JSON schema for structured output.
    required: true
  model:
    description: >-
      Optional model for the API-key path (e.g. claude-sonnet-5-5). The OAuth
      fallback keeps its own default so a plan limit cannot break it.
    required: false
    default: ""
  max_turns:
    description: Optional turn cap override (positive integer).
    required: false
    default: ""

outputs:
  structured_output:
    description: Structured JSON output from Claude Code.
    value: ${{ steps.claude_api.outputs.structured_output || steps.claude_oauth.outputs.structured_output }}
  conclusion:
    description: Provider execution conclusion.
    value: ${{ steps.claude_api.outputs.conclusion || steps.claude_oauth.outputs.conclusion }}

runs:
  using: composite
  steps:
    - name: Configure governed Claude tool lease
      id: config
      shell: bash
      env:
        PROFILE: ${{ inputs.permission_profile }}
        OUTPUT_SCHEMA: ${{ inputs.output_schema }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max_turns }}
      run: |
        set -euo pipefail
        if [ "$PROFILE" = ":workspace" ]; then
          turns=40
          tools='Edit,Read,Write,Glob,Grep,Bash(python -m pytest:*),Bash(python artifacts/wow-engine/v17/nightly_incident_records.py:*),Bash(python artifacts/wow-engine/v17/nightly_engineering_team_contract.py:*),Bash(python artifacts/wow-engine/v17/engineering_agent_team.py:*),Bash(git status),Bash(git diff:*),Bash(git log:*)'
        else
          # 24 was too low: read-only triage of broad incidents ran out (#1021).
          turns=40
          tools='Read,Glob,Grep,Bash(python -m pytest:*),Bash(python artifacts/wow-engine/v17/engineering_agent_team.py:*),Bash(git status),Bash(git diff:*),Bash(git log:*)'
        fi
        if [ -n "${MAX_TURNS:-}" ]; then
          [[ "$MAX_TURNS" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "::error::CLAUDE_MAX_TURNS_INVALID"; exit 1; }
          turns="$MAX_TURNS"
        fi
        model_arg=""
        if [ -n "${MODEL:-}" ]; then
          [[ "$MODEL" =~ ^claude-[a-z0-9.-]+$ ]] || { echo "::error::CLAUDE_MODEL_INVALID"; exit 1; }
          model_arg="--model $MODEL"
        fi
        for name in claude_args oauth_claude_args; do
          {
            echo "$name<<EOF"
            echo "--max-turns $turns"
            if [ "$name" = claude_args ] && [ -n "$model_arg" ]; then echo "$model_arg"; fi
            echo "--allowedTools \"$tools\""
            printf '%s\n' "--json-schema '$OUTPUT_SCHEMA'"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        done

    - name: Run governed Claude agent with API key
      id: claude_api
      if: inputs.anthropic_api_key != ''
      continue-on-error: true
      uses: anthropics/claude-code-base-action@16bc61eeac6dfaad1e3617aee9aefa59fce7c9be
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        prompt: ${{ inputs.prompt }}
        claude_args: ${{ steps.config.outputs.claude_args }}
        show_full_output: "false"

    - name: Run governed Claude agent with OAuth
      id: claude_oauth
      # A provider step may exit successfully without required structured_output.
      # In that case OAuth is eligible, rather than leaving the certification red.
      if: >-
        inputs.claude_code_oauth_token != '' &&
        (inputs.anthropic_api_key == '' || steps.claude_api.outcome == 'failure' ||
         steps.claude_api.outputs.structured_output == '')
      continue-on-error: true
      uses: anthropics/claude-code-base-action@16bc61eeac6dfaad1e3617aee9aefa59fce7c9be
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        prompt: ${{ inputs.prompt }}
        claude_args: ${{ steps.config.outputs.oauth_claude_args }}
        show_full_output: "false"

    - name: Verify provider result exists
      if: always()
      shell: bash
      env:
        API_RESULT: ${{ steps.claude_api.outputs.structured_output }}
        OAUTH_RESULT: ${{ steps.claude_oauth.outputs.structured_output }}
        API_OUTCOME: ${{ steps.claude_api.outcome }}
        OAUTH_OUTCOME: ${{ steps.claude_oauth.outcome }}
      run: |
        set -euo pipefail
        if [ -z "${API_RESULT:-}" ] && [ -z "${OAUTH_RESULT:-}" ]; then
          echo "::error::CLAUDE_STRUCTURED_OUTPUT_MISSING (api_outcome=${API_OUTCOME:-not-run}, oauth_outcome=${OAUTH_OUTCOME:-not-run})."
          exit 1
        fi
        # A nonempty provider string is not sufficient evidence of a typed agent
        # decision. JSON is required; downstream role gates still enforce fields.
        if [ "${API_OUTCOME:-}" = "failure" ] && [ -n "${OAUTH_RESULT:-}" ]; then
          echo "::warning::ANTHROPIC_API_KEY_PATH_FAILED: API-key attempt failed (check ANTHROPIC_API_KEY with wow-v17-anthropic-key-diagnostic); recovered via OAuth."
        fi
        RESULT="${API_RESULT:-${OAUTH_RESULT:-}}"
        if ! printf '%s' "$RESULT" | jq -e 'type == "object"' >/dev/null; then
          echo "::error::CLAUDE_STRUCTURED_OUTPUT_INVALID_JSON"
          exit 1
        fi

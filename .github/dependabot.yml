version: 2
updates:
  - package-ecosystem: pip
    directory: /artifacts/wow-engine
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "deps(wow-engine)"

  - package-ecosystem: pip
    directory: /artifacts/flask-scoring-api
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "deps(scoring-api)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "deps(actions)"

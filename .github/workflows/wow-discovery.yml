name: WOW Discovery (read-only)

# Runs a governance packet (e.g. governance/packets/V16-CLOSEOUT-DISCOVERY-00.md)
# through Claude Code in READ-ONLY mode: no Edit/Write/git-push tools available
# to the model. Output is uploaded as an artifact and posted as a PR comment
# on an auto-created discovery branch/PR — never merged automatically.
#
# Trigger: manual (workflow_dispatch) or on push of a new/changed packet file.
# This is intentionally NOT triggered on a schedule — discovery runs happen
# when a human decides a closeout package needs fresh evidence.

on:
  workflow_dispatch:
    inputs:
      packet_path:
        description: "Path to the packet spec file to run"
        required: true
        default: "governance/packets/V16-CLOSEOUT-DISCOVERY-00.md"
  push:
    paths:
      - "governance/packets/**"

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required by anthropics/claude-code-action@v1 itself, independent of
  # ANTHROPIC_API_KEY: confirmed on a live run (2026-08-30) -- without
  # this, the action's own GitHub-token bootstrap fails requesting an
  # OIDC token ("Unable to get ACTIONS_ID_TOKEN_REQUEST_URL env variable")
  # before Claude is ever invoked, so no execution_file is produced at
  # all. This is unrelated to the anthropic_federation_rule_id/WIF inputs
  # -- it's needed even when auth is a plain anthropic_api_key.
  id-token: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve packet path and load prompt
        id: packet
        run: |
          PACKET="${{ github.event.inputs.packet_path || 'governance/packets/V16-CLOSEOUT-DISCOVERY-00.md' }}"
          if [ ! -f "$PACKET" ]; then
            echo "Packet file not found: $PACKET"
            exit 1
          fi
          echo "path=$PACKET" >> "$GITHUB_OUTPUT"
          {
            echo "content<<PACKET_EOF"
            cat "$PACKET"
            echo "PACKET_EOF"
          } >> "$GITHUB_OUTPUT"

      # Anthropic's official Claude Code GitHub Action. Tool access is
      # restricted to read-only tools via claude_args (--allowedTools /
      # --disallowedTools): no Edit, no Write, no git push/commit tools.
      # This is the actual enforcement mechanism for "read-only" — not
      # just an instruction in the prompt text.
      #
      # Verified 2026-08-30 against anthropics/claude-code-action's
      # action.yml, docs/usage.md and docs/configuration.md: this action
      # does NOT expose allowed_tools / disallowed_tools / max_turns /
      # prompt_file / output_file as top-level `with:` inputs (an earlier
      # draft of this workflow guessed those names and would have hard-
      # failed on the very first run with "Unexpected input(s)"). The
      # real mechanism is `claude_args` for tool restriction and turn
      # limit, and plain-text `prompt`.
      - name: Run Claude Code (read-only reconnaissance)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.packet.outputs.content }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git branch:*),Bash(git diff:*),WebFetch"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git push:*),Bash(git commit:*),Bash(git checkout:*)"
            --max-turns 60

      # execution_file is a JSON array of Claude Code SDK event objects
      # (confirmed against anthropics/claude-code-action issue #1296 and
      # the base-action's documented event shape), not plain text -- the
      # final answer lives in the last {"type":"result",...} event's
      # `result` string.
      #
      # Confirmed against the Agent SDK's own ResultMessage definition:
      # `result` is `str | None` and is ONLY populated when
      # `subtype == "success"` -- every error subtype (error_max_turns,
      # error_during_execution, error_interrupted, error_invalid_request)
      # leaves it None. A 9-section reconnaissance packet hitting
      # --max-turns is a realistic outcome for this workflow, not a rare
      # edge case, so the fallback below is load-bearing, not cosmetic:
      # it concatenates EVERY assistant text block across the whole run,
      # in order -- not just the last one -- so a STOP_15 marker emitted
      # in an early turn survives into discovery-output.md (and therefore
      # into the grep below) even when the run aborts before, or without,
      # ever reaching a `result` event.
      #
      # The run's own completion status is recorded separately
      # (run_succeeded) and fail-closed on below, independent of what the
      # grep finds: an aborted/errored run must not be able to read as a
      # clean "no §15 issues found" just because the partial text it did
      # produce happened not to contain the marker.
      - name: Extract evidence text from execution_file
        id: evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = JSON.parse(fs.readFileSync('${{ steps.claude.outputs.execution_file }}', 'utf8'));

            const resultEvent = log.find(e => e && e.type === 'result');
            const runSucceeded = !!(resultEvent && resultEvent.subtype === 'success' && !resultEvent.is_error);

            const assistantText = log
              .filter(e => e && e.type === 'assistant' && e.message && Array.isArray(e.message.content))
              .flatMap(e => e.message.content.filter(c => c && c.type === 'text' && typeof c.text === 'string').map(c => c.text))
              .join('\n\n');

            let text = (resultEvent && typeof resultEvent.result === 'string' && resultEvent.result) || assistantText;

            if (!text) {
              text = 'Claude Code produced no extractable result or assistant text in execution_file. ' +
                     'See the wow-discovery-evidence artifact for the raw execution_file to investigate.';
            }

            fs.writeFileSync('discovery-output.md', text, 'utf8');
            fs.copyFileSync('${{ steps.claude.outputs.execution_file }}', 'execution-file.json');

            const statusNote = resultEvent
              ? `subtype=${resultEvent.subtype}, is_error=${!!resultEvent.is_error}`
              : 'no result event found in execution_file (run likely aborted before completion)';
            core.setOutput('run_succeeded', runSucceeded ? 'true' : 'false');
            core.setOutput('run_status_note', statusNote);

      - name: Check for §15 stop markers
        id: stop15
        run: |
          if grep -q "^STOP_15:" discovery-output.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "## §15 stop conditions detected in discovery output:" >> stop15-summary.md
            grep "^STOP_15:" discovery-output.md >> stop15-summary.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload evidence packet artifact
        uses: actions/upload-artifact@v4
        with:
          name: wow-discovery-evidence
          path: |
            discovery-output.md
            stop15-summary.md
            execution-file.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Open discovery evidence issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('discovery-output.md', 'utf8');
            const stop15 = '${{ steps.stop15.outputs.found }}' === 'true';
            const incomplete = '${{ steps.evidence.outputs.run_succeeded }}' !== 'true';
            const statusNote = ${{ toJSON(steps.evidence.outputs.run_status_note) }};

            // Fail closed on run completeness itself, independent of the
            // STOP_15 grep result -- see the comment on the extraction
            // step above for why a clean grep on an incomplete run can't
            // be trusted as "no §15 issues found".
            let title, labels;
            if (stop15 && incomplete) {
              title = '⚠️ WOW Discovery evidence — INCOMPLETE run + §15 stop condition(s) flagged';
              labels = ['wow-discovery', 'needs-human-review', 'stop-15', 'incomplete-run'];
            } else if (stop15) {
              title = '⚠️ WOW Discovery evidence — §15 stop condition(s) flagged';
              labels = ['wow-discovery', 'needs-human-review', 'stop-15'];
            } else if (incomplete) {
              title = '⚠️ WOW Discovery evidence — run did not complete (fail-closed, needs review)';
              labels = ['wow-discovery', 'needs-human-review', 'incomplete-run'];
            } else {
              title = 'WOW Discovery evidence packet';
              labels = ['wow-discovery', 'needs-human-review'];
            }

            const prefix = incomplete
              ? `**Run did not complete successfully** (${statusNote}). Evidence below may be partial.\n\n---\n\n`
              : '';
            const fullBody = prefix + body;
            // GitHub issue bodies cap around 65k chars — truncate defensively.
            const truncated = fullBody.length > 60000
              ? fullBody.slice(0, 60000) + '\n\n...[truncated, see workflow artifact for full packet]'
              : fullBody;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: truncated,
              labels,
            });

      - name: Fail loudly if §15 flagged
        if: steps.stop15.outputs.found == 'true'
        run: |
          echo "::warning::§15 stop condition(s) detected. See the created issue."
          echo "This is not a workflow failure — it is a required human checkpoint."
          echo "Discovery data is still valid and uploaded; do not auto-proceed to implementation."

      - name: Fail loudly if the run did not complete successfully
        if: steps.evidence.outputs.run_succeeded == 'false'
        run: |
          echo "::warning::Discovery run did not finish successfully (${{ steps.evidence.outputs.run_status_note }})."
          echo "Evidence is partial. Treat the created issue as incomplete, not as a clean 'no §15 issues found' result."

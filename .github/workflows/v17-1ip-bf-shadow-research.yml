name: v17-1ip-bf-shadow-research

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/wow-engine/mlb_1ip_bf_model.py"
      - "artifacts/wow-engine/scripts/build_mlb_1ip_bf_shadow_packet.py"
      - "artifacts/wow-engine/tests/test_mlb_1ip_bf_model.py"
      - ".github/workflows/v17-1ip-bf-shadow-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit regression
        run: python -m pytest -q tests/test_mlb_1ip_bf_model.py tests/test_mlb_1ip_batters_faced_shadow.py
      - name: Build leakage-safe historical BF shadow packet
        env:
          PYTHONPATH: .
          MLB_1IP_BF_RESEARCH_OUT: /tmp/mlb-1ip-bf-shadow
        run: python scripts/build_mlb_1ip_bf_shadow_packet.py
      - name: Upload immutable research packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-1ip-bf-shadow-research-${{ github.sha }}
          path: /tmp/mlb-1ip-bf-shadow
          if-no-files-found: error
          retention-days: 30

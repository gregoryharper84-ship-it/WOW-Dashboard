name: wow-v17-first-six-transport-rescue

on:
  schedule:
    - cron: "40 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wow-v17-first-six-transport-rescue.yml"
      - "artifacts/wow-engine/v17/team_state_runner_rescue.py"
      - "artifacts/wow-engine/v17/first_six_open_data_maintenance.py"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-first-six-transport-rescue.yml"
      - "artifacts/wow-engine/v17/team_state_runner_rescue.py"
      - "artifacts/wow-engine/v17/first_six_open_data_maintenance.py"
      - "artifacts/wow-engine/test_v17_source_heavy_runner_rescue.py"
      - "artifacts/wow-engine/test_v17_team_state_transport_isolation.py"

permissions:
  contents: read

concurrency:
  group: wow-v17-first-six-transport-rescue
  cancel-in-progress: false

jobs:
  rescue:
    name: Rescue first-six source-heavy scopes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scope:
          - MLB
          - NCAAB
          - SOCCER_EPL
          - SOCCER_BUNDESLIGA
          - SOCCER_LALIGA
          - SOCCER_SERIE_A
          - SOCCER_LIGUE_1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install governed model dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r artifacts/wow-engine/requirements.txt

      - name: Assert non-execution governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Acquire, fit, and persist governed source-heavy scope
        shell: bash
        env:
          TEAM_STATE_SCOPE: ${{ matrix.scope }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          sys.path.insert(0, str(Path("artifacts/wow-engine").resolve()))
          from v17.team_state_runner_rescue import prepare_source_heavy_scope

          origin = os.environ["WOW_ACTION_ORIGIN"].rstrip("/")
          scope = os.environ["TEAM_STATE_SCOPE"].strip().upper()
          result_path = Path(os.environ["RUNNER_TEMP"]) / "team-state-result.json"

          package = prepare_source_heavy_scope(
              scope=scope,
              training_code_sha=os.environ["GITHUB_SHA"],
          )
          result = package["result"]
          assert package["can_execute"] is False
          assert package["probability_publishable"] is False
          assert package["automatic_certification"] is False
          assert package["automatic_promotion"] is False
          assert result.get("can_execute") is False
          assert result.get("probability_publishable") is False

          def fresh_oidc_token():
              oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              oidc_url += ("&" if "?" in oidc_url else "?") + urllib.parse.urlencode(
                  {"audience": "wow-v17-multiscout"}
              )
              request = urllib.request.Request(
                  oidc_url,
                  headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)["value"]

          def persist(payload):
              body = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode("utf-8")
              last = None
              for attempt in range(1, 4):
                  request = urllib.request.Request(
                      origin + "/internal/v17/team-state-challenger-persist-batch",
                      data=body,
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {fresh_oidc_token()}",
                          "Content-Type": "application/json",
                          "User-Agent": "WOW-V17-source-heavy-runner/1.0",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=75) as response:
                          persisted = json.load(response)
                      assert persisted.get("status") == "PERSISTED", persisted
                      assert persisted.get("can_execute") is False, persisted
                      assert persisted.get("row_count") == len(payload["rows"]), persisted
                      return persisted
                  except urllib.error.HTTPError as exc:
                      error_body = exc.read().decode("utf-8", errors="replace")
                      last = f"HTTP_{exc.code}:{error_body[:400]}"
                      if exc.code not in {429, 502, 503, 504}:
                          raise RuntimeError(last) from exc
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = type(exc).__name__
                  if attempt < 3:
                      time.sleep(5 * attempt)
              raise RuntimeError(f"TEAM_STATE_PERSIST_TRANSPORT_EXHAUSTED:{scope}:{last}")

          persisted_rows = 0
          persisted_requests = 0
          for captured in package["batches"]:
              rows = captured["rows"]
              for offset in range(0, len(rows), 100):
                  payload = {
                      "table": captured["table"],
                      "rows": rows[offset:offset + 100],
                      "on_conflict": captured["on_conflict"],
                      "ignore_duplicates": True,
                  }
                  persisted = persist(payload)
                  persisted_rows += int(persisted["row_count"])
                  persisted_requests += 1

          summary = {
              "scope": scope,
              "status": result.get("status"),
              "candidate_rows_updated": result.get("candidate_rows_updated"),
              "candidate_rows_blocked": result.get("candidate_rows_blocked"),
              "terminal_code": ((result.get("rows") or [{}])[0]).get("code"),
              "captured_batches": package["batch_count"],
              "persisted_requests": persisted_requests,
              "persisted_rows": persisted_rows,
              "automatic_certification": False,
              "automatic_promotion": False,
              "probability_publishable": False,
              "can_execute": False,
          }
          result_path.write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload governed scope result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-six-source-heavy-${{ matrix.scope }}
          path: ${{ runner.temp }}/team-state-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Cool down before next source-heavy scope
        shell: bash
        run: sleep 20

  pr-contract:
    name: Verify rescue workflow governance contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert runner-side rescue keeps governance closed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/wow-v17-first-six-transport-rescue.yml').read_text()
          required = [
              'WOW_CAN_EXECUTE: "false"',
              'WOW_DRY_RUN_ONLY: "true"',
              'max-parallel: 1',
              'prepare_source_heavy_scope',
              'team-state-challenger-persist-batch',
              'probability_publishable',
              'automatic_certification',
              'automatic_promotion',
              'can_execute',
              'SOCCER_LIGUE_1',
          ]
          missing = [item for item in required if item not in text]
          assert not missing, missing
          old_sync_path = '/internal/v17/team-state-challenger-' + 'maintenance/{scope}'
          assert old_sync_path not in text
          PY
name: wow-odds-router-verify
on:
  pull_request:
    paths:
      - 'artifacts/wow-odds-router/**'
      - '.github/workflows/wow-odds-router-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: artifacts/wow-odds-router
        run: pip install -r requirements.txt
      - name: Run router tests
        working-directory: artifacts/wow-odds-router
        run: pytest -q

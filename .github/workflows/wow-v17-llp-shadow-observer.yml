name: wow-v17-llp-shadow-observer

on:
  schedule:
    # Four prospective checkpoints per UTC day. Repeated immutable predictions
    # dedupe by prediction + side + lambda, so cadence does not multiply evidence.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-llp-shadow-observer.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/v17/core_intelligence_runtime.py"
      - "artifacts/wow-engine/v17/llp_v17_1_shadow_internal_routes.py"
      - "artifacts/wow-engine/v17/llp_v17_1_shadow_runtime.py"
      - "artifacts/wow-engine/v17/llp_v17_1_shadow_scorecard.py"
      - "artifacts/wow-engine/v17/llp_v17_1_shadow_scorecard_runtime.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-llp-shadow-observer.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/v17/core_intelligence_runtime.py"
      - "artifacts/wow-engine/v17/llp_v17_1_shadow_internal_routes.py"
      - "artifacts/wow-engine/v17/llp_v17_1_shadow_runtime.py"
      - "artifacts/wow-engine/v17/llp_v17_1_shadow_scorecard.py"
      - "artifacts/wow-engine/v17/llp_v17_1_shadow_scorecard_runtime.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"

permissions:
  contents: read

concurrency:
  group: wow-v17-llp-shadow-observer
  cancel-in-progress: false

jobs:
  verify:
    name: Verify LLP shadow observer contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run shadow observer and OIDC regressions
        run: >-
          python -m pytest -q
          test_v17_github_oidc.py
          v17/test_llp_v17_1_shadow_observer.py
          v17/test_llp_v17_1_shadow_runtime.py
          v17/test_llp_v17_1_shadow_scorecard.py

  shadow-observer:
    name: Capture, grade, and score LLP shadow evidence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      WOW_AUTOMATIC_PROMOTION: "false"
    steps:
      - name: Assert shadow-only governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test "$WOW_AUTOMATIC_PROMOTION" = "false"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Run governed LLP shadow evidence cycle
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          oidc_url += separator + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
          oidc_request = urllib.request.Request(
              oidc_url,
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(oidc_request, timeout=20) as response:
              token = json.load(response)["value"]

          origin = os.environ["WOW_ACTION_ORIGIN"].rstrip("/")

          def call(path, *, method="POST", timeout=90):
              request = urllib.request.Request(
                  origin + path,
                  data=b"" if method == "POST" else None,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.load(response)

          capture = call("/internal/v17/llp/shadow/capture?max_predictions=1000")
          grade = call("/internal/v17/llp/shadow/grade?max_outcomes=2000")
          scorecard = call(
              "/internal/v17/llp/shadow/scorecard?max_grades=10000&min_cohort_events=30",
              method="GET",
          )

          for name, payload in (("capture", capture), ("grade", grade), ("scorecard", scorecard)):
              assert payload.get("can_execute") is False, (name, payload)
              assert payload.get("automatic_promotion_allowed") is False, (name, payload)
              assert payload.get("production_mutation_allowed") is False, (name, payload)

          assert capture.get("status") == "PASS"
          assert grade.get("status") == "PASS"
          assert scorecard.get("status") in {"PASS", "NO_GRADED_SHADOW_ROWS"}

          print(json.dumps({
              "capture_source_predictions": capture.get("source_prediction_n"),
              "capture_shadow_observations": capture.get("shadow_observation_n"),
              "grade_candidates": grade.get("candidate_n"),
              "new_grade_rows": grade.get("grade_n"),
              "scorecard_status": scorecard.get("status"),
              "graded_unique_slate_events": scorecard.get("graded_unique_slate_event_n", 0),
              "lambda_grid": scorecard.get("lambda_grid", []),
              "automatic_promotion_allowed": False,
              "production_mutation_allowed": False,
              "can_execute": False,
          }, sort_keys=True))
          PY

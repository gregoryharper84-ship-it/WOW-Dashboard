name: MLB V2 apply governed integration

on:
  push:
    branches: [feature/mlb-v2-governed-probability-20260827]
    paths:
      - "artifacts/flask-scoring-api/tools/apply_mlb_v2_governed_integration.py"
      - ".github/workflows/mlb-v2-apply-governed-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply assertion-based integration patch
        working-directory: artifacts/flask-scoring-api
        run: python tools/apply_mlb_v2_governed_integration.py
      - name: Static verification
        working-directory: artifacts/flask-scoring-api
        run: |
          python -m py_compile \
            gate_engine/mlb_v2_features.py \
            gate_engine/mlb_v2_runtime.py \
            gate_engine/mlb_v2_hydrator.py \
            gate_engine/moneyline/sport_model.py \
            gate_engine/moneyline/pipeline.py \
            gate_engine/moneyline_probability.py \
            app.py
          grep -q 'mlb-moneyline-v2-rolling-2026' gate_engine/moneyline_probability.py
          grep -q 'MLB_V2_NATIVE_PLATT_POINT_LOCK' gate_engine/moneyline/pipeline.py
          grep -q '/wow/score-event' app.py
          grep -q 'scikit-learn==1.9.0' requirements.txt
          grep -q 'joblib>=1.5.3' requirements.txt
          echo 'MLB_V2_INTEGRATION_STATIC=PASS'
      - name: Commit applied integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/flask-scoring-api
          if git diff --cached --quiet; then
            echo 'No integration changes to commit'
          else
            git commit -m 'Integrate governed MLB V2 rolling probability runtime'
            git push origin HEAD:feature/mlb-v2-governed-probability-20260827
          fi

name: wow-v17-one-shot-reusable-oidc-1113

on:
  push:
    branches:
      - engineering/v17-reusable-oidc-1113

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply reusable workflow OIDC compatibility') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/v17-reusable-oidc-1113
          fetch-depth: 0

      - name: Apply exact reusable OIDC patch
        run: python scripts/patch_v17_reusable_oidc_1113.py

      - name: Run isolated OIDC contract regression
        run: |
          python -m pip install --quiet PyJWT fastapi cryptography
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('artifacts/wow-engine').resolve()))
          import github_actions_oidc as oidc

          def claims(workflow_ref, event_name, *, ref=oidc.REF):
              return {
                  'repository': oidc.REPOSITORY,
                  'repository_id': oidc.REPOSITORY_ID,
                  'repository_owner_id': oidc.REPOSITORY_OWNER_ID,
                  'ref': ref,
                  'workflow_ref': workflow_ref,
                  'event_name': event_name,
                  'runner_environment': 'github-hosted',
              }

          reusable_refs = (
              oidc.SPREAD_CERTIFICATION_REPLAY_WORKFLOW_REF,
              oidc.SPREAD_FORWARD_PRODUCTION_CANARY_WORKFLOW_REF,
              oidc.PRIORITY_PROP_LIFECYCLE_WORKFLOW_REF,
          )
          for workflow_ref in reusable_refs:
              validated = oidc.validate_github_actions_claims(claims(workflow_ref, 'workflow_call'))
              assert validated['event_name'] == 'workflow_call'
              assert validated['workflow_ref'] == workflow_ref
              print(f'PASS workflow_call exact allowlist: {workflow_ref}')

          for workflow_ref in (
              oidc.SPREAD_CERTIFICATION_REPLAY_WORKFLOW_REF,
              oidc.SPREAD_FORWARD_PRODUCTION_CANARY_WORKFLOW_REF,
              oidc.PRIORITY_PROP_LIFECYCLE_WORKFLOW_REF,
          ):
              validated = oidc.validate_github_actions_claims(claims(workflow_ref, 'workflow_run'))
              assert validated['event_name'] == 'workflow_run'

          for workflow_ref in (
              oidc.NFL_PROP_FORWARD_EVIDENCE_WORKFLOW_REF,
              oidc.MLB_PROP_FORWARD_EVIDENCE_WORKFLOW_REF,
              oidc.WNBA_PROP_FORWARD_EVIDENCE_WORKFLOW_REF,
          ):
              try:
                  oidc.validate_github_actions_claims(claims(workflow_ref, 'workflow_call'))
              except oidc.GitHubOIDCValidationError as exc:
                  assert 'EVENT_NOT_ALLOWED' in str(exc), exc
                  print(f'PASS workflow_call rejected for non-reusable prop workflow: {workflow_ref}')
              else:
                  raise AssertionError(f'workflow_call unexpectedly authorized: {workflow_ref}')

          for workflow_ref in reusable_refs:
              try:
                  oidc.validate_github_actions_claims(claims(workflow_ref, 'pull_request'))
              except oidc.GitHubOIDCValidationError as exc:
                  assert 'EVENT_NOT_ALLOWED' in str(exc), exc
              else:
                  raise AssertionError(f'pull_request unexpectedly authorized: {workflow_ref}')

          for workflow_ref in reusable_refs:
              try:
                  oidc.validate_github_actions_claims(claims(workflow_ref, 'workflow_call', ref='refs/heads/not-main'))
              except oidc.GitHubOIDCValidationError as exc:
                  assert 'REF_MISMATCH' in str(exc), exc
              else:
                  raise AssertionError(f'non-main reusable workflow unexpectedly authorized: {workflow_ref}')

          print('ISOLATED_REUSABLE_OIDC_CONTRACT_PASS')
          PY
          python -m py_compile \
            artifacts/wow-engine/github_actions_oidc.py \
            artifacts/wow-engine/test_v17_spread_certification_replay_oidc_allowlist.py \
            artifacts/wow-engine/test_v17_spread_forward_production_canary_oidc_allowlist.py \
            artifacts/wow-engine/test_v17_prop_evidence_oidc_allowlist.py
          git diff --check

      - name: Commit bounded compatibility repair
        run: |
          git config user.name "WOW Engineering Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/patch_v17_reusable_oidc_1113.py
          git add \
            artifacts/wow-engine/github_actions_oidc.py \
            artifacts/wow-engine/test_v17_spread_certification_replay_oidc_allowlist.py \
            artifacts/wow-engine/test_v17_spread_forward_production_canary_oidc_allowlist.py \
            artifacts/wow-engine/test_v17_prop_evidence_oidc_allowlist.py
          git commit -m "Apply reusable workflow OIDC compatibility (#1113)"
          git push origin HEAD:engineering/v17-reusable-oidc-1113

name: v17-1ip-current-slate-rerun

on:
  push:
    branches:
      - chatgpt/fix-1ip-player-discrimination-20260914
    paths:
      - "artifacts/wow-engine/scripts/rerun_20260914_1ip_player_conditioning.py"
      - "artifacts/wow-engine/mlb_1ip_bf_mixture.py"
      - "artifacts/wow-engine/mlb_1ip_live_acquisition.py"
      - "artifacts/wow-engine/research-fixtures/mlb_1ip_player_conditioning_dev_bundle_20260914.json"
      - ".github/workflows/v17-1ip-current-slate-rerun.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rerun-board:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run supplied Sep 14 board in research shadow
        env:
          PYTHONPATH: .
          MLB_1IP_CURRENT_RERUN_OUT: /tmp/mlb-1ip-current-rerun
        run: python scripts/rerun_20260914_1ip_player_conditioning.py
      - name: Upload rerun packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-1ip-current-rerun-${{ github.sha }}
          path: /tmp/mlb-1ip-current-rerun
          if-no-files-found: error
          retention-days: 7

name: TestDriver.ai Manual Staging Smoke

# TestDriver's cloud service is metered and limited to test/non-production use.
# Do not add push, pull_request, or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      confirm_usage:
        description: "I verified an active no-charge allowance, no trial conversion risk, and authorize this one manual test"
        required: true
        type: boolean
        default: false

jobs:
  smoke:
    # This protects GitHub CI only, not the TestDriver account's trial conversion.
    # Owner must confirm billing/cancel renewal independently in TestDriver.
    if: ${{ inputs.confirm_usage && vars.TD_ZERO_COST_VERIFIED == 'true' && vars.WOW_TESTDRIVER_STAGING_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: testdriver-manual-smoke
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    env:
      WOW_TESTDRIVER_STAGING_URL: ${{ vars.WOW_TESTDRIVER_STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate staging target before hosted test
        run: |
          node -e 'const u = new URL(process.env.WOW_TESTDRIVER_STAGING_URL); if (u.protocol !== "https:" || !/(?:^|[.-])(staging|preview|sandbox|test)(?:[.-]|$)/i.test(u.hostname) || u.pathname !== "/docs" || u.username || u.password) process.exit(1);'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to TestDriver
        uses: testdriverai/action@stable
        with:
          channel: stable
          api-key: ${{ secrets.TD_API_KEY }}

      - name: Run single staging smoke
        run: pnpm exec vitest run tests/production.test.js

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testdriver-manual-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

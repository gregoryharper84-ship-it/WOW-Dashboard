name: TestDriver.ai Manual Smoke

# Intentionally manual and nonblocking. Hosted AI browser tests can incur
# TestDriver usage charges; do not turn on automatic PR/push triggers.
on:
  workflow_dispatch:
    inputs:
      confirm_usage:
        description: "I checked TestDriver billing and authorize a manual run within my no-charge allowance"
        required: true
        type: boolean
        default: false

jobs:
  smoke:
    # Fail closed until the owner has explicitly confirmed a $0 entitlement
    # in TestDriver AND opted into this single manual execution.
    if: ${{ inputs.confirm_usage && vars.TD_ZERO_COST_VERIFIED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: testdriver-manual-smoke
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to TestDriver
        uses: testdriverai/action@stable
        with:
          channel: stable
          api-key: ${{ secrets.TD_API_KEY }}

      - name: Run the single scoped browser smoke
        run: pnpm exec vitest run tests/production.test.js

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testdriver-manual-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

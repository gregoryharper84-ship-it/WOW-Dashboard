name: wow-v17-pregame-capture

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/wow-v17-pregame-capture.yml"
      - "artifacts/wow-engine/v17/pregame_capture_maintenance.py"
      - "artifacts/wow-engine/v17/pregame_capture_schedule.py"
      - "artifacts/wow-engine/v17/pregame_source_capture.py"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/tests/test_v17_pregame_capture_maintenance.py"
      - "artifacts/wow-engine/tests/test_v17_pregame_capture_schedule.py"
      - "artifacts/wow-engine/tests/test_v17_pregame_source_capture.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-pregame-capture.yml"
      - "artifacts/wow-engine/v17/pregame_capture_maintenance.py"
      - "artifacts/wow-engine/v17/pregame_capture_schedule.py"
      - "artifacts/wow-engine/v17/pregame_source_capture.py"
      - "artifacts/wow-engine/github_actions_oidc.py"

permissions:
  contents: read

# PR verification never queues behind or cancels a live capture run.
concurrency:
  group: wow-v17-pregame-capture-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify bounded pregame capture contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run pregame capture regressions
        run: >-
          python -m pytest -q
          tests/test_v17_pregame_capture_maintenance.py
          tests/test_v17_pregame_capture_schedule.py
          tests/test_v17_pregame_source_capture.py
          tests/test_v17_nba_pregame_context_features.py
          tests/test_v17_nhl_starting_goalie_evidence.py

  capture:
    name: Capture bounded pregame evidence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert non-execution governance and OIDC context
        shell: bash
        run: |
          set -euo pipefail
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Run one bounded capture cycle through the OIDC route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          origin = os.environ["WOW_ACTION_ORIGIN"].rstrip("/")
          route = "/internal/v17/pregame-capture-maintenance"

          def token():
              url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              url += ("&" if "?" in url else "?") + urllib.parse.urlencode(
                  {"audience": "wow-v17-multiscout"}
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)["value"]

          def post(path, *, attempts=3, timeout=180):
              last = None
              for attempt in range(attempts):
                  req = urllib.request.Request(
                      origin + path,
                      data=b"",
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {token()}",
                          "Content-Type": "application/json",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      if exc.code in {401, 403}:
                          raise RuntimeError(f"AUTH_HTTP_{exc.code}:{body[:300]}") from exc
                      last = (exc.code, body[:300])
                      if exc.code not in {404, 429, 500, 502, 503, 504}:
                          raise
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = (type(exc).__name__, str(exc)[:200])
                  if attempt + 1 < attempts:
                      time.sleep(10 * (attempt + 1))
              raise RuntimeError(f"CAPTURE_ROUTE_NOT_READY:{last}")

          payload = post(route)
          assert payload.get("can_execute") is False, payload
          assert payload.get("probability_publishable") is False, payload
          assert payload.get("fitted_model") is False, payload
          assert payload.get("starter_inference_allowed") is False, payload
          assert payload.get("automatic_certification") is False, payload
          assert payload.get("automatic_promotion") is False, payload
          assert payload.get("status") in {"COMPLETE", "PARTIAL"}, payload

          blocked = [row for row in payload.get("rows", []) if row.get("status") == "BLOCKED"]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "pregame-capture.json"), "w") as handle:
              json.dump(payload, handle, sort_keys=True)
          print(json.dumps({
              "status": payload.get("status"),
              "rows": [
                  {
                      "sport": row.get("sport"),
                      "status": row.get("status"),
                      "captures_attempted": row.get("captures_attempted"),
                      "captures_evidence_insufficient": row.get("captures_evidence_insufficient"),
                      "captures_candidates_only": row.get("captures_candidates_only"),
                      "blockers": row.get("blockers"),
                  }
                  for row in payload.get("rows", [])
              ],
              "blocked_rows": [row.get("sport") for row in blocked],
              "starter_inference_allowed": False,
              "can_execute": False,
          }, sort_keys=True))
          PY

      - name: Retain immutable capture receipts
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-pregame-capture-${{ github.run_id }}
          path: ${{ runner.temp }}/pregame-capture.json
          retention-days: 30
          if-no-files-found: error

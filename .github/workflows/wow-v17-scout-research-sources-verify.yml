      - "artifacts/wow-engine/test_v17_firecrawl_research_adapter.py"
      - "artifacts/wow-engine/test_v17_source_snapshot_identity.py"

permissions:
  contents: read

# Superseded PR runs are cancelled; non-PR runs keep a unique group (unchanged behavior).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Scout research source contract tests
        run: >-
          python -m pytest -q
          test_v17_research_source_adapters.py
          test_v17_news_feed_research_adapter.py
          test_v17_public_news_feed_report.py
          test_v17_news_event_research_handoff.py
          test_v17_news_scout_receipt_bridge.py
          test_v17_news_reviewed_fact_producer.py
          test_v17_news_fitted_rescore_dispatch.py
          test_v17_news_fitted_scorer_binding.py
          test_v17_news_fitted_persistence_readback.py
          test_v17_news_material_lead.py
          test_v17_nhl_multiscout_identity.py
          test_v17_news_to_model_e2e.py
          test_v17_gdelt_gkg_fallback.py
          tests/test_v17_sport_scout_teams.py
          test_v17_firecrawl_research_adapter.py
          test_v17_source_snapshot_identity.py
      - name: Verify direct refresh CLI imports fail closed without credentials
        env:
          WOW_SCOUT_DATABASE_URL: ""
          WOW_SPORTSDATAIO_API_KEY: ""
        run: |
          python - <<'PY'
          from v17.research_source_adapters import adapter_health
          h = adapter_health()
          assert h['credential_configured'] is False
          assert h['prediction_authority'] is False
          assert h['can_execute'] is False
          print('source adapter health fail-closed contract verified')
          PY

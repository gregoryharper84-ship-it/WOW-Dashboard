name: wow-pr-state-transition-fallback

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: wow-pr-state-transition-fallback-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ready-for-review:
    name: Governed Ready for Review fallback
    if: >-
      github.event.label.name == 'FORCE_READY_FOR_REVIEW' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Transition authorized same-repository draft PR to Ready for Review
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const label = context.payload.label?.name;
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;

            if (label !== 'FORCE_READY_FOR_REVIEW') {
              core.setFailed('READY_FALLBACK_LABEL_MISMATCH');
              return;
            }
            if (!pr?.draft) {
              core.setFailed('READY_FALLBACK_PR_NOT_DRAFT');
              return;
            }
            if (pr?.head?.repo?.full_name !== repoFullName) {
              core.setFailed('READY_FALLBACK_CROSS_REPOSITORY_HEAD_REJECTED');
              return;
            }

            let actorPermission = '';
            try {
              const permissionResult = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              actorPermission = String(
                permissionResult.data?.role_name || permissionResult.data?.permission || ''
              ).toLowerCase();
            } catch (error) {
              core.setFailed('READY_FALLBACK_ACTOR_PERMISSION_LOOKUP_FAILED');
              return;
            }

            const allowedPermissions = new Set(['admin', 'maintain', 'write']);
            if (!allowedPermissions.has(actorPermission)) {
              core.setFailed('READY_FALLBACK_ACTOR_NOT_AUTHORIZED');
              return;
            }

            const result = await github.graphql(`
              mutation MarkReady($id: ID!) {
                markPullRequestReadyForReview(input: {pullRequestId: $id}) {
                  pullRequest { number isDraft }
                }
              }
            `, { id: pr.node_id });

            if (result.markPullRequestReadyForReview.pullRequest.isDraft) {
              core.setFailed('READY_FALLBACK_TRANSITION_NOT_CONFIRMED');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                '### Governed PR State Transition Receipt',
                '',
                '- Trigger: `FORCE_READY_FOR_REVIEW`',
                '- Transition: `DRAFT -> READY_FOR_REVIEW`',
                `- Workflow run: ${context.runId}`,
                `- Actor: ${context.actor}`,
                `- Actor permission: ${actorPermission}`,
                '- Code mutation: `false`',
                '- Merge performed: `false`',
                '- Branch protection modified: `false`',
                '- can_execute: `false`',
              ].join('\n'),
            });

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: 'FORCE_READY_FOR_REVIEW',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

name: wow-v17-nfl-accuracy-audit

on:
  pull_request:
    paths:
      - "artifacts/wow-engine/v17/nfl_accuracy_audit.py"
      - "artifacts/wow-engine/test_v17_nfl_accuracy_audit.py"
      - ".github/workflows/wow-v17-nfl-accuracy-audit.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/wow-engine/v17/nfl_accuracy_audit.py"
      - "artifacts/wow-engine/test_v17_nfl_accuracy_audit.py"
      - ".github/workflows/wow-v17-nfl-accuracy-audit.yml"

permissions:
  contents: read

jobs:
  regression:
    name: Verify read-only NFL accuracy audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install "pytest==8.4.2"
      - name: Verify immutable, exact-line and non-execution invariants
        run: python -m pytest -q test_v17_nfl_accuracy_audit.py

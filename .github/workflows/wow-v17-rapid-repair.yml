name: wow-v17-rapid-repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/wow-engine/**'
      - '.github/workflows/wow-v17-rapid-repair.yml'
      - '.github/workflows/wow-engine-verify.yml'
      - '.github/workflows/wow-v17-change-impact-gate.yml'
      - 'codecov.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: wow-v17-rapid-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rapid-gate:
    name: WOW V17 rapid affected regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install PyYAML ruff pytest-cov

      - name: Validate rapid-repair harness
        run: python -m pytest -q --tb=short tests/test_wow_rapid.py

      - name: Compile touched engineering surfaces
        run: python -m compileall -q scripts v17

      - name: Ruff changed Python files for correctness defects
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD^"
          fi
          git diff --name-only --diff-filter=ACMR "$BASE...HEAD" \
            | grep '^artifacts/wow-engine/.*\.py$' \
            | sed 's#^artifacts/wow-engine/##' \
            > "$RUNNER_TEMP/changed-python.txt" || true
          if [ -s "$RUNNER_TEMP/changed-python.txt" ]; then
            mapfile -t python_files < "$RUNNER_TEMP/changed-python.txt"
            ruff check --select E9,F63,F7,F82 "${python_files[@]}"
          else
            echo 'No changed wow-engine Python files to lint.'
          fi

      - name: Select affected tests conservatively
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD^"
          fi
          python scripts/wow_rapid.py select \
            --base "$BASE" \
            --head HEAD \
            --output "$RUNNER_TEMP/affected-tests.txt"
          count=$(wc -l < "$RUNNER_TEMP/affected-tests.txt" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo '## Rapid repair selection'
            echo "Selected test files: $count"
            echo '```text'
            cat "$RUNNER_TEMP/affected-tests.txt"
            echo '```'
            echo '`can_execute=false`'
            echo '`terminal_authority=V17_TERMINAL_REDUCER`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run governance + affected lane with coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < "$RUNNER_TEMP/affected-tests.txt"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo 'Affected selector returned no tests; fail closed.'
            exit 1
          fi
          python -m pytest -q --tb=short -rs \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            "${tests[@]}"

      - name: Upload informational patch coverage to Codecov
        if: always() && hashFiles('artifacts/wow-engine/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: artifacts/wow-engine/coverage.xml
          flags: rapid-affected
          name: wow-v17-rapid-affected

      - name: Validate change-impact classifier
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" > "$RUNNER_TEMP/changed-paths.txt"
          else
            git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/changed-paths.txt"
          fi
          mapfile -t paths < "$RUNNER_TEMP/changed-paths.txt"
          python v17/engineering_effectiveness.py impact "${paths[@]}" | tee "$RUNNER_TEMP/change-impact.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('change-impact.json').read_text())
          assert data['can_execute'] is False
          assert data['terminal_authority'] == 'V17_TERMINAL_REDUCER'
          assert 'BASE_REGRESSION' in data['required_gates']
          print('change-impact contract preserved')
          PY

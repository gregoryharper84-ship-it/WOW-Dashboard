name: MLB V2 score-event inspection
on:
  push:
    branches: [feature/mlb-v2-governed-probability-20260827]
    paths: [.github/workflows/mlb-v2-score-event-inspect.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find score-event route and capability registry
        run: |
          grep -RniE --include='*.py' 'GOVERNED_EVENT_MODEL_UNAVAILABLE|MLB_FITTED_MODEL_ARTIFACT_UNAVAILABLE|MLB_EVENT_CALIBRATOR_UNAVAILABLE|score-event|score_event|mlb-game-win-probability-expert' artifacts/flask-scoring-api | head -n 300
          echo '=== app route context ==='
          grep -nE 'score-event|score_event|GOVERNED_EVENT_MODEL_UNAVAILABLE' artifacts/flask-scoring-api/app.py | head -n 100

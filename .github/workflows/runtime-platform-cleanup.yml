name: Runtime Platform Cleanup

on:
  push:
    branches: [chatgpt/remove-replit-20260830]
    paths:
      - '.github/workflows/runtime-platform-cleanup.yml'
      - '.github/scripts/apply_runtime_platform_cleanup.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-replit-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version
      - name: Apply guarded cleanup
        run: |
          python .github/scripts/apply_runtime_platform_cleanup.py
          needle="$(printf 'rep%s' 'lit')"
          while IFS= read -r path; do
            [ -n "$path" ] && git rm -r -f -- "$path"
          done < <(git ls-files | grep -i "$needle" || true)
          git rm -f .github/workflows/remove-legacy-platform-audit.yml .github/workflows/legacy-platform-inventory.yml || true
      - name: Regenerate workspace lock and install
        run: pnpm install --no-frozen-lockfile
      - name: Assert zero tracked legacy references
        shell: bash
        run: |
          needle="$(printf 'rep%s' 'lit')"
          path_matches="$(git ls-files | grep -i "$needle" || true)"
          content_matches="$(git grep -n -i -I "$needle" -- . || true)"
          if [ -n "$path_matches" ] || [ -n "$content_matches" ]; then
            echo 'Legacy platform residue remains:'
            printf '%s\n%s\n' "$path_matches" "$content_matches"
            exit 1
          fi
          echo 'ZERO_TRACKED_LEGACY_REFERENCES=PASS'
      - name: Validate affected frontend workspaces
        env:
          PORT: '3000'
          BASE_PATH: '/'
        run: |
          pnpm --filter @workspace/final-lock run typecheck
          pnpm --filter @workspace/final-lock run build
          pnpm --filter @workspace/flask-scoring-api run typecheck
          pnpm --filter @workspace/flask-scoring-api run build
          pnpm --filter @workspace/mockup-sandbox run typecheck
          pnpm --filter @workspace/mockup-sandbox run build
      - name: Commit cleanup
        run: |
          git config user.name "WOW CI Integration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove retired runtime platform"
          git push origin HEAD:chatgpt/remove-replit-20260830

name: wow-v17-prop-rerun-20260915

on:
  push:
    branches:
      - chatgpt/v17-prop-rerun-20260915
    paths:
      - ".github/workflows/wow-v17-prop-rerun-20260915.yml"

permissions:
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WOW_ACTION_API_KEY: ${{ secrets.WOW_ACTION_API_KEY }}
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      WOW_ENDPOINT: "https://wow-governed-probability-engine.onrender.com/score-pick-request"
    steps:
      - name: Assert dry-run governance and credential
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$WOW_ACTION_API_KEY"

      - name: Rerun 31 strikeout and 29 1IP lines
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = os.environ["WOW_ENDPOINT"]
          api_key = os.environ["WOW_ACTION_API_KEY"]
          rows = json.loads(r'''[{"row_key": "K-01", "player": "Foster Griffin", "team": "CLE", "opponent": "CWS", "stat_type": "PITCHER_STRIKEOUTS", "line": 5.0, "direction": "MORE", "source_capture_timestamp": "2026-09-15T18:28:51Z"}, {"row_key": "K-02", "player": "Davis Martin", "team": "CWS", "opponent": "CLE", "stat_type": "PITCHER_STRIKEOUTS", "line": 2.5, "direction": "MORE", "source_capture_timestamp": "2026-09-15T18:28:51Z"}, {"row_key": "K-03", "player": "Chris Murphy", "team": "CWS", "opponent": "CLE", "stat_type": "PITCHER_STRIKEOUTS", "line": 0.5, "direction": "MORE", "source_capture_timestamp": "2026-09-15T18:28:51Z"}, {"row_key": "K-04", "player": "Yoshinobu Yamamoto", "team": "LAD", "opponent": "CIN", "stat_type": "PITCHER_STRIKEOUTS", "line": 7.5, "direction": "MORE", "source_capture_timestamp": "2026-09-15T18:28:51Z"}, {"row_key": "K-05", "player": "Rhett Lowder", "team": "CIN", "opponent": "LAD", "stat_type": "PITCHER_STRIKEOUTS", "line": 3.5, "direction": "MORE", "source_capture_timestamp": "2026-09-15T18:28:51Z"}, {"row_key": "K-06", "player": "Griffin Jax", "team": "TB", "opponent": "ATH", "stat_type": "PITCHER_STRIKEOUTS", "line": 5.0, "direction": "MORE", "source_capture_timestamp": "2026-09-15T18:28:51Z"}, {"row_key": "K-07", "player": "Jack Perkins", "team": "ATH", "opponent": "TB", "stat_type": "PITCHER_STRIKEOUTS", "line": 4.0, "direction": "MORE", "source_capture_timestamp": "2026-09-15T18:28:51Z"}, {"row_key": "K-08", "player": "Jacob Misiorowski", "team": "MIL", "opponent": "PIT", "stat_type": "PITCHER_STRIKEOUTS", "line": 5.5, "direction": "MORE", "source_capture_timestamp": "2026-09-15T18:28:51Z"}, {"row_key": "K-09", "player": "Lake Bachar", "team": "PIT", "opponent": "MIL", "stat_type": "PITCHER_STRIKEOUTS", "line": 1.5, "direction": "MORE", "source_capture_timestamp": "2026-09-15T18:28:51Z"}, {"row_key": "K-10", "player": "Cristopher Sánchez", "team": "PHI", "opponent": "WSH", "stat_type": "PITCHER_STRIKEOUTS", "line": 6.5, "direc
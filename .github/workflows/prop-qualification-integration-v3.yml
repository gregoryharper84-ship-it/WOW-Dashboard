# rerun after event-precedence regression fix
name: Prop Qualification Integration V3

on:
  push:
    branches:
      - chatgpt/prop-qualification-tier-fix-20260830
    paths:
      - '.github/workflows/prop-qualification-integration-v3.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/prop-qualification-tier-fix-20260830
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install backend dependencies
        working-directory: artifacts/wow-engine
        run: pip install -r requirements.txt

      - name: Apply guarded integration
        working-directory: artifacts/wow-engine
        run: python scripts/apply_prop_qualification_integration_once.py

      - name: Compile changed runtime modules
        working-directory: artifacts/wow-engine
        run: python -m py_compile ledger.py api_prod_market.py pick_request_runtime.py qualification_policy_v2.py prop_terminal_reducer_v2.py

      - name: Run focused integration regressions
        working-directory: artifacts/wow-engine
        run: |
          python -m pytest -q \
            test_qualification_policy_v2.py \
            test_prop_terminal_reducer_v2.py \
            test_prop_live_model_acceptance.py \
            test_pick_request_runtime.py

      - name: Commit integrated production wiring
        run: |
          if git diff --quiet; then
            echo "No integration diff produced"
            exit 1
          fi
          git config user.name "WOW CI Integration"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/wow-engine/ledger.py \
                  artifacts/wow-engine/api_prod_market.py \
                  artifacts/wow-engine/pick_request_runtime.py \
                  artifacts/wow-engine/prop_terminal_reducer_v2.py \
                  artifacts/wow-engine/test_pick_request_runtime.py
          git commit -m "fix: wire prop qualification and honest terminal semantics"
          git push origin HEAD:chatgpt/prop-qualification-tier-fix-20260830

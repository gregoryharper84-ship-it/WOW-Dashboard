name: wow-odds-proxy-verify

on:
  pull_request:
    paths:
      - 'artifacts/wow-odds-proxy/**'
      - '.github/workflows/wow-odds-proxy-verify.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/wow-odds-proxy/**'
      - '.github/workflows/wow-odds-proxy-verify.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r artifacts/wow-odds-proxy/requirements.txt
      - name: Run proxy tests
        working-directory: artifacts/wow-odds-proxy
        run: pytest -q
      - name: Validate Custom GPT OpenAPI
        run: openapi-spec-validator artifacts/wow-odds-proxy/openapi.custom-gpt.yaml

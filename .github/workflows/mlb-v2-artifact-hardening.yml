name: MLB V2 artifact hardening
on:
  push:
    branches: [research/mlb-v2-artifact-hardening-20260827]
    paths:
      - 'research/mlb-v2-pregame/**'
      - '.github/workflows/mlb-v2-artifact-hardening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn joblib
      - run: |
          python research/mlb-v2-pregame/run_mlb_v2_pregame.py \
            --out artifact_hardening_out/model \
            --bootstraps 500
      - run: python research/mlb-v2-pregame/harden_model_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-v2-artifact-hardening
          path: artifact_hardening_out/artifact_manifest.json
          retention-days: 7

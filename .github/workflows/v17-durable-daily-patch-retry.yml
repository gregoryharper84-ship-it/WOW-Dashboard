name: v17-durable-daily-patch-retry

on:
  push:
    branches:
      - fix/v17-durable-daily-full-board
    paths:
      - .github/workflows/v17-durable-daily-patch-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v17-durable-daily-full-board
          fetch-depth: 0
      - name: Apply compact durable Daily patch
        run: python scripts/v17_durable_daily_patch_retry.py
      - name: Commit canonical patch
        run: |
          git config user.name "WOW Engineering Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose durable Daily Actions for V17 full-board orchestration"
          git push origin HEAD:fix/v17-durable-daily-full-board

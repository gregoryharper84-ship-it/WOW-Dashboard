name: wow-v17-ncaaf-forward-validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-ncaaf-forward-validation.yml"

permissions:
  contents: read

jobs:
  forward-validation:
    name: NCAAF frozen-candidate forward validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      NCAAF_CANDIDATE_ID: "87f4a425-7ae6-44fd-84a0-56aaf145d6af"
      WOW_CAN_EXECUTE: "false"
    steps:
      - name: Assert governance
        shell: bash
        run: test "$WOW_CAN_EXECUTE" = "false"

      - name: Run V3 forward-validation challenger
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in url else "?"
          url += sep + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
          req = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              token = json.load(response)["value"]

          endpoint = (
              os.environ["WOW_ACTION_ORIGIN"].rstrip("/")
              + "/internal/v17/experiments/ncaaf-publication-bound-v3/"
              + os.environ["NCAAF_CANDIDATE_ID"]
          )
          request = urllib.request.Request(
              endpoint,
              data=b"",
              method="POST",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=1200) as response:
              result = json.load(response)

          for key in (
              "can_execute",
              "automatic_certification",
              "automatic_promotion",
              "probability_publishable",
              "rank_eligible",
              "database_mutated",
              "production_registry_mutated",
          ):
              assert result.get(key) is False, (key, result.get(key))
          if result.get("status") != "EXPERIMENT_COMPLETE":
              raise RuntimeError("NCAAF_V3_EXPERIMENT_BLOCKED:" + json.dumps(result, sort_keys=True))

          receipt = {
              "candidate_id": result.get("candidate_id"),
              "experiment_version": result.get("experiment_version"),
              "experiment_sha256": result.get("experiment_sha256"),
              "bound_method": result.get("bound_method"),
              "split": result.get("split"),
              "historical_test_replay": result.get("historical_test_replay"),
              "forward_validation": result.get("forward_validation"),
              "recommendation_state": result.get("recommendation_state"),
              "review_policy": result.get("review_policy"),
              "final_refresh_contract": result.get("final_refresh_contract"),
              "can_execute": False,
          }
          print("NCAAF_V3_FORWARD_VALIDATION_RECEIPT=" + json.dumps(receipt, sort_keys=True))
          PY

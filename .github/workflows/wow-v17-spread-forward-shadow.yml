name: wow-v17-spread-forward-shadow

on:
  pull_request:
    paths:
      - ".github/workflows/wow-v17-spread-forward-shadow.yml"
      - "artifacts/wow-engine/v17/spread_forward_shadow.py"
      - "artifacts/wow-engine/v17/spread_forward_shadow_leagues.py"
      - "artifacts/wow-engine/v17/mlb_run_line_shadow.py"
      - "artifacts/wow-engine/v17/spread_margin_replay_route.py"
      - "artifacts/wow-engine/v17/spread_margin_challenger.py"
      - "artifacts/wow-engine/v17/spread_margin_replay.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_shadow.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_shadow_route.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_shadow_leagues.py"
      - "artifacts/wow-engine/tests/test_v17_mlb_run_line_shadow.py"
      - "artifacts/wow-engine/tests/test_v17_spread_persisted_pagination.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-spread-forward-shadow.yml"
      - "artifacts/wow-engine/v17/spread_forward_shadow.py"
      - "artifacts/wow-engine/v17/spread_forward_shadow_leagues.py"
      - "artifacts/wow-engine/v17/mlb_run_line_shadow.py"
      - "artifacts/wow-engine/v17/spread_margin_replay_route.py"
      - "artifacts/wow-engine/v17/spread_margin_challenger.py"
      - "artifacts/wow-engine/v17/spread_margin_replay.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_shadow.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_shadow_route.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_shadow_leagues.py"
      - "artifacts/wow-engine/tests/test_v17_mlb_run_line_shadow.py"
      - "artifacts/wow-engine/tests/test_v17_spread_persisted_pagination.py"

permissions:
  contents: read

jobs:
  verify:
    name: Verify governed line forward shadows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run forward-shadow and adjacent line regressions
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_v17_spread_forward_shadow.py
          tests/test_v17_spread_forward_shadow_route.py
          tests/test_v17_spread_forward_shadow_leagues.py
          tests/test_v17_mlb_run_line_shadow.py
          tests/test_v17_spread_persisted_pagination.py
          tests/test_v17_spread_margin_challenger.py
          tests/test_v17_spread_margin_replay.py
          tests/test_v17_spread_margin_replay_route.py

name: wow-v17-spread-forward-shadow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-spread-forward-shadow.yml"
      - "artifacts/wow-engine/v17/spread_forward_shadow.py"
      - "artifacts/wow-engine/v17/spread_margin_forward_fit.py"
      - "artifacts/wow-engine/v17/spread_forward_shadow_leagues.py"
      - "artifacts/wow-engine/v17/wnba_spread_event_identity.py"
      - "artifacts/wow-engine/v17/mlb_run_line_shadow.py"
      - "artifacts/wow-engine/v17/mlb_extra_inning_margin_challenger.py"
      - "artifacts/wow-engine/v17/spread_margin_replay_route.py"
      - "artifacts/wow-engine/v17/spread_margin_challenger.py"
      - "artifacts/wow-engine/v17/spread_margin_replay.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_shadow.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_context_cache.py"
      - "artifacts/wow-engine/tests/test_v17_spread_margin_forward_fit.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_shadow_route.py"
      - "artifacts/wow-engine/tests/test_v17_spread_forward_shadow_leagues.py"
      - "artifacts/wow-engine/tests/test_v17_wnba_spread_event_identity.py"
      - "artifacts/wow-engine/tests/test_v17_mlb_run_line_shadow.py"
      - "artifacts/wow-engine/tests/test_v17_mlb_extra_inning_margin_challenger.py"
      - "artifacts/wow-engine/tests/test_v17_spread_persisted_pagination.py"
      - "artifacts/wow-engine/tests/test_v17_spread_margin_challenger.py"
      - "artifacts/wow-engine/tests/test_v17_spread_margin_replay.py"
      - "artifacts/wow-engine/tests/test_v17_spread_margin_replay_route.py"

permissions:
  contents: read

# Superseded PR runs are cancelled; non-PR runs keep a unique group (unchanged behavior).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify governed line forward shadows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect spread-forward impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(.github/workflows/wow-v17-spread-forward-shadow\.yml|artifacts/wow-engine/v17/(spread_forward_shadow|spread_margin_forward_fit|spread_forward_shadow_leagues|wnba_spread_event_identity|mlb_run_line_shadow|mlb_extra_inning_margin_challenger|spread_margin_replay_route|spread_margin_challenger|spread_margin_replay)\.py|artifacts/wow-engine/tests/test_v17_(spread_forward_shadow|spread_forward_context_cache|spread_margin_forward_fit|spread_forward_shadow_route|spread_forward_shadow_leagues|wnba_spread_event_identity|mlb_run_line_shadow|mlb_extra_inning_margin_challenger|spread_persisted_pagination|spread_margin_challenger|spread_margin_replay|spread_margin_replay_route)\.py)$' "$RUNNER_TEMP/changed-files.txt"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Required-context no-op for unrelated PRs
        if: steps.impact.outputs.affected != 'true'
        run: echo "Spread-forward paths unchanged; required context emitted without running spread regressions."

      - uses: actions/setup-python@v5
        if: steps.impact.outputs.affected == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install engine dependencies
        if: steps.impact.outputs.affected == 'true'
        run: pip install -r requirements.txt

      - name: Run forward-shadow and adjacent line regressions
        if: steps.impact.outputs.affected == 'true'
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_v17_spread_forward_shadow.py
          tests/test_v17_spread_forward_context_cache.py
          tests/test_v17_spread_margin_forward_fit.py
          tests/test_v17_spread_forward_shadow_route.py
          tests/test_v17_spread_forward_shadow_leagues.py
          tests/test_v17_wnba_spread_event_identity.py
          tests/test_v17_mlb_run_line_shadow.py
          tests/test_v17_mlb_extra_inning_margin_challenger.py
          tests/test_v17_spread_persisted_pagination.py
          tests/test_v17_spread_margin_challenger.py
          tests/test_v17_spread_margin_replay.py
          tests/test_v17_spread_margin_replay_route.py

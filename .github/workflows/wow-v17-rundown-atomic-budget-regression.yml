name: wow-v17-rundown-atomic-budget-regression

on:
  pull_request:
    paths:
      - ".github/workflows/wow-v17-rundown-atomic-budget-regression.yml"
      - "artifacts/wow-engine/v17/rundown_datapoint_budget.py"
      - "artifacts/wow-engine/v17/rundown_market_ingestor.py"
      - "artifacts/wow-engine/v17/market_evidence_sources.py"
      - "artifacts/wow-engine/migrations/20261009_v17_rundown_atomic_budget.sql"
      - "artifacts/wow-engine/tests/test_v17_rundown_datapoint_budget.py"
      - "artifacts/wow-engine/tests/test_v17_rundown_budget_sql_atomic.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rundown-atomic-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-atomic-budget:
    name: Atomic paid-provider reservation in ephemeral PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: wowtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wowtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: wowtest
      WOW_RUNDOWN_ATOMIC_DB_TEST: "1"
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install test requirements
        run: pip install -r requirements.txt
      - name: Run budget and adjacent transport tests
        run: >-
          python -m pytest -q
          tests/test_v17_rundown_datapoint_budget.py
          tests/test_v17_rundown_budget_sql_atomic.py
          tests/test_v17_rundown_market_ingestor.py
          tests/test_v17_rundown_market_history.py
          tests/test_v17_rundown_call_discipline.py

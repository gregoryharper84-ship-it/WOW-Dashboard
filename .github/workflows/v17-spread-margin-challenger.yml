name: v17-spread-margin-challenger

on:
  pull_request:
    paths:
      - "artifacts/wow-engine/v17/spread_margin_challenger.py"
      - "artifacts/wow-engine/tests/test_v17_spread_margin_challenger.py"
      - "artifacts/wow-engine/V17_SPREAD_MARGIN_CHALLENGER.md"
      - ".github/workflows/v17-spread-margin-challenger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-spread-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run spread challenger unit and governance regressions
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_v17_spread_margin_challenger.py
      - name: Prove spread lane remains Class C shadow only
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("v17/spread_margin_challenger.py").read_text()
          required = [
              'CAN_EXECUTE = False',
              'AUTOMATIC_CERTIFICATION = False',
              'AUTOMATIC_PROMOTION = False',
              'PROBABILITY_PUBLISHABLE = False',
              'MARKET_PROBABILITY_SUBSTITUTION_ALLOWED = False',
              'MONEYLINE_TO_SPREAD_CONVERSION_ALLOWED = False',
              'GLOBAL_TERMINAL_REDUCER = "V17_TERMINAL_REDUCER"',
          ]
          for token in required:
              assert token in text, token
          forbidden = [
              'CAN_EXECUTE = True',
              'AUTOMATIC_CERTIFICATION = True',
              'AUTOMATIC_PROMOTION = True',
              'PROBABILITY_PUBLISHABLE = True',
              'MARKET_PROBABILITY_SUBSTITUTION_ALLOWED = True',
              'MONEYLINE_TO_SPREAD_CONVERSION_ALLOWED = True',
          ]
          for token in forbidden:
              assert token not in text, token
          print("spread challenger shadow-only invariant verification passed")
          PY

name: v17-spread-margin-challenger

on:
  pull_request:
    paths:
      - "artifacts/wow-engine/v17/spread_margin_challenger.py"
      - "artifacts/wow-engine/v17/spread_margin_replay.py"
      - "artifacts/wow-engine/v17/nfl_spread_context_challenger.py"
      - "artifacts/wow-engine/v17/spread_certification_replay_route.py"
      - "artifacts/wow-engine/scripts/run_spread_margin_challenger_replay.py"
      - "artifacts/wow-engine/tests/test_v17_spread_margin_challenger.py"
      - "artifacts/wow-engine/tests/test_v17_spread_margin_replay.py"
      - "artifacts/wow-engine/tests/test_v17_nfl_spread_context_challenger.py"
      - "artifacts/wow-engine/V17_SPREAD_MARGIN_CHALLENGER.md"
      - ".github/workflows/v17-spread-margin-challenger.yml"
      - ".github/workflows/wow-v17-spread-certification-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; non-PR runs keep a unique group (unchanged behavior).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-spread-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run spread challenger unit, replay, and governance regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_v17_spread_margin_challenger.py \
            tests/test_v17_spread_margin_replay.py \
            tests/test_v17_nfl_spread_context_challenger.py
      - name: Prove spread lane remains Class C shadow only
        run: |
          python - <<'PY'
          from pathlib import Path
          challenger = Path("v17/spread_margin_challenger.py").read_text()
          v2 = Path("v17/nfl_spread_context_challenger.py").read_text()
          replay = Path("v17/spread_margin_replay.py").read_text()
          required = [
              'CAN_EXECUTE = False',
              'AUTOMATIC_CERTIFICATION = False',
              'AUTOMATIC_PROMOTION = False',
              'PROBABILITY_PUBLISHABLE = False',
          ]
          for token in required:
              assert token in challenger, token
              assert token in v2, token
          assert 'GLOBAL_TERMINAL_REDUCER = "V17_TERMINAL_REDUCER"' in challenger
          assert 'GLOBAL_TERMINAL_REDUCER = "V17_TERMINAL_REDUCER"' in v2
          forbidden = [
              'CAN_EXECUTE = True',
              'AUTOMATIC_CERTIFICATION = True',
              'AUTOMATIC_PROMOTION = True',
              'PROBABILITY_PUBLISHABLE = True',
          ]
          for token in forbidden:
              assert token not in challenger, token
              assert token not in v2, token
          assert 'spread_line_used_as_feature": False' in v2
          assert 'market_features_used": False' in v2
          assert 'v1_recent8_blend_reused": False' in v2
          assert 'database_mutated": False' in replay
          assert 'production_registry_mutated": False' in replay
          print("spread challenger shadow-only invariant verification passed")
          PY

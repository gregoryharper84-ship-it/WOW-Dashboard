name: wow-v17-scout-board-refresh

on:
  schedule:
    - cron: "15 11 * * *"
    - cron: "15 17 * * *"
    - cron: "15 23 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["wow-v17-scout-brain-persist"]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_SCOUT_PERSIST_URL: https://iczfhsmjrrafhvcpmqhr.supabase.co/functions/v1/wow-v17-scout-brain-persist
      WOW_CAN_EXECUTE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enforce research-only governance
        run: test "$WOW_CAN_EXECUTE" = "false"
      - name: Fail closed when the upstream Scout brain persist did not succeed
        if: github.event_name != 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/wow-v17-scout-brain-persist.yml/runs?branch=main&status=completed&per_page=1" --jq '[.workflow_runs[0].conclusion // "", .workflow_runs[0].html_url // ""] | @tsv')
          conclusion=$(printf '%s' "$latest" | cut -f1)
          url=$(printf '%s' "$latest" | cut -f2)
          if [ "$conclusion" != "success" ]; then
            echo "Most recent completed wow-v17-scout-brain-persist run concluded '${conclusion:-none}'; the boards would be stale. Failing closed. ${url}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Materialize current boards
        shell: bash
        run: |
          today=$(date -u +%F)
          tomorrow=$(date -u -d '+1 day' +%F)
          python -m v17.scout_board_edge_materializer --date "$today"
          python -m v17.scout_board_edge_materializer --date "$tomorrow"

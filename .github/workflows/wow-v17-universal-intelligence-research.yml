name: WOW V17 Universal Intelligence Research Contract

on:
  pull_request:
    paths:
      - 'artifacts/wow-engine/v17/universal_sports_intelligence_research.py'
      - 'artifacts/wow-engine/v17/universal_intelligence_shadow_handoff.py'
      - 'artifacts/wow-engine/tests/test_universal_sports_intelligence_research.py'
      - 'artifacts/wow-engine/tests/test_universal_intelligence_shadow_handoff.py'
      - '.github/workflows/wow-v17-universal-intelligence-research.yml'

permissions:
  contents: read

concurrency:
  group: wow-v17-universal-intel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-research-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 13-sport research and shadow feature contracts
        working-directory: artifacts/wow-engine
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest --confcutdir=tests -q tests/test_universal_sports_intelligence_research.py tests/test_universal_intelligence_shadow_handoff.py
      - name: Confirm research never registers probability or execution
        working-directory: artifacts/wow-engine
        run: |
          python - <<'PY'
          from v17.universal_sports_intelligence_research import sport_intelligence_inventory
          i = sport_intelligence_inventory()
          assert i['sport_count'] == 13
          assert not i['production_capability_attested']
          assert not i['can_execute']
          print('UNIVERSAL_INTELLIGENCE_OFFLINE_RESEARCH_ONLY')
          PY

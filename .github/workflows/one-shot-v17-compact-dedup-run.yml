name: V17 compact dedup repair validation

on:
  push:
    branches:
      - chatgpt/v17-compact-dedup-fix

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v17-compact-dedup-fix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Apply repair
        run: python artifacts/wow-engine/v17/apply_compact_dedup_fix_once.py

      - name: Correct test dependency fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/wow-engine/tests/test_v17_compact_outer_wrapper.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from fastapi import FastAPI, Header', 'from fastapi import Depends, FastAPI, Header')
          text = text.replace('auth_dependency=lambda: None, market_api=object()', 'auth_dependency=[Depends(lambda: None)], market_api=object()')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install engine dependencies
        run: python -m pip install -r artifacts/wow-engine/requirements.txt

      - name: Run targeted regressions
        env:
          PYTHONPATH: artifacts/wow-engine
        run: |
          python -m pytest -q \
            artifacts/wow-engine/tests/test_v17_compact_outer_wrapper.py \
            artifacts/wow-engine/tests/test_v17_compact_receipt_contract.py \
            artifacts/wow-engine/tests/test_v17_prop_canonical_identity.py \
            artifacts/wow-engine/tests/test_v17_daily_unique_prop_limit.py \
            artifacts/wow-engine/tests/test_pick_request_compact_response.py \
            artifacts/wow-engine/v17/test_daily_response_contract_acceptance.py

      - name: Commit verified repair and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/wow-engine
          git rm -f \
            .github/workflows/one-shot-v17-compact-dedup-build.yml \
            .github/workflows/one-shot-v17-compact-dedup-run.yml \
            artifacts/wow-engine/v17/apply_compact_dedup_fix_once.py
          git commit -m "fix(v17): honor compact responses and dedupe sporting props"
          git push origin HEAD:chatgpt/v17-compact-dedup-fix

name: wow-v17-basketball-model-maintenance

on:
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-basketball-model-maintenance.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/basketball_event_hydration_runtime.py"
      - "artifacts/wow-engine/basketball_training_replay.py"
      - "artifacts/wow-engine/basketball_specialist_pipeline.py"
      - "artifacts/wow-engine/basketball_team_event_specialist.py"
      - "artifacts/wow-engine/v17/basketball_model_maintenance.py"
      - "artifacts/wow-engine/v17/team_state_challenger_training.py"
      - "artifacts/wow-engine/v17/team_state_scoped_maintenance.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/test_v17_basketball_model_maintenance.py"
      - "artifacts/wow-engine/test_v17_basketball_hydration_fallback.py"
      - "artifacts/wow-engine/test_v17_team_state_challenger_training.py"
      - "artifacts/wow-engine/test_v17_team_state_scoped_maintenance.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
      - "artifacts/wow-engine/test_v17_maintenance_terminal_truth.py"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-basketball-model-maintenance.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/basketball_event_hydration_runtime.py"
      - "artifacts/wow-engine/basketball_training_replay.py"
      - "artifacts/wow-engine/basketball_specialist_pipeline.py"
      - "artifacts/wow-engine/basketball_team_event_specialist.py"
      - "artifacts/wow-engine/v17/basketball_model_maintenance.py"
      - "artifacts/wow-engine/v17/team_state_challenger_training.py"
      - "artifacts/wow-engine/v17/team_state_scoped_maintenance.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/test_v17_basketball_model_maintenance.py"
      - "artifacts/wow-engine/test_v17_basketball_hydration_fallback.py"
      - "artifacts/wow-engine/test_v17_team_state_challenger_training.py"
      - "artifacts/wow-engine/test_v17_team_state_scoped_maintenance.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
      - "artifacts/wow-engine/test_v17_maintenance_terminal_truth.py"

permissions:
  contents: read

concurrency:
  group: wow-v17-basketball-model-maintenance
  cancel-in-progress: false

jobs:
  verify:
    name: Verify basketball maintenance contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run basketball maintenance and OIDC regressions
        run: >-
          python -m pytest -q
          test_v17_basketball_model_maintenance.py
          test_v17_basketball_hydration_fallback.py
          test_basketball_training_replay_boundaries.py
          test_basketball_team_event_specialist.py
          test_v17_team_state_challenger_training.py
          test_v17_team_state_scoped_maintenance.py
          test_v17_github_oidc.py
          test_v17_maintenance_terminal_truth.py

  maintain:
    name: Hydrate basketball then fit NBA/WNBA challengers
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert non-execution governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Hydrate first, then regenerate NBA/WNBA challengers
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          origin = os.environ["WOW_ACTION_ORIGIN"].rstrip("/")

          def token():
              url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              url += ("&" if "?" in url else "?") + urllib.parse.urlencode({"audience":"wow-v17-multiscout"})
              req = urllib.request.Request(url, headers={"Authorization":f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)["value"]

          def post(path, *, attempts=24, timeout=900):
              last = None
              for attempt in range(attempts):
                  req = urllib.request.Request(
                      origin + path,
                      data=b"",
                      method="POST",
                      headers={"Authorization":f"Bearer {token()}","Content-Type":"application/json"},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      if exc.code in {401, 403}:
                          raise RuntimeError(f"AUTH_HTTP_{exc.code}:{body[:400]}") from exc
                      last = (exc.code, body[:400])
                      if exc.code not in {404, 429, 502, 503, 504}:
                          raise
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = (type(exc).__name__, str(exc)[:300])
                  if attempt + 1 < attempts:
                      time.sleep(min(10 * (attempt + 1), 30))
              raise RuntimeError(f"ENDPOINT_NOT_READY:{path}:{last}")

          payload = post("/internal/v17/basketball-model-maintenance")
          assert payload.get("can_execute") is False, payload
          assert payload.get("probability_publishable") is False, payload
          assert payload.get("automatic_certification") is False, payload
          assert payload.get("automatic_promotion") is False, payload
          blocked_rows = [row for row in payload.get("rows", []) if row.get("status") == "BLOCKED"]
          if payload.get("status") == "BLOCKED" or blocked_rows:
              raise RuntimeError("BASKETBALL_PREHYDRATE_BLOCKED:" + json.dumps({
                  "status": payload.get("status"),
                  "blocked_rows": [{"sport": row.get("sport"), "code": row.get("code")} for row in blocked_rows],
              }, sort_keys=True))
          basketball = payload

          challengers = {}
          for sport in ("NBA", "WNBA"):
              challenger_payload = post(f"/internal/v17/team-state-challenger-maintenance/{sport}", attempts=8, timeout=300)
              assert challenger_payload.get("can_execute") is False, challenger_payload
              assert challenger_payload.get("probability_publishable") is False, challenger_payload
              assert challenger_payload.get("automatic_certification") is False, challenger_payload
              assert challenger_payload.get("automatic_promotion") is False, challenger_payload
              if challenger_payload.get("status") == "BLOCKED":
                  raise RuntimeError(f"{sport}_CHALLENGER_BLOCKED:" + json.dumps(challenger_payload, sort_keys=True))
              challengers[sport] = challenger_payload

          print(json.dumps({
              "ordering": "BASKETBALL_HYDRATION_AND_REPLAY_BEFORE_TEAM_STATE_CHALLENGER",
              "basketball_status": basketball.get("status"),
              "rows_updated": basketball.get("rows_updated"),
              "rows_fresh_acquisition_degraded": basketball.get("rows_fresh_acquisition_degraded"),
              "challenger_statuses": {k:v.get("status") for k,v in challengers.items()},
              "can_execute": False,
          }, sort_keys=True))
          PY

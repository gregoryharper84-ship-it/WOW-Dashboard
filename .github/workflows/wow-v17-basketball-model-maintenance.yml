name: wow-v17-basketball-model-maintenance

on:
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-basketball-model-maintenance.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/basketball_event_hydration_runtime.py"
      - "artifacts/wow-engine/basketball_training_replay.py"
      - "artifacts/wow-engine/basketball_specialist_pipeline.py"
      - "artifacts/wow-engine/basketball_team_event_specialist.py"
      - "artifacts/wow-engine/v17/basketball_model_maintenance.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/test_v17_basketball_model_maintenance.py"
      - "artifacts/wow-engine/test_v17_basketball_hydration_fallback.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-basketball-model-maintenance.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/basketball_event_hydration_runtime.py"
      - "artifacts/wow-engine/basketball_training_replay.py"
      - "artifacts/wow-engine/basketball_specialist_pipeline.py"
      - "artifacts/wow-engine/basketball_team_event_specialist.py"
      - "artifacts/wow-engine/v17/basketball_model_maintenance.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/test_v17_basketball_model_maintenance.py"
      - "artifacts/wow-engine/test_v17_basketball_hydration_fallback.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"

permissions:
  contents: read

concurrency:
  group: wow-v17-basketball-model-maintenance
  cancel-in-progress: false

jobs:
  verify:
    name: Verify basketball maintenance contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run basketball maintenance and OIDC regressions
        run: >-
          python -m pytest -q
          test_v17_basketball_model_maintenance.py
          test_v17_basketball_hydration_fallback.py
          test_basketball_training_replay_boundaries.py
          test_basketball_team_event_specialist.py
          test_v17_github_oidc.py

  maintain:
    name: Refresh NBA/WNBA training evidence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert non-execution governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Run governed basketball model maintenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          oidc_url += separator + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
          oidc_request = urllib.request.Request(
              oidc_url,
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(oidc_request, timeout=20) as response:
              oidc_token = json.load(response)["value"]

          endpoint = os.environ["WOW_ACTION_ORIGIN"].rstrip("/") + "/internal/v17/basketball-model-maintenance"
          request = urllib.request.Request(
              endpoint,
              data=b"",
              method="POST",
              headers={
                  "Authorization": f"Bearer {oidc_token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=600) as response:
              payload = json.load(response)

          assert payload.get("can_execute") is False
          assert payload.get("automatic_certification") is False
          assert payload.get("automatic_promotion") is False
          assert payload.get("probability_publishable") is False
          for row in payload.get("rows", []):
              assert row.get("can_execute") is False
              assert row.get("probability_publishable") is False
              if row.get("status") == "BLOCKED":
                  print(f"{row.get('sport')} blocked: {row.get('code')}")
          print(json.dumps({
              "status": payload.get("status"),
              "rows_updated": payload.get("rows_updated"),
              "rows_blocked": payload.get("rows_blocked"),
              "rows_fresh_acquisition_degraded": payload.get("rows_fresh_acquisition_degraded"),
              "can_execute": False,
          }, sort_keys=True))
          PY

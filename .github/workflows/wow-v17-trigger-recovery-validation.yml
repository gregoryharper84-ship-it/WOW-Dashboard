name: wow-v17-trigger-recovery-validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wow-v17-trigger-recovery-validation.yml"
      - "src/trigger/**"
      - "tests/wow-v17-recovery-probe.test.mjs"
      - "trigger.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wow-v17-trigger-recovery-validation.yml"
      - "src/trigger/**"
      - "tests/wow-v17-recovery-probe.test.mjs"
      - "trigger.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: wow-v17-trigger-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: WOW Trigger.dev recovery regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # immutable v4
        with:
          persist-credentials: false
      - name: Use Node 24 with native TypeScript stripping
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # immutable v4
        with:
          node-version: "24"
      - name: Setup pnpm v10
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # immutable v4
        with:
          version: 10.34.9
          run_install: false
      - name: Verify frozen Trigger.dev workspace dependencies before tests
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .
      - name: Run deterministic no-network sentinel regression
        run: node --experimental-strip-types --test tests/wow-v17-recovery-probe.test.mjs
      - name: Verify TypeScript probe
        run: pnpm exec tsc --noEmit --strict --target es2022 --module esnext --moduleResolution bundler --skipLibCheck src/trigger/wow-v17-recovery-probe.ts

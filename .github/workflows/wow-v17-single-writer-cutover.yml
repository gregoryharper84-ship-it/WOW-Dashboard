name: wow-v17-single-writer-cutover

# Controlled cutover (WOW-V17-DEPLOY-RELIABILITY-P0 / #2422).
# Default is dry-run GET readback. Set apply_cutover=true to PATCH both
# production services to autoDeploy=no and autoDeployTrigger=off so the sole
# writer is wow-v17-required-checks-deploy.yml. Never POSTs a deploy.
# workflow_dispatch only; step-isolated. can_execute=false.
on:
  workflow_dispatch:
    inputs:
      apply_cutover:
        description: When true, PATCH live web+worker native auto-deploy off
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wow-v17-single-writer-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: Retire native Render auto-deploy (single writer)
    if: >-
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wow-release
    env:
      CUTOVER_RECEIPT: wow-v17-single-writer-cutover.json
      APPLY_CUTOVER: ${{ inputs.apply_cutover }}
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Checkout protected main (read-only)
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Plan or apply single-writer cutover
        id: cutover
        continue-on-error: true
        working-directory: artifacts/wow-engine
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if ! python -m v17.single_writer_cutover; then
            echo "::error::SINGLE_WRITER_CUTOVER_HOLD: cutover did not verify; see receipt."
            echo "SINGLE_WRITER_CUTOVER_HOLD can_execute=false" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Preserve cutover receipt
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-v17-single-writer-cutover-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wow-engine/wow-v17-single-writer-cutover.json
          if-no-files-found: warn
          retention-days: 90

      - name: Disclosure
        continue-on-error: true
        if: always()
        run: |
          echo "Controlled cutover only; never a model/SIRT acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "Cutover step outcome: ${{ steps.cutover.outcome }}." >> "$GITHUB_STEP_SUMMARY"
          echo "apply_cutover=${{ inputs.apply_cutover }}; can_execute=false." >> "$GITHUB_STEP_SUMMARY"

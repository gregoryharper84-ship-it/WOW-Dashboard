name: tmp-nfl-prop-fit-threshold-20260920
on:
  push:
    branches: [fix/v17-nfl-prop-governed-lane-20260920-active]
    paths: ['.github/workflows/tmp-nfl-prop-fit-threshold-20260920.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v17-nfl-prop-governed-lane-20260920-active
          fetch-depth: 0
      - name: Apply bounded data-sufficiency threshold
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/wow-engine/scripts/train_nfl_props.py')
          s=p.read_text()
          old='MIN_TRAIN_ROWS = 1500\nMIN_CAL_ROWS = 400\nMIN_HOLDOUT_ROWS = 400'
          new='MIN_TRAIN_ROWS = 1000\nMIN_CAL_ROWS = 300\nMIN_HOLDOUT_ROWS = 300'
          assert old in s
          p.write_text(s.replace(old,new))
          PY
      - name: Commit and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/wow-engine/scripts/train_nfl_props.py
          git rm .github/workflows/tmp-nfl-prop-fit-threshold-20260920.yml
          git commit -m 'fix(v17): set evidence-sized NFL prop fit floor'
          git pull --rebase origin fix/v17-nfl-prop-governed-lane-20260920-active
          git push origin HEAD:fix/v17-nfl-prop-governed-lane-20260920-active

name: Legacy Platform Removal Audit

on:
  push:
    branches: [chatgpt/remove-replit-20260830]
    paths: ['.github/workflows/remove-legacy-platform-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-replit-20260830
          fetch-depth: 1
      - name: Inventory legacy platform references
        shell: bash
        run: |
          echo '=== PATHS ==='
          git ls-files | grep -i 'replit' || true
          echo '=== CONTENT ==='
          git grep -n -i -I 'replit' -- . ':(exclude).github/workflows/remove-legacy-platform-audit.yml' || true

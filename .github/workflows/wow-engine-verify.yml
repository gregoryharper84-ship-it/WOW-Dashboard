name: wow-engine-verify

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/wow-engine/**"
      - "render.yaml"
      - ".github/workflows/wow-engine-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-engine-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-probability-backend:
    name: WOW governed probability backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install backend and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyYAML openapi-spec-validator

      - name: Run governed probability backend tests
        run: python -m pytest -q

      - name: Validate Render, event schema, and Custom GPT Action contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from openapi_spec_validator import validate_spec

          render = yaml.safe_load(Path("../../render.yaml").read_text())
          assert isinstance(render, dict) and len(render.get("services", [])) == 1
          service = render["services"][0]
          assert service["type"] == "web"
          assert service["runtime"] == "python"
          assert service["plan"] == "free"
          assert service["rootDir"] == "artifacts/wow-engine"
          assert service["healthCheckPath"] == "/health"
          assert service["autoDeployTrigger"] == "off"
          assert "$PORT" in service["startCommand"]
          secret_vars = {
              item["key"]: item
              for item in service["envVars"]
              if item["key"] in {"SUPABASE_URL", "SUPABASE_SERVICE_KEY", "WOW_ACTION_API_KEY"}
          }
          assert set(secret_vars) == {"SUPABASE_URL", "SUPABASE_SERVICE_KEY", "WOW_ACTION_API_KEY"}
          assert all(item.get("sync") is False for item in secret_vars.values())

          event_schema = Path("event_schema.sql").read_text()
          assert "create table if not exists wow_event_predictions" in event_schema.lower()
          assert "create table if not exists wow_event_outcomes" in event_schema.lower()
          assert "check (can_execute = false)" in event_schema
          assert "simulation_count >= 50000" in event_schema
          assert "alter table wow_event_predictions enable row level security" in event_schema.lower()
          assert "alter table wow_event_outcomes enable row level security" in event_schema.lower()
          assert "direction in ('MORE','LESS')" not in event_schema

          action = yaml.safe_load(Path("openapi.custom-gpt.template.yaml").read_text())
          validate_spec(action)
          operations = {
              action["paths"]["/health"]["get"]["operationId"],
              action["paths"]["/governance"]["get"]["operationId"],
              action["paths"]["/score-prop"]["post"]["operationId"],
              action["paths"]["/score-event"]["post"]["operationId"],
              action["paths"]["/settle"]["post"]["operationId"],
          }
          assert len(operations) == 5
          assert action["components"]["securitySchemes"]["actionBearer"]["scheme"] == "bearer"
          assert action["paths"]["/score-prop"]["post"]["security"] == [{"actionBearer": []}]
          assert action["paths"]["/score-event"]["post"]["security"] == [{"actionBearer": []}]
          assert action["paths"]["/settle"]["post"]["security"] == [{"actionBearer": []}]
          assert action["paths"]["/score-event"]["post"]["operationId"] == "scoreWowEvent"
          assert "REPLACE_WITH_RENDER_SERVICE_HOST" in action["servers"][0]["url"]
          print("release contracts valid")
          PY

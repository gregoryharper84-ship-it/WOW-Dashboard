name: wow-engine-verify

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/wow-engine/**"
      - "render.yaml"
      - ".github/workflows/wow-engine-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-engine-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-probability-backend:
    name: WOW governed probability backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow_agent_ci
          POSTGRES_PASSWORD: wow_agent_ci
          POSTGRES_DB: wow_agent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wow_agent_ci -d wow_agent_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgres://wow_agent_ci:wow_agent_ci@postgres:5432/wow_agent_ci
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: wow-agent-runtime-ci-only-jwt-secret-not-a-real-secret-32-bytes
        ports:
          - 3000:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install backend and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyYAML openapi-spec-validator PyJWT

      - name: Run governed probability backend tests
        run: python -m pytest -q

      - name: Run durable Agent Runtime integration (real Postgres + Redis + PostgREST + Celery)
        env:
          WOW_AGENT_RUNTIME_INTEGRATION: "1"
          AGENT_RUNTIME_POSTGRES_DSN: postgresql://wow_agent_ci:wow_agent_ci@localhost:5432/wow_agent_ci
          SUPABASE_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379/0
          WOW_CAN_EXECUTE: "false"
          WOW_DRY_RUN_ONLY: "true"
        run: |
          SUPABASE_SERVICE_KEY=$(python -c "
          import jwt
          print(jwt.encode({'role': 'service_role'}, 'wow-agent-runtime-ci-only-jwt-secret-not-a-real-secret-32-bytes', algorithm='HS256'))
          ")
          export SUPABASE_SERVICE_KEY
          celery -A agent_runtime.celery_app:celery_app worker --loglevel=WARNING --pool=solo --concurrency=1 \
            > "$RUNNER_TEMP/wow-agent-worker.log" 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true; echo "--- worker log ---"; cat "$RUNNER_TEMP/wow-agent-worker.log" || true' EXIT
          sleep 3
          python -m pytest -q test_agent_runtime_postgres_integration.py
          kill "$WORKER_PID" 2>/dev/null || true
          wait "$WORKER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Validate Render, event schema, and Custom GPT Action contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from openapi_spec_validator import validate_spec

          render = yaml.safe_load(Path("../../render.yaml").read_text())
          assert isinstance(render, dict)
          services = render.get("services", [])
          by_name = {item["name"]: item for item in services}
          assert set(by_name) == {"wow-jobs", "wow-governed-probability-engine", "wow-agent-worker"}

          queue = by_name["wow-jobs"]
          assert queue["type"] == "keyvalue"
          assert queue["maxmemoryPolicy"] == "noeviction"
          assert queue["ipAllowList"] == []

          service = by_name["wow-governed-probability-engine"]
          assert service["type"] == "web"
          assert service["runtime"] == "python"
          assert service["plan"] == "free"
          assert service["rootDir"] == "artifacts/wow-engine"
          assert service["healthCheckPath"] == "/health/ready"
          assert service["autoDeployTrigger"] == "off"
          assert "$PORT" in service["startCommand"]
          secret_vars = {
              item["key"]: item
              for item in service["envVars"]
              if item["key"] in {"SUPABASE_URL", "SUPABASE_SERVICE_KEY", "WOW_ACTION_API_KEY"}
          }
          assert set(secret_vars) == {"SUPABASE_URL", "SUPABASE_SERVICE_KEY", "WOW_ACTION_API_KEY"}
          assert all(item.get("sync") is False for item in secret_vars.values())
          service_env_by_key = {item["key"]: item for item in service["envVars"]}
          assert service_env_by_key["WOW_CAN_EXECUTE"]["value"] == "false"
          assert service_env_by_key["WOW_DRY_RUN_ONLY"]["value"] == "true"

          worker = by_name["wow-agent-worker"]
          assert worker["type"] == "worker"
          assert worker["runtime"] == "python"
          assert worker["rootDir"] == "artifacts/wow-engine"
          assert worker["autoDeployTrigger"] == "off"
          assert "agent_runtime.celery_app:celery_app" in worker["startCommand"]
          worker_env_by_key = {item["key"]: item for item in worker["envVars"]}
          assert worker_env_by_key["WOW_CAN_EXECUTE"]["value"] == "false"
          assert worker_env_by_key["WOW_DRY_RUN_ONLY"]["value"] == "true"

          event_schema = Path("event_schema.sql").read_text()
          assert "create table if not exists wow_event_predictions" in event_schema.lower()
          assert "create table if not exists wow_event_outcomes" in event_schema.lower()
          assert "check (can_execute = false)" in event_schema
          assert "simulation_count >= 50000" in event_schema
          assert "alter table wow_event_predictions enable row level security" in event_schema.lower()
          assert "alter table wow_event_outcomes enable row level security" in event_schema.lower()
          assert "direction in ('MORE','LESS')" not in event_schema

          action = yaml.safe_load(Path("openapi.custom-gpt.template.yaml").read_text())
          validate_spec(action)
          operations = {
              action["paths"]["/health"]["get"]["operationId"],
              action["paths"]["/governance"]["get"]["operationId"],
              action["paths"]["/score-prop"]["post"]["operationId"],
              action["paths"]["/score-event"]["post"]["operationId"],
              action["paths"]["/settle"]["post"]["operationId"],
          }
          assert len(operations) == 5
          assert action["components"]["securitySchemes"]["actionBearer"]["scheme"] == "bearer"
          assert action["paths"]["/score-prop"]["post"]["security"] == [{"actionBearer": []}]
          assert action["paths"]["/score-event"]["post"]["security"] == [{"actionBearer": []}]
          assert action["paths"]["/settle"]["post"]["security"] == [{"actionBearer": []}]
          assert action["paths"]["/score-event"]["post"]["operationId"] == "scoreWowEvent"
          assert "REPLACE_WITH_RENDER_SERVICE_HOST" in action["servers"][0]["url"]
          print("release contracts valid")
          PY

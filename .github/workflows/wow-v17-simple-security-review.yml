name: wow-v17-simple-security-review
# Independent Claude -> Gemini -> authenticated owner recovery, no certification loop.
# Owner review never certifies owner-authored source, including App copies.
# Add WOW Independent Security Review (QA App 5245832) as required after bootstrap.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open same-repository PR number
        required: true
        type: string
      head_sha:
        description: Optional exact expected 40-char SHA; stale targets fail closed
        required: false
        type: string
      preflight_only:
        description: Owner-only, zero-inference Gemini credential/model capability probe
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: wow-independent-security-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false
  queue: max
jobs:
  independent-security:
    name: Execute independent semantic security review
    # Fail closed for paid inference by default. Draft edits and synchronization
    # must never trigger credits. Security HOLD remains binding without a
    # separately signed exact-head review. Manual paid review requires opt-in.
    if: >-
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.preflight_only == true) ||
       (vars.WOW_QA_PAID_REVIEW_ENABLED == 'true' &&
        (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'pull_request_target' &&
          github.event.pull_request.draft == false &&
          (github.event.action == 'opened' ||
           github.event.action == 'reopened' ||
           github.event.action == 'ready_for_review')))))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: wow-qa
    steps:
      - name: Checkout trusted protected main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate reviewer code locally
        run: python -m unittest discover -s .github/scripts/tests -p test_wow_simple_security_review.py -q
      - name: Mint separate QA App checks-only token
        if: inputs.preflight_only != true
        id: qa
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.WOW_QA_APP_ID }}
          private-key: ${{ secrets.WOW_QA_APP_PRIVATE_KEY }}
          repositories: WOW-Dashboard
          permission-checks: write
      - name: Authenticate Gemini model without generating content
        if: inputs.preflight_only == true
        env:
          WOW_QA_REVIEW_GEMINI_API_KEY: ${{ secrets.WOW_QA_REVIEW_GEMINI_API_KEY }}
          WOW_QA_GEMINI_MODEL: ${{ vars.WOW_QA_GEMINI_MODEL }}
        run: python .github/scripts/wow_simple_security_review.py --preflight
      - name: Review exact PR diff and publish QA App check
        if: inputs.preflight_only != true
        env:
          GH_READ_TOKEN: ${{ github.token }}
          QA_APP_TOKEN: ${{ steps.qa.outputs.token }}
          WOW_QA_REVIEW_ANTHROPIC_API_KEY: ${{ secrets.WOW_QA_REVIEW_ANTHROPIC_API_KEY }}
          WOW_QA_REVIEW_GEMINI_API_KEY: ${{ secrets.WOW_QA_REVIEW_GEMINI_API_KEY }}
          WOW_QA_CLAUDE_MODEL: ${{ vars.WOW_QA_CLAUDE_MODEL }}
          WOW_QA_GEMINI_MODEL: ${{ vars.WOW_QA_GEMINI_MODEL }}
        run: python .github/scripts/wow_simple_security_review.py
      - name: Retain attributable reviewer decision
        if: always() && inputs.preflight_only != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-independent-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: wow-independent-security-decision.json
          if-no-files-found: ignore
          retention-days: 30

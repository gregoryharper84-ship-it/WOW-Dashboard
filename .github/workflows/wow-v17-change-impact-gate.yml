name: wow-v17-change-impact-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wow-v17-change-impact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: WOW V17 change impact gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install governed engine test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r artifacts/wow-engine/requirements.txt
          python -m pip install PyYAML

      - name: Resolve changed paths and required adjacent gates
        id: impact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t files < <(gh pr diff "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --name-only)
          else
            mapfile -t files < <(git diff --name-only HEAD^ HEAD)
          fi
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/changed-paths.txt"
          python artifacts/wow-engine/v17/engineering_effectiveness.py impact "${files[@]}" \
            | tee "$RUNNER_TEMP/change-impact.json"
          gates=$(jq -r '.required_gates | join(",")' "$RUNNER_TEMP/change-impact.json")
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          {
            echo "# Change Impact"
            echo "Required gates: \`$gates\`"
            echo
            echo "This classifier never authorizes Class C behavior; probability-adjacent changes still require explicit governed review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run effectiveness contract regression
        run: python -m pytest -q artifacts/wow-engine/test_v17_engineering_effectiveness.py

      - name: Run workflow/handoff adjacent regression when required
        if: contains(steps.impact.outputs.gates, 'WORKFLOW_HANDOFF_ACCEPTANCE')
        run: |
          python -m pytest -q \
            artifacts/wow-engine/test_v17_24h_completion_loop.py \
            artifacts/wow-engine/test_v17_multi_agent_engineering_workflows.py \
            artifacts/wow-engine/test_v17_morning_green_continuation_workflow.py

      - name: Run live-host contract regression when required
        if: contains(steps.impact.outputs.gates, 'GPT_EDITOR_SYNC_ACCEPTANCE') || contains(steps.impact.outputs.gates, 'GOLDEN_LIVE_HOST_ACCEPTANCE')
        run: |
          python -m pytest -q \
            artifacts/wow-engine/v17/test_gpt_editor_sync_packet.py \
            artifacts/wow-engine/tests/test_v17_user_journey_recovery_contract.py

      - name: Record fail-closed production gates
        if: contains(steps.impact.outputs.gates, 'FULL_SLATE_PRODUCTION_ACCEPTANCE') || contains(steps.impact.outputs.gates, 'EXACT_SHA_RENDER_VERIFICATION') || contains(steps.impact.outputs.gates, 'GOLDEN_BACKEND_ACCEPTANCE')
        run: |
          {
            echo "## Post-merge production gates"
            echo "This PR affects a governed runtime boundary. Repository CI does not satisfy the following remote gates by itself:"
            echo "- full-slate production acceptance when applicable"
            echo "- exact merged-SHA Render verification"
            echo "- golden backend/user-journey acceptance"
            echo "These must remain explicit release evidence rather than inferred green status."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record invariants
        run: |
          echo "can_execute=false" >> "$GITHUB_STEP_SUMMARY"
          echo "terminal_authority=V17_TERMINAL_REDUCER" >> "$GITHUB_STEP_SUMMARY"

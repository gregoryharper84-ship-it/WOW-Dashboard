name: wow-v17-ci-postgres-throttle-retry

# P2 #1693: One verified, exact-run retry for external PostgreSQL image
# provisioning throttles. Never executes untrusted PR code or publishes a
# success status; original required CI gates remain authoritative.
on:
  workflow_run:
    workflows: [wow-verify, wow-engine-verify]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: wow-ci-postgres-throttle-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-provisioning-only:
    if: >-
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout protected main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify provider throttle and bounded retry eligibility
        id: retry
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          set -euo pipefail
          python artifacts/wow-engine/v17/ci_registry_retry.py \
            --event "$GITHUB_EVENT_PATH" --execute \
            | tee "$RUNNER_TEMP/wow-ci-registry-retry-receipt.json"
          jq -e '.can_execute == false and .terminal_authority == "V17_TERMINAL_REDUCER"' \
            "$RUNNER_TEMP/wow-ci-registry-retry-receipt.json" >/dev/null
          echo "Retry controller receipt for exact workflow-run: " >> "$GITHUB_STEP_SUMMARY"
          jq -c '{state, reason, run_id, head_sha, failed_job_ids, can_execute}' \
            "$RUNNER_TEMP/wow-ci-registry-retry-receipt.json" >> "$GITHUB_STEP_SUMMARY"

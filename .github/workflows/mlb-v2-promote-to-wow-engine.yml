name: MLB V2 promote to live wow-engine

on:
  push:
    branches: [feature/mlb-v2-governed-probability-20260827]
    paths:
      - ".github/workflows/mlb-v2-promote-to-wow-engine.yml"
      - "artifacts/wow-engine/tools/apply_mlb_v2_event_integration.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-v2-governed-probability-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Promote validated runtime and artifacts byte-for-byte
        run: |
          set -euo pipefail
          SRC=artifacts/flask-scoring-api/gate_engine
          DST=artifacts/wow-engine
          cp "$SRC/mlb_v2_features.py" "$DST/mlb_v2_features.py"
          cp "$SRC/mlb_v2_runtime.py" "$DST/mlb_v2_runtime.py"
          cp "$SRC/mlb_v2_hydrator.py" "$DST/mlb_v2_hydrator.py"
          rm -rf "$DST/mlb_v2_artifacts"
          mkdir -p "$DST/mlb_v2_artifacts"
          cp -a "$SRC/mlb_v2_artifacts/." "$DST/mlb_v2_artifacts/"
          python - <<'PY'
          from pathlib import Path
          rt = Path('artifacts/wow-engine/mlb_v2_runtime.py')
          text = rt.read_text()
          old = 'from gate_engine.mlb_v2_features import FEATURE_NAMES'
          assert text.count(old) == 1
          rt.write_text(text.replace(old, 'from mlb_v2_features import FEATURE_NAMES', 1))

          hy = Path('artifacts/wow-engine/mlb_v2_hydrator.py')
          text = hy.read_text()
          old = 'from gate_engine.mlb_v2_features import FEATURE_NAMES, build_feature_vector, starter_summary, team_summary'
          assert text.count(old) == 1
          hy.write_text(text.replace(old, 'from mlb_v2_features import FEATURE_NAMES, build_feature_vector, starter_summary, team_summary', 1))
          PY

      - name: Apply assertion-based FastAPI integration
        run: python artifacts/wow-engine/tools/apply_mlb_v2_event_integration.py

      - name: Static compilation and artifact identity checks
        run: |
          set -euo pipefail
          python -m py_compile \
            artifacts/wow-engine/api.py \
            artifacts/wow-engine/mlb_v2_features.py \
            artifacts/wow-engine/mlb_v2_runtime.py \
            artifacts/wow-engine/mlb_v2_hydrator.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          src=Path('artifacts/flask-scoring-api/gate_engine/mlb_v2_artifacts')
          dst=Path('artifacts/wow-engine/mlb_v2_artifacts')
          required=['mlb_v2_base_model.joblib','mlb_v2_platt_calibrator.joblib','mlb_v2_feature_schema.json','mlb_v2_manifest.json','mlb_v2_pregame_state.json.gz']
          for name in required:
              def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
              assert h(src/name)==h(dst/name), name
          print('MLB_V2_WOW_ENGINE_BINARY_IDENTITY=PASS')
          PY

      - name: Install wow-engine dependencies
        working-directory: artifacts/wow-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Existing 11-point wow-engine deployment gate
        working-directory: artifacts/wow-engine
        run: pytest -q deployment_gate_tests.py

      - name: MLB V2 artifact and fail-closed runtime gate
        working-directory: artifacts/wow-engine
        run: |
          python - <<'PY'
          from datetime import date
          import mlb_v2_runtime as rt
          h=rt.artifact_health(date(2026,8,27))
          assert h['healthy'] is True, h
          assert h['probability_capability']=='AVAILABLE', h
          assert h['model_id']=='mlb-moneyline-v2-rolling-2026', h
          assert h['can_execute'] is False
          bad=rt.score_home_probability([0.0]*40, as_of=date(2026,8,27))
          assert bad['probability_publishable'] is False
          assert 'home_probability' not in bad
          print('MLB_V2_WOW_ENGINE_RUNTIME_GATE=PASS')
          PY

      - name: Real current-event FastAPI score-event gate
        working-directory: artifacts/wow-engine
        env:
          WOW_ACTION_API_KEY: ci-live-v2-key
        run: |
          python - <<'PY'
          import uuid, requests
          from datetime import date
          from fastapi.testclient import TestClient
          import api

          target=date(2026,8,27)
          payload=requests.get(
              'https://statsapi.mlb.com/api/v1/schedule',
              params={'sportId':1,'gameTypes':'R','date':target.isoformat(),'hydrate':'probablePitcher,venue'},
              timeout=15,
              headers={'User-Agent':'WOW-MLB-V2-FastAPI-Gate/20260827'},
          ).json()
          games=[]
          for day in payload.get('dates',[]):
              for g in day.get('games',[]):
                  if g.get('gameType')!='R': continue
                  if (g.get('status') or {}).get('abstractGameState')!='Preview': continue
                  home=(g.get('teams') or {}).get('home') or {}
                  away=(g.get('teams') or {}).get('away') or {}
                  hp=home.get('probablePitcher') or {}
                  ap=away.get('probablePitcher') or {}
                  if not hp.get('id') or not ap.get('id'): continue
                  games.append((g,home,away,hp,ap))
          assert games, 'NO_CURRENT_PREVIEW_GAME_WITH_BOTH_STARTERS'
          client=TestClient(api.app)
          attempts=[]
          success=None
          for g,home,away,hp,ap in games:
              body={
                  'research_run_id':'mlb-v2-fastapi-ci-'+str(uuid.uuid4()),
                  'requested_slate_date':target.isoformat(),
                  'requested_timezone':'America/Chicago',
                  'scan_stage':'PREGAME',
                  'event_key':f"MLB:{g['gamePk']}",
                  'official_event_id':str(g['gamePk']),
                  'event_start_time_utc':g['gameDate'],
                  'sport':'MLB','league':'MLB','market_family':'OUTRIGHT_WINNER',
                  'settlement_basis':'FULL_GAME_INCLUDING_EXTRA_INNINGS',
                  'home_team':(home.get('team') or {}).get('name') or '',
                  'away_team':(away.get('team') or {}).get('name') or '',
                  'venue':(g.get('venue') or {}).get('name') or 'MLB venue',
                  'home_starting_pitcher':hp.get('fullName') or '',
                  'away_starting_pitcher':ap.get('fullName') or '',
                  'home_starter_status':'PROBABLE','away_starter_status':'PROBABLE',
                  'home_lineup_status':'UNCONFIRMED','away_lineup_status':'UNCONFIRMED',
                  'source_snapshot_id':str(uuid.uuid4()),
              }
              r=client.post('/score-event',json=body,headers={'Authorization':'Bearer ci-live-v2-key'})
              d=r.json()
              attempts.append({'gamePk':g['gamePk'],'status':r.status_code,'response':d})
              if r.status_code==200:
                  success=d
                  break
          print({'attempt_count':len(attempts),'success':success,'attempts':attempts})
          assert success is not None, 'NO_CURRENT_EVENT_PASSED_FASTAPI_V2_GATE'
          assert success['code']=='GOVERNED_EVENT_MODEL_AVAILABLE'
          assert success['governed_probability_capability']=='AVAILABLE'
          assert success['governed_probability_status']=='PRODUCED'
          assert success['probability_publishable'] is True
          assert 0.0 < success['home_probability'] < 1.0
          assert 0.0 < success['away_probability'] < 1.0
          assert abs(success['home_probability']+success['away_probability']-1.0) < 1e-6
          assert success['home_probability_lower_bound'] <= success['home_probability'] <= success['home_probability_upper_bound']
          assert success['market_weight_in_point_probability']==0.0
          assert success['hydration']['strict_prior_date_only'] is True
          assert success['hydration']['same_day_results_used'] is False
          assert success['can_execute'] is False
          assert success['can_approve_bets'] is False
          print('MLB_V2_WOW_ENGINE_FASTAPI_LIVE_GATE=PASS')
          PY

      - name: Commit production wow-engine integration
        run: |
          set -euo pipefail
          git config user.name "gregoryharper84-ship-it"
          git config user.email "gregory.harper84@gmail.com"
          git add artifacts/wow-engine/api.py artifacts/wow-engine/requirements.txt \
                  artifacts/wow-engine/mlb_v2_features.py artifacts/wow-engine/mlb_v2_runtime.py \
                  artifacts/wow-engine/mlb_v2_hydrator.py artifacts/wow-engine/mlb_v2_artifacts
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Integrate validated MLB V2 into live wow-engine"
            git push origin HEAD:feature/mlb-v2-governed-probability-20260827
          fi

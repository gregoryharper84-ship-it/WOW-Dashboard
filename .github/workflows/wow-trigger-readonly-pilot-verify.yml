name: wow-trigger-readonly-pilot-verify

# Tests only: no cron, no Trigger.dev auth, no external probes and no deploy.
on:
  pull_request:
    paths:
      - "integrations/trigger-dev-pilot/**"
      - ".github/workflows/wow-trigger-readonly-pilot-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-trigger-pilot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  isolated-contract:
    name: Verify read-only pilot contract (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: integrations/trigger-dev-pilot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Local no-network contracts
        run: |
          node --check src/lib/read-only-health.mjs
          node --check src/lib/submit-readonly.mjs
          node --check bin/trigger-once.mjs
          node --test
      - name: Cross-platform lockfile completeness (macOS arm64 and x64)
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync("package-lock.json", "utf8")).packages;
          const required = [
            "node_modules/@depot/cli-darwin-arm64",
            "node_modules/@depot/cli-darwin-x64",
            "node_modules/@depot/cli-linux-arm",
            "node_modules/@depot/cli-linux-arm64",
            "node_modules/@depot/cli-linux-ia32",
            "node_modules/@depot/cli-win32-arm64",
            "node_modules/@depot/cli-win32-ia32",
            "node_modules/@depot/cli-win32-x64",
            "node_modules/@rollup/rollup-darwin-arm64",
            "node_modules/fsevents",
            "node_modules/@esbuild/aix-ppc64",
            "node_modules/@esbuild/android-arm",
            "node_modules/@esbuild/android-arm64",
            "node_modules/@esbuild/android-x64",
            "node_modules/@esbuild/darwin-arm64",
            "node_modules/@esbuild/darwin-x64",
            "node_modules/@esbuild/freebsd-arm64",
            "node_modules/@esbuild/freebsd-x64",
            "node_modules/@esbuild/linux-arm",
            "node_modules/@esbuild/linux-arm64",
            "node_modules/@esbuild/linux-ia32",
            "node_modules/@esbuild/linux-loong64",
            "node_modules/@esbuild/linux-mips64el",
            "node_modules/@esbuild/linux-ppc64",
            "node_modules/@esbuild/linux-riscv64",
            "node_modules/@esbuild/linux-s390x",
            "node_modules/@esbuild/netbsd-x64",
            "node_modules/@esbuild/openbsd-arm64",
            "node_modules/@esbuild/openbsd-x64",
            "node_modules/@esbuild/sunos-x64",
            "node_modules/@esbuild/win32-arm64",
            "node_modules/@esbuild/win32-ia32",
            "node_modules/@esbuild/win32-x64"
          ];
          const missing = required.filter(x => !p[x]);
          if (missing.length) throw new Error("INCOMPLETE_CROSS_PLATFORM_LOCK: " + missing.join(", "));
          console.log("Cross-platform optional lock entries present:", required.length);
          NODE
      - name: Resolve patched dependency lockfile (temporary transfer)
        run: |
          npm install --package-lock-only --include=dev --include=optional --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require("node:fs");
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const expected = { "deepmerge-ts": "8.0.2", "esbuild": "0.25.0", "minimatch": "11.0.1", "tar": "7.5.22", "zod": "4.6.7" };
          const resolved = {};
          for (const name of Object.keys(expected)) {
            const entries = Object.entries(lock.packages).filter(([path]) => path === "node_modules/" + name || path.endsWith("/node_modules/" + name));
            resolved[name] = [...new Set(entries.map(([, value]) => value.version))];
          }
          console.log("PATCHED_DEPENDENCY_RESOLUTION", JSON.stringify(resolved));
          for (const [name, version] of Object.entries(expected)) {
            if (!resolved[name].includes(version)) throw new Error("PATCHED_DEPENDENCY_MISSING: " + name + "@" + version);
          }
          const b64 = fs.readFileSync("package-lock.json").toString("base64");
          for (let i = 0; i < b64.length; i += 1024) console.log("PATCHED_LOCK_CHUNK " + (i / 1024) + " " + b64.slice(i, i + 1024));
          console.log("PATCHED_LOCK_END " + b64.length);
          NODE
      - name: Build-time SDK compatibility (isolated, no deploy)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Audit dependency tree (high and critical advisories fail)
        run: npm audit --audit-level=high

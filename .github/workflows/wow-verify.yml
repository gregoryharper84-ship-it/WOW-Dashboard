name: wow-verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR runs may supersede older PR runs. A push to protected main is authoritative
# for Render checksPass and must always reach a terminal check conclusion.
concurrency:
  group: wow-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgresql://wow_ci:wow_ci@localhost:5432/wow_test
  WOW_CI: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  ANTHROPIC_API_KEY: "wow-ci-placeholder-not-live"
  SESSION_SECRET: "wow-ci-attestation-secret-not-live"

jobs:
  required-three-collection:
    name: WOW required-three collection contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: artifacts/flask-scoring-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow_ci
          POSTGRES_PASSWORD: wow_ci
          POSTGRES_DB: wow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wow_ci -d wow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/flask-scoring-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Initialize CI-local database schema
        run: |
          python - <<'PY'
          from gate_engine.pg_session_ledger import ensure_table_exists
          ensure_table_exists()
          print("wow_session_exposure schema initialized")
          PY
      - name: Enforce full required-three collection floor
        env:
          MIN_REQUIRED_COLLECTION: "5572"
        run: |
          set +e
          python -m pytest --collect-only -q gate_engine/tests services/tests tests > "$RUNNER_TEMP/required-three-collection.txt" 2>&1
          collection_status=$?
          set -e
          cat "$RUNNER_TEMP/required-three-collection.txt"
          if [ "$collection_status" -ne 0 ]; then
            exit "$collection_status"
          fi
          python - "$RUNNER_TEMP/required-three-collection.txt" "$MIN_REQUIRED_COLLECTION" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors="replace")
          floor = int(sys.argv[2])
          matches = re.findall(r"([\d,]+)\s+tests?\s+collected", text)
          if not matches:
              raise SystemExit("Could not determine pytest collection count")
          count = int(matches[-1].replace(",", ""))
          print(f"required-three collected={count}; floor={floor}")
          if count < floor:
              raise SystemExit(f"Collection floor failed: {count} < {floor}")
          PY

  required-three-shards:
    name: WOW required-three shard / ${{ matrix.name }}
    needs: required-three-collection
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gate-engine
            suite: gate_engine/tests
          - name: services
            suite: services/tests
          - name: application
            suite: tests
    defaults:
      run:
        working-directory: artifacts/flask-scoring-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow_ci
          POSTGRES_PASSWORD: wow_ci
          POSTGRES_DB: wow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wow_ci -d wow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/flask-scoring-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Dependency consistency diagnostic
        continue-on-error: true
        run: python -m pip check
      - name: Initialize isolated shard database schema
        run: |
          python - <<'PY'
          from gate_engine.pg_session_ledger import ensure_table_exists
          ensure_table_exists()
          print("wow_session_exposure schema initialized")
          PY
      - name: Run isolated required-three shard
        run: python -m pytest "${{ matrix.suite }}" -q --tb=short -rs

  required-three:
    name: WOW required-three regression
    if: always()
    needs: [required-three-collection, required-three-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate protected required-three result
        env:
          COLLECTION_RESULT: ${{ needs.required-three-collection.result }}
          SHARD_RESULT: ${{ needs.required-three-shards.result }}
        run: |
          echo "collection=$COLLECTION_RESULT shards=$SHARD_RESULT"
          test "$COLLECTION_RESULT" = "success"
          test "$SHARD_RESULT" = "success"

  additional-shards:
    name: WOW additional shard / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kalshi
            suite: kalshi_engine/tests
          - name: validation
            suite: validation/tests
    defaults:
      run:
        working-directory: artifacts/flask-scoring-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow_ci
          POSTGRES_PASSWORD: wow_ci
          POSTGRES_DB: wow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wow_ci -d wow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/flask-scoring-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Initialize isolated shard database schema
        run: |
          python - <<'PY'
          from gate_engine.pg_session_ledger import ensure_table_exists
          ensure_table_exists()
          print("wow_session_exposure schema initialized")
          PY
      - name: Run isolated additional regression shard
        run: python -m pytest "${{ matrix.suite }}" -q --tb=short -rs

  additional-required:
    name: WOW additional required regression
    if: always()
    needs: additional-shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate protected additional result
        env:
          SHARD_RESULT: ${{ needs.additional-shards.result }}
        run: |
          echo "additional shards=$SHARD_RESULT"
          test "$SHARD_RESULT" = "success"

name: wow-verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - rescue/replit-emergency-20260820-1221
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-three:
    name: WOW required-three regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: artifacts/flask-scoring-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow_ci
          POSTGRES_PASSWORD: wow_ci
          POSTGRES_DB: wow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wow_ci -d wow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://wow_ci:wow_ci@localhost:5432/wow_test
      WOW_CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SCORING_API_KEY: "wow-ci-scoring-key-not-live"
      MIN_REQUIRED_COLLECTION: "5572"
      # CI-local, non-functional placeholders. Neither value is a live
      # credential: ANTHROPIC_API_KEY only needs to be non-empty so the
      # config-presence gate passes (the Anthropic client itself is mocked
      # in every test that reaches it); SESSION_SECRET is the server-only
      # HMAC key gate_engine.runtime_provenance already documents as
      # acceptable attestation key material (WOW_ATTESTATION_SECRET or
      # SESSION_SECRET) — CI just never had either configured.
      ANTHROPIC_API_KEY: "wow-ci-placeholder-not-live"
      SESSION_SECRET: "wow-ci-attestation-secret-not-live"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/flask-scoring-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
          python -m pip install PyYAML==6.0.3

      - name: Dependency consistency diagnostic
        continue-on-error: true
        run: python -m pip check

      - name: Initialize CI-local database schema
        run: |
          python - <<'PY'
          from gate_engine.pg_session_ledger import ensure_table_exists
          ensure_table_exists()
          print("wow_session_exposure schema initialized")
          PY

      - name: Collect required-three suite
        run: |
          python -m pytest --collect-only -q \
            gate_engine/tests \
            services/tests \
            tests > "$RUNNER_TEMP/required-three-collection.txt" 2>&1
          cat "$RUNNER_TEMP/required-three-collection.txt"
          python - "$RUNNER_TEMP/required-three-collection.txt" "$MIN_REQUIRED_COLLECTION" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          floor = int(sys.argv[2])
          matches = re.findall(r"([\d,]+)\s+tests?\s+collected", text)
          if not matches:
              raise SystemExit("Could not determine pytest collection count")
          count = int(matches[-1].replace(",", ""))
          print(f"required-three collected={count}; floor={floor}")
          if count < floor:
              raise SystemExit(f"Collection floor failed: {count} < {floor}")
          PY

      - name: Run required-three regression
        run: |
          python -m pytest \
            gate_engine/tests \
            services/tests \
            tests \
            -q --tb=short -rs

  additional-required:
    name: WOW additional required regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: artifacts/flask-scoring-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow_ci
          POSTGRES_PASSWORD: wow_ci
          POSTGRES_DB: wow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wow_ci -d wow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://wow_ci:wow_ci@localhost:5432/wow_test
      WOW_CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # These are deliberately non-live placeholders. Tests must mock external
      # calls and separately exercise absent-credential fail-closed behavior.
      ANTHROPIC_API_KEY: "wow-ci-placeholder-not-live"
      SESSION_SECRET: "wow-ci-attestation-secret-not-live"
      SCORING_API_KEY: "wow-ci-scoring-key-not-live"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/flask-scoring-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
          python -m pip install PyYAML==6.0.3

      - name: Initialize CI-local database schema
        run: |
          python - <<'PY'
          from gate_engine.pg_session_ledger import ensure_table_exists
          ensure_table_exists()
          print("wow_session_exposure schema initialized")
          PY

      - name: Run additive suites
        run: |
          python -m pytest \
            kalshi_engine/tests \
            validation/tests \
            -q --tb=short -rs

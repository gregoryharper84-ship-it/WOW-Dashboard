name: v17-mlb-1ip-publication-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/v17-mlb-1ip-publication-validation.yml"
      - "artifacts/wow-engine/mlb_1ip_empirical_pmf.py"
      - "artifacts/wow-engine/mlb_1ip_player_conditioned.py"
      - "artifacts/wow-engine/mlb_1ip_training_dataset.py"
      - "artifacts/wow-engine/scripts/validate_mlb_1ip_line_expansion_2026.py"
      - "artifacts/wow-engine/scripts/validate_mlb_1ip_publication_2026.py"
      - "artifacts/wow-engine/research-fixtures/mlb_1ip_player_conditioning_dev_bundle_20260914.json"
  push:
    branches:
      - engineering/mlb-1ip-publication-942
    paths:
      - ".github/workflows/v17-mlb-1ip-publication-validation.yml"
      - "artifacts/wow-engine/scripts/validate_mlb_1ip_publication_2026.py"

permissions:
  contents: read

concurrency:
  group: v17-mlb-1ip-publication-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-publication-readiness:
    name: Validate MLB 1IP production-publication evidence
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Compile unchanged scorer and publication validation
        run: >-
          python -m py_compile
          mlb_1ip_empirical_pmf.py
          mlb_1ip_player_conditioned.py
          scripts/validate_mlb_1ip_line_expansion_2026.py
          scripts/validate_mlb_1ip_publication_2026.py
      - name: Run untouched chronological publication-readiness replay
        env:
          PYTHONPATH: .
          MLB_1IP_PUBLICATION_VALIDATION_OUT: /tmp/mlb-1ip-publication-validation
        run: python scripts/validate_mlb_1ip_publication_2026.py
      - name: Assert fail-closed evidence contract
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/mlb-1ip-publication-validation/publication_validation_report.json').read_text())
          assert report['validation_passed'] is True
          assert report['promotion_status'] == 'REVIEW_REQUIRED'
          assert report['probability_publishable'] is False
          assert report['rank_eligible'] is False
          assert report['can_execute'] is False
          assert report['model_payload_changed'] is False
          assert report['calibration_transform_changed'] is False
          assert report['bound_method_changed'] is False
          assert report['certified_lines'] == [11.5, 13.5, 14.5, 15.5, 16.5, 17.5, 19.5, 21.5]
          assert report['directions'] == ['MORE', 'LESS']
          assert report['validation_failures'] == []
          for line in map(str, report['certified_lines']):
              for direction in report['directions']:
                  row = report['line_results'][line][direction]
                  assert row['n'] >= 500
                  assert row['conservative_lower_bound'] is True
                  assert row['probability_unique_count'] >= 2
                  assert row['lower_bound_unique_count'] >= 2
          PY
      - name: Run adjacent 1IP regression coverage
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_mlb_1ip_player_conditioned.py
          tests/test_mlb_1ip_exact_line_expansion.py
          test_v17_mlb_1ip_line_expansion_maintenance.py
          v17/test_prop_capability_manifest.py
      - name: Upload immutable publication evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-1ip-publication-validation-${{ github.sha }}
          path: /tmp/mlb-1ip-publication-validation
          if-no-files-found: warn
          retention-days: 30

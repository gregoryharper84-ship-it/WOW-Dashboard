name: WNBA Refresh Checked Candidates

on:
  push:
    branches:
      - feat/v17-wnba-certification-replay-20260905
    paths:
      - '.github/workflows/wnba-refresh-checked-candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen WNBA source
        run: PYTHONPATH=. pytest -q test_wnba_training_source.py
      - name: Generate checked candidate bytes from frozen source
        env:
          WNBA_ARTIFACT_OUT_DIR: data/wnba-machine-refresh
        run: |
          mkdir -p data/wnba-machine-refresh
          PYTHONPATH=. python scripts/train_wnba_props_frozen.py
          cp data/wnba-machine-refresh/wow_wnba_prop_artifacts_v1.json data/wow_wnba_prop_artifacts_v1.json
      - name: Commit machine-generated checked candidates
        run: |
          git config user.name 'WOW V17 CI'
          git config user.email 'wow-v17-ci@users.noreply.github.com'
          git add data/wow_wnba_prop_artifacts_v1.json
          if git diff --cached --quiet; then
            echo 'Checked WNBA candidates already match machine output.'
          else
            git commit -m 'V17: regenerate checked WNBA candidates from frozen source'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

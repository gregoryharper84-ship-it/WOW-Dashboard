name: wow-v17-release-production-verification-agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Engineering PR number to verify
        required: true
        type: string

permissions:
  actions: read
  id-token: write
  checks: read
  contents: read
  pull-requests: write

concurrency:
  group: wow-v17-release-production-verification-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  release-verification:
    name: Release / Production Verification agent
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pre-merge required-context contract gate
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          echo "Pre-merge context only. Production verification remains post-merge."
          echo "can_execute=false"

      - name: Non-release closed-PR context
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged != true
        run: |
          echo "Closed PR was not merged; no production verification is permitted."
          echo "can_execute=false"

      - name: Resolve PR number
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.action == 'closed' &&
           github.event.pull_request.merged == true)
        id: pr
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout protected main
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Reliability V1 receipt dependency
        if: steps.pr.outputs.number != ''
        run: python -m pip install 'pydantic>=2.6,<3'

      - name: Resolve exact merged identity
        if: steps.pr.outputs.number != ''
        id: merged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          merged_at=$(jq -r '.merged_at // ""' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha // ""' <<<"$pr_json")
          head_ref=$(jq -r '.head.ref // ""' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          merge_sha=$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")

          [ -n "$merged_at" ] || {
            echo "RELEASE_GOVERNANCE_PR_NOT_MERGED: PR #${PR_NUMBER} has no merged_at timestamp." >&2
            exit 1
          }
          [ -n "$head_sha" ] && [ -n "$head_ref" ] && [ -n "$merge_sha" ] || {
            echo "RELEASE_GOVERNANCE_IDENTITY_INCOMPLETE" >&2
            exit 1
          }
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
            echo "RELEASE_GOVERNANCE_HEAD_REPOSITORY_MISMATCH: $head_repo" >&2
            exit 1
          }

          git merge-base --is-ancestor "$merge_sha" HEAD || {
            echo "RELEASE_MERGED_SHA_NOT_ON_PROTECTED_MAIN: $merge_sha" >&2
            exit 1
          }

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Verify required exact-head CI
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.merged.outputs.head_sha }}
        run: |
          set -euo pipefail
          runs=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" --jq '.workflow_runs')
          required=(
            "wow-verify|.github/workflows/wow-verify.yml"
            "wow-engine-verify|.github/workflows/wow-engine-verify.yml"
            "wow-v17-rapid-repair|.github/workflows/wow-v17-rapid-repair.yml"
            "wow-v17-change-impact-gate|.github/workflows/wow-v17-change-impact-gate.yml"
            "wow-v17-engineering-auditor-code-health|.github/workflows/wow-v17-engineering-auditor-code-health.yml"
            "wow-v17-spread-forward-shadow|.github/workflows/wow-v17-spread-forward-shadow.yml"
          )
          for required_spec in "${required[@]}"; do
            required_name="${required_spec%%|*}"
            required_path="${required_spec#*|}"
            match=$(jq -r --arg name "$required_name" --arg path "$required_path" '[.[] | select(.name == $name and .path == $path)] | sort_by(.created_at) | reverse | first | "\(.status)|\(.conclusion // "")"' <<<"$runs")
            [ "$match" = "completed|success" ] || {
              echo "RELEASE_REQUIRED_WORKFLOW_NOT_GREEN: $required_name:$required_path -> ${match:-MISSING}" >&2
              exit 1
            }
          done
          checks=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" --jq '.check_runs')
          gate=$(jq -r '[.[] | select(.name == "Trusted exact-head engineering governance")] | sort_by(.started_at // .created_at) | reverse | first | "\(.status)|\(.conclusion // "")"' <<<"$checks")
          [ "$gate" = "completed|success" ] || {
            echo "RELEASE_TRUSTED_GOVERNANCE_CHECK_NOT_GREEN: ${gate:-MISSING}" >&2
            exit 1
          }

      - name: Resolve trusted exact-head governance artifact
        if: steps.pr.outputs.number != ''
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.merged.outputs.head_sha }}
        run: |
          set -euo pipefail
          artifact_name="wow-v17-engineering-governance-${HEAD_SHA}"
          artifacts=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=20")
          artifact_id=$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .id // ""' <<<"$artifacts")
          run_id=$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .workflow_run.id // ""' <<<"$artifacts")
          [ -n "$artifact_id" ] && [ -n "$run_id" ] || {
            echo "RELEASE_GOVERNANCE_RECEIPT_MISSING: no trusted artifact for exact head ${HEAD_SHA}." >&2
            exit 1
          }
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify governance-producing workflow provenance
        if: steps.pr.outputs.number != ''
        id: governance_workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.artifact.outputs.run_id }}
        run: |
          set -euo pipefail
          run_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          name=$(jq -r '.name // ""' <<<"$run_json")
          path=$(jq -r '.path // ""' <<<"$run_json")
          event=$(jq -r '.event // ""' <<<"$run_json")
          status=$(jq -r '.status // ""' <<<"$run_json")
          conclusion=$(jq -r '.conclusion // ""' <<<"$run_json")
          head_branch=$(jq -r '.head_branch // ""' <<<"$run_json")
          head_repo=$(jq -r '.head_repository.full_name // ""' <<<"$run_json")

          protected_main_source=false
          case "$name|$path" in
            "wow-v17-chatgpt-engineering-worker|.github/workflows/wow-v17-chatgpt-engineering-worker.yml")
              case "$event" in schedule|workflow_run|workflow_dispatch) ;; *) exit 1 ;; esac
              [ "$head_branch" = "main" ] && protected_main_source=true
              ;;
            "wow-v17-claude-engineering-worker|.github/workflows/wow-v17-claude-engineering-worker.yml")
              [ "$event" = "workflow_dispatch" ] || exit 1
              [ "$head_branch" = "main" ] && protected_main_source=true
              ;;
            "wow-v17-existing-pr-governance-review|.github/workflows/wow-v17-existing-pr-governance-review.yml")
              case "$event" in
                pull_request_target) protected_main_source=true ;;
                workflow_dispatch) [ "$head_branch" = "main" ] && protected_main_source=true ;;
                *) exit 1 ;;
              esac
              ;;
            *)
              echo "RELEASE_GOVERNANCE_WORKFLOW_IDENTITY_MISMATCH: $name at $path" >&2
              exit 1
              ;;
          esac

          [ "$status" = "completed" ] && [ "$conclusion" = "success" ] || {
            echo "RELEASE_GOVERNANCE_WORKFLOW_NOT_SUCCESSFUL" >&2
            exit 1
          }
          [ "$protected_main_source" = "true" ] || {
            echo "RELEASE_GOVERNANCE_WORKFLOW_REF_MISMATCH: $head_branch" >&2
            exit 1
          }
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
            echo "RELEASE_GOVERNANCE_WORKFLOW_REPOSITORY_MISMATCH: $head_repo" >&2
            exit 1
          }
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Download and verify trusted governance receipt
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          RUN_ID: ${{ steps.artifact.outputs.run_id }}
          WORKFLOW_NAME: ${{ steps.governance_workflow.outputs.name }}
          HEAD_SHA: ${{ steps.merged.outputs.head_sha }}
          HEAD_REF: ${{ steps.merged.outputs.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/wow-engine/v17/.release-evidence
          zip_path="$RUNNER_TEMP/governance.zip"
          receipt="artifacts/wow-engine/v17/.release-evidence/governance-receipt.json"
          checksum="$RUNNER_TEMP/wow-engineering-governance-receipt.sha256"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$zip_path"
          unzip -p "$zip_path" wow-engineering-governance-receipt.json > "$receipt"
          unzip -p "$zip_path" wow-engineering-governance-receipt.sha256 > "$checksum"

          expected=$(tr -d '[:space:]' < "$checksum")
          actual=$(sha256sum "$receipt" | awk '{print $1}')
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
            echo "RELEASE_GOVERNANCE_RECEIPT_CHECKSUM_MISMATCH" >&2
            exit 1
          }

          verifier=".github/scripts/verify_engineering_governance_receipt.py"
          if [ "$WORKFLOW_NAME" = "wow-v17-existing-pr-governance-review" ]; then
            verifier=".github/scripts/verify_existing_pr_governance_receipt.py"
          fi

          python "$verifier" \
            --receipt "$receipt" \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --head-ref "$HEAD_REF" \
            --workflow-run-id "$RUN_ID" \
            --workflow-name "$WORKFLOW_NAME"

      - name: Capture deterministic release evidence
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.merged.outputs.head_sha }}
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          WOW_RENDER_SERVICE_ID: "srv-da7sa9gu01pc73brt80g"
        run: |
          set -euo pipefail
          mkdir -p artifacts/wow-engine/v17/.release-evidence
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > artifacts/wow-engine/v17/.release-evidence/pr.json
          git rev-parse HEAD > artifacts/wow-engine/v17/.release-evidence/main-sha.txt
          printf '%s\n' "$HEAD_SHA" > artifacts/wow-engine/v17/.release-evidence/pr-head-sha.txt
          printf '%s\n' "$MERGE_SHA" > artifacts/wow-engine/v17/.release-evidence/merge-sha.txt
          gh run list --repo "$GITHUB_REPOSITORY" --branch main --limit 30 \
            --json databaseId,name,headSha,status,conclusion,url \
            > artifacts/wow-engine/v17/.release-evidence/runs.json
          health_status=$(curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 30 \
            -D artifacts/wow-engine/v17/.release-evidence/health-live.headers \
            -o artifacts/wow-engine/v17/.release-evidence/health-live.json \
            -w '%{http_code}' \
            https://wow-governed-probability-engine.onrender.com/health/live)
          printf '%s\n' "$health_status" > artifacts/wow-engine/v17/.release-evidence/health-live.status
          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 30 \
            -D artifacts/wow-engine/v17/.release-evidence/governance.headers \
            -o artifacts/wow-engine/v17/.release-evidence/governance.json \
            https://wow-governed-probability-engine.onrender.com/governance

          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          out = "artifacts/wow-engine/v17/.release-evidence"
          api_key = os.environ.get("RENDER_API_KEY", "").strip()
          service_id = os.environ.get("WOW_RENDER_SERVICE_ID", "").strip()
          if not api_key or not service_id:
              open(f"{out}/render-live-sha.txt", "w").write("\n")
              open(f"{out}/render-live-deploy-id.txt", "w").write("\n")
              raise SystemExit(0)
          req = urllib.request.Request(
              "https://api.render.com/v1/services/" + urllib.parse.quote(service_id, safe="") + "/deploys?limit=20",
              headers={"Authorization": f"Bearer {api_key}", "Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          items = payload if isinstance(payload, list) else payload.get("deploys", [])
          deploys = [item.get("deploy", item) for item in items if isinstance(item, dict)]
          live = next((d for d in deploys if isinstance(d, dict) and str(d.get("status") or "") == "live"), None)
          commit = (live or {}).get("commit") if isinstance((live or {}).get("commit"), dict) else {}
          open(f"{out}/render-live-sha.txt", "w").write(str(commit.get("id") or "") + "\n")
          open(f"{out}/render-live-deploy-id.txt", "w").write(str((live or {}).get("id") or "") + "\n")
          with open(f"{out}/render-live-deploy.json", "w") as fh:
              json.dump(live or {}, fh, indent=2, sort_keys=True)
          PY

      - name: Release / Production Verification agent
        if: steps.pr.outputs.number != ''
        id: release_agent
        uses: ./.github/actions/wow-chatgpt-agent
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 RELEASE_OBSERVABILITY_AGENT running on OpenAI/ChatGPT tooling only.
            Read .agents/skills/wow-engineering-release-observability-agent/SKILL.md,
            the merged PR, and artifacts/wow-engine/v17/.release-evidence/**.
            The deterministic workflow has already required exact-head CI plus a trusted
            Lead/Triage/Engineering/Independent Review/QA governance receipt tied to the exact
            pre-merge head and has proven the GitHub merge SHA is on protected main. Independently
            verify production liveness/governance and exact deployed-SHA evidence. Do not edit, merge, deploy,
            or change sporting probability behavior. If exact production SHA cannot
            be independently proven, return PENDING. Preserve can_execute=false.
          output_schema: '{"type":"object","properties":{"status":{"type":"string","enum":["PRODUCTION_VERIFIED","PENDING","BLOCKED_WITH_EXACT_REASON"]},"main_sha":{"type":"string"},"production_sha":{"type":"string"},"acceptance":{"type":"string"},"reconciliation":{"type":"string"},"blocker":{"type":"string"},"next_action":{"type":"string"}},"required":["status","main_sha","production_sha","acceptance","reconciliation","blocker","next_action"],"additionalProperties":false}'

      - name: Generate Reliability V1 machine receipt
        if: steps.pr.outputs.number != ''
        id: reliability_receipt
        env:
          RESULT: ${{ steps.release_agent.outputs.structured_output }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.merged.outputs.head_sha }}
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
          PYTHONPATH: artifacts/wow-engine
        shell: bash
        run: |
          set -euo pipefail
          echo "generated=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            exit 0
          fi
          status=$(jq -r '.status // ""' <<<"$RESULT")
          [ "$status" = "PRODUCTION_VERIFIED" ] || exit 0
          pr_body=$(jq -r '.body // ""' artifacts/wow-engine/v17/.release-evidence/pr.json)
          version=$(sed -n 's/^Reliability-Receipt-Version:[[:space:]]*\([^[:space:]]\+\)[[:space:]]*$/\1/p' <<<"$pr_body" | head -n1)
          [ "$version" = "WOW_ENGINEERING_RELIABILITY_V1" ] || exit 0
          issue=$(sed -n 's/^Terminal-Issue:[[:space:]]*#\([0-9][0-9]*\)[[:space:]]*$/\1/p' <<<"$pr_body" | head -n1)
          if [ -z "$issue" ]; then
            issue=$(sed -nE 's/^Incident:[[:space:]]*`?#?([0-9]+)`?[[:space:]]*$/\1/p' <<<"$pr_body" | head -n1)
          fi
          [ -n "$issue" ] || { echo "RELIABILITY_RECEIPT_ISSUE_ID_MISSING" >&2; exit 1; }
          deployed_sha=$(tr -d '\r\n ' < artifacts/wow-engine/v17/.release-evidence/render-live-sha.txt)
          [ "$deployed_sha" = "$MERGE_SHA" ] || { echo "RELIABILITY_RECEIPT_DEPLOYED_SHA_MISMATCH:$deployed_sha:$MERGE_SHA" >&2; exit 1; }
          http_status=$(tr -d '\r\n ' < artifacts/wow-engine/v17/.release-evidence/health-live.status)
          artifact="wow-v17-verification-receipt-$MERGE_SHA"
          python -m v17.reliability_verify_issue \
            --issue "$issue" \
            --pr "$PR_NUMBER" \
            --pr-head-sha "$HEAD_SHA" \
            --merge-sha "$MERGE_SHA" \
            --deployed-sha "$deployed_sha" \
            --method GET \
            --route /health/live \
            --http-status "$http_status" \
            --headers artifacts/wow-engine/v17/.release-evidence/health-live.headers \
            --response artifacts/wow-engine/v17/.release-evidence/health-live.json \
            --workflow "$GITHUB_WORKFLOW" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-name "$artifact" \
            --receipt-out artifacts/wow-engine/v17/.release-evidence/verification-receipt.json \
            --trace-out artifacts/wow-engine/v17/.release-evidence/execution-trace.json
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Persist Reliability V1 receipt to append-only ledger
        if: steps.reliability_receipt.outputs.generated == 'true'
        id: persist_reliability_receipt
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="$ACTIONS_ID_TOKEN_REQUEST_URL"
          oidc_url+="&audience=wow-v17-multiscout"
          token=$(curl --fail --show-error --silent \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$oidc_url" | jq -r '.value')
          test -n "$token"
          curl --fail --show-error --silent --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @artifacts/wow-engine/v17/.release-evidence/verification-receipt.json \
            https://wow-governed-probability-engine.onrender.com/internal/v17/reliability-receipts \
            > artifacts/wow-engine/v17/.release-evidence/audit-persistence.json
          status=$(jq -r '.status // ""' artifacts/wow-engine/v17/.release-evidence/audit-persistence.json)
          case "$status" in PERSISTED|ALREADY_PERSISTED) ;; *) echo "RELIABILITY_RECEIPT_PERSISTENCE_FAILED:$status" >&2; exit 1 ;; esac
          receipt_sig=$(jq -r '.sentinel_signature' artifacts/wow-engine/v17/.release-evidence/verification-receipt.json)
          persisted_sig=$(jq -r '.sentinel_signature // ""' artifacts/wow-engine/v17/.release-evidence/audit-persistence.json)
          [ "$receipt_sig" = "$persisted_sig" ] || { echo "RELIABILITY_RECEIPT_PERSISTENCE_SIGNATURE_MISMATCH" >&2; exit 1; }
          echo "persisted=true" >> "$GITHUB_OUTPUT"

      - name: Upload immutable Reliability V1 evidence artifact
        if: steps.persist_reliability_receipt.outputs.persisted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reliability_receipt.outputs.artifact }}
          path: |
            artifacts/wow-engine/v17/.release-evidence/verification-receipt.json
            artifacts/wow-engine/v17/.release-evidence/execution-trace.json
            artifacts/wow-engine/v17/.release-evidence/audit-persistence.json
            artifacts/wow-engine/v17/.release-evidence/health-live.headers
            artifacts/wow-engine/v17/.release-evidence/health-live.json
            artifacts/wow-engine/v17/.release-evidence/render-live-deploy.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish release verification receipt
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RESULT: ${{ steps.release_agent.outputs.structured_output }}
          HEAD_SHA: ${{ steps.merged.outputs.head_sha }}
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/release-comment.md"
          {
            echo "## Release / Production Verification Agent"
            echo
            echo "Provider: OpenAI/ChatGPT"
            echo
            echo "- governed_pr_head_sha: `$HEAD_SHA`"
            echo "- protected_main_merge_sha: `$MERGE_SHA`"
            echo "- trusted_handoff_receipt: VERIFIED"
            echo
            echo '~~~json'
            echo "$RESULT"
            echo '~~~'
            if [ -f artifacts/wow-engine/v17/.release-evidence/verification-receipt.json ]; then
              echo
              echo "### Machine VerificationReceipt"
              echo '~~~json'
              cat artifacts/wow-engine/v17/.release-evidence/verification-receipt.json
              echo '~~~'
            fi
            echo
            echo "`can_execute=false`"
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

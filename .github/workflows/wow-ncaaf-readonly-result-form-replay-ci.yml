name: WOW NCAAF Read-Only Result Form Replay CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/wow-ncaaf-readonly-result-form-replay-ci.yml
      - artifacts/wow-engine/v17/ncaaf_result_form_replay_audit.py
      - artifacts/wow-engine/v17/ncaaf_model_maintenance.py
      - artifacts/wow-engine/tests/test_ncaaf_result_form_replay_audit.py

permissions:
  contents: read

jobs:
  diagnostic-replay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Compile candidate replay and tests
        working-directory: artifacts/wow-engine
        run: |
          python3 -m py_compile v17/ncaaf_result_form_replay_audit.py
          python3 -m py_compile tests/test_ncaaf_result_form_replay_audit.py

      - name: Test 25 NCAAF replay and fail-closed cases
        working-directory: artifacts/wow-engine
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests \
            -p 'test_ncaaf_result_form_replay_audit.py' -v

      - name: Assert read-only authenticated endpoint
        working-directory: artifacts/wow-engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          verifier = Path('v17/ncaaf_result_form_replay_audit.py').read_text()
          installer = Path('v17/ncaaf_model_maintenance.py').read_text()
          assert 'install_ncaaf_result_form_replay_route' in installer
          assert 'scout_route_auth_dependency(auth_dependency)' in verifier
          assert 'NCAAF_RESULT_FORM_DETERMINISTIC_REPLAY_PASS_SOURCE_HOLD' in verifier
          assert '"certification_granted": False' in verifier
          assert '"probability_publishable": False' in verifier
          assert '"can_execute": False' in verifier
          assert 'table("wow_d1_training_rows")' in verifier
          assert '.insert(' not in verifier and '.upsert(' not in verifier
          print("NCAAF_READ_ONLY_AUTHENTICATED_REPLAY_CONTRACT_PASS")
          PY

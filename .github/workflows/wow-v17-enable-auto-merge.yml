name: wow-v17-enable-auto-merge

# Arms GitHub auto-merge on ordinary same-repo PRs so they merge themselves
# once every REQUIRED check on main passes (3 regression checks +
# WOW Independent QA exact-head + WOW Release Authority exact-head).
#
# Safety:
# - pull_request_target, but PR code is NEVER checked out or executed.
# - Fork PRs and drafts are ignored.
# - PRs touching trust roots (.github/**, .agents/**), including rename
#   origins, are NOT armed; they stay on the owner-signed release path.
# - Arming auto-merge grants nothing by itself: branch protection still
#   requires QA + Release Authority from their own GitHub Apps.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions: {}

concurrency:
  group: wow-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --auto --merge
          echo "AUTO_MERGE_ARMED pr=$PR (merges only when all required checks pass)"

name: wow-v17-enable-auto-merge
# Containment: ordinary CI has no merge authority. Owner-signed release only.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  no-auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "AUTO_MERGE_DISABLED_OWNER_AUTHORIZATION_REQUIRED"

name: wow-v17-enable-auto-merge

# P0 #1663: QUARANTINED. The old pull_request_target job invoked
# gh pr merge --auto --merge based on an unverified assumption that main
# requires separately issued Independent QA + Release Authority checks.
# PRs #1647 and #1662 merged without any submitted independent PR reviews.
# Until the real branch protection and distinct identities are proven, this
# workflow is strictly read-only. A successful audit job is NOT approval.
#
# Recovery route: verified independent exact-head review -> owner-held signed
# release authorization; deploy only under a SEPARATE production approval.
# Never execute PR code or grant auto-merge on missing/403 policy evidence.
# can_execute=false; probability models and release authorities unchanged.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions: {}

concurrency:
  group: wow-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    name: Auto-merge quarantine (audit only; NOT release approval)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Record typed fail-closed auto-merge hold
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read GitHub's current PR state. No PR checkout or write-capable token.
          # If the read fails, this step fails closed without authorizing a merge.
          actual_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          if [ -z "$actual_head" ] || [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::AUTO_MERGE_HOLD_STALE_HEAD expected=$EXPECTED_HEAD actual=$actual_head"
            exit 1
          fi

          echo "::warning::AUTO_MERGE_HOLD_POLICY_UNVERIFIED pr=$PR head=$actual_head"
          {
            echo "### P0 #1663 — automatic merge quarantined"
            echo ""
            echo "- PR: $PR"
            echo "- Observed exact head: \`$actual_head\`"
            echo "- Decision: \`AUTO_MERGE_HOLD_POLICY_UNVERIFIED\`"
            echo "- This is a read-only audit receipt, **not** independent QA or approval."
            echo "- Next: distinct independent exact-head verification, then owner-signed release."
            echo "- Production deployment requires separate owner authorization and live verification."
          } >> "$GITHUB_STEP_SUMMARY"

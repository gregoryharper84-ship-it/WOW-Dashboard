name: wow-v17-frontier-intelligence-agent

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wow-v17-frontier-intelligence-agent
  cancel-in-progress: false

jobs:
  frontier-intelligence:
    name: Frontier Intelligence / Continuous Improvement agent
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Reliability preemption gate
        id: gate
        run: |
          set -euo pipefail
          python artifacts/wow-engine/v17/engineering_agent_team.py frontier-gate \
            | tee "$RUNNER_TEMP/frontier-gate.json"
          echo "allowed=$(jq -r '.frontier_allowed' "$RUNNER_TEMP/frontier-gate.json")" >> "$GITHUB_OUTPUT"

      - name: Frontier Intelligence agent
        id: frontier_agent
        if: steps.gate.outputs.allowed == 'true'
        uses: ./.github/actions/wow-chatgpt-agent
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          permission_profile: ":read-only"
          codex_args: "--search"
          prompt: |
            You are the WOW FRONTIER_INTELLIGENCE_AGENT running on OpenAI/ChatGPT tooling only.
            Read .agents/skills/wow-frontier-intelligence-agent/SKILL.md,
            artifacts/wow-engine/v17/incident-ledger.json, and season-readiness evidence.
            Search the current web for material developments from the last 30 days in BOTH
            AI/agent engineering and sports betting/sports analytics/data/modeling. Compare them
            with actual WOW weaknesses and existing capabilities. Return at most ONE highest-value
            net-new opportunity. Do not edit the repository. Market information remains evidence
            only. Any Class C idea is challenger-only. production_change must be false.
          output_schema: '{"type":"object","properties":{"found":{"type":"boolean"},"fingerprint":{"type":"string"},"title":{"type":"string"},"domain":{"type":"string","enum":["AI","SPORTS_DATA","SPORTS_MODELING","AGENT_INFRA","OBSERVABILITY","OTHER"]},"radar_status":{"type":"string","enum":["ADOPT","TRIAL","ASSESS","WATCH","REJECT","DUPLICATE"]},"source_date":{"type":"string"},"evidence":{"type":"array","items":{"type":"string"}},"wow_problem_or_opportunity":{"type":"string"},"hypothesis":{"type":"string"},"expected_benefit":{"type":"string"},"risk_class":{"type":"string","enum":["A","B","C"]},"validation_plan":{"type":"array","items":{"type":"string"}},"counterexamples_to_test":{"type":"array","items":{"type":"string"}},"production_change":{"type":"boolean"}},"required":["found","fingerprint","title","domain","radar_status","source_date","evidence","wow_problem_or_opportunity","hypothesis","expected_benefit","risk_class","validation_plan","counterexamples_to_test","production_change"],"additionalProperties":false}'

      - name: Validate and persist frontier opportunity
        if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.frontier_agent.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.found' <<<"$RESULT")" != "true" ]; then
            echo "No net-new frontier opportunity." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$(jq -r '.production_change' <<<"$RESULT")" != "false" ]; then
            echo "::error::Frontier agent attempted production-change authority."
            exit 1
          fi
          fingerprint=$(jq -r '.fingerprint' <<<"$RESULT")
          title=$(jq -r '.title' <<<"$RESULT")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$fingerprint" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "DUPLICATE: already tracked in issue #$existing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body="$RUNNER_TEMP/frontier.md"
          {
            echo "## Frontier Intelligence opportunity"
            echo
            echo "Fingerprint: \`$fingerprint\`"
            echo '```json'
            echo "$RESULT"
            echo '```'
            echo
            echo "### Governance"
            echo "- OpenAI/ChatGPT tooling only; no Anthropic/Claude runtime dependency."
            echo "- Experiment/research candidate only; not a production model change."
            echo "- Class C requires challenger, replay, counterexample review, holdout/forward validation, regression, and governed promotion."
            echo "- can_execute=false"
          } > "$body"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Frontier: $title" --body-file "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Reliability preemption receipt
        if: steps.gate.outputs.allowed != 'true'
        run: |
          echo "Frontier research yielded to actionable P0/P1 reliability work." >> "$GITHUB_STEP_SUMMARY"
          echo "can_execute=false" >> "$GITHUB_STEP_SUMMARY"

name: wow-v17-remote-writer-finalize

# Exact-reservation terminal release of one authenticated Cursor writer.
# Reuse the SAME global implementation mutex, never the read-only probe queue.
# One existing workflow, same single-writer mutex. The hourly scheduled
# path discovers only a unique, immutable failed-launch reservation; it does
# not react to arbitrary merges or accept untrusted PR code.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      reservation_comment_id:
        description: Exact immutable Cursor reservation comment ID in issue #1138
        required: true
        type: string

permissions:
  contents: read

jobs:
  finalize-original-cursor:
    if: github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Same global writer mutex. queue: max is GitHub's native pending cap
      # (100), not a second controller or a per-sport writer lane.
      group: wow-v17-engineering-implementation-single-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate exact original terminal Cursor run and append release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RESERVATION_COMMENT_ID: ${{ inputs.reservation_comment_id }}
        run: |
          set -euo pipefail
          if [ -n "${RESERVATION_COMMENT_ID:-}" ]; then
            [[ "$RESERVATION_COMMENT_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::REMOTE_RELEASE_TARGET_INVALID"
              exit 1
            }
          fi
          # On schedule, the CLI discovers at most one unresolved failed
          # Cursor launch. On manual dispatch, exact ID remains required.
          # Both paths re-read provider and source, recheck the entire held
          # ledger and append one receipt. Guards trust only completed
          # successful runs, not this job's initial success flag.
          args=()
          if [ -n "${RESERVATION_COMMENT_ID:-}" ]; then
            args+=(--reservation-comment-id "$RESERVATION_COMMENT_ID")
          fi
          PYTHONPATH=artifacts/wow-engine python -m v17.engineering_remote_fallback finalize-cursor "${args[@]}"

name: wow-v17-remote-writer-finalize

# Exact-reservation terminal release of one authenticated Cursor writer.
# Reuse the SAME global implementation mutex, never the read-only probe queue.
# One existing workflow, same single-writer mutex. The hourly scheduled
# path discovers only a unique, immutable failed-launch reservation; it does
# not react to arbitrary merges or accept untrusted PR code.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      reservation_comment_id:
        description: Exact immutable Cursor reservation comment ID in issue #1138
        required: true
        type: string

permissions:
  contents: read

jobs:
  finalize-original-cursor:
    if: github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Same global writer mutex. queue: max is GitHub's native pending cap
      # (100), not a second controller or a per-sport writer lane.
      group: wow-v17-engineering-implementation-single-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          # The finalizer validates this exact revision against live main
          # before and after the source/ledger/provider witnesses.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve exact target without Cursor credential
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RESERVATION_ID: ${{ inputs.reservation_comment_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=artifacts/wow-engine python - <<'PY'
          import os
          import re
          from v17.engineering_remote_fallback import GitHub, REPOSITORY
          from v17.engineering_remote_writer_release import auto_failed_launch_target

          if (os.environ.get("GITHUB_REPOSITORY") != REPOSITORY
                  or os.environ.get("GITHUB_REF") != "refs/heads/main"):
              raise SystemExit("REMOTE_RELEASE_PROTECTED_MAIN_UNVERIFIED")
          manual = os.environ.get("MANUAL_RESERVATION_ID", "")
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              if manual:
                  raise SystemExit("REMOTE_AUTO_RELEASE_MANUAL_TARGET_INVALID")
              candidate = auto_failed_launch_target(GitHub(os.environ["GH_TOKEN"]))
          else:
              if not re.fullmatch(r"[1-9][0-9]*", manual):
                  raise SystemExit("REMOTE_RELEASE_TARGET_INVALID")
              candidate = int(manual)
          # A no-op is not an authorization; explicitly exit without
          # selecting the credentialed step.
          if candidate is None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("reservation_comment_id=\\n")
              print("NO_UNRELEASED_REMOTE_WRITER")
              raise SystemExit(0)
          if type(candidate) is not int or candidate <= 0:
              raise SystemExit("REMOTE_RELEASE_TARGET_INVALID")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"reservation_comment_id={candidate}\\n")
          PY
      - name: Authenticate original Cursor state and append release
        if: ${{ success() && steps.target.outcome == 'success' && steps.target.outputs.reservation_comment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RESERVATION_COMMENT_ID: ${{ steps.target.outputs.reservation_comment_id }}
        run: |
          set -euo pipefail
          [[ "$RESERVATION_COMMENT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::REMOTE_RELEASE_TARGET_INVALID"
            exit 1
          }
          # The preflight is only a read-only candidate lookup. Under the
          # original writer mutex the existing finalizer authenticates source,
          # performs two fresh provider inventory probes, re-reads the PR,
          # checks the immutable ledger and rechecks protected main before POST.
          PYTHONPATH=artifacts/wow-engine python -m v17.engineering_remote_fallback finalize-cursor --reservation-comment-id "$RESERVATION_COMMENT_ID"

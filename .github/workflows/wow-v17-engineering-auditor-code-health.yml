name: wow-v17-engineering-auditor-code-health

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-v17-engineering-auditor-code-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-health:
    name: Continuous code-health audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install governed engine dependencies
        run: python -m pip install -r artifacts/wow-engine/requirements.txt

      - name: Compile V17 engineering control plane
        run: python -m compileall -q artifacts/wow-engine/v17 artifacts/wow-engine/agent_runtime

      - name: Verify installed Python dependencies
        run: python -m pip check

      - name: Run engineering-team self-check
        run: python artifacts/wow-engine/v17/engineering_agent_team.py self-check

      - name: Enforce lifecycle change-class boundary
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # An old Actions event can hold a stale PR body after a metadata edit.
          # Read the current trusted body, but only if the PR head is unchanged.
          [[ "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ ]] &&
            [[ "${EXPECTED_HEAD_SHA:-}" =~ ^[a-f0-9]{40}$ ]] || {
              echo "::error::LIFECYCLE_PR_IDENTITY_INVALID"; exit 1;
            }
          live_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}") || {
            echo "::error::LIFECYCLE_PR_READ_FAILED"; exit 1;
          }
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_HEAD_SHA" '
            .state == "open" and .base.ref == "main" and
            .base.repo.full_name == $repo and .head.sha == $sha
          ' <<<"$live_pr" >/dev/null || {
            echo "::error::LIFECYCLE_PR_STALE_OR_WRONG_TARGET"; exit 1;
          }
          jq -r '.body // ""' <<<"$live_pr" > "$RUNNER_TEMP/lifecycle-pr-body.md"
          git diff --name-only HEAD^1 HEAD^2 > "$RUNNER_TEMP/lifecycle-changed-paths.txt"
          python artifacts/wow-engine/v17/engineering_agent_team.py lifecycle-classify \
            --pr-body-file "$RUNNER_TEMP/lifecycle-pr-body.md" \
            --changed-paths-file "$RUNNER_TEMP/lifecycle-changed-paths.txt"

      - name: Run continuous-auditor focused tests
        run: >-
          python -m pytest -q
          artifacts/wow-engine/test_v17_engineering_auditor.py
          artifacts/wow-engine/test_v17_engineering_auditor_worker_db_client.py
          artifacts/wow-engine/test_v17_engineering_auditor_backlog_constraints.py
          artifacts/wow-engine/test_v17_sirt_assurance.py

      - name: Run adjacent engineering closure regressions
        run: >-
          python -m pytest -q
          artifacts/wow-engine/test_v17_24h_completion_loop.py
          artifacts/wow-engine/test_v17_lifecycle_closure_cell.py

      - name: Preserve non-execution governance receipt
        if: always()
        run: |
          {
            echo "# WOW V17 Continuous Code-Health Audit"
            echo "- trigger: event-driven only; no schedule or cron"
            echo "- probability_behavior_change: false"
            echo "- terminal_authority: V17_TERMINAL_REDUCER"
            echo "- can_execute: false"
          } >> "$GITHUB_STEP_SUMMARY"

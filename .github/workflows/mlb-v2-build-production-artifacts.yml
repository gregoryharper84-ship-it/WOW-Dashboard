name: MLB V2 build production artifacts

on:
  push:
    branches: [feature/mlb-v2-governed-probability-20260827]
    paths:
      - "artifacts/flask-scoring-api/tools/build_mlb_v2_production_artifacts.py"
      - ".github/workflows/mlb-v2-build-production-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn==1.9.0 joblib requests
      - name: Extract validated reference feature code
        run: |
          mkdir -p /tmp/mlb_v2_reference
          git fetch origin research/mlb-v2-pregame-20260827 research/mlb-v2-2026-confirmation-20260827 research/mlb-v2-live-hydrator-20260827
          git show origin/research/mlb-v2-pregame-20260827:research/mlb-v2-pregame/run_mlb_v2_pregame.py > /tmp/mlb_v2_reference/run_mlb_v2_pregame.py
          git show origin/research/mlb-v2-2026-confirmation-20260827:research/mlb-v2-pregame/confirm_mlb_v2_2026.py > /tmp/mlb_v2_reference/confirm_mlb_v2_2026.py
          git show origin/research/mlb-v2-live-hydrator-20260827:research/mlb-v2-pregame/live_hydrator_smoke.py > /tmp/mlb_v2_reference/live_hydrator_smoke.py
          python -m py_compile /tmp/mlb_v2_reference/*.py
      - name: Build canonical rolling artifact and strict-pregame state
        working-directory: artifacts/flask-scoring-api
        env:
          MLB_V2_BUILD_DATE: "2026-08-27"
        run: |
          rm -rf gate_engine/mlb_v2_artifacts
          python tools/build_mlb_v2_production_artifacts.py \
            --reference-dir /tmp/mlb_v2_reference \
            --out gate_engine/mlb_v2_artifacts \
            --build-date 2026-08-27
      - name: Verify artifact manifest and governance
        working-directory: artifacts/flask-scoring-api
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('gate_engine/mlb_v2_artifacts/mlb_v2_manifest.json')
          d=json.loads(p.read_text())
          assert d['model_id']=='mlb-moneyline-v2-rolling-2026'
          assert d['feature_count']==41
          assert d['governance']['probability_capability']=='AVAILABLE'
          assert d['governance']['probability_publishable'] is True
          assert d['governance']['can_execute'] is False
          assert d['governance']['can_approve_bets'] is False
          assert d['publication_contract']['market_weight_in_published_point_probability']==0.0
          print(json.dumps({'model_id':d['model_id'],'state':d['state'],'governance':d['governance'],'hashes':d['artifact_hashes']},indent=2))
          PY
      - name: Commit generated governed artifacts to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/flask-scoring-api/gate_engine/mlb_v2_artifacts
          if git diff --cached --quiet; then
            echo "Artifacts unchanged"
          else
            git commit -m "Build canonical MLB V2 rolling probability artifacts"
            git push origin HEAD:feature/mlb-v2-governed-probability-20260827
          fi

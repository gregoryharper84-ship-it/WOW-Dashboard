name: kalshi-weather-trigger-research-validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/kalshi-weather-trigger-research-validation.yml"
      - "artifacts/wow-engine/api_kalshi_weather_v2.py"
      - "artifacts/wow-engine/kalshi_weather_v2/research_backfill.py"
      - "artifacts/wow-engine/test_kalshi_weather_research_backfill.py"
      - "src/trigger/weather-research-backfill.ts"
      - "trigger.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kalshi-weather-trigger-research-validation.yml"
      - "artifacts/wow-engine/api_kalshi_weather_v2.py"
      - "artifacts/wow-engine/kalshi_weather_v2/research_backfill.py"
      - "artifacts/wow-engine/test_kalshi_weather_research_backfill.py"
      - "src/trigger/weather-research-backfill.ts"
      - "trigger.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  offline-research:
    name: Offline settlement recovery + locked Trigger dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install weather test dependencies
        run: |
          python -m pip install -r artifacts/wow-engine/requirements.txt
          python -m pip install pytest
      - name: Run offline API, deduplication, no-hindsight and missing-source tests
        working-directory: artifacts/wow-engine
        env:
          WOW_KALSHI_WEATHER_ISOLATED_CAPTURE_OWNER: "0"
          WOW_KALSHI_WEATHER_EMPIRICAL_COHORT_ENABLED: "0"
        run: |
          python -m pytest -q test_kalshi_weather_research_backfill.py test_kalshi_weather_release_a_research.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.9
          run_install: false
      - name: Verify pinned SDK with frozen lock and no lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .

name: wow-v17-ncaaf-sdv-player-history-research

on:
  schedule:
    - cron: "17 13 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wow-v17-ncaaf-sdv-player-history-research.yml"
      - "artifacts/wow-engine/v17/ncaaf_sdv_player_history_acquisition.py"
      - "artifacts/wow-engine/tests/test_ncaaf_sdv_player_history_acquisition.py"
      - "artifacts/wow-engine/v17/ncaaf_sdv_espn_crosswalk.py"
      - "artifacts/wow-engine/tests/test_ncaaf_sdv_espn_crosswalk.py"
      - "artifacts/wow-engine/v17/ncaaf_cfbd_full_audit_log.py"
      - "artifacts/wow-engine/tests/test_ncaaf_cfbd_full_audit_log.py"
      - "artifacts/wow-engine/v17/ncaaf_cfbd_exact_sample_sql.py"
      - "artifacts/wow-engine/tests/test_ncaaf_cfbd_exact_sample_sql.py"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-ncaaf-sdv-player-history-research.yml"
      - "artifacts/wow-engine/v17/ncaaf_sdv_player_history_acquisition.py"
      - "artifacts/wow-engine/tests/test_ncaaf_sdv_player_history_acquisition.py"
      - "artifacts/wow-engine/v17/ncaaf_sdv_espn_crosswalk.py"
      - "artifacts/wow-engine/tests/test_ncaaf_sdv_espn_crosswalk.py"
      - "artifacts/wow-engine/v17/ncaaf_cfbd_full_audit_log.py"
      - "artifacts/wow-engine/tests/test_ncaaf_cfbd_full_audit_log.py"
      - "artifacts/wow-engine/v17/ncaaf_cfbd_exact_sample_sql.py"
      - "artifacts/wow-engine/tests/test_ncaaf_cfbd_exact_sample_sql.py"

permissions:
  contents: read

concurrency:
  group: ncaaf-sdv-history-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Validate no-key NCAAF source-only contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test parser and source boundaries
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest --noconftest -q tests/test_ncaaf_sdv_player_history_acquisition.py tests/test_ncaaf_sdv_espn_crosswalk.py tests/test_ncaaf_cfbd_exact_sample_sql.py tests/test_ncaaf_cfbd_full_audit_log.py

  acquire:
    name: Archive a public historical player-game release (research only)
    needs: contract
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned research-only reader
        run: python -m pip install pyarrow==19.0.1 requests==2.32.3
      - name: Acquire and audit 2024 completed-season release
        run: |
          python -m v17.ncaaf_sdv_player_history_acquisition --season 2024 --output-dir ncaaf-sdv-research
      - name: Archive source bytes and provenance manifest with attribution
        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-sdv-player-history-2024-research-${{ github.run_id }}
          path: artifacts/wow-engine/ncaaf-sdv-research/
          if-no-files-found: error
          retention-days: 7

  cross_source:
    name: Audit NCAA↔ESPN player-game/stat candidates (non-authoritative)
    needs: acquire
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned offline Parquet reader
        run: python -m pip install pyarrow==19.0.1 requests==2.32.3
      - name: Reuse same-run NCAA source artifact
        uses: actions/download-artifact@v4
        with:
          name: ncaaf-sdv-player-history-2024-research-${{ github.run_id }}
          path: artifacts/wow-engine/ncaaf-sdv-research/
      - name: Audit independent NCAA versus ESPN stat values for identity candidates
        run: |
          python -m v17.ncaaf_sdv_espn_crosswalk \
            --season 2024 \
            --ncaa-parquet ncaaf-sdv-research/ncaa_mfb_player_stats_2024.parquet \
            --output-dir ncaaf-crosswalk-research/
      - name: Produce strict read-only 2024 CFBD sample comparison SQL
        run: |
          python -m v17.ncaaf_cfbd_exact_sample_sql \
            --manifest ncaaf-crosswalk-research/ncaaf_national_espn_crosswalk_manifest.json \
            --season 2024 \
            --output-sql ncaaf-crosswalk-research/ncaaf_cfbd_exact_sample_read_only.sql
      - name: Emit bounded public-source parity candidates for exact CFBD read-only audit
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m v17.ncaaf_cfbd_full_audit_log \
            --candidate-file ncaaf-crosswalk-research/ncaaf_public_full_candidate_stats_2024.json \
            --manifest ncaaf-crosswalk-research/ncaaf_national_espn_crosswalk_manifest.json
      - name: Archive source-hashed manifest and public stat candidate cohort

        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-ncaa-espn-reconciliation-${{ github.run_id }}
          path: artifacts/wow-engine/ncaaf-crosswalk-research/
          if-no-files-found: error
          retention-days: 7

name: Prop Settlement Strictness

on:
  push:
    branches: [chatgpt/prop-settlement-audit-20260830]
    paths: ['.github/workflows/prop-settlement-strictness.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/prop-settlement-audit-20260830
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Apply strictness fix
        working-directory: artifacts/wow-engine
        run: python scripts/apply_prop_settlement_strictness_fix.py
      - name: Compile and focused tests
        working-directory: artifacts/wow-engine
        run: |
          python -m py_compile api_prod_market.py prop_settlement.py prop_market_audit.py
          python -m pytest -q test_prop_settlement.py test_prop_market_audit.py
      - name: Commit strictness fix
        run: |
          git config user.name "WOW CI Integration"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/wow-engine/api_prod_market.py
          git commit -m "fix: make prop line tolerance server owned"
          git push origin HEAD:chatgpt/prop-settlement-audit-20260830

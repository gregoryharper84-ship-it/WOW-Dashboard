name: tmp-nfl-prop-train-20260920

on:
  push:
    branches: [fix/v17-nfl-prop-governed-lane-20260920-active]
    paths:
      - 'artifacts/wow-engine/scripts/train_nfl_props.py'
      - '.github/workflows/tmp-nfl-prop-train-20260920.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v17-nfl-prop-governed-lane-20260920-active
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic training dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn requests
      - name: Train governed NFL prop candidates
        id: train
        shell: bash
        run: |
          set +e
          cd artifacts/wow-engine
          python scripts/train_nfl_props.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist exact training evidence and self-delete
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/wow-engine/data/wow_nfl_prop_artifacts_v1.json
          test -s artifacts/wow-engine/data/wow_nfl_prop_training_report_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/wow-engine/data/wow_nfl_prop_artifacts_v1.json artifacts/wow-engine/data/wow_nfl_prop_training_report_v1.json
          git rm .github/workflows/tmp-nfl-prop-train-20260920.yml
          git commit -m 'build(v17): freeze NFL prop fitted candidate evidence'
          git pull --rebase origin fix/v17-nfl-prop-governed-lane-20260920-active
          git push origin HEAD:fix/v17-nfl-prop-governed-lane-20260920-active
      - name: Enforce training gate
        if: steps.train.outputs.exit_code != '0'
        run: |
          echo "NFL prop offline training gate failed; frozen report is preserved for diagnosis."
          exit 1

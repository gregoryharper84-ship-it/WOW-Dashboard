name: wow-v17-scout-brain-persist

on:
  workflow_run:
    workflows: ["wow-v17-nightly-multiscout"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional source workflow run id
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

# Native nightly persistence and persist-resume can target the same source run.
# Serialize those writers so a second BEGIN cannot reset in-flight counters.
concurrency:
  group: wow-v17-scout-brain-persist-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  persist:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    # A full slate is now several hundred bounded requests rather than one, so
    # cap the job instead of letting a hang run for the six-hour default.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_SCOUT_DATABASE_URL: ${{ secrets.WOW_SCOUT_DATABASE_URL }}
      WOW_SCOUT_PERSIST_URL: https://iczfhsmjrrafhvcpmqhr.supabase.co/functions/v1/wow-v17-scout-brain-persist
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      # Bounds apply to the APPEND request itself, evidence included. Bounding
      # whole candidates was not enough: one team/event candidate in run
      # 35131443035 was 1,135,529 bytes over 1,952 evidence rows, and a batch
      # always emitted at least one candidate, so it was posted intact under
      # both the 256 KiB and the 64 KiB bound and exhausted the worker each
      # time. Evidence is now sliced across requests.
      WOW_SCOUT_PERSIST_REQUEST_BYTES: "262144"
      WOW_SCOUT_PERSIST_EVIDENCE_ROWS: "150"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check direct database credential
        id: credential
        shell: bash
        run: |
          if [ -n "$WOW_SCOUT_DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Using configured direct Scout database persistence path." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "WOW_SCOUT_DATABASE_URL is absent; using short-lived GitHub OIDC to the governed Supabase Edge persistence function." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Locate recoverable Scout discovery artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/scout-brain"
          artifact_name=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '.artifacts | map(select(.name | test("^wow-v17-multiscout-wow-scout-.*-discovery$"))) | sort_by(.created_at) | last | .name // ""')
          if [ -n "$artifact_name" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          # A pull_request source run skips discovery by design, so it has no
          # artifact and nothing to persist. Every other source run that
          # produced none is a real loss and must not report success.
          source_event=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.event // ""')
          if [ "$source_event" = "pull_request" ]; then
            echo "Source run ${SOURCE_RUN_ID} is a pull_request run; discovery is skipped by design and persistence is not applicable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "No recoverable Scout discovery artifact exists for source run ${SOURCE_RUN_ID} (event '${source_event:-unknown}'); persistence failed closed rather than reporting success without fabricating a run." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Download recoverable Scout handoff artifact
        if: steps.artifact.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          gh run download "$SOURCE_RUN_ID" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/scout-brain"
          test -f "$RUNNER_TEMP/scout-brain/model-handoff.json"
      - name: Persist through direct database credential
        if: steps.artifact.outputs.present == 'true' && steps.credential.outputs.configured == 'true'
        run: |
          python -m v17.scout_brain_sync \
            --input "$RUNNER_TEMP/scout-brain/model-handoff.json" \
            --receipt "$RUNNER_TEMP/scout-brain/persistence-receipt.json"
      - name: Persist through governed Supabase Edge OIDC
        if: steps.artifact.outputs.present == 'true' && steps.credential.outputs.configured != 'true'
        run: |
          python -m v17.scout_brain_edge_sync \
            --input "$RUNNER_TEMP/scout-brain/model-handoff.json" \
            --receipt "$RUNNER_TEMP/scout-brain/persistence-receipt.json"
      - name: Report persistence receipt
        if: steps.artifact.outputs.present == 'true'
        run: cat "$RUNNER_TEMP/scout-brain/persistence-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload persistence receipt
        if: steps.artifact.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-scout-brain-persistence-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/scout-brain/persistence-receipt.json
          if-no-files-found: error
          retention-days: 90

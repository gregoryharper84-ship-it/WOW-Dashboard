name: wow-v17-scout-brain-persist
run-name: wow-v17-scout-brain-persist source=${{ inputs.run_id || github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["wow-v17-nightly-multiscout"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional source workflow run id
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  # One persistence writer at a time across all source runs. Separate source
  # identities can touch the same high-volume evidence tables, so per-source
  # serialization still allowed overlapping write storms during recovery.
  group: wow-v17-scout-brain-persist-global
  cancel-in-progress: false

jobs:
  persist:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_SCOUT_DATABASE_URL: ${{ secrets.WOW_SCOUT_DATABASE_URL }}
      WOW_SCOUT_PERSIST_URL: https://iczfhsmjrrafhvcpmqhr.supabase.co/functions/v1/wow-v17-scout-brain-persist
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      # Keep each Edge transaction below the observed worker/DB timeout envelope.
      # The 150-row bound still produced 52s APPENDs and then HTTP 500 on the
      # same protected-main replay. 25 rows preserves identical evidence and
      # candidate reconciliation while reducing per-request database work.
      WOW_SCOUT_PERSIST_REQUEST_BYTES: "262144"
      WOW_SCOUT_PERSIST_EVIDENCE_ROWS: "25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check direct database credential
        id: credential
        shell: bash
        run: |
          if [ -n "$WOW_SCOUT_DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Using configured direct Scout database persistence path." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "WOW_SCOUT_DATABASE_URL is absent; using short-lived GitHub OIDC to the governed Supabase Edge persistence function." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Locate recoverable Scout discovery artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scout-brain"
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "SCOUT_SOURCE_RUN_ID_INVALID" >&2
            exit 1
          fi
          source_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          jobs_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")
          artifacts_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" '
            .name == "wow-v17-nightly-multiscout" and
            .path == ".github/workflows/wow-v17-nightly-multiscout.yml" and
            .head_branch == "main" and .status == "completed" and
            (.head_repository.full_name == $repo) and
            .conclusion == "success"
          ' <<<"$source_json" >/dev/null; then
            echo "SCOUT_SOURCE_PROVENANCE_INVALID_HOLD" >&2
            exit 1
          fi
          discovery_state=$(jq -r '
            [.jobs[] | select(.name == "Nightly all-sport discovery and governed specialist handoff") | .conclusion]
            | if length == 1 then .[0] else "UNKNOWN" end
          ' <<<"$jobs_json")
          verification_state=$(jq -r '
            [.jobs[] | select(.name == "Verify Multi-Scout contract") | .conclusion]
            | if length == 1 then .[0] else "UNKNOWN" end
          ' <<<"$jobs_json")
          artifact_name=$(jq -r '
            [.artifacts[] | select(.expired == false and (.name | test("^wow-v17-multiscout-wow-scout-.*-discovery$")))]
            | sort_by(.created_at) | last | .name // ""
          ' <<<"$artifacts_json")
          source_event=$(jq -r '.event // ""' <<<"$source_json")
          if [ "$discovery_state" = "skipped" ] && [ "$verification_state" = "success" ] &&
            { [ "$source_event" = "pull_request" ] || [ "$source_event" = "push" ] || [ "$source_event" = "workflow_run" ]; }; then
            if [ -n "$artifact_name" ]; then
              echo "SCOUT_SKIPPED_DISCOVERY_ARTIFACT_CONFLICT_HOLD" >&2
              exit 1
            fi
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SCOUT_DISCOVERY_NOT_APPLICABLE: source run ${SOURCE_RUN_ID} verified source code only; discovery job was skipped. No persistence attempted or claimed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$discovery_state" != "success" ]; then
            echo "SCOUT_DISCOVERY_NOT_SUCCESSFUL_HOLD: source run ${SOURCE_RUN_ID} discovery=${discovery_state}." >&2
            exit 1
          fi
          if [ -z "$artifact_name" ]; then
            echo "SCOUT_DISCOVERY_ARTIFACT_MISSING_HOLD: source run ${SOURCE_RUN_ID} completed discovery without recoverable evidence." >&2
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Download recoverable Scout handoff artifact
        if: steps.artifact.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          gh run download "$SOURCE_RUN_ID" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/scout-brain"
          test -f "$RUNNER_TEMP/scout-brain/model-handoff.json"
      - name: Bound persistence transport metadata
        if: steps.artifact.outputs.present == 'true'
        run: |
          python -m v17.scout_brain_transport_sanitizer \
            --input "$RUNNER_TEMP/scout-brain/model-handoff.json"
      - name: Persist through direct database credential
        if: steps.artifact.outputs.present == 'true' && steps.credential.outputs.configured == 'true'
        run: |
          python -m v17.scout_brain_sync \
            --input "$RUNNER_TEMP/scout-brain/model-handoff.json" \
            --receipt "$RUNNER_TEMP/scout-brain/persistence-receipt.json"
      - name: Persist through governed Supabase Edge OIDC
        if: steps.artifact.outputs.present == 'true' && steps.credential.outputs.configured != 'true'
        run: |
          python -m v17.scout_brain_edge_sync \
            --input "$RUNNER_TEMP/scout-brain/model-handoff.json" \
            --receipt "$RUNNER_TEMP/scout-brain/persistence-receipt.json"
      - name: Report persistence receipt
        if: steps.artifact.outputs.present == 'true'
        run: cat "$RUNNER_TEMP/scout-brain/persistence-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload persistence receipt
        if: steps.artifact.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-scout-brain-persistence-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/scout-brain/persistence-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Materialize current Scout boards after successful persistence
        if: steps.artifact.outputs.present == 'true'
        shell: bash
        run: |
          today=$(date -u +%F)
          tomorrow=$(date -u -d '+1 day' +%F)
          python -m v17.scout_board_edge_materializer --date "$today"
          python -m v17.scout_board_edge_materializer --date "$tomorrow"

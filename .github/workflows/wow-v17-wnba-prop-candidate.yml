name: wow-v17-wnba-prop-candidate

on:
  schedule:
    - cron: "55 13 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-wnba-prop-candidate.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/scripts/train_wnba_props.py"
      - "artifacts/wow-engine/wnba_prop_model_adapter.py"
      - "artifacts/wow-engine/v17/wnba_prop_candidate_registry.py"
      - "artifacts/wow-engine/pick_request_runtime.py"
      - "artifacts/wow-engine/test_v17_wnba_prop_candidate_registry.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-wnba-prop-candidate.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/scripts/train_wnba_props.py"
      - "artifacts/wow-engine/wnba_prop_model_adapter.py"
      - "artifacts/wow-engine/v17/wnba_prop_candidate_registry.py"
      - "artifacts/wow-engine/pick_request_runtime.py"
      - "artifacts/wow-engine/test_v17_wnba_prop_candidate_registry.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"

permissions:
  contents: read

concurrency:
  group: wow-v17-wnba-prop-candidate
  cancel-in-progress: false

jobs:
  verify:
    name: Verify WNBA prop candidate contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run WNBA prop candidate regressions
        run: >-
          python -m pytest -q
          test_v17_wnba_prop_candidate_registry.py
          test_wnba_prop_model_adapter.py
          test_v17_github_oidc.py

  train-and-register:
    name: Train and register WNBA prop candidates
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      WNBA_ARTIFACT_OUT_DIR: /tmp/wow-wnba-prop-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Assert non-execution governance and OIDC context
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Train leakage-safe WNBA prop candidates
        run: |
          mkdir -p "$WNBA_ARTIFACT_OUT_DIR"
          python scripts/train_wnba_props.py
          test -s "$WNBA_ARTIFACT_OUT_DIR/wow_wnba_prop_artifacts_v1.json"
          test -s "$WNBA_ARTIFACT_OUT_DIR/wow_wnba_prop_training_report_v1.json"
      - name: Register validated candidates through governed control plane
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          artifacts = json.loads(
              Path(os.environ["WNBA_ARTIFACT_OUT_DIR"], "wow_wnba_prop_artifacts_v1.json").read_text()
          )
          assert len(artifacts) == 4
          for artifact in artifacts:
              assert artifact.get("sport") == "WNBA"
              assert artifact.get("lifecycle_state") == "CANDIDATE"
              assert artifact.get("promoted") is False
              assert artifact.get("active") is False
              assert artifact.get("probability_publishable") is False
              assert artifact.get("can_execute") is False
              metrics = artifact.get("validation_metrics") or {}
              assert metrics.get("validation_status") == "PASS"
              assert metrics.get("probability_publishable") is False
              assert metrics.get("can_execute") is False

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          oidc_url += separator + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
          oidc_request = urllib.request.Request(
              oidc_url,
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(oidc_request, timeout=20) as response:
              oidc_token = json.load(response)["value"]

          endpoint = os.environ["WOW_ACTION_ORIGIN"].rstrip("/") + "/internal/v17/wnba-prop-candidates"
          body = json.dumps({"artifacts": artifacts}).encode("utf-8")
          request = urllib.request.Request(
              endpoint,
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {oidc_token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              payload = json.load(response)

          assert payload.get("status") == "CANDIDATE_REGISTRATION_COMPLETE"
          assert payload.get("registered_n") == 4
          assert payload.get("automatic_certification") is False
          assert payload.get("automatic_promotion") is False
          assert payload.get("probability_publishable") is False
          assert payload.get("can_execute") is False
          for row in payload.get("registered", []):
              assert row.get("lifecycle_state") == "CANDIDATE"
          print(json.dumps({
              "status": payload.get("status"),
              "registered_n": payload.get("registered_n"),
              "routes": sorted(row.get("stat_type") for row in payload.get("registered", [])),
              "can_execute": False,
          }, sort_keys=True))
          PY

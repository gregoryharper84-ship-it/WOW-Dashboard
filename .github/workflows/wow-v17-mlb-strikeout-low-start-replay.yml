name: wow-v17-mlb-strikeout-low-start-replay

on:
  pull_request:
    paths:
      - "artifacts/wow-engine/scripts/evaluate_mlb_pitcher_strikeouts_low_start.py"
      - "artifacts/wow-engine/scripts/evaluate_mlb_pitcher_strikeouts_min3_candidate.py"
      - "artifacts/wow-engine/v17/test_mlb_strikeout_low_start_replay_contract.py"
      - "artifacts/wow-engine/data/mlb_pitcher_starts_2024_2025_regular_season.csv"
      - "artifacts/wow-engine/data/mlb_team_batting_by_game_2024_2025_regular_season.csv"
      - "artifacts/wow-engine/data/wow_mlb_pitcher_strikeouts_artifact_v1.json"
      - "artifacts/wow-engine/data/wow_mlb_pitcher_strikeouts_training_report_v1.json"
      - ".github/workflows/wow-v17-mlb-strikeout-low-start-replay.yml"

permissions:
  contents: read

jobs:
  replay:
    name: MLB strikeout low-start governed replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert governance invariants
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
      - name: Run low-start chronological replay
        run: |
          python artifacts/wow-engine/scripts/evaluate_mlb_pitcher_strikeouts_low_start.py \
            --output "$RUNNER_TEMP/mlb-strikeout-low-start-replay.json"
          python artifacts/wow-engine/scripts/evaluate_mlb_pitcher_strikeouts_min3_candidate.py \
            --output "$RUNNER_TEMP/mlb-strikeout-min3-candidate.json"
      - name: Run replay contract tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest artifacts/wow-engine/v17/test_mlb_strikeout_low_start_replay_contract.py -q
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-strikeout-low-start-replay
          path: |
            ${{ runner.temp }}/mlb-strikeout-low-start-replay.json
            ${{ runner.temp }}/mlb-strikeout-min3-candidate.json
          if-no-files-found: error

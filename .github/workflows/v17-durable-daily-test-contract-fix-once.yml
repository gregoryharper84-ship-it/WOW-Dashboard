name: v17-durable-daily-test-contract-fix-once

on:
  push:
    branches:
      - fix/v17-durable-daily-full-board
    paths:
      - .github/workflows/v17-durable-daily-test-contract-fix-once.yml

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v17-durable-daily-full-board
          fetch-depth: 0
      - name: Reconcile 23-operation live-editor test contracts
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('artifacts/wow-engine/tests/test_v17_live_editor_compat.py'); s=p.read_text(); s=s.replace('def test_live_editor_schema_is_single_domain_and_exposes_all_21_operations():','def test_live_editor_schema_is_single_domain_and_exposes_all_23_operations():'); s=s.replace('    assert len(operations) == 21','    assert len(operations) == 23'); s=s.replace('        \"getWowV17PickRequestRunState\",','        \"submitWowV17DailySnapshot\",\\n        \"getWowV17DailySnapshotRun\",\\n        \"getWowV17PickRequestRunState\",',1); p.write_text(s)"
          python -c "from pathlib import Path; p=Path('artifacts/wow-engine/v17/test_v17_daily_async_action_contract.py'); s=p.read_text(); s=s.replace('ROOT = Path(__file__).resolve().parents[1]\\nSCHEMA = ROOT / \"openapi.wow-betting-engine.v17.yaml\"\\nINSTRUCTIONS = ROOT.parent / \"WOW_V17_CUSTOM_GPT_INSTRUCTIONS.txt\"','V17_DIR = Path(__file__).resolve().parent\\nSCHEMA = V17_DIR / \"openapi.wow-betting-engine.v17.yaml\"\\nINSTRUCTIONS = V17_DIR.parent / \"WOW_V17_CUSTOM_GPT_INSTRUCTIONS.txt\"'); p.write_text(s)"
          rm .github/workflows/v17-durable-daily-test-contract-fix-once.yml
          git config user.name "WOW Engineering Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align V17 live-editor tests with 23-operation durable Daily schema"
          git push origin HEAD:fix/v17-durable-daily-full-board

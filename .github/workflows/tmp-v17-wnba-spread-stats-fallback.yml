    "ESPN_WNBA_TEAMS_URL",
    "WNBA_STATS_TO_ESPN_ABBREVIATION",
    "espn_team_id_for_wnba_stats_tricode",
]
''')

          canary = Path('artifacts/wow-engine/v17/spread_forward_auto_canary.py')

name: wow-v17-nightly-engineering-scan

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-v17-nightly-engineering-scan
  cancel-in-progress: false

jobs:
  nightly-engineering-scan:
    name: WOW V17 nightly engineering scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: artifacts/wow-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyYAML openapi-spec-validator

      - name: Run governed probability backend regression suite
        run: python -m pytest -q

      - name: Validate postmortem and engineering-fix ledger
        run: python v17/nightly_incident_records.py validate

      - name: Validate V17 and Action contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from openapi_spec_validator import validate_spec

          candidates = [
              Path("v17/openapi.wow-betting-engine.v17.yaml"),
              Path("openapi.pick-request-action.yaml"),
          ]
          for path in candidates:
              if not path.exists():
                  raise SystemExit(f"required contract missing: {path}")
              spec = yaml.safe_load(path.read_text())
              validate_spec(spec)
              print(f"validated {path}")

          v17 = yaml.safe_load(Path("v17/openapi.wow-betting-engine.v17.yaml").read_text())
          server_urls = [item.get("url") for item in v17.get("servers", [])]
          assert "https://wow-governed-probability-engine.onrender.com" in server_urls

          text = Path("../../render.yaml").read_text()
          assert 'WOW_CAN_EXECUTE' in text
          assert 'value: "false"' in text or "value: 'false'" in text
          assert 'WOW_DRY_RUN_ONLY' in text
          print("nightly invariant validation passed")
          PY

      - name: Probe production health and governance
        shell: bash
        run: |
          set -euo pipefail
          base="https://wow-governed-probability-engine.onrender.com"
          mkdir -p "$RUNNER_TEMP/wow-nightly"

          curl --fail --show-error --silent --retry 4 --retry-all-errors --retry-delay 5 \
            --max-time 30 "$base/health" \
            | tee "$RUNNER_TEMP/wow-nightly/health.json"

          curl --fail --show-error --silent --retry 4 --retry-all-errors --retry-delay 5 \
            --max-time 30 "$base/governance" \
            | tee "$RUNNER_TEMP/wow-nightly/governance.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "wow-nightly"
          health = json.loads((root / "health.json").read_text())
          governance = json.loads((root / "governance.json").read_text())

          payload = json.dumps({"health": health, "governance": governance}, sort_keys=True).lower()
          forbidden = [
              '"can_execute": true',
              '"dry_run_only": false',
          ]
          for marker in forbidden:
              if marker in payload:
                  raise SystemExit(f"unsafe production invariant detected: {marker}")

          print("production health/governance probe completed")
          PY

      - name: Write nightly evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "# WOW V17 Nightly Engineering Scan"
            echo
            echo "- UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Incident ledger: artifacts/wow-engine/v17/incident-ledger.json"
            echo "- Postmortems: artifacts/wow-engine/v17/postmortems/"
            echo "- Engineering fixes: artifacts/wow-engine/v17/engineering-fixes/"
            echo "- can_execute: false"
            echo
            echo "This workflow is the deterministic detector/acceptance layer."
            echo "Autonomous diagnosis and bounded repair are governed by .agents/skills/wow-nightly-engineering-autopilot/SKILL.md."
            echo "Any reproducible defect entering repair must receive a PM record before code changes and a linked FIX record before implementation."
          } | tee "$RUNNER_TEMP/wow-nightly-summary.md"

      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-nightly-engineering-evidence
          path: |
            ${{ runner.temp }}/wow-nightly-summary.md
            ${{ runner.temp }}/wow-nightly/*.json
          if-no-files-found: warn
          retention-days: 14

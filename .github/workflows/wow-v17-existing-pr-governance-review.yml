name: wow-v17-existing-pr-governance-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing engineering PR to certify
        required: true
        type: string
      incident_id:
        description: Optional canonical incident override
        required: false
        type: string
  workflow_run:
    workflows: [wow-v17-independent-qa-check]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: wow-v17-existing-pr-governance-${{ github.event.workflow_run.id || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  certify-existing-pr:
    name: Existing PR trusted governance certification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Route event applicability
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_ACTIVE: ${{ vars.WOW_QA_INDEPENDENT_REVIEW_ACTIVE || '' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: |
          set -euo pipefail
          # A workflow_run event carries no PR identity of its own. Only a successful
          # QA run that resolved an exact-head target can supply one; every other
          # completion is inapplicable and exits neutrally instead of manufacturing
          # EXISTING_PR_NUMBER_INVALID. Applicable events keep every fail-closed gate.
          neutral() {
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "::notice::GOVERNANCE_EVENT_NOT_APPLICABLE:$1 (no receipt produced)"
            exit 0
          }
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            [ "$REVIEW_ACTIVE" = "true" ] || neutral "INDEPENDENT_SOURCE_REVIEW_INACTIVE"
            [ "$SOURCE_CONCLUSION" = "success" ] || neutral "SOURCE_QA_RUN_NOT_SUCCESSFUL:${SOURCE_CONCLUSION:-none}"
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "SOURCE_REVIEW_RUN_ID_OR_ATTEMPT_INVALID" >&2; exit 1;
            }
            artifacts=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")
            targeted=$(jq -e '[.artifacts[] | select(.name | startswith("wow-v17-qa-policy-"))] | length' <<<"$artifacts") || {
              echo "SOURCE_REVIEW_ARTIFACT_INVENTORY_INVALID" >&2; exit 1;
            }
            [ "$targeted" -gt 0 ] || neutral "SOURCE_QA_RUN_HAD_NO_EXACT_HEAD_TARGET"
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - name: Checkout protected main
        if: steps.route.outputs.applicable == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Test protected receipt verifier
        if: steps.route.outputs.applicable == 'true'
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest -q .github/scripts/tests/test_existing_pr_governance_receipt.py

      - name: Resolve exact standalone source-review artifact
        id: source_review
        if: steps.route.outputs.applicable == 'true' && (github.event_name == 'workflow_run' && vars.WOW_QA_INDEPENDENT_REVIEW_ACTIVE == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] && [[ "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "SOURCE_REVIEW_RUN_ID_OR_ATTEMPT_INVALID" >&2; exit 1;
          }
          source_run="$RUNNER_TEMP/source-review-run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$source_run"
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson attempt "$SOURCE_ATTEMPT" \
            '.workflow_id == 380562324 and
             .path == ".github/workflows/wow-v17-independent-qa-check.yml" and
             (.event == "workflow_dispatch" or .event == "workflow_run") and .head_branch == "main" and
             .head_repository.full_name == $repo and .repository.full_name == $repo and
             .run_attempt == $attempt and .status == "completed" and .conclusion == "success"' \
            "$source_run" >/dev/null || {
              echo "SOURCE_REVIEW_WORKFLOW_RUN_UNTRUSTED_OR_NOT_SUCCESSFUL" >&2; exit 1;
            }
          artifacts=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")
          matches=$(jq -c --arg suffix "-${SOURCE_RUN_ID}-${SOURCE_ATTEMPT}" \
            '[.artifacts[] | select(.expired == false and
              (.name | startswith("wow-v17-independent-source-review-")) and
              (.name | endswith($suffix)))]' <<<"$artifacts")
          [ "$(jq 'length' <<<"$matches")" -eq 1 ] || {
            echo "SOURCE_REVIEW_ARTIFACT_MISSING_OR_DUPLICATE" >&2; exit 1;
          }
          artifact_id=$(jq -r '.[0].id' <<<"$matches")
          artifact_name=$(jq -r '.[0].name' <<<"$matches")
          [[ "$artifact_name" =~ ^wow-v17-independent-source-review-([1-9][0-9]*)-([a-f0-9]{40})-${SOURCE_RUN_ID}-${SOURCE_ATTEMPT}$ ]] || {
            echo "SOURCE_REVIEW_ARTIFACT_NAME_INVALID" >&2; exit 1;
          }
          source_pr="${BASH_REMATCH[1]}"
          source_sha="${BASH_REMATCH[2]}"
          inventory='[]'
          for page in $(seq 1 20); do
            response=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}")
            items=$(jq -ce '.artifacts' <<<"$response") || {
              echo "SOURCE_REVIEW_ARTIFACT_INVENTORY_INVALID" >&2; exit 1;
            }
            count=$(jq 'length' <<<"$items")
            inventory=$(jq -cn --argjson old "$inventory" --argjson new "$items" '$old + $new')
            [ "$count" -lt 100 ] && break
            [ "$page" -lt 20 ] || {
              echo "SOURCE_REVIEW_ARTIFACT_INVENTORY_LIMIT_EXCEEDED" >&2; exit 1;
            }
          done
          printf '%s\n' "$inventory" > "$RUNNER_TEMP/source-review-artifact-inventory.json"
          python - "$RUNNER_TEMP/source-review-artifact-inventory.json" \
            "wow-v17-independent-source-review-${source_pr}-${source_sha}-" "$artifact_id" \
            "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT" <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, ".github/scripts")
          from independent_source_review_receipt import (
              SourceReviewError, verify_unique_artifact_inventory,
          )
          try:
              prefix, run_id, attempt = sys.argv[2], sys.argv[4], sys.argv[5]
              records = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
              records = [item for item in records if
                         isinstance(item, dict) and isinstance(item.get("name"), str)
                         and item["name"].startswith(prefix)
                         and item["name"].endswith(f"-{run_id}-{attempt}")]
              verify_unique_artifact_inventory(
                  records,
                  prefix=prefix,
                  expected_artifact_id=int(sys.argv[3]),
              )
          except (OSError, json.JSONDecodeError, ValueError) as exc:
              print(f"SOURCE_REVIEW_ARTIFACT_INVENTORY_HOLD:{exc}", file=sys.stderr)
              raise SystemExit(1)
          PY
          mkdir -p "$RUNNER_TEMP/source-review"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$RUNNER_TEMP/source-review/decision.zip"
          unzip -p "$RUNNER_TEMP/source-review/decision.zip" \
            wow-v17-independent-source-review.json > "$RUNNER_TEMP/source-review/decision.json"
          unzip -p "$RUNNER_TEMP/source-review/decision.zip" \
            wow-v17-independent-source-review.json.sha256 > "$RUNNER_TEMP/source-review/decision.json.sha256"
          pr_number=$(jq -er '.target.pr_number | select(type == "number" and . > 0)' \
            "$RUNNER_TEMP/source-review/decision.json")
          head_sha=$(jq -er '.target.head_sha | select(type == "string")' \
            "$RUNNER_TEMP/source-review/decision.json")
          head_ref=$(jq -er '.target.head_ref | select(type == "string")' \
            "$RUNNER_TEMP/source-review/decision.json")
          python .github/scripts/independent_source_review_receipt.py \
            --verify \
            --artifact "$RUNNER_TEMP/source-review/decision.json" \
            --run "$source_run" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$pr_number" \
            --head-sha "$head_sha" \
            --head-ref "$head_ref" \
            --attempt "$SOURCE_ATTEMPT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream QA target from authenticated artifacts
        id: upstream_qa
        if: steps.route.outputs.applicable == 'true' && github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_PULL_REQUESTS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] && [[ "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "UPSTREAM_QA_RUN_IDENTITY_INVALID" >&2; exit 1;
          }
          if ! resolved=$(python .github/scripts/independent_source_review_receipt.py \
            --resolve-upstream-qa \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --attempt "$SOURCE_ATTEMPT" \
            --pull-requests-json "$SOURCE_PULL_REQUESTS"); then
            printf '%s\n' "$resolved" >&2
            echo "UPSTREAM_QA_TARGET_UNRESOLVED" >&2
            exit 1
          fi
          pr_number=$(jq -er '.pr_number' <<<"$resolved")
          head_sha=$(jq -er '.head_sha' <<<"$resolved")
          head_ref=$(jq -er '.head_ref' <<<"$resolved")
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] && [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]] && [ -n "$head_ref" ] || {
            echo "UPSTREAM_QA_TARGET_INVALID" >&2; exit 1;
          }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Resolve exact PR identity and incident
        if: steps.route.outputs.applicable == 'true'
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          INPUT_PR: ${{ inputs.pr_number || '' }}
          INPUT_INCIDENT: ${{ inputs.incident_id || '' }}
          SOURCE_PR: ${{ steps.source_review.outputs.pr_number || '' }}
          SOURCE_HEAD_SHA: ${{ steps.source_review.outputs.head_sha || '' }}
          SOURCE_HEAD_REF: ${{ steps.source_review.outputs.head_ref || '' }}
          UPSTREAM_PR: ${{ steps.upstream_qa.outputs.pr_number || '' }}
          UPSTREAM_HEAD_SHA: ${{ steps.upstream_qa.outputs.head_sha || '' }}
          UPSTREAM_HEAD_REF: ${{ steps.upstream_qa.outputs.head_ref || '' }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR:-${INPUT_PR:-${SOURCE_PR:-${UPSTREAM_PR:-}}}}"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || { echo "EXISTING_PR_NUMBER_INVALID" >&2; exit 1; }
          if [ -n "${SOURCE_PR:-}" ] && [ "$SOURCE_PR" != "$pr_number" ]; then
            echo "UPSTREAM_QA_IDENTITY_MISMATCH" >&2; exit 1;
          fi
          if [ -n "${UPSTREAM_PR:-}" ] && [ "$UPSTREAM_PR" != "$pr_number" ]; then
            echo "UPSTREAM_QA_IDENTITY_MISMATCH" >&2; exit 1;
          fi

          mkdir -p .governance-review-evidence
          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          state=$(jq -r '.state // ""' <<<"$pr_json")
          draft=$(jq -r 'if (.draft | type) == "boolean" then (.draft | tostring) else "unknown" end' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha // ""' <<<"$pr_json")
          head_ref=$(jq -r '.head.ref // ""' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref // ""' <<<"$pr_json")
          base_repo=$(jq -r '.base.repo.full_name // ""' <<<"$pr_json")
          body=$(jq -r '.body // ""' <<<"$pr_json")

          [ "$state" = "open" ] || { echo "EXISTING_PR_NOT_OPEN" >&2; exit 1; }
          [ "$draft" = "false" ] || { echo "EXISTING_PR_NOT_READY_FOR_REVIEW" >&2; exit 1; }
          [ "$base_ref" = "main" ] && [ "$base_repo" = "$GITHUB_REPOSITORY" ] || {
            echo "EXISTING_PR_BASE_NOT_CANONICAL_MAIN" >&2; exit 1;
          }
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
            echo "EXISTING_PR_HEAD_REPOSITORY_MISMATCH" >&2; exit 1;
          }
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]] && [ -n "$head_ref" ] || {
            echo "EXISTING_PR_IDENTITY_INCOMPLETE" >&2; exit 1;
          }
          if [ -n "${SOURCE_HEAD_SHA:-}" ]; then
            [ "$head_sha" = "$SOURCE_HEAD_SHA" ] && [ "$head_ref" = "$SOURCE_HEAD_REF" ] || {
              echo "SOURCE_REVIEW_PR_HEAD_MOVED_OR_REF_MISMATCH" >&2; exit 1;
            }
          fi
          if [ -n "${UPSTREAM_HEAD_SHA:-}" ]; then
            [ "$head_sha" = "$UPSTREAM_HEAD_SHA" ] && [ "$head_ref" = "$UPSTREAM_HEAD_REF" ] || {
              echo "UPSTREAM_QA_PR_HEAD_MOVED_OR_REF_MISMATCH" >&2; exit 1;
            }
          fi

          incident="${INPUT_INCIDENT:-}"
          if [ -z "$incident" ]; then
            incident=$(python - "$body" <<'PY'
          import re, sys
          body=sys.argv[1]
          patterns=[
              r'(?im)^\s*(?:fixes|closes|resolves)\s+#(\d+)\b',
              r'(?im)^\s*(?:refs?|related to)\s+#(\d+)\b',
              r'(?im)^\s*incident\s*:\s*#?(\d+)\b',
              r'(?im)\bissue\s+#(\d+)\b',
          ]
          for pattern in patterns:
              match=re.search(pattern, body)
              if match:
                  print(match.group(1))
                  raise SystemExit(0)
          PY
          )
          fi
          [[ "$incident" =~ ^[1-9][0-9]*$ ]] || { echo "EXISTING_PR_INCIDENT_ID_MISSING" >&2; exit 1; }

          gh issue view "$incident" --repo "$GITHUB_REPOSITORY" \
            --json number,title,state,url > ".governance-review-evidence/incident.json"
          echo "$pr_json" > ".governance-review-evidence/initial-pr.json"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Verify exact-head deterministic CI
        if: steps.route.outputs.applicable == 'true'
        id: regression
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          api_array() {
            local endpoint="$1" selector="$2" page=1 response items count accumulated='[]'
            while [ "$page" -le 10 ]; do
              response=$(gh api "${endpoint}&per_page=100&page=${page}") || return 1
              items=$(jq -ce "$selector" <<<"$response") || {
                echo "EXISTING_PR_API_ARRAY_INVALID" >&2; return 1;
              }
              accumulated=$(printf '%s\n%s\n' "$accumulated" "$items" |
                jq -cse 'if length == 2 and all(.[]; type == "array")
                         then .[0] + .[1] else error("EXISTING_PR_API_ARRAY_INVALID") end') || return 1
              count=$(jq 'length' <<<"$items")
              [ "$count" -lt 100 ] && { printf '%s\n' "$accumulated"; return 0; }
              page=$((page + 1))
            done
            echo "EXISTING_PR_API_INVENTORY_LIMIT_EXCEEDED" >&2
            return 1
          }
          required=(
            "wow-verify|.github/workflows/wow-verify.yml"
            "wow-engine-verify|.github/workflows/wow-engine-verify.yml"
            "wow-v17-rapid-repair|.github/workflows/wow-v17-rapid-repair.yml"
            "wow-v17-change-impact-gate|.github/workflows/wow-v17-change-impact-gate.yml"
            "wow-v17-engineering-auditor-code-health|.github/workflows/wow-v17-engineering-auditor-code-health.yml"
            "wow-v17-spread-forward-shadow|.github/workflows/wow-v17-spread-forward-shadow.yml"
            "wow-v17-release-production-verification-agent|.github/workflows/wow-v17-release-production-verification-agent.yml"
          )
          ready=false
          runs='[]'
          for _ in $(seq 1 120); do
            runs=$(api_array "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}" '.workflow_runs')
            ready=true
            for required_spec in "${required[@]}"; do
              required_name="${required_spec%%|*}"
              required_path="${required_spec#*|}"
              match=$(jq -r --arg name "$required_name" --arg path "$required_path" \
                '[.[] | select(.name == $name and .path == $path)] | sort_by(.created_at, .id) | last | "\(.status)|\(.conclusion // "")"' \
                <<<"$runs")
              if [ "$match" = "completed|failure" ] || [ "$match" = "completed|cancelled" ] || \
                 [ "$match" = "completed|timed_out" ] || [ "$match" = "completed|action_required" ]; then
                echo "EXISTING_PR_REQUIRED_CI_FAILED:$required_name" >&2
                exit 1
              fi
              if [ "$match" != "completed|success" ]; then
                ready=false
              fi
            done
            [ "$ready" = "true" ] && break
            sleep 10
          done
          [ "$ready" = "true" ] || {
            echo "EXISTING_PR_REQUIRED_CI_INCOMPLETE_AFTER_BOUNDED_WAIT" >&2
            exit 1
          }
          printf '%s\n' "$runs" > ".governance-review-evidence/workflow-runs.json"
          echo "status=0" >> "$GITHUB_OUTPUT"

      - name: Collect complete exact-head GitHub evidence
        if: steps.route.outputs.applicable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          INCIDENT: ${{ steps.target.outputs.incident }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
        run: |
          set -euo pipefail
          api_array() {
            local endpoint="$1" selector="$2" page=1 response items count accumulated='[]'
            while [ "$page" -le 10 ]; do
              response=$(gh api "${endpoint}?per_page=100&page=${page}") || return 1
              items=$(jq -ce "$selector" <<<"$response") || {
                echo "EXISTING_PR_API_ARRAY_INVALID" >&2; return 1;
              }
              accumulated=$(printf '%s\n%s\n' "$accumulated" "$items" |
                jq -cse 'if length == 2 and all(.[]; type == "array")
                         then .[0] + .[1] else error("EXISTING_PR_API_ARRAY_INVALID") end') || return 1
              count=$(jq 'length' <<<"$items")
              [ "$count" -lt 100 ] && { printf '%s\n' "$accumulated"; return 0; }
              page=$((page + 1))
            done
            echo "EXISTING_PR_API_INVENTORY_LIMIT_EXCEEDED" >&2
            return 1
          }
          api="/repos/${GITHUB_REPOSITORY}"
          pr_json=$(gh api "${api}/pulls/${PR_NUMBER}")
          jq -e --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .draft == false and .head.sha == $sha and
             .head.repo.full_name == $repo and .base.ref == "main" and
             .base.repo.full_name == $repo' <<<"$pr_json" >/dev/null || {
              echo "EXISTING_PR_HEAD_MOVED_OR_NOT_READY" >&2; exit 1;
            }

          api_array "${api}/pulls/${PR_NUMBER}/files" \
            '[.[] | {filename,previous_filename,status}]' > ".governance-review-evidence/changed-files.json"
          api_array "${api}/pulls/${PR_NUMBER}/reviews" '.' > ".governance-review-evidence/reviews.json"
          api_array "${api}/commits/${HEAD_SHA}/check-runs" '.check_runs' > ".governance-review-evidence/check-runs.json"
          printf '%s\n' "$pr_json" > ".governance-review-evidence/pr.json"

          current_sha=$(gh api "${api}/pulls/${PR_NUMBER}" --jq '.head.sha')
          [ "$current_sha" = "$HEAD_SHA" ] || { echo "EXISTING_PR_HEAD_MOVED_DURING_CAPTURE" >&2; exit 1; }
          jq -nce \
            --slurpfile pr ".governance-review-evidence/pr.json" \
            --slurpfile changed_files ".governance-review-evidence/changed-files.json" \
            --slurpfile reviews ".governance-review-evidence/reviews.json" \
            --slurpfile check_runs ".governance-review-evidence/check-runs.json" \
            --slurpfile workflow_runs ".governance-review-evidence/workflow-runs.json" \
            'def one($kind):
               if length == 1 and (.[0] | type) == $kind then .[0]
               else error("EXISTING_PR_API_ARRAY_INVALID") end;
             {complete_inventory:true,pr:($pr | one("object")),
              changed_files:($changed_files | one("array")),reviews:($reviews | one("array")),
              check_runs:($check_runs | one("array")),workflow_runs:($workflow_runs | one("array"))}' \
            > ".governance-review-evidence/evidence.json"

      - name: Build and verify review-evidence receipt
        if: steps.route.outputs.applicable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_REVIEWERS_JSON: ${{ vars.WOW_V17_INDEPENDENT_REVIEWERS }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          INCIDENT: ${{ steps.target.outputs.incident }}
          SOURCE_REVIEW_ARTIFACT_ID: ${{ steps.source_review.outputs.artifact_id || '' }}
        run: |
          set -euo pipefail
          evidence=".governance-review-evidence/evidence.json"
          classification_file="$RUNNER_TEMP/wow-governance-classification.txt"
          set +e
          python .github/scripts/verify_existing_pr_governance_receipt.py \
            --evidence "$evidence" \
            --classify \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --head-ref "$HEAD_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-name "wow-v17-existing-pr-governance-review" \
            --pr-number "$PR_NUMBER" \
            --incident-id "$INCIDENT" \
            > "$classification_file"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cat "$classification_file" >&2
            exit 1
          fi
          classification=$(tr -d '[:space:]' < "$classification_file")
          case "$classification" in
            TRUST_ROOT_BOOTSTRAP|ORDINARY_ENGINEERING) ;;
            *) echo "EXISTING_PR_CLASSIFICATION_INVALID:$classification" >&2; exit 1 ;;
          esac

          if [ "$classification" = "TRUST_ROOT_BOOTSTRAP" ]; then
            api="/repos/${GITHUB_REPOSITORY}"
            api_array() {
              local endpoint="$1" selector="$2" page=1 response items count accumulated='[]'
              while [ "$page" -le 10 ]; do
                response=$(gh api "${endpoint}?per_page=100&page=${page}") || return 1
                items=$(jq -ce "$selector" <<<"$response") || {
                  echo "EXISTING_PR_API_ARRAY_INVALID" >&2; return 1;
                }
                accumulated=$(printf '%s\n%s\n' "$accumulated" "$items" |
                  jq -cse 'if length == 2 and all(.[]; type == "array")
                           then .[0] + .[1] else error("EXISTING_PR_API_ARRAY_INVALID") end') || return 1
                count=$(jq 'length' <<<"$items")
                [ "$count" -lt 100 ] && { printf '%s\n' "$accumulated"; return 0; }
                page=$((page + 1))
              done
              echo "EXISTING_PR_API_INVENTORY_LIMIT_EXCEEDED" >&2
              return 1
            }
            required_checks=(
              "WOW required-three regression|15368"
              "WOW governed probability backend|15368"
              "WOW additional required regression|15368"
              "WOW V17 change impact gate|15368"
              "WOW Independent QA exact-head|5245832"
              "WOW Release Authority exact-head|5245853"
            )
            ready=false
            checks='[]'
            for _ in $(seq 1 60); do
              checks=$(api_array "${api}/commits/${HEAD_SHA}/check-runs" '.check_runs')
              ready=true
              for required_spec in "${required_checks[@]}"; do
                check_name="${required_spec%%|*}"
                app_id="${required_spec#*|}"
                match=$(jq -r --arg name "$check_name" --argjson app "$app_id" --arg sha "$HEAD_SHA" \
                  '[.[] | select(.name == $name and (.app.id == $app) and .head_sha == $sha)] | sort_by(.started_at, .id) | last | "\(.status // "")|\(.conclusion // "")"' \
                  <<<"$checks")
                if [ "$match" = "completed|failure" ] || [ "$match" = "completed|cancelled" ] || \
                   [ "$match" = "completed|timed_out" ] || [ "$match" = "completed|action_required" ] || \
                   [ "$match" = "completed|skipped" ]; then
                  echo "EXISTING_PR_BOOTSTRAP_CHECK_FAILED:$check_name" >&2
                  exit 1
                fi
                if [ "$match" != "completed|success" ]; then
                  ready=false
                fi
              done
              [ "$ready" = "true" ] && break
              sleep 10
            done
            [ "$ready" = "true" ] || {
              echo "EXISTING_PR_BOOTSTRAP_CHECKS_INCOMPLETE" >&2
              exit 1
            }
            printf '%s\n' "$checks" > ".governance-review-evidence/bootstrap-check-runs.json"
            jq -nce --slurpfile evidence "$evidence" \
              --slurpfile check_runs ".governance-review-evidence/bootstrap-check-runs.json" \
              'if ($evidence | length) == 1 and ($evidence[0] | type) == "object"
                  and ($check_runs | length) == 1 and ($check_runs[0] | type) == "array"
               then $evidence[0] | .check_runs = $check_runs[0]
               else error("EXISTING_PR_API_ARRAY_INVALID") end' > "${evidence}.tmp"
            mv "${evidence}.tmp" "$evidence"
          fi

          receipt="$RUNNER_TEMP/wow-engineering-governance-receipt.json"
          common=(
            --evidence "$evidence"
            --output "$receipt"
            --repository "$GITHUB_REPOSITORY"
            --head-sha "$HEAD_SHA"
            --head-ref "$HEAD_REF"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
            --workflow-name "wow-v17-existing-pr-governance-review"
            --pr-number "$PR_NUMBER"
            --incident-id "$INCIDENT"
          )
          if [ "$classification" = "TRUST_ROOT_BOOTSTRAP" ]; then
            python .github/scripts/verify_existing_pr_governance_receipt.py "${common[@]}" --bootstrap
          else
            if [ -n "${TRUSTED_REVIEWERS_JSON}" ] && [ "${TRUSTED_REVIEWERS_JSON}" != "null" ]; then
              python .github/scripts/verify_existing_pr_governance_receipt.py \
                "${common[@]}" \
                --trusted-reviewers-json "$TRUSTED_REVIEWERS_JSON"
            elif [ -n "${SOURCE_REVIEW_ARTIFACT_ID:-}" ] && \
                 [ -f "$RUNNER_TEMP/source-review/decision.json" ] && \
                 [ -f "$RUNNER_TEMP/source-review-run.json" ]; then
              python .github/scripts/verify_existing_pr_governance_receipt.py \
                "${common[@]}" \
                --source-review-json "$RUNNER_TEMP/source-review/decision.json" \
                --source-review-run-json "$RUNNER_TEMP/source-review-run.json" \
                --source-review-artifact-id "$SOURCE_REVIEW_ARTIFACT_ID"
            else
              echo "INDEPENDENT_REVIEW_EVIDENCE_MISSING: no allowlisted human approval or authenticated exact-head automated review." >&2
              exit 1
            fi
          fi
          sha256sum "$receipt" | awk '{print $1}' > "$RUNNER_TEMP/wow-engineering-governance-receipt.sha256"

      - name: Upload exact-head review-evidence receipt
        if: steps.route.outputs.applicable == 'true' && (success())
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-engineering-governance-${{ steps.target.outputs.head_sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/wow-engineering-governance-receipt.json
            ${{ runner.temp }}/wow-engineering-governance-receipt.sha256

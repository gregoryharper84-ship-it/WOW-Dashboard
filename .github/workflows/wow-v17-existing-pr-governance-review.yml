name: wow-v17-existing-pr-governance-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing engineering PR to certify
        required: true
        type: string
      incident_id:
        description: Optional canonical incident override
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: wow-v17-existing-pr-governance-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  certify-existing-pr:
    name: Existing PR trusted governance certification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Test protected receipt verifier
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest -q .github/scripts/tests/test_existing_pr_governance_receipt.py

      - name: Resolve exact PR identity and incident
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          INPUT_PR: ${{ inputs.pr_number || '' }}
          INPUT_INCIDENT: ${{ inputs.incident_id || '' }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR:-${INPUT_PR:-}}"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || { echo "EXISTING_PR_NUMBER_INVALID" >&2; exit 1; }

          mkdir -p .governance-review-evidence
          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          state=$(jq -r '.state // ""' <<<"$pr_json")
          draft=$(jq -r 'if (.draft | type) == "boolean" then (.draft | tostring) else "unknown" end' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha // ""' <<<"$pr_json")
          head_ref=$(jq -r '.head.ref // ""' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref // ""' <<<"$pr_json")
          base_repo=$(jq -r '.base.repo.full_name // ""' <<<"$pr_json")
          body=$(jq -r '.body // ""' <<<"$pr_json")

          [ "$state" = "open" ] || { echo "EXISTING_PR_NOT_OPEN" >&2; exit 1; }
          [ "$draft" = "false" ] || { echo "EXISTING_PR_NOT_READY_FOR_REVIEW" >&2; exit 1; }
          [ "$base_ref" = "main" ] && [ "$base_repo" = "$GITHUB_REPOSITORY" ] || {
            echo "EXISTING_PR_BASE_NOT_CANONICAL_MAIN" >&2; exit 1;
          }
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
            echo "EXISTING_PR_HEAD_REPOSITORY_MISMATCH" >&2; exit 1;
          }
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]] && [ -n "$head_ref" ] || {
            echo "EXISTING_PR_IDENTITY_INCOMPLETE" >&2; exit 1;
          }

          incident="${INPUT_INCIDENT:-}"
          if [ -z "$incident" ]; then
            incident=$(python - "$body" <<'PY'
          import re, sys
          body=sys.argv[1]
          patterns=[
              r'(?im)^\s*(?:fixes|closes|resolves)\s+#(\d+)\b',
              r'(?im)^\s*incident\s*:\s*#?(\d+)\b',
              r'(?im)\bissue\s+#(\d+)\b',
          ]
          for pattern in patterns:
              match=re.search(pattern, body)
              if match:
                  print(match.group(1))
                  raise SystemExit(0)
          PY
          )
          fi
          [[ "$incident" =~ ^[1-9][0-9]*$ ]] || { echo "EXISTING_PR_INCIDENT_ID_MISSING" >&2; exit 1; }

          gh issue view "$incident" --repo "$GITHUB_REPOSITORY" \
            --json number,title,state,url > ".governance-review-evidence/incident.json"
          echo "$pr_json" > ".governance-review-evidence/initial-pr.json"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Verify exact-head deterministic CI
        id: regression
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          api_array() {
            local endpoint="$1" selector="$2" page=1 response items count accumulated='[]'
            while [ "$page" -le 10 ]; do
              response=$(gh api "${endpoint}&per_page=100&page=${page}")
              items=$(jq -ce "$selector" <<<"$response")
              count=$(jq 'length' <<<"$items")
              accumulated=$(
                printf '%s\n%s\n' "$accumulated" "$items" |
                  jq -cse 'if (length == 2 and all(.[]; type == "array")) then .[0] + .[1] else error("EXISTING_PR_API_ARRAY_INVALID") end'
              )
              [ "$count" -lt 100 ] && { printf '%s\n' "$accumulated"; return 0; }
              page=$((page + 1))
            done
            echo "EXISTING_PR_API_INVENTORY_LIMIT_EXCEEDED" >&2
            return 1
          }
          required=(
            "wow-verify|.github/workflows/wow-verify.yml"
            "wow-engine-verify|.github/workflows/wow-engine-verify.yml"
            "wow-v17-rapid-repair|.github/workflows/wow-v17-rapid-repair.yml"
            "wow-v17-change-impact-gate|.github/workflows/wow-v17-change-impact-gate.yml"
            "wow-v17-engineering-auditor-code-health|.github/workflows/wow-v17-engineering-auditor-code-health.yml"
            "wow-v17-spread-forward-shadow|.github/workflows/wow-v17-spread-forward-shadow.yml"
            "wow-v17-release-production-verification-agent|.github/workflows/wow-v17-release-production-verification-agent.yml"
          )
          ready=false
          runs='[]'
          for _ in $(seq 1 120); do
            runs=$(api_array "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}" '.workflow_runs')
            ready=true
            for required_spec in "${required[@]}"; do
              required_name="${required_spec%%|*}"
              required_path="${required_spec#*|}"
              match=$(jq -r --arg name "$required_name" --arg path "$required_path" \
                '[.[] | select(.name == $name and .path == $path)] | sort_by(.created_at) | reverse | first | "\(.status)|\(.conclusion // "")"' \
                <<<"$runs")
              if [ "$match" = "completed|failure" ] || [ "$match" = "completed|cancelled" ] || \
                 [ "$match" = "completed|timed_out" ] || [ "$match" = "completed|action_required" ]; then
                echo "EXISTING_PR_REQUIRED_CI_FAILED:$required_name" >&2
                exit 1
              fi
              if [ "$match" != "completed|success" ]; then
                ready=false
              fi
            done
            [ "$ready" = "true" ] && break
            sleep 10
          done
          [ "$ready" = "true" ] || {
            echo "EXISTING_PR_REQUIRED_CI_INCOMPLETE_AFTER_BOUNDED_WAIT" >&2
            exit 1
          }
          printf '%s\n' "$runs" > ".governance-review-evidence/workflow-runs.json"
          echo "status=0" >> "$GITHUB_OUTPUT"

      - name: Collect complete exact-head GitHub evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          INCIDENT: ${{ steps.target.outputs.incident }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
        run: |
          set -euo pipefail
          api_array() {
            local endpoint="$1" selector="$2" page=1 response items count accumulated='[]'
            while [ "$page" -le 10 ]; do
              response=$(gh api "${endpoint}?per_page=100&page=${page}")
              items=$(jq -ce "$selector" <<<"$response")
              count=$(jq 'length' <<<"$items")
              accumulated=$(
                printf '%s\n%s\n' "$accumulated" "$items" |
                  jq -cse 'if (length == 2 and all(.[]; type == "array")) then .[0] + .[1] else error("EXISTING_PR_API_ARRAY_INVALID") end'
              )
              [ "$count" -lt 100 ] && { printf '%s\n' "$accumulated"; return 0; }
              page=$((page + 1))
            done
            echo "EXISTING_PR_API_INVENTORY_LIMIT_EXCEEDED" >&2
            return 1
          }
          api="/repos/${GITHUB_REPOSITORY}"
          pr_json=$(gh api "${api}/pulls/${PR_NUMBER}")
          jq -e --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .draft == false and .head.sha == $sha and
             .head.repo.full_name == $repo and .base.ref == "main" and
             .base.repo.full_name == $repo' <<<"$pr_json" >/dev/null || {
              echo "EXISTING_PR_HEAD_MOVED_OR_NOT_READY" >&2; exit 1;
            }

          changed_files=$(api_array "${api}/pulls/${PR_NUMBER}/files" \
            '[.[] | {filename,previous_filename,status}]')
          reviews=$(api_array "${api}/pulls/${PR_NUMBER}/reviews" '.')
          checks=$(api_array "${api}/commits/${HEAD_SHA}/check-runs" '.check_runs')

          current_sha=$(gh api "${api}/pulls/${PR_NUMBER}" --jq '.head.sha')
          [ "$current_sha" = "$HEAD_SHA" ] || { echo "EXISTING_PR_HEAD_MOVED_DURING_CAPTURE" >&2; exit 1; }
          parts="$RUNNER_TEMP/wow-existing-pr-evidence-parts"
          mkdir -p "$parts"
          printf '%s\n' "$pr_json" > "$parts/pr.json"
          printf '%s\n' "$changed_files" > "$parts/changed_files.json"
          printf '%s\n' "$reviews" > "$parts/reviews.json"
          printf '%s\n' "$checks" > "$parts/check_runs.json"
          jq -en \
            --slurpfile pr "$parts/pr.json" \
            --slurpfile changed_files "$parts/changed_files.json" \
            --slurpfile reviews "$parts/reviews.json" \
            --slurpfile check_runs "$parts/check_runs.json" \
            --slurpfile workflow_runs ".governance-review-evidence/workflow-runs.json" \
            'if ([$pr, $changed_files, $reviews, $check_runs, $workflow_runs] | all(length == 1))
               and ($pr[0] | type == "object")
               and ([$changed_files[0], $reviews[0], $check_runs[0], $workflow_runs[0]] | all(type == "array"))
             then {complete_inventory:true,pr:$pr[0],changed_files:$changed_files[0],reviews:$reviews[0],
                   check_runs:$check_runs[0],workflow_runs:$workflow_runs[0]}
             else error("EXISTING_PR_EVIDENCE_INVALID") end' \
            > ".governance-review-evidence/evidence.json"

      - name: Build and verify review-evidence receipt
        shell: bash
        env:
          TRUSTED_REVIEWERS_JSON: ${{ vars.WOW_V17_INDEPENDENT_REVIEWERS }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          INCIDENT: ${{ steps.target.outputs.incident }}
        run: |
          set -euo pipefail
          evidence=".governance-review-evidence/evidence.json"
          classification_file="$RUNNER_TEMP/wow-governance-classification.txt"
          set +e
          python .github/scripts/verify_existing_pr_governance_receipt.py \
            --evidence "$evidence" \
            --classify \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --head-ref "$HEAD_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-name "wow-v17-existing-pr-governance-review" \
            --pr-number "$PR_NUMBER" \
            --incident-id "$INCIDENT" \
            > "$classification_file"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cat "$classification_file" >&2
            exit 1
          fi
          classification=$(tr -d '[:space:]' < "$classification_file")
          case "$classification" in
            TRUST_ROOT_BOOTSTRAP|ORDINARY_ENGINEERING) ;;
            *) echo "EXISTING_PR_CLASSIFICATION_INVALID:$classification" >&2; exit 1 ;;
          esac

          if [ "$classification" = "TRUST_ROOT_BOOTSTRAP" ]; then
            api="/repos/${GITHUB_REPOSITORY}"
            api_array() {
              local endpoint="$1" selector="$2" page=1 response items count accumulated='[]'
              while [ "$page" -le 10 ]; do
                response=$(gh api "${endpoint}?per_page=100&page=${page}")
                items=$(jq -ce "$selector" <<<"$response")
                count=$(jq 'length' <<<"$items")
                accumulated=$(
                  printf '%s\n%s\n' "$accumulated" "$items" |
                    jq -cse 'if (length == 2 and all(.[]; type == "array")) then .[0] + .[1] else error("EXISTING_PR_API_ARRAY_INVALID") end'
                )
                [ "$count" -lt 100 ] && { printf '%s\n' "$accumulated"; return 0; }
                page=$((page + 1))
              done
              echo "EXISTING_PR_API_INVENTORY_LIMIT_EXCEEDED" >&2
              return 1
            }
            required_checks=(
              "WOW required-three regression|15368"
              "WOW governed probability backend|15368"
              "WOW additional required regression|15368"
              "WOW V17 change impact gate|15368"
              "WOW Independent QA exact-head|5245832"
              "WOW Release Authority exact-head|5245853"
            )
            ready=false
            checks='[]'
            for _ in $(seq 1 60); do
              checks=$(api_array "${api}/commits/${HEAD_SHA}/check-runs" '.check_runs')
              ready=true
              for required_spec in "${required_checks[@]}"; do
                check_name="${required_spec%%|*}"
                app_id="${required_spec#*|}"
                match=$(jq -r --arg name "$check_name" --argjson app "$app_id" --arg sha "$HEAD_SHA" \
                  '[.[] | select(.name == $name and (.app.id == $app) and .head_sha == $sha)] | sort_by(.started_at, .id) | last | "\(.status // "")|\(.conclusion // "")"' \
                  <<<"$checks")
                if [ "$match" = "completed|failure" ] || [ "$match" = "completed|cancelled" ] || \
                   [ "$match" = "completed|timed_out" ] || [ "$match" = "completed|action_required" ] || \
                   [ "$match" = "completed|skipped" ]; then
                  echo "EXISTING_PR_BOOTSTRAP_CHECK_FAILED:$check_name" >&2
                  exit 1
                fi
                if [ "$match" != "completed|success" ]; then
                  ready=false
                fi
              done
              [ "$ready" = "true" ] && break
              sleep 10
            done
            [ "$ready" = "true" ] || {
              echo "EXISTING_PR_BOOTSTRAP_CHECKS_INCOMPLETE" >&2
              exit 1
            }
            printf '%s\n' "$checks" > "$RUNNER_TEMP/wow-bootstrap-check-runs.json"
            jq -e --slurpfile check_runs "$RUNNER_TEMP/wow-bootstrap-check-runs.json" \
              'if (type == "object") and ($check_runs | length == 1) and ($check_runs[0] | type == "array")
               then .check_runs = $check_runs[0] else error("EXISTING_PR_BOOTSTRAP_EVIDENCE_INVALID") end' \
              "$evidence" > "${evidence}.tmp"
            rm -f "$RUNNER_TEMP/wow-bootstrap-check-runs.json"
            mv "${evidence}.tmp" "$evidence"
          fi

          receipt="$RUNNER_TEMP/wow-engineering-governance-receipt.json"
          common=(
            --evidence "$evidence"
            --output "$receipt"
            --repository "$GITHUB_REPOSITORY"
            --head-sha "$HEAD_SHA"
            --head-ref "$HEAD_REF"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
            --workflow-name "wow-v17-existing-pr-governance-review"
            --pr-number "$PR_NUMBER"
            --incident-id "$INCIDENT"
          )
          if [ "$classification" = "TRUST_ROOT_BOOTSTRAP" ]; then
            python .github/scripts/verify_existing_pr_governance_receipt.py "${common[@]}" --bootstrap
          else
            if [ -z "${TRUSTED_REVIEWERS_JSON}" ] || [ "${TRUSTED_REVIEWERS_JSON}" = "null" ]; then
              echo "INDEPENDENT_REVIEWER_ALLOWLIST_MISSING" >&2
              exit 1
            fi
            python .github/scripts/verify_existing_pr_governance_receipt.py \
              "${common[@]}" \
              --trusted-reviewers-json "$TRUSTED_REVIEWERS_JSON"
          fi
          sha256sum "$receipt" | awk '{print $1}' > "$RUNNER_TEMP/wow-engineering-governance-receipt.sha256"

      - name: Upload exact-head review-evidence receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-engineering-governance-${{ steps.target.outputs.head_sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/wow-engineering-governance-receipt.json
            ${{ runner.temp }}/wow-engineering-governance-receipt.sha256

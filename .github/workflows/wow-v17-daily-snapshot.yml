name: wow-v17-daily-snapshot

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      post_deploy_acceptance:
        description: Run the serialized NFL exact-once production acceptance after exact-SHA deploy
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/wow-v17-daily-snapshot.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/v17/daily_snapshot_oidc_bridge.py"
      - "artifacts/wow-engine/v17/daily_snapshot_runtime.py"
      - "artifacts/wow-engine/v17/__init__.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
      - "artifacts/wow-engine/tests/test_v17_daily_snapshot_oidc_bridge.py"

permissions:
  contents: read

concurrency:
  group: wow-v17-daily-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Daily OIDC automation contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run Daily OIDC regressions
        run: >-
          python -m pytest -q
          test_v17_github_oidc.py
          tests/test_v17_daily_snapshot_oidc_bridge.py

  daily-snapshot:
    name: Run governed full-slate Daily snapshot
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_USER_TIMEZONE: America/Chicago
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert non-execution governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Run server-owned Daily snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def fresh_oidc_token():
              oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              separator = "&" if "?" in oidc_url else "?"
              oidc_url += separator + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
              oidc_request = urllib.request.Request(
                  oidc_url,
                  headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
              )
              with urllib.request.urlopen(oidc_request, timeout=20) as response:
                  return json.load(response)["value"]

          slate_date = datetime.now(ZoneInfo(os.environ["WOW_USER_TIMEZONE"])).date().isoformat()
          payload = {
              "requested_slate_date": slate_date,
              "requested_timezone": os.environ["WOW_USER_TIMEZONE"],
              "lanes": ["MONEYLINE"],
              "max_props": 0,
              "max_team_events": 24,
              "response_mode": "COMPACT",
          }
          body = json.dumps(payload).encode("utf-8")
          endpoint = os.environ["WOW_ACTION_ORIGIN"].rstrip("/") + "/internal/v17/daily-snapshot"

          result = None
          transient_statuses = {404, 502, 503, 504}
          max_attempts = 90
          retry_delay_seconds = 20
          for attempt in range(1, max_attempts + 1):
              oidc_token = fresh_oidc_token()
              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {oidc_token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=240) as response:
                      result = json.load(response)
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in transient_statuses or attempt == max_attempts:
                      raise
                  time.sleep(retry_delay_seconds)
              except (urllib.error.URLError, TimeoutError):
                  if attempt == max_attempts:
                      raise
                  time.sleep(retry_delay_seconds)

          if not isinstance(result, dict):
              raise RuntimeError("DAILY_SNAPSHOT_RESPONSE_MISSING")
          if str(result.get("run_status") or "").startswith("RUN_INVALID"):
              raise AssertionError("DAILY_SNAPSHOT_RUN_INVALID")
          if result.get("can_execute") is not False:
              raise AssertionError("DAILY_SNAPSHOT_CAN_EXECUTE_INVARIANT_FAILED")
          if result.get("global_terminal_authority") != "V17_TERMINAL_REDUCER":
              raise AssertionError("DAILY_SNAPSHOT_TERMINAL_AUTHORITY_MISMATCH")
          if result.get("automation_auth") != "GITHUB_ACTIONS_OIDC":
              raise AssertionError("DAILY_SNAPSHOT_OIDC_AUTH_NOT_PROVEN")

          reconciliation = result.get("reconciliation") or {}
          if reconciliation.get("balanced") is not True:
              raise AssertionError("DAILY_SNAPSHOT_ROW_RECONCILIATION_FAILED")

          lane = (result.get("lane_reconciliation") or {}).get("MONEYLINE") or {}
          if lane.get("requested_row_limit") != 24:
              raise AssertionError("DAILY_SNAPSHOT_FULL_SLATE_LIMIT_NOT_APPLIED")

          cross_sport = result.get("cross_sport_discovery_audit")
          if not isinstance(cross_sport, dict):
              raise AssertionError("DAILY_SNAPSHOT_CROSS_SPORT_AUDIT_MISSING")
          cross_reconciliation = cross_sport.get("reconciliation") or {}
          if cross_reconciliation.get("row_reconciliation") != "PASS":
              raise AssertionError("DAILY_SNAPSHOT_CROSS_SPORT_RECONCILIATION_FAILED")

          rows = result.get("rows") or []
          summary = {
              "run_id": result.get("run_id"),
              "run_status": result.get("run_status"),
              "requested_slate_date": result.get("requested_slate_date"),
              "moneyline_rows": len([row for row in rows if row.get("lane") == "MONEYLINE"]),
              "rows_completed": reconciliation.get("rows_completed"),
              "rows_held": reconciliation.get("rows_held"),
              "rows_rejected": reconciliation.get("rows_rejected"),
              "canonical_moneyline_rows": lane.get("canonicalized_count"),
              "cross_sport_row_reconciliation": cross_reconciliation.get("row_reconciliation"),
              "blockers": result.get("blockers") or [],
              "probability_values_logged": False,
              "global_terminal_authority": "V17_TERMINAL_REDUCER",
              "can_execute": False,
          }
          print(json.dumps(summary, sort_keys=True))
          PY

  nfl-full-slate-exact-once-acceptance:
    name: Verify NFL >12 FULL moneyline exact-once production path
    if: inputs.post_deploy_acceptance == true
    needs: daily-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_USER_TIMEZONE: America/Chicago
      WOW_NFL_ACCEPTANCE_LOOKAHEAD_DAYS: "42"
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert production acceptance governance
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Run serialized future NFL full-slate exact-once acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          def fresh_oidc_token():
              base = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              separator = "&" if "?" in base else "?"
              url = base + separator + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)["value"]

          def select_future_nfl_acceptance_slate():
              """Choose a non-aging future NFL slate using schedule identity only.

              ESPN is used only to locate a future date with >12 scheduled events.
              It contributes no sporting probability, market prior, ranking, or
              model input. The actual acceptance still runs through the governed
              production Daily snapshot endpoint.
              """
              zone = ZoneInfo(os.environ["WOW_USER_TIMEZONE"])
              today = datetime.now(zone).date()
              lookahead_days = int(os.environ.get("WOW_NFL_ACCEPTANCE_LOOKAHEAD_DAYS") or "42")
              for offset in range(1, lookahead_days + 1):
                  candidate = today + timedelta(days=offset)
                  if candidate.weekday() != 6:
                      continue
                  params = urllib.parse.urlencode({
                      "dates": candidate.strftime("%Y%m%d"),
                      "limit": 100,
                  })
                  url = (
                      "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?"
                      + params
                  )
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "WOW-V17-NFL-Acceptance-Identity/1.0",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = json.load(response)
                  except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                      continue
                  events = body.get("events") if isinstance(body, dict) else None
                  if not isinstance(events, list):
                      continue
                  scheduled = []
                  for event in events:
                      if not isinstance(event, dict):
                          continue
                      status = event.get("status") if isinstance(event.get("status"), dict) else {}
                      status_type = (
                          status.get("type") if isinstance(status.get("type"), dict) else {}
                      )
                      if status_type.get("completed") is True:
                          continue
                      scheduled.append(event)
                  if len(scheduled) > 12:
                      return candidate.isoformat(), len(scheduled)
              return None, 0

          acceptance_slate_date, selector_event_count = select_future_nfl_acceptance_slate()
          if acceptance_slate_date is None:
              print(json.dumps({
                  "status": "DEFERRED_WITH_JUSTIFICATION",
                  "code": "NFL_FULL_SLATE_ACCEPTANCE_DEFERRED_NO_GT12_FUTURE_SLATE",
                  "lookahead_days": int(os.environ.get("WOW_NFL_ACCEPTANCE_LOOKAHEAD_DAYS") or "42"),
                  "schedule_selector": "ESPN_SCOREBOARD_IDENTITY_ONLY",
                  "probability_values_logged": False,
                  "global_terminal_authority": "V17_TERMINAL_REDUCER",
                  "can_execute": False,
              }, sort_keys=True))
              raise SystemExit(0)

          payload = {
              "requested_slate_date": acceptance_slate_date,
              "requested_timezone": os.environ["WOW_USER_TIMEZONE"],
              "lanes": ["MONEYLINE"],
              "max_props": 0,
              "max_team_events": 32,
              "response_mode": "FULL",
          }
          endpoint = os.environ["WOW_ACTION_ORIGIN"].rstrip("/") + "/internal/v17/daily-snapshot"
          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {fresh_oidc_token()}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=900) as response:
              result = json.load(response)

          assert isinstance(result, dict), result
          assert not str(result.get("run_status") or "").startswith("RUN_INVALID"), result
          assert result.get("can_execute") is False, result
          assert result.get("global_terminal_authority") == "V17_TERMINAL_REDUCER", result
          assert result.get("automation_auth") == "GITHUB_ACTIONS_OIDC", result

          reconciliation = result.get("reconciliation") or {}
          assert reconciliation.get("balanced") is True, reconciliation
          cross = result.get("cross_sport_discovery_audit") or {}
          cross_reconciliation = cross.get("reconciliation") or {}
          assert cross_reconciliation.get("row_reconciliation") == "PASS", cross_reconciliation
          assert cross_reconciliation.get("events_accounted") == cross_reconciliation.get("events_discovered"), cross_reconciliation

          rows = [row for row in (result.get("rows") or []) if row.get("lane") == "MONEYLINE"]
          nfl_rows = [row for row in rows if str((row.get("identity") or {}).get("sport") or "").upper() == "NFL"]
          if len(nfl_rows) <= 12:
              raise AssertionError(
                  "NFL_FULL_SLATE_DISCOVERY_COVERAGE_MISMATCH:"
                  f"selector={selector_event_count}:backend={len(nfl_rows)}:"
                  f"slate={acceptance_slate_date}"
              )

          identities = []
          budget_rows = []
          for row in nfl_rows:
              identity = row.get("identity") or {}
              event_id = identity.get("official_event_id") or identity.get("event_id") or identity.get("id")
              if not event_id:
                  raise AssertionError("NFL_FULL_SLATE_EVENT_ID_MISSING")
              identities.append(str(event_id))
              if "MODEL_INVOCATION_BUDGET_REACHED" in json.dumps(row.get("result") or {}, sort_keys=True):
                  budget_rows.append(str(event_id))
              assert row.get("can_execute") is False, row

          assert len(identities) == len(set(identities)), identities
          assert not budget_rows, budget_rows

          print(json.dumps({
              "status": "PASS",
              "code": "NFL_FULL_SLATE_EXACT_ONCE_PRODUCTION_ACCEPTANCE_PASS",
              "run_id": result.get("run_id"),
              "requested_slate_date": result.get("requested_slate_date"),
              "schedule_selector": "ESPN_SCOREBOARD_IDENTITY_ONLY",
              "selector_event_count": selector_event_count,
              "nfl_rows": len(nfl_rows),
              "unique_nfl_event_ids": len(set(identities)),
              "model_invocation_budget_terminal_rows": 0,
              "events_discovered": cross_reconciliation.get("events_discovered"),
              "events_accounted": cross_reconciliation.get("events_accounted"),
              "row_reconciliation": cross_reconciliation.get("row_reconciliation"),
              "probability_values_logged": False,
              "global_terminal_authority": result.get("global_terminal_authority"),
              "can_execute": False,
          }, sort_keys=True))
          PY

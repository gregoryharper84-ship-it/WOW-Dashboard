name: MLB V2 production route inspection

on:
  push:
    branches:
      - feature/mlb-v2-governed-probability-20260827
    paths:
      - ".github/workflows/mlb-v2-production-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate governed score-event code
        shell: bash
        run: |
          set +e
          echo '=== app.py governance/MLB matches ==='
          grep -nEi 'GOVERNED_EVENT_MODEL|governed_probability|OUTRIGHT_WINNER|score.?event|mlb.game.win|SECTION_8A|probability_publishable|can_execute' artifacts/flask-scoring-api/app.py | tail -n 250
          echo '=== recursive Python matches ==='
          grep -RniE --include='*.py' 'GOVERNED_EVENT_MODEL|governed_probability|OUTRIGHT_WINNER|score.?event|mlb.game.win|SECTION_8A|probability_publishable' artifacts/flask-scoring-api | tail -n 400
          echo '=== relevant test names ==='
          find artifacts/flask-scoring-api/tests -maxdepth 2 -type f | sort | grep -Ei 'mlb|score|event|probab|govern' | tail -n 200

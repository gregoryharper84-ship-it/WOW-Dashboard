name: wow-v17-one-shot-post-deploy-orchestration-patch

on:
  push:
    branches:
      - engineering/v17-post-deploy-orchestrator-1087

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply workflow-level post-deploy orchestration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/v17-post-deploy-orchestrator-1087
          fetch-depth: 0

      - name: Apply exact bounded orchestration patch
        run: python scripts/patch_v17_post_deploy_orchestration_1087.py

      - name: Run focused orchestration regression
        run: |
          python - <<'PY'
          import runpy
          from pathlib import Path

          paths = [
              Path('artifacts/wow-engine/tests/test_v17_post_deploy_canary_gate.py'),
              Path('artifacts/wow-engine/v17/test_priority_prop_lifecycle_workflow.py'),
          ]
          failures = []
          ran = 0
          for path in paths:
              ns = runpy.run_path(str(path))
              for name, fn in sorted(ns.items()):
                  if name.startswith('test_') and callable(fn):
                      ran += 1
                      try:
                          fn()
                          print(f'PASS {path}:{name}')
                      except Exception as exc:
                          failures.append((path, name, exc))
                          print(f'FAIL {path}:{name}: {exc!r}')
          if failures:
              raise SystemExit(f'{len(failures)} focused contract tests failed')
          print(f'FOCUSED_CONTRACT_TESTS_PASSED={ran}')
          PY
          git diff --check

      - name: Commit bounded repair and remove one-shot helper
        run: |
          git config user.name "WOW Engineering Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/patch_v17_post_deploy_orchestration_1087.py
          git rm .github/workflows/wow-v17-one-shot-post-deploy-orchestration-patch.yml
          git add \
            .github/workflows/wow-v17-spread-certification-replay.yml \
            .github/workflows/wow-v17-priority-prop-lifecycle.yml \
            .github/workflows/wow-v17-spread-forward-production-canary.yml \
            .github/workflows/wow-v17-post-deploy-verification-orchestrator.yml \
            artifacts/wow-engine/tests/test_v17_post_deploy_canary_gate.py \
            artifacts/wow-engine/v17/test_priority_prop_lifecycle_workflow.py
          git commit -m "Apply workflow-level post-deploy orchestration (#1108)"
          git push origin HEAD:engineering/v17-post-deploy-orchestrator-1087

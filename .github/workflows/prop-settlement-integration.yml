name: Prop Settlement Integration

on:
  push:
    branches:
      - chatgpt/prop-settlement-audit-20260830
    paths:
      - '.github/workflows/prop-settlement-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/prop-settlement-audit-20260830
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install backend dependencies
        working-directory: artifacts/wow-engine
        run: pip install -r requirements.txt

      - name: Apply guarded settlement integration
        working-directory: artifacts/wow-engine
        run: python scripts/apply_prop_settlement_integration_once.py

      - name: Compile runtime modules
        working-directory: artifacts/wow-engine
        run: python -m py_compile api_prod_market.py api_prod_market_acceptance.py prop_settlement.py prop_market_audit.py

      - name: Run focused settlement and prop regressions
        working-directory: artifacts/wow-engine
        run: |
          python -m pytest -q \
            test_prop_settlement.py \
            test_prop_market_audit.py \
            test_prop_live_model_acceptance.py \
            test_prop_terminal_reducer_v2.py \
            test_pick_request_runtime.py

      - name: Commit production wiring
        run: |
          if git diff --quiet; then
            echo "No integration diff produced"
            exit 1
          fi
          git config user.name "WOW CI Integration"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/wow-engine/api_prod_market.py \
                  artifacts/wow-engine/api_prod_market_acceptance.py
          git commit -m "feat: wire exact prop settlement and market audit"
          git push origin HEAD:chatgpt/prop-settlement-audit-20260830

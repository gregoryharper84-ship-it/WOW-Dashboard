name: wow-v17-canonical-prop-action

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: Repository-relative governed prop request JSON; use a current pregame slate unless explicitly replaying history
        required: true
        type: string
      allow_historical_request:
        description: Explicitly allow a historical/stale request for reproduction only; never counts as current-slate/live-host proof
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-canonical-prop-action.yml"
      - "artifacts/wow-engine/v17/canonical_prop_action_runner.py"
      - "artifacts/wow-engine/v17/mlb_1ip_direction_neutrality.py"
      - "artifacts/wow-engine/test_v17_mlb_1ip_direction_neutrality.py"
      - "artifacts/wow-engine/WOW_V17_CUSTOM_GPT_INSTRUCTIONS.txt"
      - "artifacts/wow-engine/v17/prop_action_requests/**"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-canonical-prop-action.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
      - "artifacts/wow-engine/v17/canonical_prop_action_runner.py"
      - "artifacts/wow-engine/v17/mlb_1ip_direction_neutrality.py"
      - "artifacts/wow-engine/test_v17_mlb_1ip_direction_neutrality.py"
      - "artifacts/wow-engine/WOW_V17_CUSTOM_GPT_INSTRUCTIONS.txt"
      - "artifacts/wow-engine/v17/prop_action_requests/**"

permissions:
  contents: read

concurrency:
  group: wow-v17-canonical-prop-action-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify canonical prop OIDC + 1IP direction-neutral contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run focused regressions
        run: python -m pytest -q test_v17_github_oidc.py test_v17_mlb_1ip_direction_neutrality.py tests/test_v17_live_editor_compat.py tests/test_v17_canonical_prop_workflow_contract.py test_v17_action_invocation_telemetry.py test_v17_interactive_latency_telemetry.py
      - name: Compile canonical prop runner
        run: python -m py_compile v17/canonical_prop_action_runner.py v17/mlb_1ip_direction_neutrality.py v17/action_invocation_telemetry.py

  canonical-prop-action:
    name: Run canonical V17 prop Action
    # Deliberately manual-only. Push/PR verifies the contract but does not create
    # synthetic production traffic from a fixture. A current-slate Action proof
    # must be explicitly dispatched with its exact request file.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_REQUEST_FILE: ${{ inputs.request_file }}
      WOW_ALLOW_HISTORICAL_REQUEST: ${{ inputs.allow_historical_request }}
      WOW_SLATE_TIMEZONE: America/New_York
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Assert fail-closed governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -n "$WOW_REQUEST_FILE"
          test -f "$WOW_REQUEST_FILE"

      - name: Reject stale request unless explicitly historical
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path(os.environ["WOW_REQUEST_FILE"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          slate_date = str(payload.get("slate_date") or "").strip()
          timezone_name = os.environ.get("WOW_SLATE_TIMEZONE", "America/New_York")
          today = datetime.now(ZoneInfo(timezone_name)).date().isoformat()
          historical = str(os.environ.get("WOW_ALLOW_HISTORICAL_REQUEST", "false")).strip().lower() == "true"
          if slate_date != today and not historical:
              raise SystemExit(
                  f"STALE_CANONICAL_PROP_REQUEST_BLOCKED slate_date={slate_date!r} current_slate={today!r} "
                  "set allow_historical_request=true only for an explicitly historical reproduction"
              )
          classification = "HISTORICAL_REPRODUCTION" if slate_date != today else "CURRENT_SLATE_CANARY"
          print(f"CANONICAL_PROP_REQUEST_CLASSIFICATION={classification} slate_date={slate_date} current_slate={today}")
          PY

      - name: Resolve exact events and invoke canonical score-pick-request
        run: python artifacts/wow-engine/v17/canonical_prop_action_runner.py

      - name: Upload governed prop Action result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-canonical-prop-action-result
          path: v17_canonical_prop_action_result.json
          if-no-files-found: warn
          retention-days: 7

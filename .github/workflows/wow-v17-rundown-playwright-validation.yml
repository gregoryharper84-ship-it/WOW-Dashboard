name: wow-v17-rundown-playwright-validation

on:
  push:
    branches:
      - chatgpt/v17-rundown-playwright
    paths:
      - ".github/workflows/wow-v17-rundown-playwright-validation.yml"
      - "artifacts/wow-engine/requirements.txt"
      - "artifacts/wow-engine/v17/rundown_playwright_capture.py"
      - "artifacts/wow-engine/v17/rundown_route_probe.py"
      - "artifacts/wow-engine/v17/nightly_multiscout_rundown_primary.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-board-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      WOW_RUNDOWN_BOARD_URL: "https://therundown.io/odds/"
      WOW_RUNDOWN_LOGIN_URL: "https://auth.therundown.io/login/"
      RUNDOWN_EMAIL: ${{ secrets.RUNDOWN_EMAIL }}
      RUNDOWN_PASSWORD: ${{ secrets.RUNDOWN_PASSWORD }}
      RUNDOWN_STORAGE_STATE_B64: ${{ secrets.RUNDOWN_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify TheRundown login form contract without submitting credentials
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              page = browser.new_page()
              response = page.goto('https://auth.therundown.io/login/', wait_until='domcontentloaded', timeout=45000)
              assert response is not None and response.status == 200
              assert page.locator('input[type="email"], input[name="email"]').count() > 0
              assert page.locator('input[type="password"], input[name="password"]').count() > 0
              assert page.locator('button[type="submit"], button:has-text("Sign In")').count() > 0
              print('RUNDOWN_LOGIN_FORM_CONTRACT=OK')
              browser.close()
          PY

      - name: Prove public sport/date routes are marketing only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rundown-playwright"
          python v17/rundown_route_probe.py \
            --output "$RUNNER_TEMP/rundown-playwright/route-probe.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'rundown-playwright' / 'route-probe.json'
          data = json.loads(p.read_text())
          assert data['can_execute'] is False
          assert data['prediction_authority'] is False
          summary = []
          for r in data['routes']:
              network = []
              for n in r.get('network') or []:
                  key = (n.get('host'), n.get('url'), n.get('resource_type'), n.get('status'), tuple(n.get('top_level_keys') or ()))
                  if key not in network:
                      network.append(key)
              summary.append({
                  'sport': r['sport'],
                  'status': r.get('http_status'),
                  'real_rows': r.get('real_board_row_count'),
                  'preview_rows': r.get('marketing_preview_row_count'),
                  'sign_in_form': r.get('sign_in_form'),
                  'network': network[:20],
              })
          print('PUBLIC_ROUTE_BOUNDARY=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Exercise authenticated board collector
        shell: bash
        run: |
          set +e
          python v17/rundown_playwright_capture.py \
            --output "$RUNNER_TEMP/rundown-playwright/board-capture.json"
          rc=$?
          set -e
          export COLLECTOR_RC="$rc"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'rundown-playwright' / 'board-capture.json'
          data = json.loads(p.read_text())
          rc = int(os.environ['COLLECTOR_RC'])
          assert data['can_execute'] is False
          assert data['prediction_authority'] is False
          assert data['research_ceiling'] == 'RESEARCH_INTEREST'
          assert data['coverage']['marketing_rows_accepted'] == 0
          configured = bool(os.environ.get('RUNDOWN_EMAIL')) and bool(os.environ.get('RUNDOWN_PASSWORD'))
          if configured or os.environ.get('RUNDOWN_STORAGE_STATE_B64'):
              assert rc == 0, (data['status'], data['reason_code'], data['auth_status'], data['board_surface'])
              assert data['status'] == 'DISCOVERY_COMPLETE'
              assert data['board_surface'] == 'AUTHENTICATED_ODDS_APP'
              assert data['coverage']['rows_captured'] > 0
              print('RUNDOWN_AUTHENTICATED_CAPTURE=PASS')
          else:
              assert rc != 0
              assert data['status'] == 'DISCOVERY_BLOCKED'
              assert data['reason_code'] == 'RUNDOWN_AUTH_CREDENTIALS_UNCONFIGURED'
              print('RUNDOWN_AUTHENTICATED_CAPTURE=BLOCKED_EXPECTED_SECRETS_UNCONFIGURED')
          print(json.dumps({
              'status': data['status'],
              'reason_code': data['reason_code'],
              'auth_status': data['auth_status'],
              'board_surface': data['board_surface'],
              'coverage': data['coverage'],
              'sports_with_rows': data['sports_with_rows'],
              'network_shapes': data['network_json_shapes'][:20],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload sanitized rendered-board diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-rundown-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rundown-playwright
          if-no-files-found: warn
          retention-days: 14

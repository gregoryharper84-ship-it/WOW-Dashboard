name: wow-v17-rundown-playwright-validation

on:
  push:
    branches:
      - chatgpt/v17-rundown-playwright
    paths:
      - ".github/workflows/wow-v17-rundown-playwright-validation.yml"
      - "artifacts/wow-engine/requirements.txt"
      - "artifacts/wow-engine/v17/rundown_playwright_capture.py"
      - "artifacts/wow-engine/v17/rundown_route_probe.py"
      - "artifacts/wow-engine/v17/nightly_multiscout_rundown_primary.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-board-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      WOW_RUNDOWN_BOARD_URL: "https://therundown.io/odds/"
      RUNDOWN_EMAIL: ${{ secrets.RUNDOWN_EMAIL }}
      RUNDOWN_PASSWORD: ${{ secrets.RUNDOWN_PASSWORD }}
      RUNDOWN_STORAGE_STATE_B64: ${{ secrets.RUNDOWN_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Probe public sport/date routes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rundown-playwright"
          python v17/rundown_route_probe.py \
            --output "$RUNNER_TEMP/rundown-playwright/route-probe.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'rundown-playwright' / 'route-probe.json'
          data = json.loads(p.read_text())
          assert data['can_execute'] is False
          assert data['prediction_authority'] is False
          summary = []
          for r in data['routes']:
              network = []
              for n in r.get('network') or []:
                  key = (n.get('host'), n.get('url'), n.get('resource_type'), n.get('status'), tuple(n.get('top_level_keys') or ()))
                  if key not in network:
                      network.append(key)
              summary.append({
                  'sport': r['sport'],
                  'status': r.get('http_status'),
                  'real_rows': r.get('real_board_row_count'),
                  'preview_rows': r.get('marketing_preview_row_count'),
                  'sign_in_form': r.get('sign_in_form'),
                  'iframes': r.get('iframes'),
                  'network': network[:30],
                  'dom_candidates': (r.get('dom_candidates') or [])[:10],
                  'body_text_sample': (r.get('body_text_sample') or '')[:1200],
              })
          print('ROUTE_DIAGNOSTIC=' + json.dumps(summary, sort_keys=True))
          PY
      - name: Capture rendered TheRundown root board
        shell: bash
        run: |
          set +e
          python v17/rundown_playwright_capture.py \
            --output "$RUNNER_TEMP/rundown-playwright/board-capture.json"
          rc=$?
          set -e
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'rundown-playwright' / 'board-capture.json'
          data = json.loads(p.read_text())
          assert data['can_execute'] is False
          assert data['prediction_authority'] is False
          assert data['research_ceiling'] == 'RESEARCH_INTEREST'
          print(json.dumps({
              'status': data['status'],
              'reason_code': data['reason_code'],
              'auth_status': data['auth_status'],
              'coverage': data['coverage'],
              'sports_with_rows': data['sports_with_rows'],
              'network_shapes': data['network_json_shapes'][:20],
          }, indent=2, sort_keys=True))
          PY
          exit "$rc"
      - name: Upload sanitized rendered-board diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-rundown-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rundown-playwright
          if-no-files-found: warn
          retention-days: 14

name: wow-v17-model-improvement-experiment

on:
  workflow_dispatch:
    inputs:
      repair_pr:
        description: Optional governed model-experiment PR number to repair after failed CI
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: wow-v17-model-improvement-experiment
  cancel-in-progress: false

jobs:
  challenger-experiment:
    name: Build and validate one non-serving model challenger experiment
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve experiment mode
        id: mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_PR: ${{ inputs.repair_pr }}
        run: |
          set -euo pipefail
          if [ -z "${REPAIR_PR:-}" ]; then
            echo "mode=new" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${REPAIR_PR}")
          state=$(jq -r '.state' <<<"$pr")
          base=$(jq -r '.base.ref' <<<"$pr")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          branch=$(jq -r '.head.ref' <<<"$pr")
          body=$(jq -r '.body // ""' <<<"$pr")
          if [ "$state" != "open" ] || [ "$base" != "main" ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::repair_pr is not an open same-repository experiment PR against main."
            exit 1
          fi
          if ! grep -Fq 'Model-Experiment-Autonomous: true' <<<"$body" || \
             ! grep -Fq 'Production-Behavior-Change: false' <<<"$body"; then
            echo "::error::repair_pr is missing governed experiment markers."
            exit 1
          fi
          mapfile -t files < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${REPAIR_PR}/files?per_page=100" --jq '.[].filename')
          for file in "${files[@]}"; do
            case "$file" in
              artifacts/wow-engine/v17/experiments/*) ;;
              *) echo "::error::Existing experiment PR escaped non-serving boundary: $file"; exit 1 ;;
            esac
          done
          git fetch origin "$branch"
          git switch "$branch"
          echo "mode=repair" >> "$GITHUB_OUTPUT"
          echo "pr_number=$REPAIR_PR" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r artifacts/wow-engine/requirements.txt
          pip install PyYAML openapi-spec-validator

      - name: Reliability preemption gate
        id: gate
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "repair" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo '{"frontier_allowed":true,"reason":"repair existing governed experiment only"}' > "$RUNNER_TEMP/model-improvement-gate.json"
          else
            python artifacts/wow-engine/v17/engineering_agent_team.py frontier-gate \
              | tee "$RUNNER_TEMP/model-improvement-gate.json"
            echo "allowed=$(jq -r '.frontier_allowed' "$RUNNER_TEMP/model-improvement-gate.json")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build or repair one governed challenger experiment
        id: experiment_agent
        if: steps.gate.outputs.allowed == 'true'
        uses: ./.github/actions/wow-chatgpt-agent
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          permission_profile: ":workspace"
          prompt: |
            You are the WOW V17 MODEL_IMPROVEMENT_EXPERIMENT_AGENT running on OpenAI/ChatGPT tooling only.

            Mode: ${{ steps.mode.outputs.mode }}
            Repair PR: ${{ steps.mode.outputs.pr_number }}

            Goal: perform actual evidence-backed model-improvement work, not a narrative status report.
            You may create or edit files ONLY below:
              artifacts/wow-engine/v17/experiments/

            In NEW mode: read current season-readiness evidence, calibration/challenger artifacts,
            recent model-quality postmortems, and existing tests. Select exactly ONE highest-value
            model weakness that can be investigated safely with repository data now. Create a
            self-contained non-serving experiment package with README.md, executable replay/experiment
            code, deterministic pytest tests, and result.json when current repository data supports replay.

            In REPAIR mode: do not start a new hypothesis. Inspect the existing experiment PR diff,
            reproduce its failing tests/checks locally, and make the smallest experiment-only fix that
            gets that same experiment back to green. If the failure cannot be reproduced, strengthen the
            experiment test/evidence package only when justified by concrete evidence; never weaken a test
            merely to make CI pass.

            For Class C ideas, this is CHALLENGER/EXPERIMENT ONLY. Never modify a production model,
            calibration artifact, coefficient, lower-bound rule, qualification threshold, router,
            registry, serving adapter, or runtime configuration. Never use sportsbook implied probability,
            recent outcomes alone, external projections, or generic LLM judgment as a substitute probability.
            Preserve `can_execute=false`, dry-run-only, exact typed failures, and V17_TERMINAL_REDUCER.

            Run the narrowest experiment/tests before finishing. If evidence disproves the hypothesis,
            preserve that negative result; do not manufacture an improvement.
          output_schema: '{"type":"object","properties":{"changed":{"type":"boolean"},"experiment_id":{"type":"string"},"sport":{"type":"string"},"model_lane":{"type":"string"},"hypothesis":{"type":"string"},"replay_status":{"type":"string"},"result":{"type":"string"},"recommendation":{"type":"string"},"production_change":{"type":"boolean"}},"required":["changed","experiment_id","sport","model_lane","hypothesis","replay_status","result","recommendation","production_change"],"additionalProperties":false}'

      - name: Enforce experiment-only diff boundary
        id: scope
        if: steps.gate.outputs.allowed == 'true' && steps.experiment_agent.outcome == 'success'
        shell: bash
        env:
          RESULT: ${{ steps.experiment_agent.outputs.structured_output }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          changed=$(jq -r '.changed' <<<"$RESULT")
          production_change=$(jq -r '.production_change' <<<"$RESULT")
          if [ "$production_change" != "false" ]; then
            echo "::error::Model-improvement agent attempted production-change authority."
            exit 1
          fi
          if [ "$changed" != "true" ]; then
            if [ "$MODE" = "repair" ]; then
              echo "::error::Experiment repair run produced no corrective change."
              exit 1
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t files < <(git status --porcelain=v1 | sed -E 's/^.. //')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Agent reported changed=true but produced no working-tree changes."
            exit 1
          fi
          for file in "${files[@]}"; do
            case "$file" in
              artifacts/wow-engine/v17/experiments/*) ;;
              *)
                echo "::error::Experiment escaped non-serving boundary: $file"
                exit 1
                ;;
            esac
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${files[@]}" | tee "$RUNNER_TEMP/model-experiment-files.txt"

      - name: Run experiment tests
        if: steps.scope.outputs.changed == 'true'
        run: python -m pytest -q artifacts/wow-engine/v17/experiments

      - name: Run adjacent WOW regression
        if: steps.scope.outputs.changed == 'true'
        run: python -m pytest -q artifacts/wow-engine

      - name: Commit experiment changes
        id: commit
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.experiment_agent.outputs.structured_output }}
          MODE: ${{ steps.mode.outputs.mode }}
          EXISTING_BRANCH: ${{ steps.mode.outputs.branch }}
        run: |
          set -euo pipefail
          experiment_id=$(jq -r '.experiment_id' <<<"$RESULT")
          if [ "$MODE" = "repair" ]; then
            branch="$EXISTING_BRANCH"
          else
            branch="chatgpt/model-improvement/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/wow-engine/v17/experiments
          git commit -m "Model experiment: ${experiment_id}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "experiment_id=$experiment_id" >> "$GITHUB_OUTPUT"

      - name: Open governed experiment PR and enable auto-merge
        if: steps.scope.outputs.changed == 'true' && steps.mode.outputs.mode == 'new'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          EXPERIMENT_ID: ${{ steps.commit.outputs.experiment_id }}
          RESULT: ${{ steps.experiment_agent.outputs.structured_output }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/model-experiment-pr.md"
          {
            echo "## WOW V17 governed model-improvement experiment"
            echo
            echo "Experiment: \`$EXPERIMENT_ID\`"
            echo
            echo '```json'
            echo "$RESULT"
            echo '```'
            echo
            echo "### Governance"
            echo "- Model-Experiment-Autonomous: true"
            echo "- Production-Behavior-Change: false"
            echo "- Class-C-Promotion: false"
            echo "- Changed files are mechanically restricted to \`artifacts/wow-engine/v17/experiments/**\`."
            echo "- Production champions remain unchanged until governed replay/holdout evidence earns separate promotion review."
            echo "- can_execute=false"
          } > "$body"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Model experiment: $EXPERIMENT_ID" --body-file "$body")
          pr_number=${pr_url##*/}
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --merge
          echo "Experiment PR #$pr_number created with auto-merge after protected checks." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore auto-merge after experiment repair
        if: steps.scope.outputs.changed == 'true' && steps.mode.outputs.mode == 'repair'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.mode.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge
          echo "Repaired experiment PR #$PR_NUMBER pushed and returned to protected CI/auto-merge." >> "$GITHUB_STEP_SUMMARY"

      - name: Record experiment receipt
        if: always()
        env:
          RESULT: ${{ steps.experiment_agent.outputs.structured_output }}
        run: |
          {
            echo "# WOW V17 Model Improvement Experiment"
            echo "- mode: ${{ steps.mode.outputs.mode || 'unknown' }}"
            echo "- repair_pr: ${{ steps.mode.outputs.pr_number || 'NONE' }}"
            echo "- reliability_gate: ${{ steps.gate.outputs.allowed || 'false' }}"
            echo "- changed: ${{ steps.scope.outputs.changed || 'false' }}"
            echo "- provider: OpenAI/ChatGPT"
            echo "- experiment_status: EXPERIMENT_CREATED when a guarded branch/PR is emitted"
            if [ -n "${RESULT:-}" ]; then
              echo '```json'
              echo "$RESULT"
              echo '```'
            fi
            echo "- production_change: false"
            echo "- can_execute: false"
          } >> "$GITHUB_STEP_SUMMARY"

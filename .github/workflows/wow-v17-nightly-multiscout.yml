name: wow-v17-nightly-multiscout

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/wow-v17-nightly-multiscout.yml"
      - "artifacts/wow-engine/v17/nightly_multiscout.py"
      - "artifacts/wow-engine/test_v17_nightly_multiscout.py"
      - "artifacts/wow-odds-proxy/**"

permissions:
  contents: read

concurrency:
  group: wow-v17-nightly-multiscout
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Multi-Scout contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run Multi-Scout regression tests
        run: python -m pytest -q test_v17_nightly_multiscout.py
      - name: Verify odds proxy extension
        working-directory: artifacts/wow-odds-proxy
        run: |
          pip install -r requirements.txt
          pytest -q

  nightly-discovery:
    name: Nightly all-sport sportsbook discovery and model handoff
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_ODDS_PROXY_URL: https://wow-odds-proxy.onrender.com
      WOW_ODDS_PROXY_ACTION_KEY: ${{ secrets.WOW_ODDS_PROXY_ACTION_KEY }}
      WOW_SCOUT_REGIONS: us,us2,uk,eu,au
      WOW_SCOUT_HORIZON_HOURS: "36"
      WOW_SCOUT_REQUEST_DELAY_MS: "75"
      WOW_SCOUT_MARKET_CHUNK_SIZE: "10"
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert fail-closed execution governance
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
      - name: Run V17 Nightly Multi-Scout
        id: scout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wow-multiscout"
          set +e
          python v17/nightly_multiscout.py --output "$RUNNER_TEMP/wow-multiscout/model-handoff.json"
          rc=$?
          set -e
          echo "runner_exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -f "$RUNNER_TEMP/wow-multiscout/model-handoff.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "wow-multiscout" / "model-handoff.json"
          data = json.loads(p.read_text())
          assert data.get("can_execute", data.get("governance", {}).get("can_execute")) is False
          if data.get("status") == "DISCOVERY_COMPLETE":
              assert data["model_handoff_ready"] is True
              assert data["model_handoff"]["parallel_discovery_router_required"] is True
              assert data["governance"]["upset_alert_requires_governed_llp_probability"] is True
              print("nightly discovery handoff is model-router ready")
          else:
              print(f"nightly discovery blocked: {data.get('reason_code')}")
          PY
      - name: Write human-readable Scout summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "wow-multiscout"
          source = root / "model-handoff.json"
          out = root / "summary.md"
          if not source.exists():
              out.write_text("# WOW V17 Nightly Multi-Scout\n\nNo handoff artifact was produced.\n")
              raise SystemExit(0)
          data = json.loads(source.read_text())
          h = data.get("model_handoff", {})
          sports = sorted({r.get("sport") for r in data.get("coverage", []) if r.get("scope") == "sport" and r.get("status") == "SCANNED"})
          books = data.get("sportsbook_coverage", {}).get("bookmakers_seen", [])
          lines = [
              "# WOW V17 Nightly Multi-Scout",
              "",
              f"- Status: `{data.get('status')}`",
              f"- Generated: `{data.get('generated_at')}`",
              f"- Sports scanned: **{len(sports)}**",
              f"- Sportsbooks/bookmakers observed: **{len(books)}**",
              f"- Team/event handoff candidates: **{len(h.get('team_event_candidates', []))}**",
              f"- Prop evidence rows for handoff: **{len(h.get('prop_candidates', []))}**",
              "- NBA required: yes",
              "- NCAAMB required: yes",
              "- WNBA required: yes",
              "- Upset evaluation handoff: LLP only after governed probability",
              "- Game-script enumeration: enabled",
              "- Market/alternate-line Scout: enabled",
              "- Contrarian/Red-Team Scout: enabled",
              "- Parallel Discovery Router handoff: required",
              "- can_execute: false",
              "",
              "## Sports",
              *[f"- {s}" for s in sports],
              "",
              "## Sportsbooks observed",
              *[f"- {b}" for b in books],
          ]
          out.write_text("\n".join(lines) + "\n")
          PY
      - name: Upload governed model-handoff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-nightly-multiscout-model-handoff
          path: |
            ${{ runner.temp }}/wow-multiscout/model-handoff.json
            ${{ runner.temp }}/wow-multiscout/summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Fail nightly run if source acquisition was blocked
        if: steps.scout.outputs.runner_exit_code != '0'
        run: exit 1

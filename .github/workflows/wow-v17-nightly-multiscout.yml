name: wow-v17-nightly-multiscout

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-nightly-multiscout.yml"
      - "artifacts/wow-engine/requirements.txt"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/v17/nightly_multiscout.py"
      - "artifacts/wow-engine/v17/nightly_multiscout_oidc.py"
      - "artifacts/wow-engine/v17/github_actions_oidc_client.py"
      - "artifacts/wow-engine/v17/nightly_multiscout_delivery.py"
      - "artifacts/wow-engine/v17/multiscout_auto_advance.py"
      - "artifacts/wow-engine/v17/multiscout_auto_advance_oidc.py"
      - "artifacts/wow-engine/v17/sport_scout_registry.py"
      - "artifacts/wow-engine/v17/sport_scout_enrichment.py"
      - "artifacts/wow-engine/v17/scout_research_ledger.py"
      - "artifacts/wow-engine/pick_request_runtime.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/agent_runtime/coordinator_v17.py"
      - "artifacts/wow-engine/agent_runtime/durable_runner.py"
      - "artifacts/wow-odds-proxy/**"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-nightly-multiscout.yml"
      - "artifacts/wow-engine/requirements.txt"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/v17/nightly_multiscout.py"
      - "artifacts/wow-engine/v17/nightly_multiscout_oidc.py"
      - "artifacts/wow-engine/v17/github_actions_oidc_client.py"
      - "artifacts/wow-engine/v17/nightly_multiscout_delivery.py"
      - "artifacts/wow-engine/v17/multiscout_auto_advance.py"
      - "artifacts/wow-engine/v17/multiscout_auto_advance_oidc.py"
      - "artifacts/wow-engine/v17/sport_scout_registry.py"
      - "artifacts/wow-engine/v17/sport_scout_enrichment.py"
      - "artifacts/wow-engine/v17/scout_research_ledger.py"
      - "artifacts/wow-engine/pick_request_runtime.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/agent_runtime/coordinator_v17.py"
      - "artifacts/wow-engine/agent_runtime/durable_runner.py"
      - "artifacts/wow-engine/test_v17_nightly_multiscout.py"
      - "artifacts/wow-engine/test_v17_nightly_multiscout_delivery.py"
      - "artifacts/wow-engine/test_v17_multiscout_auto_advance.py"
      - "artifacts/wow-engine/test_agent_runtime_v17_model_failures.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
      - "artifacts/wow-engine/test_v17_multiscout_oidc_runtime.py"
      - "artifacts/wow-engine/tests/test_v17_sport_scout_teams.py"
      - "artifacts/wow-odds-proxy/**"

permissions:
  contents: read

concurrency:
  group: wow-v17-nightly-multiscout
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Multi-Scout contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run Multi-Scout, sport-team, OIDC, and typed-failure regression tests
        run: >-
          python -m pytest -q
          test_v17_nightly_multiscout.py
          test_v17_nightly_multiscout_delivery.py
          test_v17_multiscout_auto_advance.py
          test_agent_runtime_v17_model_failures.py
          test_v17_github_oidc.py
          test_v17_multiscout_oidc_runtime.py
          tests/test_v17_sport_scout_teams.py
      - name: Verify odds proxy extension
        working-directory: artifacts/wow-odds-proxy
        run: |
          pip install -r requirements.txt
          pytest -q

  nightly-discovery:
    name: Nightly all-sport discovery and governed specialist handoff
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_ODDS_PROXY_URL: https://wow-odds-proxy.onrender.com
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_USER_TIMEZONE: America/Chicago
      WOW_SCOUT_REGIONS: us,us2,uk,eu,au
      WOW_SCOUT_HORIZON_HOURS: "36"
      WOW_SCOUT_REQUEST_DELAY_MS: "75"
      WOW_SCOUT_MARKET_CHUNK_SIZE: "10"
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install live Scout runtime dependencies
        run: pip install -r requirements.txt
      - name: Assert fail-closed execution governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Run V17 Nightly Multi-Scout
        id: scout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wow-multiscout"
          set +e
          python v17/nightly_multiscout_oidc.py --output "$RUNNER_TEMP/wow-multiscout/model-handoff.json"
          rc=$?
          set -e
          echo "runner_exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -f "$RUNNER_TEMP/wow-multiscout/model-handoff.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "wow-multiscout" / "model-handoff.json"
          data = json.loads(p.read_text())
          assert data.get("can_execute", data.get("governance", {}).get("can_execute")) is False
          if data.get("status") == "DISCOVERY_COMPLETE":
              assert data["model_handoff_ready"] is True
              assert data["model_handoff"]["parallel_discovery_router_required"] is True
              assert data["governance"]["upset_alert_requires_governed_llp_probability"] is True
              print("nightly discovery handoff is model-router ready")
          else:
              print(f"nightly discovery blocked: {data.get('reason_code')}")
          PY
      - name: Enrich handoff with sport-specialist Scout teams
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/wow-multiscout/model-handoff.json"
          python v17/sport_scout_enrichment.py \
            --input "$RUNNER_TEMP/wow-multiscout/model-handoff.json" \
            --output "$RUNNER_TEMP/wow-multiscout/model-handoff-enriched.json"
          mv "$RUNNER_TEMP/wow-multiscout/model-handoff-enriched.json" "$RUNNER_TEMP/wow-multiscout/model-handoff.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "wow-multiscout" / "model-handoff.json"
          data = json.loads(p.read_text())
          assert data.get("can_execute") is False
          assert data.get("sport_scout_registry", {}).get("can_execute") is False
          for lane in ("team_event_candidates", "prop_candidates"):
              for row in data.get("model_handoff", {}).get(lane, []):
                  assert row.get("research_ceiling") == "RESEARCH_INTEREST"
                  assert row.get("probability_authority") is False
                  assert row.get("can_execute") is False
                  assert row.get("controlling_specialist_route") in {"LLP_TEAM_BETTING_ENGINE", "WOW_PROP_LANE"}
          PY
      - name: Stamp recoverable Scout run identity and manifest
        id: delivery
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/wow-multiscout/model-handoff.json"
          run_id="wow-scout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_name="wow-v17-multiscout-${run_id}"
          python v17/nightly_multiscout_delivery.py \
            --input "$RUNNER_TEMP/wow-multiscout/model-handoff.json" \
            --output-dir "$RUNNER_TEMP/wow-multiscout" \
            --run-id "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload early Scout discovery recovery artifact
        if: always() && steps.delivery.outputs.artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.delivery.outputs.artifact_name }}-discovery
          path: |
            ${{ runner.temp }}/wow-multiscout/model-handoff.json
            ${{ runner.temp }}/wow-multiscout/model-handoff-${{ steps.delivery.outputs.run_id }}.json
            ${{ runner.temp }}/wow-multiscout/run-manifest.json
            ${{ runner.temp }}/wow-multiscout/latest-pointer.json
          if-no-files-found: error
          retention-days: 90
      - name: Auto-advance Scout candidates into governed specialist routes
        id: advance
        if: steps.scout.outputs.runner_exit_code == '0'
        shell: bash
        run: |
          set +e
          python v17/multiscout_auto_advance_oidc.py \
            --input "$RUNNER_TEMP/wow-multiscout/model-handoff.json" \
            --output "$RUNNER_TEMP/wow-multiscout/auto-advance-receipt.json"
          rc=$?
          set -e
          echo "runner_exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -f "$RUNNER_TEMP/wow-multiscout/auto-advance-receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "wow-multiscout"
          handoff = json.loads((root / "model-handoff.json").read_text())
          receipt = json.loads((root / "auto-advance-receipt.json").read_text())
          assert receipt.get("can_execute") is False
          assert receipt.get("source_run_id") == handoff.get("run_id")
          assert receipt.get("research_run_id") == handoff.get("research_run_id")
          status = str(receipt.get("status") or "")
          assert status in {
              "AUTO_ADVANCE_COMPLETE",
              "AUTO_ADVANCE_COMPLETE_WITH_BLOCKERS",
              "BLOCKED_BACKEND_HANDOFF",
              "BLOCKED_RECONCILIATION",
              "BLOCKED_INVALID_SCOUT_HANDOFF",
          }
          print(f"governed auto-advance status={status} code={receipt.get('code')}")
          PY
      - name: Write human-readable Scout summary
        if: always()
        shell: bash
        env:
          SCOUT_RUN_ID: ${{ steps.delivery.outputs.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "wow-multiscout"
          source = root / "model-handoff.json"
          receipt_path = root / "auto-advance-receipt.json"
          out = root / "summary.md"
          if not source.exists():
              out.write_text("# WOW V17 Nightly Multi-Scout\n\nNo handoff artifact was produced.\n")
              raise SystemExit(0)
          data = json.loads(source.read_text())
          receipt = json.loads(receipt_path.read_text()) if receipt_path.exists() else {}
          h = data.get("model_handoff", {})
          sports = sorted({r.get("sport") for r in data.get("coverage", []) if r.get("scope") == "sport" and r.get("status") == "SCANNED"})
          books = data.get("sportsbook_coverage", {}).get("bookmakers_seen", [])
          delivery = data.get("delivery", {})
          recon = data.get("reconciliation", {})
          advance_recon = receipt.get("reconciliation", {})
          mapping = receipt.get("mapping", {})
          scout_team_ids = sorted({r.get("scout_team_id") for lane in ("team_event_candidates", "prop_candidates") for r in h.get(lane, []) if r.get("scout_team_id")})
          lines = [
              "# WOW V17 Nightly Multi-Scout",
              "",
              f"- Run ID: `{data.get('run_id')}`",
              f"- Research run ID: `{data.get('research_run_id')}`",
              f"- Scout status: `{data.get('status')}`",
              f"- Governed auto-advance status: `{receipt.get('status') or 'NOT_RUN'}`",
              f"- Governed auto-advance code: `{receipt.get('code') or 'NOT_RUN'}`",
              f"- Generated: `{data.get('generated_at')}`",
              f"- GitHub run: {delivery.get('github_run_url') or 'unavailable'}",
              f"- Recoverable artifact: `{delivery.get('artifact_name')}`",
              f"- Retention: **{delivery.get('retention_days', 90)} days**",
              f"- Sports scanned: **{len(sports)}**",
              f"- Sport-specialist Scout teams active: **{len(scout_team_ids)}**",
              f"- Sportsbooks/bookmakers observed: **{len(books)}**",
              f"- Team/event Scout candidates: **{len(h.get('team_event_candidates', []))}**",
              f"- Prop Scout evidence rows: **{len(h.get('prop_candidates', []))}**",
              f"- Reconciled Scout candidate rows: **{recon.get('candidate_rows_total', 0)}**",
              f"- Mapped prop rows sent to governed prop lane: **{mapping.get('mapped_prop_rows', 0)}**",
              f"- Duplicate prop observations collapsed: **{mapping.get('duplicate_prop_rows', 0)}**",
              f"- Prop mapping rejects: **{len(mapping.get('rejected_prop_rows', []))}**",
              f"- Team/event objective rows sent to LLP lane: **{mapping.get('downstream_team_objective_rows', 0)}**",
              f"- Team/event mapping rejects: **{len(mapping.get('rejected_team_event_rows', []))}**",
              f"- Downstream completed rows: **{advance_recon.get('completed_downstream_rows', 0)}**",
              f"- Downstream governed holds/rejects: **{advance_recon.get('blocked_downstream_rows', 0)}**",
              f"- Downstream reconciliation pass: **{advance_recon.get('response_reconciliation_pass', False)}**",
              "- Research ceiling: RESEARCH_INTEREST",
              "- Upset probability authority: LLP only",
              "- Scout/market probability authority: none",
              "- V17 Terminal Reducer remains terminal authority",
              "- can_execute: false",
              "",
              "## Sport-specialist Scout teams",
              *[f"- {s}" for s in scout_team_ids],
              "",
              "## Sports",
              *[f"- {s}" for s in sports],
              "",
              "## Sportsbooks observed",
              *[f"- {b}" for b in books],
          ]
          out.write_text("\n".join(lines) + "\n")
          PY
          cat "$RUNNER_TEMP/wow-multiscout/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload governed Scout and downstream receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.delivery.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/wow-multiscout/model-handoff.json
            ${{ runner.temp }}/wow-multiscout/model-handoff-${{ steps.delivery.outputs.run_id }}.json
            ${{ runner.temp }}/wow-multiscout/run-manifest.json
            ${{ runner.temp }}/wow-multiscout/latest-pointer.json
            ${{ runner.temp }}/wow-multiscout/auto-advance-receipt.json
            ${{ runner.temp }}/wow-multiscout/summary.md
          if-no-files-found: warn
          retention-days: 90
      - name: Fail nightly run if source acquisition was blocked
        if: steps.scout.outputs.runner_exit_code != '0'
        run: exit 1
      - name: Fail nightly run if governed auto-advance infrastructure was blocked
        if: steps.scout.outputs.runner_exit_code == '0' && steps.advance.outputs.runner_exit_code != '0'
        run: exit 1

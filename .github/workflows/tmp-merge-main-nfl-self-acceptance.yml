name: tmp-merge-main-nfl-self-acceptance
on:
  push:
    branches: [fix/v17-nfl-prop-render-self-acceptance-20260920]
    paths: [.github/workflows/tmp-merge-main-nfl-self-acceptance.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v17-nfl-prop-render-self-acceptance-20260920
          fetch-depth: 0
      - name: Merge current main and self-delete
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/tmp-merge-main-nfl-self-acceptance.yml
          git add .github/workflows/tmp-merge-main-nfl-self-acceptance.yml
          git commit -m 'chore: remove temporary branch sync workflow'
          git push origin HEAD:fix/v17-nfl-prop-render-self-acceptance-20260920

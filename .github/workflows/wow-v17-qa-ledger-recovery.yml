name: wow-v17-qa-ledger-recovery
# Governed recovery for orphaned QA content-ledger reservations (P0 #2136).
# Manual dispatch ONLY, from protected main, in the wow-qa environment.
# Defaults to dry-run; a mutation requires dry_run=false and completes the
# stale reservation as HOLD or REJECT -- never PASS, never a deletion.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Exact 64-char content-ledger digest of the stale reservation
        required: true
        type: string
      reservation_id:
        description: Exact QA App check-run ID of the in_progress reservation
        required: true
        type: string
      pr_number:
        description: Original PR number that created the reservation
        required: true
        type: string
      head_sha:
        description: Original exact 40-char PR head SHA
        required: true
        type: string
      base_sha:
        description: Original exact 40-char base SHA
        required: true
        type: string
      original_run_id:
        description: Workflow run ID that created the reservation
        required: true
        type: string
      provider_decision:
        description: Operator-established provider decision evidence
        required: true
        type: choice
        options:
          - NONE_RECEIVED
          - PROVIDER_UNAVAILABLE
          - REJECT_CONFIRMED
      reviewer_identity:
        description: Required only for REJECT_CONFIRMED
        required: false
        type: choice
        options:
          - anthropic-claude-api
          - gemini-generative-api
          - none
      evidence_ref:
        description: Durable evidence reference (run/artifact/receipt identifier)
        required: true
        type: string
      dry_run:
        description: Plan only; perform no mutation
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  checks: read
concurrency:
  group: wow-independent-security-qa-ledger-writer
  cancel-in-progress: false
  queue: max
jobs:
  qa-ledger-recovery:
    name: Recover orphaned QA ledger reservation
    if: github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: wow-qa
    steps:
      - name: Checkout trusted protected main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate recovery code locally
        run: python -m unittest discover -s .github/scripts/tests -p 'test_wow_qa_ledger_recovery.py' -q
      - name: Mint separate QA App checks-only token
        id: qa
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.WOW_QA_APP_ID }}
          private-key: ${{ secrets.WOW_QA_APP_PRIVATE_KEY }}
          repositories: WOW-Dashboard
          permission-checks: write
      - name: Recover exact stale reservation
        env:
          GH_READ_TOKEN: ${{ github.token }}
          QA_APP_TOKEN: ${{ steps.qa.outputs.token }}
          RECOVERY_DIGEST: ${{ inputs.digest }}
          RECOVERY_RESERVATION_ID: ${{ inputs.reservation_id }}
          RECOVERY_PR_NUMBER: ${{ inputs.pr_number }}
          RECOVERY_HEAD_SHA: ${{ inputs.head_sha }}
          RECOVERY_BASE_SHA: ${{ inputs.base_sha }}
          RECOVERY_ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          RECOVERY_PROVIDER_DECISION: ${{ inputs.provider_decision }}
          RECOVERY_REVIEWER_IDENTITY: ${{ inputs.reviewer_identity == 'none' && '' || inputs.reviewer_identity }}
          RECOVERY_EVIDENCE_REF: ${{ inputs.evidence_ref }}
          RECOVERY_DRY_RUN: ${{ inputs.dry_run }}
        run: python .github/scripts/wow_qa_ledger_recovery.py
      - name: Retain traceable recovery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-qa-ledger-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: wow-qa-ledger-recovery-receipt.json
          if-no-files-found: ignore
          retention-days: 30

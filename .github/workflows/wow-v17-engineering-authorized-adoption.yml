# P0 #1845 — only the authenticated Engineering App may advance this existing PR.
# Inactive until a separately controlled repo variable authorizes the specific handoff.
# Not a substitute for CODEOWNER, Security, QA, Release, or workflow approvals.
name: wow-v17-engineering-authorized-adoption
on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  # Same lock as existing engineering implementation worker; no parallel writer.
  group: wow-v17-engineering-implementation-single-writer
  cancel-in-progress: false
jobs:
  adopt:
    if: >-
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      github.ref == 'refs/heads/main' &&
      vars.WOW_1834_ENGINEERING_ADOPTION_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wow-engineering
    env:
      PR_NUMBER: '1834'
      SOURCE_PR_NUMBER: '1846'
      EXPECTED_PR_HEAD_SHA: 'e80fc36753e9a7b2e3b6fc1843b5028f1248f9fe'
      EXPECTED_SOURCE_SHA: '58ee0f2763c276c61c1a178bc9a83404facdd63a'
      TARGET_BRANCH: copilot/gregoryharper84-ship-itwow-dashboard-1759-adopt-re
      WOW_CAN_EXECUTE: 'false'
      WOW_DRY_RUN_ONLY: 'true'
    steps:
      - name: Checkout protected-main adoption code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and target without writing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WOW_CAN_EXECUTE" = false
          test "$WOW_DRY_RUN_ONLY" = true
          decision=$(python artifacts/wow-engine/v17/engineering_authorized_adoption.py preflight \
            --repo "$GITHUB_REPOSITORY" \
            --target-pr "$PR_NUMBER" --source-pr "$SOURCE_PR_NUMBER" \
            --expected-target "$EXPECTED_PR_HEAD_SHA" \
            --expected-source "$EXPECTED_SOURCE_SHA" \
            --target-branch "$TARGET_BRANCH")
          case "$decision" in
            ADOPTABLE) echo 'preflight=ok' >> "$GITHUB_OUTPUT" ;;
            ALREADY_ADOPTED_NO_ACTION) echo 'preflight=done' >> "$GITHUB_OUTPUT" ;;
            *) echo "UNEXPECTED_ADOPTION_DECISION_HOLD:$decision"; exit 1 ;;
          esac
      - name: Mint ONLY Engineering App token (never QA or Release token)
        id: engineering
        if: steps.plan.outputs.preflight == 'ok'
        uses: ./.github/actions/wow-engineering-token
        with:
          app-id: ${{ vars.WOW_ENGINEERING_APP_ID }}
          app-private-key: ${{ secrets.WOW_ENGINEERING_APP_PRIVATE_KEY }}
      - name: Require verified Engineering App credentials
        if: steps.plan.outputs.preflight == 'ok'
        env:
          KEY_PRESENT: ${{ steps.engineering.outputs.key-present }}
          APP_TOKEN: ${{ steps.engineering.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$KEY_PRESENT" == true && -n "$APP_TOKEN" ]] || {
            echo 'ENGINEERING_APP_CREDENTIAL_MISSING_HOLD'; exit 1;
          }
      - name: Adopt with non-force fast-forward only; refuse any drift
        if: steps.plan.outputs.preflight == 'ok'
        env:
          GH_TOKEN: ${{ steps.engineering.outputs.token }}
          APP_TOKEN: ${{ steps.engineering.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # This environment is a separately authorized implementation identity;
          # source & target are never executed here. No force push, no merge.
          python artifacts/wow-engine/v17/engineering_authorized_adoption.py adopt \
            --repo "$GITHUB_REPOSITORY" \
            --target-pr "$PR_NUMBER" --source-pr "$SOURCE_PR_NUMBER" \
            --expected-target "$EXPECTED_PR_HEAD_SHA" \
            --expected-source "$EXPECTED_SOURCE_SHA" \
            --target-branch "$TARGET_BRANCH"
          echo 'ENGINEERING_ADOPTION_ONLY_NO_RELEASE_AUTHORIZATION'
          echo 'RELEASE_JOURNAL_PREFLIGHT_HOLD_NO_DEPLOY'
          echo 'can_execute=false'

name: wow-v17-nfl-atd-gamebook-evidence

on:
  pull_request:
    paths:
      - "artifacts/wow-engine/v17/nfl_atd_gamebook_evidence.py"
      - "artifacts/wow-engine/test_v17_nfl_atd_gamebook_evidence.py"
      - ".github/workflows/wow-v17-nfl-atd-gamebook-evidence.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/wow-engine/v17/nfl_atd_gamebook_evidence.py"
      - "artifacts/wow-engine/test_v17_nfl_atd_gamebook_evidence.py"
      - ".github/workflows/wow-v17-nfl-atd-gamebook-evidence.yml"

permissions:
  contents: read

jobs:
  evidence-regressions:
    name: NFL official gamebook evidence no-write regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install "pytest==8.4.2" "pypdf>=5.0"
      - name: Verify scorer identity, source boundaries and no execution
        run: python -m pytest --noconftest -q test_v17_nfl_atd_gamebook_evidence.py

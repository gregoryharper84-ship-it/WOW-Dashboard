name: wow-v17-trusted-governance-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged or open PR whose exact head should be rechecked
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: wow-v17-trusted-governance-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event.pull_request.head.sha || 'dispatch' }}
  cancel-in-progress: true

jobs:
  trusted-governance:
    name: Trusted exact-head engineering governance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout verifier from protected main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact PR identity
        id: pr
        shell: bash
        env:
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || '' }}
          INPUT_PR: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR:-${INPUT_PR:-}}"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || { echo "GOVERNANCE_PR_NUMBER_INVALID" >&2; exit 1; }
          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          head_sha=$(jq -r '.head.sha // ""' <<<"$pr_json")
          head_ref=$(jq -r '.head.ref // ""' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref // ""' <<<"$pr_json")
          base_repo=$(jq -r '.base.repo.full_name // ""' <<<"$pr_json")
          state=$(jq -r '.state // ""' <<<"$pr_json")
          merged=$(jq -r '.merged // false' <<<"$pr_json")
          merged_at=$(jq -r '.merged_at // ""' <<<"$pr_json")
          merge_sha=$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")
          [ "$base_ref" = "main" ] && [ "$base_repo" = "$GITHUB_REPOSITORY" ] && [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
            echo "GOVERNANCE_PR_IDENTITY_MOVED_OR_UNTRUSTED" >&2; exit 1;
          }
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]] && [ -n "$head_ref" ] || {
            echo "GOVERNANCE_PR_IDENTITY_MOVED_OR_UNTRUSTED" >&2; exit 1;
          }
          if [ -n "$EVENT_SHA" ] && [ "$EVENT_SHA" != "$head_sha" ]; then
            echo "GOVERNANCE_PR_IDENTITY_MOVED_OR_UNTRUSTED" >&2; exit 1;
          fi
          if [ "$state" = "open" ]; then
            [ "$merged" = "false" ] && [ -z "$merged_at" ] || {
              echo "GOVERNANCE_PR_IDENTITY_MOVED_OR_UNTRUSTED" >&2; exit 1;
            }
          elif [ "$state" = "closed" ] && [ "$merged" = "true" ] && [ -n "$merged_at" ]; then
            [[ "$merge_sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo "GOVERNANCE_PR_IDENTITY_MOVED_OR_UNTRUSTED" >&2; exit 1;
            }
            git merge-base --is-ancestor "$merge_sha" HEAD || {
              echo "GOVERNANCE_MERGE_COMMIT_NOT_ON_MAIN" >&2; exit 1;
            }
            git merge-base --is-ancestor "$head_sha" "$merge_sha" || {
              echo "GOVERNANCE_HEAD_NOT_IN_MERGE_COMMIT" >&2; exit 1;
            }
          else
            echo "GOVERNANCE_PR_IDENTITY_MOVED_OR_UNTRUSTED" >&2; exit 1;
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Resolve trusted exact-head governance artifact
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="wow-v17-engineering-governance-${PR_HEAD_SHA}"
          artifact_id=""
          run_id=""

          for _ in $(seq 1 180); do
            artifacts=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=20")
            artifact_id=$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .id // ""' <<<"$artifacts")
            run_id=$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .workflow_run.id // ""' <<<"$artifacts")
            if [ -n "$artifact_id" ] && [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$artifact_id" ] || [ -z "$run_id" ]; then
            echo "GOVERNANCE_RECEIPT_MISSING: no trusted artifact exists for exact PR head ${PR_HEAD_SHA}." >&2
            exit 1
          fi

          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify trusted workflow identity and completion
        id: workflow
        shell: bash
        env:
          RUN_ID: ${{ steps.artifact.outputs.run_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            run_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
            name=$(jq -r '.name // ""' <<<"$run_json")
            path=$(jq -r '.path // ""' <<<"$run_json")
            status=$(jq -r '.status // ""' <<<"$run_json")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run_json")
            event=$(jq -r '.event // ""' <<<"$run_json")
            head_branch=$(jq -r '.head_branch // ""' <<<"$run_json")
            head_repo=$(jq -r '.head_repository.full_name // ""' <<<"$run_json")

            case "$name|$path" in
              "wow-v17-chatgpt-engineering-worker|.github/workflows/wow-v17-chatgpt-engineering-worker.yml")
                case "$event" in
                  schedule|workflow_run|workflow_dispatch) ;;
                  *)
                    echo "GOVERNANCE_WORKFLOW_EVENT_MISMATCH: unexpected ChatGPT worker event $event" >&2
                    exit 1
                    ;;
                esac
                ;;
              "wow-v17-claude-engineering-worker|.github/workflows/wow-v17-claude-engineering-worker.yml")
                [ "$event" = "workflow_dispatch" ] || {
                  echo "GOVERNANCE_WORKFLOW_EVENT_MISMATCH: unexpected Claude worker event $event" >&2
                  exit 1
                }
                [ "$head_branch" = "main" ] || {
                  echo "GOVERNANCE_WORKFLOW_REF_MISMATCH: Claude worker must run from protected main, got $head_branch" >&2
                  exit 1
                }
                ;;
              "wow-v17-existing-pr-governance-review|.github/workflows/wow-v17-existing-pr-governance-review.yml")
                case "$event" in
                  pull_request_target) ;;
                  workflow_dispatch)
                    [ "$head_branch" = "main" ] || {
                      echo "GOVERNANCE_WORKFLOW_REF_MISMATCH: manual existing-PR certification must run from protected main, got $head_branch" >&2
                      exit 1
                    }
                    ;;
                  *)
                    echo "GOVERNANCE_WORKFLOW_EVENT_MISMATCH: unexpected existing-PR certification event $event" >&2
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "GOVERNANCE_WORKFLOW_IDENTITY_MISMATCH: untrusted workflow $name at $path" >&2
                exit 1
                ;;
            esac
            if [ "$name" = "wow-v17-chatgpt-engineering-worker" ]; then
              [ "$head_branch" = "main" ] || {
                echo "GOVERNANCE_WORKFLOW_REF_MISMATCH: ChatGPT worker must run from protected main, got $head_branch" >&2
                exit 1
              }
            fi
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
              echo "GOVERNANCE_WORKFLOW_REPOSITORY_MISMATCH: trusted worker came from $head_repo" >&2
              exit 1
            }

            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || {
                echo "GOVERNANCE_WORKFLOW_NOT_SUCCESSFUL: run ${RUN_ID} concluded $conclusion" >&2
                exit 1
              }
              echo "name=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          echo "GOVERNANCE_WORKFLOW_INCOMPLETE: trusted worker run ${RUN_ID} did not complete within the bounded gate window." >&2
          exit 1

      - name: Download and verify exact-head receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          RUN_ID: ${{ steps.artifact.outputs.run_id }}
          WORKFLOW_NAME: ${{ steps.workflow.outputs.name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/governance.zip"
          receipt="$RUNNER_TEMP/wow-engineering-governance-receipt.json"
          checksum="$RUNNER_TEMP/wow-engineering-governance-receipt.sha256"
          live_reviews="$RUNNER_TEMP/wow-live-reviews.json"

          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          jq -e --arg sha "$PR_HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.head.sha == $sha and .head.repo.full_name == $repo and
             .base.ref == "main" and .base.repo.full_name == $repo and (
               (.state == "open" and .merged_at == null and .merged != true) or
               (.state == "closed" and .merged == true and .merged_at != null and
                (.merge_commit_sha | type == "string" and test("^[a-f0-9]{40}$")))
             )' <<<"$pr_json" >/dev/null || {
              echo "GOVERNANCE_PR_IDENTITY_MOVED_OR_UNTRUSTED" >&2; exit 1;
            }
          if [ "$(jq -r '.merged' <<<"$pr_json")" = "true" ]; then
            merge_sha=$(jq -r '.merge_commit_sha' <<<"$pr_json")
            git merge-base --is-ancestor "$merge_sha" HEAD || {
              echo "GOVERNANCE_MERGE_COMMIT_NOT_ON_MAIN" >&2; exit 1;
            }
            git merge-base --is-ancestor "$PR_HEAD_SHA" "$merge_sha" || {
              echo "GOVERNANCE_HEAD_NOT_IN_MERGE_COMMIT" >&2; exit 1;
            }
          fi
          reviews='[]'
          for page in $(seq 1 10); do
            response=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100&page=${page}")
            count=$(jq 'length' <<<"$response")
            reviews=$(jq -cn --argjson old "$reviews" --argjson new "$response" '$old + $new')
            [ "$count" -lt 100 ] && break
            [ "$page" -lt 10 ] || { echo "GOVERNANCE_REVIEW_INVENTORY_LIMIT_EXCEEDED" >&2; exit 1; }
          done
          printf '%s\n' "$reviews" > "$live_reviews"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$zip_path"
          unzip -p "$zip_path" wow-engineering-governance-receipt.json > "$receipt"
          unzip -p "$zip_path" wow-engineering-governance-receipt.sha256 > "$checksum"

          expected=$(tr -d '[:space:]' < "$checksum")
          actual=$(sha256sum "$receipt" | awk '{print $1}')
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
            echo "GOVERNANCE_RECEIPT_CHECKSUM_MISMATCH" >&2
            exit 1
          }

          cert_mode=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("certification_mode") or "")' "$receipt")
          live_checks="$RUNNER_TEMP/wow-live-checks.json"
          if [ "$cert_mode" = "TRUST_ROOT_BOOTSTRAP" ]; then
            checks='[]'
            for page in $(seq 1 10); do
              response=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100&page=${page}")
              items=$(jq -ce '.check_runs' <<<"$response")
              count=$(jq 'length' <<<"$items")
              checks=$(jq -cn --argjson old "$checks" --argjson new "$items" '$old + $new')
              [ "$count" -lt 100 ] && break
              [ "$page" -lt 10 ] || { echo "GOVERNANCE_CHECK_INVENTORY_LIMIT_EXCEEDED" >&2; exit 1; }
            done
            printf '%s\n' "$checks" > "$live_checks"
          fi

          verifier=".github/scripts/verify_engineering_governance_receipt.py"
          if [ "$WORKFLOW_NAME" = "wow-v17-existing-pr-governance-review" ]; then
            verifier=".github/scripts/verify_existing_pr_governance_receipt.py"
          fi

          extra_args=()
          if [ "$WORKFLOW_NAME" = "wow-v17-existing-pr-governance-review" ]; then
            extra_args=(--pr-number "$PR_NUMBER" --live-reviews-json "$live_reviews")
            cert_mode=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("certification_mode") or "")' "$receipt")
            if [ "$cert_mode" = "TRUST_ROOT_BOOTSTRAP" ]; then
              extra_args+=(--live-checks-json "$live_checks")
            fi
          fi

          python "$verifier" \
            --receipt "$receipt" \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$PR_HEAD_SHA" \
            --head-ref "$PR_HEAD_REF" \
            --workflow-run-id "$RUN_ID" \
            --workflow-name "$WORKFLOW_NAME" \
            "${extra_args[@]}"

          echo "Trusted exact-head governance receipt verified. can_execute=false." >> "$GITHUB_STEP_SUMMARY"

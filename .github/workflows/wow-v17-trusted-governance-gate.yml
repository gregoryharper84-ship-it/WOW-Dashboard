name: wow-v17-trusted-governance-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: [wow-v17-existing-pr-governance-review]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: wow-v17-trusted-governance-${{ github.event.workflow_run.id || format('{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}
  cancel-in-progress: true

jobs:
  trusted-governance:
    name: Trusted exact-head engineering governance
    if: github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout verifier from protected main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Resolve trusted exact-head governance artifact
        id: artifact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "GOVERNANCE_CERTIFIER_RUN_ID_INVALID" >&2; exit 1;
            }
            source_run="$RUNNER_TEMP/governance-certifier-run.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$source_run"
            jq -e --arg repo "$GITHUB_REPOSITORY" \
              '.name == "wow-v17-existing-pr-governance-review" and
               .path == ".github/workflows/wow-v17-existing-pr-governance-review.yml" and
               .event == "workflow_run" and .head_branch == "main" and
               .head_repository.full_name == $repo and .repository.full_name == $repo and
               .status == "completed" and .conclusion == "success"' "$source_run" >/dev/null || {
                echo "GOVERNANCE_CERTIFIER_RUN_UNTRUSTED_OR_NOT_SUCCESSFUL" >&2; exit 1;
              }
            artifacts=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")
            matches=$(jq -c '[.artifacts[] | select(.expired == false and
              (.name | test("^wow-v17-engineering-governance-[a-f0-9]{40}$")))]' <<<"$artifacts")
            [ "$(jq 'length' <<<"$matches")" -eq 1 ] || {
              echo "GOVERNANCE_CERTIFIER_RECEIPT_MISSING_OR_DUPLICATE" >&2; exit 1;
            }
            artifact_id=$(jq -r '.[0].id' <<<"$matches")
            artifact_name=$(jq -r '.[0].name' <<<"$matches")
            sha_from_name="${artifact_name#wow-v17-engineering-governance-}"
            mkdir -p "$RUNNER_TEMP/certifier-receipt"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "$RUNNER_TEMP/certifier-receipt/receipt.zip"
            unzip -p "$RUNNER_TEMP/certifier-receipt/receipt.zip" \
              wow-engineering-governance-receipt.json > "$RUNNER_TEMP/certifier-receipt/receipt.json"
            unzip -p "$RUNNER_TEMP/certifier-receipt/receipt.zip" \
              wow-engineering-governance-receipt.sha256 > "$RUNNER_TEMP/certifier-receipt/receipt.sha256"
            expected=$(tr -d '[:space:]' < "$RUNNER_TEMP/certifier-receipt/receipt.sha256")
            actual=$(sha256sum "$RUNNER_TEMP/certifier-receipt/receipt.json" | awk '{print $1}')
            [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
              echo "GOVERNANCE_RECEIPT_CHECKSUM_MISMATCH" >&2; exit 1;
            }
            receipt="$RUNNER_TEMP/certifier-receipt/receipt.json"
            pr_number=$(jq -er '.target.pr_number | select(type == "number" and . > 0)' "$receipt")
            head_sha=$(jq -er '.target.head_sha | select(type == "string")' "$receipt")
            head_ref=$(jq -er '.target.head_ref | select(type == "string")' "$receipt")
            jq -e --arg sha "$sha_from_name" --argjson run_id "$SOURCE_RUN_ID" \
              --arg repo "$GITHUB_REPOSITORY" \
              '.receipt_schema_version == 2 or .receipt_schema_version == 3' "$receipt" >/dev/null || {
                echo "GOVERNANCE_RECEIPT_SCHEMA_UNSUPPORTED" >&2; exit 1;
              }
            jq -e --arg sha "$sha_from_name" --argjson run_id "$SOURCE_RUN_ID" \
              --arg repo "$GITHUB_REPOSITORY" \
              '.target.head_sha == $sha and .repository == $repo and
               .workflow_name == "wow-v17-existing-pr-governance-review" and
               .workflow_run_id == ($run_id | tostring)' "$receipt" >/dev/null || {
                echo "GOVERNANCE_CERTIFIER_RECEIPT_TARGET_MISMATCH" >&2; exit 1;
              }
            run_id="$SOURCE_RUN_ID"
          else
          pr_number="$EVENT_PR_NUMBER"
          head_sha="$EVENT_HEAD_SHA"
          head_ref="$EVENT_HEAD_REF"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] && [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo "GOVERNANCE_PR_EVENT_IDENTITY_INVALID" >&2; exit 1;
          }
          artifact_name="wow-v17-engineering-governance-${head_sha}"
          artifact_id=""
          run_id=""

          for _ in $(seq 1 180); do
            artifacts=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=20")
            artifact_id=$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .id // ""' <<<"$artifacts")
            run_id=$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .workflow_run.id // ""' <<<"$artifacts")
            if [ -n "$artifact_id" ] && [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          fi

          if [ -z "$artifact_id" ] || [ -z "$run_id" ]; then
            echo "GOVERNANCE_RECEIPT_MISSING: no trusted artifact exists for exact PR head ${head_sha}." >&2
            exit 1
          fi

          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Verify trusted workflow identity and completion
        id: workflow
        shell: bash
        env:
          RUN_ID: ${{ steps.artifact.outputs.run_id }}
          PR_NUMBER: ${{ steps.artifact.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.artifact.outputs.head_sha }}
          PR_HEAD_REF: ${{ steps.artifact.outputs.head_ref }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            run_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
            name=$(jq -r '.name // ""' <<<"$run_json")
            path=$(jq -r '.path // ""' <<<"$run_json")
            status=$(jq -r '.status // ""' <<<"$run_json")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run_json")
            event=$(jq -r '.event // ""' <<<"$run_json")
            head_branch=$(jq -r '.head_branch // ""' <<<"$run_json")
            head_repo=$(jq -r '.head_repository.full_name // ""' <<<"$run_json")

            case "$name|$path" in
              "wow-v17-chatgpt-engineering-worker|.github/workflows/wow-v17-chatgpt-engineering-worker.yml")
                case "$event" in
                  schedule|workflow_run|workflow_dispatch) ;;
                  *)
                    echo "GOVERNANCE_WORKFLOW_EVENT_MISMATCH: unexpected ChatGPT worker event $event" >&2
                    exit 1
                    ;;
                esac
                ;;
              "wow-v17-claude-engineering-worker|.github/workflows/wow-v17-claude-engineering-worker.yml")
                [ "$event" = "workflow_dispatch" ] || {
                  echo "GOVERNANCE_WORKFLOW_EVENT_MISMATCH: unexpected Claude worker event $event" >&2
                  exit 1
                }
                [ "$head_branch" = "main" ] || {
                  echo "GOVERNANCE_WORKFLOW_REF_MISMATCH: Claude worker must run from protected main, got $head_branch" >&2
                  exit 1
                }
                ;;
              "wow-v17-existing-pr-governance-review|.github/workflows/wow-v17-existing-pr-governance-review.yml")
                case "$event" in
                  pull_request_target) ;;
                  workflow_dispatch)
                    [ "$head_branch" = "main" ] || {
                      echo "GOVERNANCE_WORKFLOW_REF_MISMATCH: manual existing-PR certification must run from protected main, got $head_branch" >&2
                      exit 1
                    }
                    ;;
                  workflow_run)
                    [ "$head_branch" = "main" ] || {
                      echo "GOVERNANCE_WORKFLOW_REF_MISMATCH: workflow-run existing-PR certification must run from protected main, got $head_branch" >&2
                      exit 1
                    }
                    ;;
                  *)
                    echo "GOVERNANCE_WORKFLOW_EVENT_MISMATCH: unexpected existing-PR certification event $event" >&2
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "GOVERNANCE_WORKFLOW_IDENTITY_MISMATCH: untrusted workflow $name at $path" >&2
                exit 1
                ;;
            esac
            if [ "$name" = "wow-v17-chatgpt-engineering-worker" ]; then
              [ "$head_branch" = "main" ] || {
                echo "GOVERNANCE_WORKFLOW_REF_MISMATCH: ChatGPT worker must run from protected main, got $head_branch" >&2
                exit 1
              }
            fi
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
              echo "GOVERNANCE_WORKFLOW_REPOSITORY_MISMATCH: trusted worker came from $head_repo" >&2
              exit 1
            }

            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || {
                echo "GOVERNANCE_WORKFLOW_NOT_SUCCESSFUL: run ${RUN_ID} concluded $conclusion" >&2
                exit 1
              }
              echo "name=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          echo "GOVERNANCE_WORKFLOW_INCOMPLETE: trusted worker run ${RUN_ID} did not complete within the bounded gate window." >&2
          exit 1

      - name: Download and verify exact-head receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          RUN_ID: ${{ steps.artifact.outputs.run_id }}
          WORKFLOW_NAME: ${{ steps.workflow.outputs.name }}
          PR_NUMBER: ${{ steps.artifact.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.artifact.outputs.head_sha }}
          PR_HEAD_REF: ${{ steps.artifact.outputs.head_ref }}
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/governance.zip"
          receipt="$RUNNER_TEMP/wow-engineering-governance-receipt.json"
          checksum="$RUNNER_TEMP/wow-engineering-governance-receipt.sha256"
          live_reviews="$RUNNER_TEMP/wow-live-reviews.json"

          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          jq -e --arg sha "$PR_HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo and
             .base.ref == "main" and .base.repo.full_name == $repo' <<<"$pr_json" >/dev/null || {
              echo "GOVERNANCE_PR_IDENTITY_MOVED_OR_UNTRUSTED" >&2; exit 1;
            }
          reviews='[]'
          for page in $(seq 1 10); do
            response=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100&page=${page}")
            count=$(jq 'length' <<<"$response")
            reviews=$(jq -cn --argjson old "$reviews" --argjson new "$response" '$old + $new')
            [ "$count" -lt 100 ] && break
            [ "$page" -lt 10 ] || { echo "GOVERNANCE_REVIEW_INVENTORY_LIMIT_EXCEEDED" >&2; exit 1; }
          done
          printf '%s\n' "$reviews" > "$live_reviews"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$zip_path"
          unzip -p "$zip_path" wow-engineering-governance-receipt.json > "$receipt"
          unzip -p "$zip_path" wow-engineering-governance-receipt.sha256 > "$checksum"

          expected=$(tr -d '[:space:]' < "$checksum")
          actual=$(sha256sum "$receipt" | awk '{print $1}')
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
            echo "GOVERNANCE_RECEIPT_CHECKSUM_MISMATCH" >&2
            exit 1
          }

          cert_mode=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("certification_mode") or "")' "$receipt")
          receipt_schema=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("receipt_schema_version") or "")' "$receipt")
          live_checks="$RUNNER_TEMP/wow-live-checks.json"
          if [ "$cert_mode" = "TRUST_ROOT_BOOTSTRAP" ]; then
            checks='[]'
            for page in $(seq 1 10); do
              response=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100&page=${page}")
              items=$(jq -ce '.check_runs' <<<"$response")
              count=$(jq 'length' <<<"$items")
              checks=$(jq -cn --argjson old "$checks" --argjson new "$items" '$old + $new')
              [ "$count" -lt 100 ] && break
              [ "$page" -lt 10 ] || { echo "GOVERNANCE_CHECK_INVENTORY_LIMIT_EXCEEDED" >&2; exit 1; }
            done
            printf '%s\n' "$checks" > "$live_checks"
          fi

          source_review_run="$RUNNER_TEMP/source-review-run.json"
          if [ "$receipt_schema" = "3" ]; then
            source_run_id=$(jq -er '.independent_review.artifact.source.run_id | select(type == "string" and test("^[1-9][0-9]*$"))' "$receipt")
            source_attempt=$(jq -er '.independent_review.artifact.source.run_attempt | select(type == "number" and . > 0)' "$receipt")
            source_artifact_id=$(jq -er '.independent_review.artifact_id | select(type == "number" and . > 0)' "$receipt")
            source_sha=$(jq -er '.target.head_sha' "$receipt")
            source_pr=$(jq -er '.target.pr_number' "$receipt")
            source_ref=$(jq -er '.target.head_ref' "$receipt")
            expected_source_artifact="wow-v17-independent-source-review-${source_pr}-${source_sha}-${source_run_id}-${source_attempt}"

            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}" > "$source_review_run"
            jq -e --arg repo "$GITHUB_REPOSITORY" --argjson attempt "$source_attempt" \
              '.name == "wow-v17-independent-source-review" and
               .path == ".github/workflows/wow-v17-independent-source-review.yml" and
               .event == "workflow_dispatch" and .head_branch == "main" and
               .head_repository.full_name == $repo and .repository.full_name == $repo and
               .run_attempt == $attempt and .status == "completed" and .conclusion == "success"' \
              "$source_review_run" >/dev/null || {
                echo "GOVERNANCE_SOURCE_REVIEW_RUN_UNTRUSTED" >&2; exit 1;
              }
            source_artifact_meta=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${source_artifact_id}")
            jq -e --arg name "$expected_source_artifact" --argjson run_id "$source_run_id" \
              '.expired == false and .name == $name and .workflow_run.id == $run_id' \
              <<<"$source_artifact_meta" >/dev/null || {
                echo "GOVERNANCE_SOURCE_REVIEW_ARTIFACT_UNTRUSTED" >&2; exit 1;
              }
            source_inventory='[]'
            for page in $(seq 1 20); do
              source_response=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}")
              source_items=$(jq -ce '.artifacts' <<<"$source_response") || {
                echo "GOVERNANCE_SOURCE_REVIEW_INVENTORY_INVALID" >&2; exit 1;
              }
              source_count=$(jq 'length' <<<"$source_items")
              source_inventory=$(jq -cn --argjson old "$source_inventory" --argjson new "$source_items" '$old + $new')
              [ "$source_count" -lt 100 ] && break
              [ "$page" -lt 20 ] || {
                echo "GOVERNANCE_SOURCE_REVIEW_INVENTORY_LIMIT_EXCEEDED" >&2; exit 1;
              }
            done
            printf '%s\n' "$source_inventory" > "$RUNNER_TEMP/source-review-artifact-inventory.json"
            python - "$RUNNER_TEMP/source-review-artifact-inventory.json" \
              "wow-v17-independent-source-review-${source_pr}-${source_sha}-" "$source_artifact_id" <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, ".github/scripts")
          from independent_source_review_receipt import (
              SourceReviewError, verify_unique_artifact_inventory,
          )
          try:
              verify_unique_artifact_inventory(
                  json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")),
                  prefix=sys.argv[2],
                  expected_artifact_id=int(sys.argv[3]),
              )
          except (OSError, json.JSONDecodeError, ValueError) as exc:
              print(f"GOVERNANCE_SOURCE_REVIEW_INVENTORY_HOLD:{exc}", file=sys.stderr)
              raise SystemExit(1)
          PY

            mkdir -p "$RUNNER_TEMP/source-review"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${source_artifact_id}/zip" \
              > "$RUNNER_TEMP/source-review/source-review.zip"
            unzip -p "$RUNNER_TEMP/source-review/source-review.zip" \
              wow-v17-independent-source-review.json > "$RUNNER_TEMP/source-review/source-review.json"
            unzip -p "$RUNNER_TEMP/source-review/source-review.zip" \
              wow-v17-independent-source-review.json.sha256 > "$RUNNER_TEMP/source-review/source-review.json.sha256"
            python - "$receipt" "$RUNNER_TEMP/source-review/source-review.json" <<'PY'
          import json, pathlib, sys
          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          source = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected = json.dumps(
              receipt["independent_review"]["artifact"], indent=2, sort_keys=True
          ) + "\n"
          if pathlib.Path(sys.argv[2]).read_text(encoding="utf-8") != expected or source != receipt["independent_review"]["artifact"]:
              raise SystemExit("GOVERNANCE_SOURCE_REVIEW_ARTIFACT_CONTENT_MISMATCH")
          PY
            source_artifact_digest=$(jq -r '.independent_review.artifact_sha256' "$receipt")
            source_actual_digest=$(sha256sum "$RUNNER_TEMP/source-review/source-review.json" | awk '{print $1}')
            source_sidecar_digest=$(tr -d '[:space:]' < "$RUNNER_TEMP/source-review/source-review.json.sha256")
            [ "$source_artifact_digest" = "$source_actual_digest" ] && \
              [ "$source_sidecar_digest" = "$source_actual_digest" ] || {
                echo "GOVERNANCE_SOURCE_REVIEW_ARTIFACT_CHECKSUM_MISMATCH" >&2; exit 1;
              }
            python .github/scripts/independent_source_review_receipt.py \
              --verify \
              --artifact "$RUNNER_TEMP/source-review/source-review.json" \
              --run "$source_review_run" \
              --repository "$GITHUB_REPOSITORY" \
              --pr-number "$source_pr" \
              --head-sha "$source_sha" \
              --head-ref "$source_ref" \
              --attempt "$source_attempt"
          elif [ "$receipt_schema" != "2" ]; then
            echo "GOVERNANCE_RECEIPT_SCHEMA_UNSUPPORTED" >&2
            exit 1
          fi

          verifier=".github/scripts/verify_engineering_governance_receipt.py"
          if [ "$WORKFLOW_NAME" = "wow-v17-existing-pr-governance-review" ]; then
            verifier=".github/scripts/verify_existing_pr_governance_receipt.py"
          fi

          extra_args=()
          if [ "$WORKFLOW_NAME" = "wow-v17-existing-pr-governance-review" ]; then
            extra_args=(--pr-number "$PR_NUMBER" --live-reviews-json "$live_reviews")
            if [ "$cert_mode" = "TRUST_ROOT_BOOTSTRAP" ]; then
              extra_args+=(--live-checks-json "$live_checks")
            elif [ "$receipt_schema" = "3" ]; then
              extra_args+=(--source-review-run-json "$source_review_run")
            fi
          fi

          python "$verifier" \
            --receipt "$receipt" \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$PR_HEAD_SHA" \
            --head-ref "$PR_HEAD_REF" \
            --workflow-run-id "$RUN_ID" \
            --workflow-name "$WORKFLOW_NAME" \
            "${extra_args[@]}"

          echo "Trusted exact-head governance receipt verified. can_execute=false." >> "$GITHUB_STEP_SUMMARY"

name: wow-v17-24h-engineering-closure-loop

on:
  schedule:
    - cron: "47 * * * *"
  push:
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows:
      - "WOW Elite Ecosystem Assurance"
      - "wow-engine-verify"
      - "wow-v17-existing-pr-governance-review"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: wow-v17-24h-engineering-closure-loop
  cancel-in-progress: false

jobs:
  advance-one-stage:
    name: Advance highest-priority WOW work
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve next concrete action
        id: decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repair_pr=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '[.[] | select(.draft == false) | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | select((.body // "") | contains("Morning-Green-Autonomous: true"))] | sort_by(.created_at) | first | .number // empty')
          experiment_pr=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '[.[] | select(.draft == false) | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | select((.body // "") | contains("Model-Experiment-Autonomous: true"))] | sort_by(.created_at) | first | .number // empty')

          priority=$(python artifacts/wow-engine/v17/engineering_agent_team.py priority)
          incident=$(jq -r '.incident_id // ""' <<<"$priority")
          state=$(jq -r '.state // "NONE"' <<<"$priority")
          severity=$(jq -r '.severity // "NONE"' <<<"$priority")
          frontier_allowed=$(jq -r '.frontier_allowed // false' <<<"$priority")
          product=$(python artifacts/wow-engine/v17/engineering_effectiveness.py health artifacts/wow-engine/V17_USER_JOURNEY_HEALTH.md)
          product_health=$(jq -r '.user_journey_status // "UNKNOWN"' <<<"$product")
          utc_hour=$((10#$(date -u +%H)))

          action="DETECT"
          target=""
          reason="No unfinished reliability item; run deterministic detector."

          if [ -n "$repair_pr" ]; then
            action="RESUME_REPAIR_PR"
            target="$repair_pr"
            reason="An autonomous repair PR is open; finish its CI/merge lifecycle before starting new work."
          elif [ "$state" = "DEPLOYED_PENDING_VERIFY" ] || [ "$state" = "MERGED_PENDING_DEPLOY" ] || [ "$state" = "PR_CREATED" ]; then
            action="VERIFY_RELEASE"
            target="$incident"
            reason="Highest-priority incident is in release/production verification."
          elif [ -n "$incident" ]; then
            action="REPAIR"
            target="$incident"
            reason="Highest-priority durable incident still requires engineering closure."
          elif [ "$product_health" != "PASS" ]; then
            action="VERIFY_PRODUCT"
            reason="Golden user journey is not PASS; run independent product acceptance before discretionary model research."
          elif [ -n "$experiment_pr" ]; then
            action="RESUME_EXPERIMENT_PR"
            target="$experiment_pr"
            reason="Product health is PASS and a governed model-improvement experiment PR is open; finish or repair it before starting another experiment."
          elif [ "$frontier_allowed" = "true" ] && [ $((utc_hour % 6)) -eq 0 ]; then
            action="IMPROVE_MODEL"
            reason="Reliability queue and golden user journey are green; execute one governed non-serving model-improvement experiment."
          fi

          lifecycle_owner="LIFECYCLE_CONTROLLER_AGENT"
          case "$action" in
            RESUME_REPAIR_PR|VERIFY_RELEASE)
              lifecycle_owner="RELEASE_VERIFICATION_OWNER_AGENT"
              ;;
            DETECT|VERIFY_PRODUCT)
              lifecycle_owner="QUEUE_STEWARD_AGENT"
              ;;
          esac

          {
            echo "action=$action"
            echo "lifecycle_owner=$lifecycle_owner"
            echo "target=$target"
            echo "incident=$incident"
            echo "state=$state"
            echo "severity=$severity"
            echo "product_health=$product_health"
            echo "reason<<EOF"
            echo "$reason"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          jq -n \
            --arg action "$action" \
            --arg lifecycle_owner "$lifecycle_owner" \
            --arg target "$target" \
            --arg incident "$incident" \
            --arg state "$state" \
            --arg severity "$severity" \
            --arg product_health "$product_health" \
            --arg reason "$reason" \
            '{action:$action,lifecycle_owner:$lifecycle_owner,target:$target,incident:$incident,state:$state,severity:$severity,product_health:$product_health,reason:$reason,can_execute:false}' \
            | tee "$RUNNER_TEMP/wow-24h-decision.json"

      - name: Resume autonomous repair PR
        if: steps.decision.outputs.action == 'RESUME_REPAIR_PR'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.decision.outputs.target }}
        run: |
          set -euo pipefail

          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          head_sha=$(jq -r '.head.sha // ""' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          mergeable_state=$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")

          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::Repair PR must be same-repository."
            exit 1
          }
          [ -n "$head_sha" ] || {
            echo "::error::Repair PR head SHA is missing."
            exit 1
          }

          if [ "$mergeable_state" = "behind" ]; then
            echo "REVALIDATE_IN_PLACE: PR #${PR_NUMBER} is behind protected main; updating the same branch with expected head ${head_sha}." >> "$GITHUB_STEP_SUMMARY"
            gh api \
              --method PUT \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f expected_head_sha="$head_sha" >/dev/null
            echo "Same PR preserved. The synchronize event will rerun exact-head CI and trusted governance; stale certification is not dispatched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$mergeable_state" = "dirty" ]; then
            echo "BLOCKED_WITH_EXACT_REASON: PR #${PR_NUMBER} has a real merge conflict. Preserve the same PR; do not close, supersede, or recreate it. RESTACK_SAME_PR is required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run wow-v17-morning-green-continuation.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$PR_NUMBER"

      - name: Resume release verification
        if: steps.decision.outputs.action == 'VERIFY_RELEASE'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wow-v17-release-resume-agent.yml --limit 10 \
            --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" -gt 0 ]; then
            echo "Release verification is already active." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run wow-v17-release-resume-agent.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Dispatch engineering repair
        if: steps.decision.outputs.action == 'REPAIR'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wow-v17-chatgpt-engineering-worker.yml --limit 10 \
            --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" -gt 0 ]; then
            echo "An engineering worker is already active; preserving the single implementation lease." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run wow-v17-chatgpt-engineering-worker.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Verify golden product acceptance
        if: steps.decision.outputs.action == 'VERIFY_PRODUCT'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wow-v17-golden-product-acceptance.yml --limit 10 \
            --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" -gt 0 ]; then
            echo "Golden product acceptance is already active." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run wow-v17-golden-product-acceptance.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Resume governed model-experiment PR
        if: steps.decision.outputs.action == 'RESUME_EXPERIMENT_PR'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.decision.outputs.target }}
        run: |
          set -euo pipefail
          pr=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          head_sha=$(jq -r '.head.sha' <<<"$pr")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          body=$(jq -r '.body // ""' <<<"$pr")
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::Experiment PR must be same-repository."; exit 1; }
          grep -Fq 'Model-Experiment-Autonomous: true' <<<"$body" || { echo "::error::Missing experiment marker."; exit 1; }
          grep -Fq 'Production-Behavior-Change: false' <<<"$body" || { echo "::error::Experiment PR claims production behavior change."; exit 1; }

          mapfile -t files < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')
          for file in "${files[@]}"; do
            case "$file" in
              artifacts/wow-engine/v17/experiments/*) ;;
              *) echo "::error::Experiment PR escaped non-serving boundary: $file"; exit 1 ;;
            esac
          done

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge || true
          checks=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" -H 'Accept: application/vnd.github+json' --jq '.check_runs')
          failed=$(jq '[.[] | select(.status == "completed") | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | length' <<<"$checks")
          if [ "$failed" -gt 0 ]; then
            active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wow-v17-model-improvement-experiment.yml --limit 10 \
              --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
            if [ "$active" -eq 0 ]; then
              gh workflow run wow-v17-model-improvement-experiment.yml --repo "$GITHUB_REPOSITORY" --ref main -f repair_pr="$PR_NUMBER"
              echo "Failed experiment CI routed to bounded ChatGPT experiment repair." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Experiment PR remains on protected auto-merge; no failed checks detected." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Execute governed model-improvement experiment
        if: steps.decision.outputs.action == 'IMPROVE_MODEL'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wow-v17-model-improvement-experiment.yml --limit 10 \
            --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" -gt 0 ]; then
            echo "A governed model-improvement experiment is already active." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run wow-v17-model-improvement-experiment.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Run deterministic detection / acceptance pulse
        if: steps.decision.outputs.action == 'DETECT'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wow-v17-nightly-engineering-scan.yml --limit 10 \
            --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" -eq 0 ]; then
            gh workflow run wow-v17-nightly-engineering-scan.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

      - name: Record 24-hour loop receipt
        if: always()
        run: |
          {
            echo "# WOW V17 24-Hour Completion Loop"
            echo "- action: ${{ steps.decision.outputs.action || 'UNRESOLVED' }}"
            echo "- lifecycle_owner: ${{ steps.decision.outputs.lifecycle_owner || 'UNRESOLVED' }}"
            echo "- target: ${{ steps.decision.outputs.target || 'NONE' }}"
            echo "- incident: ${{ steps.decision.outputs.incident || 'NONE' }}"
            echo "- incident_state: ${{ steps.decision.outputs.state || 'NONE' }}"
            echo "- product_health: ${{ steps.decision.outputs.product_health || 'UNKNOWN' }}"
            echo "- reason: ${{ steps.decision.outputs.reason || 'NONE' }}"
            echo "- policy: finish existing work before starting new work"
            echo "- product policy: no discretionary model research while golden user journey is not PASS"
            echo "- model improvement: challenger/experiment only until governed evidence earns promotion"
            echo "- can_execute: false"
          } >> "$GITHUB_STEP_SUMMARY"

  autonomous-pr-continuation:
    name: Continue eligible PR lifecycle without chat
    if: github.event_name == 'schedule' || github.event_name == 'pull_request_review' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR: ${{ github.event.pull_request.number || '' }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Re-enter CI / certification / reviewer stages (bounded)
        shell: bash
        run: |
          set -euo pipefail
          numbers="$RUNNER_TEMP/continuation-prs.txt"
          : > "$numbers"
          if [ "$EVENT_NAME" = pull_request_review ]; then
            printf '%s\n' "$EVENT_PR" >> "$numbers"
          elif [ "$EVENT_NAME" = workflow_run ]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.pull_requests[]?.number' >> "$numbers"
          else
            gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
              --jq '.[] | select(.draft == false) | select((.body // "") | contains("Incident: #1547") or contains("Terminal-Closure-Autonomous: true")) | .number' >> "$numbers"
          fi
          sort -un "$numbers" -o "$numbers"
          attempts=0
          while read -r number; do
            [ -n "$number" ] || continue
            [ "$attempts" -lt 5 ] || break
            attempts=$((attempts + 1))
            pr=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$number")
            head=$(jq -r '.head.sha' <<<"$pr")
            head_repo=$(jq -r '.head.repo.full_name' <<<"$pr")
            author=$(jq -r '.user.login' <<<"$pr")
            if [ "$(jq -r '.state' <<<"$pr")" != open ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              continue
            fi
            checks=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" --jq '.check_runs')
            # A passing check is not enough: zero checks, pending checks and
            # any failed check are all non-certifiable.
            count=$(jq 'length' <<<"$checks")
            failing=$(jq '[.[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"$checks")
            if [ "$count" -eq 0 ] || [ "$failing" -ne 0 ]; then
              echo "PR #$number CI_PENDING_OR_FAILED head=$head" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Certification is an independent workflow, never an approval.
            # One attempt per SHA is recorded in the PR discussion to prevent
            # hourly re-dispatch storms; a new head gets a new attempt.
            marker="WOW_AUTO_CERTIFICATION_HEAD:$head"
            comments=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$number/comments?per_page=100" --jq '[.[].body]')
            if ! jq -e --arg m "$marker" 'any(.[]; contains($m))' <<<"$comments" >/dev/null; then
              gh workflow run wow-v17-existing-pr-governance-review.yml \
                --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$number"
              gh pr comment "$number" --repo "$GITHUB_REPOSITORY" \
                --body "<!-- $marker --> Trusted certification dispatched for exact PR head $head. This is NOT independent approval."
              echo "PR #$number certification dispatched for $head" >> "$GITHUB_STEP_SUMMARY"
            fi
            # Reviewer discovery is read-only and never promotes permissions.
            reviewers=$(jq -r '.requested_reviewers[]?.login' <<<"$pr")
            authorized=0
            while read -r reviewer; do
              [ -n "$reviewer" ] || continue
              [ "$reviewer" != "$author" ] || continue
              perm=$(gh api "/repos/$GITHUB_REPOSITORY/collaborators/$reviewer/permission" --jq '.permission' 2>/dev/null || echo unknown)
              if [ "$perm" = write ] || [ "$perm" = maintain ] || [ "$perm" = admin ]; then
                authorized=1
                break
              fi
            done <<<"$reviewers"
            if [ "$authorized" -ne 1 ]; then
              echo "PR #$number BLOCKED_WITH_EXACT_REASON:REVIEWER_NOT_CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PR #$number authorized reviewer requested; awaiting GitHub-enforced approval and protected release" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$numbers"

name: wow-v17-release-authority-check
run-name: wow-v17-release-authority-check event=${{ github.event_name }} pr=${{ inputs.pr_number || 'AUTO' }} head=${{ inputs.head_sha || 'AUTO' }}

# Phase C of #1550. Runs from protected main only and never checks out or executes
# PR code. Evidence is read with the read-only GITHUB_TOKEN; the check is published
# with this role's own GitHub App token, downscoped to checks:write. The ruleset pins
# the check to this App's integration_id. A pass is evidence, never merge, deploy or
# probability authority. can_execute=false.

on:
  workflow_run:
    workflows: [wow-v17-independent-qa-check]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate at its current exact head.
        required: true
        type: string
      head_sha:
        description: Optional exact SHA binding
        required: false
        type: string
      qa_run_id:
        description: Authenticated exact-head QA workflow run that produced the policy receipt.
        required: true
      qa_run_attempt:
        description: Exact attempt number of the producing QA workflow run.
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  admit-release:
    # GitHub workflow_run often omits pull_requests even for an authentic
    # exact-PR QA result. Never queue unrelated events behind a shared AUTO
    # key. Admission verifies the actual QA run and immutable policy receipt
    # using read-only identity *before* assigning a PR-scoped release writer.
    if: github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' && vars.WOW_RELEASE_APP_ID != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      applicable: ${{ steps.target.outputs.applicable }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      head_sha: ${{ steps.target.outputs.head_sha }}
    steps:
      - name: Checkout protected main for read-only QA receipt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Resolve authenticated exact-PR release lane
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          QA_RUN_ID: ${{ github.event.workflow_run.id || inputs.qa_run_id }}
          QA_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.qa_run_attempt }}
        run: |
          set -euo pipefail
          echo "applicable=false" >> "$GITHUB_OUTPUT"
          [[ "${QA_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]] &&
          [[ "${QA_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::RELEASE_QA_RUN_IDENTITY_INVALID"; exit 1;
          }
          tool=artifacts/wow-engine/v17/independent_release_checks.py
          if [ "$EVENT" = "workflow_run" ]; then
            classified=$(python "$tool" classify-upstream-qa \
              --repo "$GITHUB_REPOSITORY" \
              --run-id "$QA_RUN_ID" --run-attempt "$QA_RUN_ATTEMPT")
            disposition=$(jq -er '.disposition' <<< "$classified")
            if [ "$disposition" = "neutral" ]; then
              echo "::notice::RELEASE_NEUTRAL_BEFORE_PR_LOCK:$(jq -r .reason <<< "$classified")"
              exit 0
            fi
            [ "$disposition" = "applicable" ] || {
              echo "::error::RELEASE_QA_APPLICABILITY_INVALID"; exit 1;
            }
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "${INPUT_PR:-}" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::RELEASE_TARGET_PR_INVALID"; exit 1;
            }
          else
            echo "::error::RELEASE_EVENT_NOT_SUPPORTED"; exit 1
          fi
          args=(resolve-qa-policy --repo "$GITHUB_REPOSITORY" \
            --run-id "$QA_RUN_ID" --run-attempt "$QA_RUN_ATTEMPT")
          if [ "$EVENT" = "workflow_dispatch" ]; then
            args+=(--pr "$INPUT_PR")
          fi
          bundle=$(python "$tool" "${args[@]}")
          pr=$(jq -er '.policy.target.pr_number' <<< "$bundle")
          head=$(jq -er '.policy.target.head_sha' <<< "$bundle")
          [[ "$pr" =~ ^[1-9][0-9]*$ ]] &&
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::RELEASE_POLICY_TARGET_INVALID"; exit 1;
          }
          if [ -n "${INPUT_HEAD_SHA:-}" ]; then
            [ "$INPUT_HEAD_SHA" = "$head" ] || {
              echo "::error::RELEASE_POLICY_TARGET_STALE"; exit 1;
            }
          fi
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
          echo "applicable=true" >> "$GITHUB_OUTPUT"
          echo "Authenticated QA policy resolved PR #$pr head $head" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: admit-release
    # An exact PR is known before acquiring a Release writer. Failed/unrelated
    # QA producers cannot monopolize the single AUTO group.
    if: >-
      needs.admit-release.result == 'success' &&
      needs.admit-release.outputs.applicable == 'true' &&
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      vars.WOW_RELEASE_APP_ID != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped')
    concurrency:
      group: wow-v17-release-authority-check-pr-${{ needs.admit-release.outputs.pr_number }}
      cancel-in-progress: false
      queue: max
    # Missing Review/Release App identity always remains fail-closed at the
    # verified job's credential step; admission never obtains App write access.
    environment: wow-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Require this role's App identity
        shell: bash
        env:
          APP_ID: ${{ vars.WOW_RELEASE_APP_ID }}
          KEY_PRESENT: ${{ secrets.WOW_RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if ! [[ "${APP_ID:-}" =~ ^[0-9]+$ ]] || [ "${KEY_PRESENT:-false}" != "true" ]; then
            echo "::error::RELEASE_APP_CREDENTIAL_MISSING: WOW_RELEASE_APP_ID / WOW_RELEASE_APP_PRIVATE_KEY not configured; no check published."
            exit 1
          fi

      - name: Classify upstream QA applicability
        id: upstream
        if: success() && github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_QA_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_QA_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          tool=artifacts/wow-engine/v17/independent_release_checks.py
          [[ "${SOURCE_QA_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]] &&
            [[ "${SOURCE_QA_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::SOURCE_QA_RUN_IDENTITY_INVALID"; exit 1;
          }
          err="$RUNNER_TEMP/classify-upstream-qa.err"
          if ! classified=$(python "$tool" classify-upstream-qa --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_QA_RUN_ID" --run-attempt "$SOURCE_QA_RUN_ATTEMPT" \
            2>"$err"); then
            reason=$(head -n 1 "$err" | tr -d '\r')
            echo "::error::${reason}"
            exit 1
          fi
          disposition=$(jq -er '.disposition' <<<"$classified")
          reason=$(jq -er '.reason' <<<"$classified")
          if [ "$disposition" = "neutral" ]; then
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_UPSTREAM_QA_NEUTRAL:$reason (no check published)"
            echo "Release upstream QA is neutral: $reason" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$disposition" = "applicable" ] || {
            echo "::error::RELEASE_UPSTREAM_QA_DISPOSITION_INVALID"; exit 1;
          }
          echo "applicable=true" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Decide at exact head (read-only)
        id: decide
        if: success() && (github.event_name != 'workflow_run' || steps.upstream.outputs.applicable == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          QA_APP_ID: ${{ vars.WOW_QA_APP_ID }}
          RELEASE_APP_ID: ${{ vars.WOW_RELEASE_APP_ID }}
          REVIEW_ACTIVATION: ${{ vars.WOW_QA_INDEPENDENT_REVIEW_ACTIVE }}
          ZERO_CREDIT_ACTIVATION: ${{ vars.WOW_QA_ZERO_CREDIT_MODE }}
          SOURCE_QA_RUN_ID: ${{ github.event.workflow_run.id || inputs.qa_run_id }}
          SOURCE_QA_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.qa_run_attempt }}
        run: |
          set -euo pipefail
          tool=artifacts/wow-engine/v17/independent_release_checks.py
          out="$RUNNER_TEMP/decisions"; mkdir -p "$out"
          [[ "${SOURCE_QA_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]] &&
            [[ "${SOURCE_QA_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::SOURCE_QA_RUN_IDENTITY_INVALID"; exit 1;
          }
          policy_args=(resolve-qa-policy --repo "$GITHUB_REPOSITORY"
            --run-id "$SOURCE_QA_RUN_ID" --run-attempt "$SOURCE_QA_RUN_ATTEMPT")
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "${INPUT_PR:-}" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::RELEASE_PR_NUMBER_INVALID"; exit 1;
            }
            policy_args+=(--pr "$INPUT_PR")
          fi
          policy_bundle=$(python "$tool" "${policy_args[@]}")
          policy=$(jq -ce '.policy' <<<"$policy_bundle")
          printf '%s\n' "$policy" > "$out/qa-policy.json"
          pr=$(jq -r '.target.pr_number' <<<"$policy")
          head=$(jq -r '.target.head_sha' <<<"$policy")
          if [ -n "${INPUT_HEAD_SHA:-}" ]; then
            [[ "$INPUT_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::RELEASE_INPUT_HEAD_SHA_INVALID"; exit 1; }
            [ "$INPUT_HEAD_SHA" = "$head" ] || { echo "::error::RELEASE_INPUT_HEAD_SHA_STALE"; exit 1; }
          fi
          review_mode=$(jq -r '.mode' <<<"$policy")
          case "${REVIEW_ACTIVATION:-}" in
            true) current_review_active=true ;;
            ""|false) current_review_active=false ;;
            *) echo "::error::QA_REVIEW_POLICY_INVALID"; exit 1 ;;
          esac
          ev="$out/evidence-$pr.json"
          gather_args=(gather --repo "$GITHUB_REPOSITORY" --pr "$pr" --expected-head "$head"
            --qa-policy-json "$out/qa-policy.json")
          case "${ZERO_CREDIT_ACTIVATION:-}" in
            true) zero_credit_active=true ;;
            ""|false) zero_credit_active=false ;;
            *) echo "::error::QA_ZERO_CREDIT_POLICY_INVALID"; exit 1 ;;
          esac
          [ "$zero_credit_active" != "true" ] || gather_args+=(--zero-credit-policy-enabled)
          [ "$current_review_active" != "true" ] || gather_args+=(--current-review-active)
          [ "$review_mode" != "legacy" ] || gather_args+=(--legacy-review-policy)
          python "$tool" "${gather_args[@]}" > "$ev"
          readiness=$(python "$tool" classify-release-readiness --evidence "$ev")
          disposition=$(jq -er '.disposition' <<<"$readiness")
          if [ "$disposition" = "pending" ]; then
            checks=$(jq -er '.pending_checks | join(", ")' <<<"$readiness")
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_QA_EVIDENCE_PENDING:$checks (no check published)"
            echo "Release deferred until exact-head native regression completes: $checks. No Release check published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$disposition" = "ready" ] || {
            echo "::error::RELEASE_READINESS_DISPOSITION_INVALID"; exit 1;
          }
          python "$tool" decide-release --evidence "$ev" --qa-app-id "$QA_APP_ID" --release-app-id "$RELEASE_APP_ID" > "$out/decision-$pr.json"
          echo "count=1" >> "$GITHUB_OUTPUT"
          echo "RELEASE decision: PR $pr at $head using QA mode $review_mode" >> "$GITHUB_STEP_SUMMARY"

      - name: Mint checks-only App token
        id: app_token
        if: steps.decide.outputs.count == '1'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.WOW_RELEASE_APP_ID }}
          private-key: ${{ secrets.WOW_RELEASE_APP_PRIVATE_KEY }}
          repositories: WOW-Dashboard
          permission-checks: write

      - name: Publish exact-head check
        if: steps.decide.outputs.count == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          for decision in "$RUNNER_TEMP"/decisions/decision-*.json; do
            jq -e '.can_execute == false and .merge_or_release_authorized == false' "$decision" >/dev/null || {
              echo "::error::RELEASE_DECISION_INVARIANT_VIOLATED: $decision"; exit 1; }
            payload=$(jq '{name: .check_name, head_sha: .head_sha, status: "completed",
              conclusion: .conclusion, output: {title: .title, summary: .summary}}' "$decision")
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - <<<"$payload" >/dev/null; then
              echo "::error::RELEASE_CHECK_PUBLISH_FAILED: $(jq -r '.head_sha' "$decision")"
              exit 1
            fi
            echo "- $(jq -r '"\(.check_name) \(.conclusion) at \(.head_sha)"' "$decision")" >> "$GITHUB_STEP_SUMMARY"
          done

name: wow-v17-main-verification-reconciler

# Recover lost main verification triggers for both required suites; never deploy or approve releases.
on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: wow-v17-main-verification-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Reconcile exact-main verification workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$WOW_CAN_EXECUTE" = false
          test "$WOW_DRY_RUN_ONLY" = true
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          # A present run, including a failed one, must never be retried silently.
          # Both independent suites are mandatory for the protected release contract.
          for workflow in wow-verify.yml wow-engine-verify.yml; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=100" --jq '.workflow_runs')
            verdict=$(jq -r --arg sha "$main_sha" '[.[] | select(.head_sha == $sha and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.created_at) | reverse | first | if . == null then "MISSING" else (.status + "|" + (.conclusion // "")) end' <<< "$runs")
            if [ "$verdict" != MISSING ]; then
              echo "EXACT_MAIN_VERIFY_PRESENT:$workflow:$verdict"
              continue
            fi
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
            [ "$main_sha" = "$current_sha" ] || { echo "MAIN_SUPERSEDED_HOLD"; exit 0; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" -f ref=main
            echo "MISSING_VERIFY_DISPATCHED_FOR_MAIN:$workflow:$main_sha"
            echo "CHECKS_AND_INDEPENDENT_RELEASE_PROVENANCE_STILL_REQUIRED"
          done

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ANTHROPIC_API_KEY: test-only-placeholder
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wow_test
      SCORING_API_KEY: test-scoring-key
    defaults:
      run:
        working-directory: artifacts/flask-scoring-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/flask-scoring-api/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Initialize test database
        run: >-
          python -c
          "from gate_engine.pg_session_ledger import ensure_table_exists;
          ensure_table_exists()"

      - name: Run test suite
        run: >-
          python -m pytest
          gate_engine/tests
          kalshi_engine/tests
          services/tests
          --strict-markers
          --disable-warnings

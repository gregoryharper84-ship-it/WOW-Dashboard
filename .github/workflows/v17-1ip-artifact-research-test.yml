name: v17-1ip-artifact-research-test

on:
  push:
    branches:
      - chatgpt/v17-1ip-artifact-research-20260901
    paths:
      - "artifacts/wow-engine/mlb_1ip_training_dataset.py"
      - "artifacts/wow-engine/mlb_1ip_empirical_pmf.py"
      - "artifacts/wow-engine/mlb_1ip_empirical_specialist.py"
      - "artifacts/wow-engine/mlb_1ip_ingress_runtime.py"
      - "artifacts/wow-engine/mlb_1ip_final_refresh_job.py"
      - "artifacts/wow-engine/pick_request_runtime.py"
      - "artifacts/wow-engine/tests/test_mlb_1ip_training_identity.py"
      - "artifacts/wow-engine/tests/test_mlb_1ip_production_capability.py"
      - "artifacts/wow-engine/tests/test_mlb_1ip_empirical_pmf.py"
      - "artifacts/wow-engine/tests/test_mlb_1ip_empirical_specialist.py"
      - "artifacts/wow-engine/test_pick_request_1ip_integration.py"
      - ".github/workflows/v17-1ip-artifact-research-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Focused MLB 1IP tests
        run: python -m pytest -q tests/test_mlb_1ip_training_identity.py tests/test_mlb_1ip_production_capability.py tests/test_mlb_1ip_empirical_pmf.py tests/test_mlb_1ip_empirical_specialist.py test_pick_request_1ip_integration.py
      - name: Full WOW engine regression suite
        run: python -m pytest -q

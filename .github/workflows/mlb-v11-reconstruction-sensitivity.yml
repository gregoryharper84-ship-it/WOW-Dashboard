name: MLB V1.1 reconstruction sensitivity

on:
  push:
    branches:
      - research/mlb-v1-repro-20260827
    paths:
      - ".github/workflows/mlb-v11-reconstruction-sensitivity.yml"
      - "research/mlb-v1-repro/mlb_v11_reconstruction_sensitivity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn joblib
      - name: Run 12-variant V1.1 sensitivity audit
        working-directory: research/mlb-v1-repro
        run: python mlb_v11_reconstruction_sensitivity.py
      - name: Show sensitivity summary
        if: always()
        run: cat research/mlb-v1-repro/research/mlb-v11-sensitivity-out/mlb_v11_reconstruction_sensitivity.json || true
      - name: Upload sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-v11-reconstruction-sensitivity
          path: research/mlb-v1-repro/research/mlb-v11-sensitivity-out/mlb_v11_reconstruction_sensitivity.json
          if-no-files-found: warn
          retention-days: 7

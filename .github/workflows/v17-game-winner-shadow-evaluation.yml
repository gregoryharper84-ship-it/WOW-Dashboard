name: v17-game-winner-shadow-evaluation

on:
  pull_request:
    paths:
      - "artifacts/wow-engine/v17/mlb_game_winner_shadow_db_runner.py"
      - "artifacts/wow-engine/v17/mlb_game_winner_shadow_one_shot.py"
      - "artifacts/wow-engine/v17/mlb_game_winner_shadow_evaluation.py"
      - "artifacts/wow-engine/v17/mlb_game_winner_shadow_challenger.py"
      - "artifacts/wow-engine/v17/test_mlb_game_winner_shadow_challenger.py"
      - "artifacts/wow-engine/v17/test_mlb_game_winner_shadow_evaluation.py"
      - "artifacts/wow-engine/v17_observability.py"
      - "artifacts/wow-engine/scripts/run_mlb_game_winner_shadow_evaluation.py"
      - "artifacts/wow-engine/tests/test_mlb_game_winner_shadow_db_runner.py"
      - "artifacts/wow-engine/tests/test_mlb_game_winner_shadow_one_shot.py"
      - "artifacts/wow-engine/tests/test_v17_observability_shadow_schedule.py"
      - ".github/workflows/v17-game-winner-shadow-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shadow-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Game Winner shadow evaluator regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            v17/test_mlb_game_winner_shadow_challenger.py \
            v17/test_mlb_game_winner_shadow_evaluation.py \
            tests/test_mlb_game_winner_shadow_db_runner.py \
            tests/test_mlb_game_winner_shadow_one_shot.py \
            tests/test_v17_observability_shadow_schedule.py
      - name: Prove no serving/promotion mutation in runner sources
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path("v17/mlb_game_winner_shadow_db_runner.py"),
              Path("v17/mlb_game_winner_shadow_one_shot.py"),
          ]
          text = "\n".join(path.read_text() for path in files)
          required = [
              'automatic_promotion',
              'admission_policy_mutated',
              'cash_single_gate_mutated',
              'can_execute',
          ]
          for token in required:
              assert token in text, token
          forbidden = [
              'prizepicks_multiplier',
              'break_even_probability',
              'cash_single_approved = True',
              'can_execute = True',
          ]
          lower = text.lower()
          for token in forbidden:
              assert token.lower() not in lower, token
          print("shadow-only invariant verification passed")
          PY

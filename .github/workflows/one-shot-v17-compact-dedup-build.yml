from types import SimpleNamespace

from v17.daily_snapshot_runtime import _prop_manifest_rows


class _Query:
    def __init__(self, rows):
        self.rows = list(rows)
        self.start = 0
        self.end = len(self.rows) - 1
    def select(self, *_args, **_kwargs): return self
    def eq(self, *_args, **_kwargs): return self
    def order(self, *_args, **_kwargs): return self
    def limit(self, n): self.start, self.end = 0, n - 1; return self
    def range(self, start, end): self.start, self.end = start, end; return self
    def execute(self): return SimpleNamespace(data=self.rows[self.start:self.end + 1])


class _DB:
    def __init__(self, rows): self.rows = rows
    def table(self, name):
        assert name == "wow_prop_evidence_snapshots"
        return _Query(self.rows)


def _row(snapshot_id, player, line):
    return {
        "source_snapshot_id": snapshot_id,
        "captured_at": "2099-09-20T10:00:00Z",
        "event_id": f"evt-{player}",
        "event_start_time": "2099-09-20T20:00:00Z",
        "sport": "MLB",
        "player": player,
        "stat_type": "PITCHER_STRIKEOUTS",
        "line": line,
        "hydration_status": "PASS",
        "blockers": [],
    }


def test_twenty_duplicate_snapshots_do_not_consume_four_prop_limit_slots():
    rows = [_row(f"dup-{i}", "Cristopher Sanchez", 6.5) for i in range(20)]
    rows += [
        _row("u-1", "Pitcher Two", 5.5),
        _row("u-2", "Pitcher Three", 4.5),
        _row("u-3", "Pitcher Four", 7.5),
    ]
    manifest = _prop_manifest_rows(_DB(rows), "2099-09-20", "UTC")
    limited = manifest[:4]
    assert len(manifest) == 4
    assert len(limited) == 4
    assert [row["player"] for row in limited] == [
        "Cristopher Sanchez", "Pitcher Two", "Pitcher Three", "Pitcher Four"
    ]
    assert limited[0]["source_instance_count"] == 20
    assert len(limited[0]["source_snapshot_ids"]) == 20

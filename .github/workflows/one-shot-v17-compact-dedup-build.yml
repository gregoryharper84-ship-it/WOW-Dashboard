name: One-shot V17 compact and canonical dedup build

on:
  push:
    branches:
      - chatgpt/v17-compact-dedup-fix

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message != 'chore(v17): apply compact/dedup repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v17-compact-dedup-fix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Apply V17 repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = root / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_TARGET_COUNT:{path}:{count}:{old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Preserve response_mode through the outer detailed-evidence wrapper.
          detailed = 'artifacts/wow-engine/v17/detailed_evidence_install.py'
          replace_once(detailed, 'from typing import Any, Optional\n', 'from typing import Any, Literal, Optional\n')
          replace_once(
              detailed,
              'class DetailedPickRequestBatch(BaseModel):\n    model_config = ConfigDict(extra="forbid")\n    request_id: Optional[str] = None\n    rows: list[DetailedPickRequestRow] = Field(min_length=1, max_length=50)\n',
              'class DetailedPickRequestBatch(BaseModel):\n    model_config = ConfigDict(extra="forbid")\n    request_id: Optional[str] = None\n    response_mode: Literal["FULL", "COMPACT"] = "FULL"\n    rows: list[DetailedPickRequestRow] = Field(min_length=1, max_length=50)\n',
          )
          replace_once(
              detailed,
              '        base_batch = pick_runtime.PickRequestBatch(\n            request_id=batch.request_id,\n            rows=base_rows,\n        )\n',
              '        base_batch = pick_runtime.PickRequestBatch(\n            request_id=batch.request_id,\n            response_mode=batch.response_mode,\n            rows=base_rows,\n        )\n',
          )
          replace_once(
              detailed,
              '        if isinstance(result, dict) and isinstance(result.get("rows"), list):\n            for outcome in result["rows"]:\n',
              '        if isinstance(result, dict):\n            # The outer wrapper owns request-shape preservation. Never let a\n            # wrapper silently downgrade a client COMPACT request back to FULL.\n            result["response_mode"] = batch.response_mode\n\n        if batch.response_mode == "FULL" and isinstance(result, dict) and isinstance(result.get("rows"), list):\n            for outcome in result["rows"]:\n',
          )

          # 2) COMPACT rows are valid model packages even after nested result is stripped.
          top10 = 'artifacts/wow-engine/v17/top10_model_reconciliation.py'
          replace_once(
              top10,
              'def has_valid_model_package(outcome: dict[str, Any]) -> bool:\n    if outcome.get("model_evaluated") is not True:\n        return False\n    for package in _candidate_probability_dicts(outcome):\n',
              'def has_valid_model_package(outcome: dict[str, Any]) -> bool:\n    if outcome.get("model_evaluated") is not True:\n        return False\n    compact_lower = outcome.get("calibrated_probability_lower_bound")\n    if compact_lower is None:\n        compact_lower = outcome.get("calibrated_lower_bound")\n    if _finite_probability(outcome.get("calibrated_probability")) and _finite_probability(compact_lower):\n        return True\n    for package in _candidate_probability_dicts(outcome):\n',
          )

          # 3) Harden the actual COMPACT serializer denylist and preserve the bounded receipt fields.
          core = 'artifacts/wow-engine/pick_request_runtime_core.py'
          replace_once(
              core,
              '_PICK_REQUEST_COMPACT_DETAIL_KEYS = frozenset({"result", "detail", "acquisition", "specialist_utilization_audit"})\n',
              '_PICK_REQUEST_COMPACT_DETAIL_KEYS = frozenset({\n    "result", "detail", "acquisition", "specialist_utilization_audit",\n    "evidence", "acquisition_evidence", "box_score_log", "game_log",\n    "model_evidence", "failure_path_evidence", "directional_probability_assessments",\n    "v17_numerical_engine", "objective_lanes", "backend_traversal",\n    "detailed_evidence", "artifact_metadata", "training_metadata", "source_timestamps",\n})\n',
          )
          replace_once(
              core,
              '        for key in ("blocker_code", "failure_class", "blocker", "sport", "stat_type", "controlling_specialist"):\n',
              '        for key in (\n            "blocker_code", "failure_class", "blocker", "primary_blocker", "blockers",\n            "event_id", "event_start_time", "sport", "league", "player", "stat_type",\n            "line", "direction", "controlling_specialist",\n        ):\n',
          )
          replace_once(
              core,
              '        for source, mapping in ((prediction, {"raw_model_probability":"model_probability","calibrated_probability":"calibrated_probability","calibrated_probability_lower_bound":"calibrated_probability_lower_bound","calibration_status":"calibration_status","model_version":"model_version"}),(qualification, {"confidence_tier":"confidence_tier","rank_eligible":"rank_eligible","model_supported":"model_supported","terminal_label":"terminal_label"})):\n',
              '        for source, mapping in ((prediction, {"prediction_id":"prediction_id","raw_model_probability":"model_probability","calibrated_probability":"calibrated_probability","calibrated_probability_lower_bound":"calibrated_probability_lower_bound","calibrated_probability_upper_bound":"calibrated_probability_upper_bound","calibrated_upper_bound":"calibrated_probability_upper_bound","calibration_status":"calibration_status","model_version":"model_version"}),(qualification, {"confidence_tier":"confidence_tier","rank_eligible":"rank_eligible","model_supported":"model_supported","terminal_label":"terminal_label"})):\n',
          )
          replace_once(
              core,
              '    compact["detail_available"] = any(k in outcome for k in _PICK_REQUEST_COMPACT_DETAIL_KEYS)\n    compact["can_execute"] = False\n    return compact\n',
              '    detail_available = any(k in outcome for k in _PICK_REQUEST_COMPACT_DETAIL_KEYS)\n    compact["detail_available"] = detail_available\n    compact["detail_ref"] = {\n        "prediction_id": compact.get("prediction_id"),\n        "row_key": compact.get("row_key"),\n        "detail_available": detail_available,\n    }\n    compact["can_execute"] = False\n    return compact\n',
          )

          # 4) Canonical sporting identity for snapshot manifests. Snapshot/provider IDs are provenance, not identity.
          identity_path = root / 'artifacts/wow-engine/v17/prop_canonical_identity.py'
          identity_path.write_text(r'''"""Canonical sporting identity for V17 prop source instances.

Source snapshots and provider aliases are provenance.  They must not consume
multiple scoring slots for the same exact sporting proposition.  This module
never changes model math, calibration, terminal semantics, or can_execute.
"""
from __future__ import annotations

from datetime import datetime, timezone
from decimal import Decimal, InvalidOperation
from typing import Any, Iterable


_SPORT_ALIASES = {
    "CFB": "NCAAF",
    "COLLEGE_FOOTBALL": "NCAAF",
    "NCAA_FOOTBALL": "NCAAF",
}


def _text(value: Any) -> str:
    return "_".join(str(value or "").strip().upper().replace("-", " ").split())


def _player(value: Any) -> str:
    return " ".join(str(value or "").split()).casefold()


def _line(value: Any) -> str | None:
    try:
        return format(Decimal(str(value)).normalize(), "f")
    except (InvalidOperation, TypeError, ValueError):
        return None


def _time(value: Any) -> str:
    raw = str(value or "").strip()
    if not raw:
        return ""
    try:
        parsed = datetime.fromisoformat(raw.replace("Z", "+00:00"))
    except (TypeError, ValueError):
        return raw
    if parsed.utcoffset() is None:
        return raw
    return parsed.astimezone(timezone.utc).isoformat()


def canonical_sporting_key(row: dict[str, Any]) -> tuple[str, ...] | None:
    sport = _SPORT_ALIASES.get(_text(row.get("sport")), _text(row.get("sport")))
    event_id = str(row.get("event_id") or row.get("official_event_id") or "").strip()
    event_start = _time(row.get("event_start_time") or row.get("event_start_time_utc"))
    player = _player(row.get("player") or row.get("participant"))
    stat_type = _text(row.get("stat_type") or row.get("market_stat"))
    line = _line(row.get("line"))
    if not sport or not event_id or not event_start or not player or not stat_type or line is None:
        return None
    # Direction is intentionally optional here: Daily evidence snapshots are base
    # props before direction expansion, while directional Action rows include it.
    direction = _text(row.get("direction"))
    period = _text(row.get("period"))
    settlement = _text(row.get("settlement_identity") or row.get("settlement_basis"))
    return sport, event_id, event_start, player, stat_type, line, direction, period, settlement


def _snapshot_ids(row: dict[str, Any]) -> list[str]:
    values: list[str] = []
    for value in row.get("source_snapshot_ids") or []:
        text = str(value or "").strip()
        if text and text not in values:
            values.append(text)
    single = str(row.get("source_snapshot_id") or "").strip()
    if single and single not in values:
        values.append(single)
    return values


def _captured_at(row: dict[str, Any]) -> datetime:
    raw = str(row.get("captured_at") or "").strip()
    try:
        value = datetime.fromisoformat(raw.replace("Z", "+00:00"))
        if value.utcoffset() is not None:
            return value.astimezone(timezone.utc)
    except (TypeError, ValueError):
        pass
    return datetime.min.replace(tzinfo=timezone.utc)


def canonicalize_prop_manifest(rows: Iterable[dict[str, Any]]) -> list[dict[str, Any]]:
    selected: list[dict[str, Any]] = []
    index_by_key: dict[tuple[str, ...], int] = {}
    for raw in rows:
        row = dict(raw)
        key = canonical_sporting_key(row)
        ids = _snapshot_ids(row)
        if key is None:
            row["source_snapshot_ids"] = ids
            row["source_instance_count"] = max(len(ids), 1)
            row["canonical_sporting_key"] = None
            selected.append(row)
            continue

        index = index_by_key.get(key)
        if index is None:
            row["source_snapshot_ids"] = ids
            row["source_instance_count"] = max(len(ids), 1)
            row["canonical_sporting_key"] = "|".join(key)
            index_by_key[key] = len(selected)
            selected.append(row)
            continue

        current = selected[index]
        merged_ids = _snapshot_ids(current)
        for snapshot_id in ids:
            if snapshot_id not in merged_ids:
                merged_ids.append(snapshot_id)

        # Score the freshest source instance while preserving every source link.
        if _captured_at(row) > _captured_at(current):
            replacement = row
            replacement["canonical_sporting_key"] = current.get("canonical_sporting_key")
            selected[index] = replacement
            current = replacement
        current["source_snapshot_ids"] = merged_ids
        current["source_instance_count"] = max(len(merged_ids), 1)

    return selected


def canonical_source_snapshot_ids(rows: Iterable[dict[str, Any]]) -> set[str]:
    ids: set[str] = set()
    for row in rows:
        ids.update(_snapshot_ids(row))
    return ids


__all__ = [
    "canonical_sporting_key",
    "canonicalize_prop_manifest",
    "canonical_source_snapshot_ids",
]
''', encoding='utf-8')


name: tmp-nfl-render-self-acceptance-patch
on:
  push:
    branches: [fix/v17-nfl-prop-render-self-acceptance-20260920]
    paths: [.github/workflows/tmp-nfl-render-self-acceptance-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v17-nfl-prop-render-self-acceptance-20260920
      - name: Patch family-aware production self acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/wow-engine/prop_live_model_acceptance.py')
          s=p.read_text()
          s=s.replace('def _is_governed_model_path_pass(body: dict[str, Any]) -> tuple[bool, str | None]:', 'def _is_governed_model_path_pass(\n    body: dict[str, Any],\n    *,\n    expected_model_family: str = "MLB_PITCHER_SO_FAILURE_PATH_NB_V1",\n) -> tuple[bool, str | None]:')
          s=s.replace('and model.get("model_family") == "MLB_PITCHER_SO_FAILURE_PATH_NB_V1"', 'and model.get("model_family") == expected_model_family', 1)
          s=s.replace('def _is_research_only_model_path_pass(body: dict[str, Any]) -> bool:', 'def _is_research_only_model_path_pass(\n    body: dict[str, Any],\n    *,\n    expected_model_family: str = "MLB_PITCHER_SO_FAILURE_PATH_NB_V1",\n) -> bool:')
          s=s.replace('and research.get("model_family") == "MLB_PITCHER_SO_FAILURE_PATH_NB_V1"', 'and research.get("model_family") == expected_model_family', 1)
          anchor='def _is_bootstrap_pick_pass(response: httpx.Response) -> tuple[bool, str, str | None, str]:\n'
          helper='''def _expected_bootstrap_model_family(payload: dict[str, Any]) -> str:\n    rows = payload.get("rows") if isinstance(payload.get("rows"), list) else []\n    row = rows[0] if rows and isinstance(rows[0], dict) else {}\n    sport = str(row.get("sport") or "").strip().upper()\n    stat = "_".join(str(row.get("stat_type") or "").strip().upper().replace("-", " ").split())\n    nfl_aliases = {\n        "PASS_YARDS", "PASSING_YARDS", "RUSH_YARDS", "RUSHING_YARDS",\n        "REC_YARDS", "RECEIVING_YARDS", "ANYTIME_TD", "ANYTIME_TDS",\n        "ANYTIME_TOUCHDOWN", "ANYTIME_TOUCHDOWNS",\n    }\n    if sport == "NFL" and stat in nfl_aliases:\n        return "NFL_PROP_ROLLING_FITTED_V1"\n    return "MLB_PITCHER_SO_FAILURE_PATH_NB_V1"\n\n\ndef _is_bootstrap_pick_pass(\n    response: httpx.Response,\n    *,\n    expected_model_family: str = "MLB_PITCHER_SO_FAILURE_PATH_NB_V1",\n) -> tuple[bool, str, str | None, str]:\n'''
          if anchor not in s: raise SystemExit('bootstrap pass anchor missing')
          s=s.replace(anchor, helper, 1)
          s=s.replace('if row.get("code") == "MODEL_QUALIFIED_HOLD" and _is_research_only_model_path_pass(result):', 'if row.get("code") == "MODEL_QUALIFIED_HOLD" and _is_research_only_model_path_pass(\n        result, expected_model_family=expected_model_family\n    ):', 1)
          s=s.replace('governed_ok, prediction_id = _is_governed_model_path_pass(result)', 'governed_ok, prediction_id = _is_governed_model_path_pass(\n        result, expected_model_family=expected_model_family\n    )', 1)
          old='passed, last_code, last_snapshot, last_mode = _is_bootstrap_pick_pass(response)'
          new='passed, last_code, last_snapshot, last_mode = _is_bootstrap_pick_pass(\n                response, expected_model_family=_expected_bootstrap_model_family(payload)\n            )'
          if old not in s: raise SystemExit('bootstrap call anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('artifacts/wow-engine/test_nfl_prop_live_acceptance_family.py')
          t.write_text('''from prop_live_model_acceptance import _expected_bootstrap_model_family, _is_governed_model_path_pass\n\n\ndef test_nfl_bootstrap_selects_exact_fitted_family():\n    payload={"rows":[{"sport":"NFL","stat_type":"Rush Yards"}]}\n    assert _expected_bootstrap_model_family(payload)=="NFL_PROP_ROLLING_FITTED_V1"\n\n\ndef test_governed_checker_accepts_nfl_family_only_when_explicit():\n    body={\n        "ok":True,\n        "prediction":{"prediction_id":"nfl-test"},\n        "model_evidence":{\n            "provider_identity":"WOW_PROP_FITTED_MODEL_V1",\n            "model_family":"NFL_PROP_ROLLING_FITTED_V1",\n            "calibration_status":"PRECALIBRATION_SHRINKAGE",\n            "probability_publishable":True,\n            "can_execute":False,\n        },\n        "objective_lanes":{"MODEL":{"status":"PASS","probability_publishable":True,"can_execute":False}},\n        "can_execute":False,\n    }\n    ok,pid=_is_governed_model_path_pass(body, expected_model_family="NFL_PROP_ROLLING_FITTED_V1")\n    assert ok is True and pid=="nfl-test"\n    old_ok,_=_is_governed_model_path_pass(body)\n    assert old_ok is False\n''')
          PY
          rm .github/workflows/tmp-nfl-render-self-acceptance-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/wow-engine/prop_live_model_acceptance.py artifacts/wow-engine/test_nfl_prop_live_acceptance_family.py .github/workflows/tmp-nfl-render-self-acceptance-patch.yml
          git commit -m 'fix(v17): make prop self-acceptance NFL-family aware'
          git push origin HEAD:fix/v17-nfl-prop-render-self-acceptance-20260920

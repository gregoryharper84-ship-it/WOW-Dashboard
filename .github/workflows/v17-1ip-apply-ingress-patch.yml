name: v17-1ip-apply-ingress-patch

on:
  push:
    branches:
      - chatgpt/v17-1ip-production-capability-20260901
    paths:
      - "artifacts/wow-engine/scripts/apply_1ip_ingress_patch.py"
      - ".github/workflows/v17-1ip-apply-ingress-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v17-1ip-production-capability-20260901
      - name: Apply deterministic ingress patch
        run: python artifacts/wow-engine/scripts/apply_1ip_ingress_patch.py
      - name: Commit generated source edit
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/wow-engine/pick_request_runtime.py
          git commit -m "v17 1IP: wire live acquisition into canonical pick ingress"
          git push origin HEAD:chatgpt/v17-1ip-production-capability-20260901

name: v17-durable-daily-patch-once

on:
  push:
    branches:
      - fix/v17-durable-daily-full-board
    paths:
      - .github/workflows/v17-durable-daily-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v17-durable-daily-full-board
          fetch-depth: 0
      - name: Apply deterministic Class-B durable Daily Action patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          openapi = root / 'artifacts/wow-engine/v17/openapi.wow-betting-engine.v17.yaml'
          instructions = root / 'artifacts/wow-engine/WOW_V17_CUSTOM_GPT_INSTRUCTIONS.txt'
          builder = root / 'artifacts/wow-engine/v17/build_gpt_editor_sync_packet.py'
          sync_doc = root / 'artifacts/wow-engine/V17_CUSTOM_GPT_EDITOR_SYNC.md'
          attestation = root / 'artifacts/wow-engine/v17/WOW_BETTING_ENGINE_EDITOR_ATTESTATION.md'
          packet_test = root / 'artifacts/wow-engine/v17/test_gpt_editor_sync_packet.py'
          contract_test = root / 'artifacts/wow-engine/v17/test_v17_daily_async_action_contract.py'
          workflow = root / '.github/workflows/v17-durable-daily-patch-once.yml'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # 1. Canonical single-domain Action schema: expose the existing durable
          # Daily submit/status transport. Keep the synchronous bounded route for
          # explicit small diagnostics only.
          text = openapi.read_text(encoding='utf-8')
          if 'operationId: submitWowV17DailySnapshot' in text or 'operationId: getWowV17DailySnapshotRun' in text:
              raise SystemExit('async Daily operations already present; refusing duplicate patch')
          path_anchor = '  /v17/daily-snapshot-run:\n'
          async_paths = '''  /v17/daily-snapshot-submit:\n    post:\n      operationId: submitWowV17DailySnapshot\n      x-openai-isConsequential: false\n      description: >-\n        Durable asynchronous Daily submission for current/full-board work. Persists\n        the bounded Daily request and returns a run_id immediately; poll\n        getWowV17DailySnapshotRun until terminal. No wager execution authority.\n      security: [{actionBearer: []}]\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: {$ref: '#/components/schemas/AsyncDailySubmitRequest'}\n      responses:\n        '202': {description: Durable Daily request queued with run_id}\n        '401': {description: Authentication failed}\n        '503': {description: Durable Daily submission persistence unavailable}\n  /v17/daily-snapshot-run/{run_id}:\n    get:\n      operationId: getWowV17DailySnapshotRun\n      x-openai-isConsequential: false\n      description: >-\n        Read durable asynchronous Daily state by run_id. Poll until COMPLETED or\n        FAILED; terminal result preserves the existing governed Daily receipt.\n      security: [{actionBearer: []}]\n      parameters:\n        - name: run_id\n          in: path\n          required: true\n          schema: {type: string}\n      responses:\n        '200': {description: Durable Daily queue/run state and terminal result when available}\n        '401': {description: Authentication failed}\n        '404': {description: Durable Daily run not found}\n        '503': {description: Durable Daily status service unavailable}\n'''
          text = replace_once(text, path_anchor, async_paths + path_anchor, 'openapi path anchor')
          schema_anchor = '    DailySnapshotRequest:\n'
          async_schema = '''    AsyncDailySubmitRequest:\n      type: object\n      additionalProperties: false\n      required: [requested_slate_date, requested_timezone]\n      properties:\n        requested_slate_date: {type: string, format: date}\n        requested_timezone: {type: string, minLength: 1, maxLength: 64}\n        lanes:\n          type: array\n          items: {type: string, enum: [PROPS, MONEYLINE]}\n          default: [PROPS, MONEYLINE]\n        max_props: {type: integer, minimum: 0, maximum: 12, default: 6}\n        max_team_events: {type: integer, minimum: 0, maximum: 12, default: 6}\n        response_mode: {type: string, enum: [COMPACT, FULL], default: COMPACT}\n        idempotency_key: {type: [string, 'null'], minLength: 8, maxLength: 128}\n'''
          text = replace_once(text, schema_anchor, async_schema + schema_anchor, 'openapi schema anchor')
          openapi.write_text(text, encoding='utf-8')

          # 2. Host routing: full/current-board discovery must use the durable Daily
          # queue, not the long synchronous Daily Action.
          text = instructions.read_text(encoding='utf-8')
          instruction_anchor = '- Large boards: runWowV17ResumablePickRequest freezes the manifest; poll getWowV17PickRequestRunState; use /score-pick-request <=50-row batches. Resume by request_id, never chat memory; closeWowV17PickRequestRun persists closure.\n'
          daily_rule = '- Full current-board/all-sport scans: call submitWowV17DailySnapshot first and poll getWowV17DailySnapshotRun to terminal before row scoring/recovery. Do not start full-board work with synchronous runWowV17DailySnapshot; reserve it for explicitly bounded/small diagnostics.\n'
          text = replace_once(text, instruction_anchor, daily_rule + instruction_anchor, 'instruction anchor')
          instructions.write_text(text, encoding='utf-8')

          # 3. Deterministic editor packet: 23 ops and mandatory durable Daily ops.
          text = builder.read_text(encoding='utf-8')
          text = replace_once(text, 'REQUIRED_OPERATION_COUNT = 21', 'REQUIRED_OPERATION_COUNT = 23', 'builder count')
          op_anchor = '    "getWowV17BackendHealth",\n'
          text = replace_once(text, op_anchor, op_anchor + '    "submitWowV17DailySnapshot",\n    "getWowV17DailySnapshotRun",\n', 'builder required operations')
          text = replace_once(text, '"IMPORT_SINGLE_CANONICAL_ACTION_SCHEMA_WITH_21_OPERATIONS",', '"IMPORT_SINGLE_CANONICAL_ACTION_SCHEMA_WITH_23_OPERATIONS",', 'builder acceptance count')
          acceptance_anchor = '            "FRESH_CHAT_GET_WOW_V17_BACKEND_HEALTH",\n'
          text = replace_once(text, acceptance_anchor, acceptance_anchor + '            "FRESH_CHAT_SUBMIT_AND_POLL_DURABLE_WOW_V17_DAILY_SNAPSHOT",\n', 'builder daily acceptance')
          builder.write_text(text, encoding='utf-8')

          # 4. Repository editor-sync contract and attestation.
          text = sync_doc.read_text(encoding='utf-8')
          text = text.replace('exactly **21**', 'exactly **23**')
          text = text.replace('all **21** WOW operations', 'all **23** WOW operations')
          text = text.replace('single canonical 21-operation Action schema', 'single canonical 23-operation Action schema')
          text = text.replace('exposing all 21 operations', 'exposing all 23 operations')
          insertion = '- The same single Action group exposes durable Daily full-board transport:\n  - `/v17/daily-snapshot-submit` -> `submitWowV17DailySnapshot`\n  - `/v17/daily-snapshot-run/{run_id}` -> `getWowV17DailySnapshotRun`\n- Full current-board/all-sport scans must submit through the durable Daily route and poll to terminal; the synchronous Daily route remains bounded diagnostic transport only.\n'
          sync_anchor = '- The same single Action group exposes the research-only NCAAF spread forward-shadow operation:\n'
          text = replace_once(text, sync_anchor, insertion + sync_anchor, 'sync doc daily insertion')
          acceptance = '5. `submitWowV17DailySnapshot` and `getWowV17DailySnapshotRun` are visible; a full-board canary creates a durable run_id and polls it to terminal;\n'
          text = text.replace('5. `getWowV17PickRequestRunState`', acceptance + '6. `getWowV17PickRequestRunState`', 1)
          text = text.replace('6. `scoreWowV17SpreadForwardShadow`', '7. `scoreWowV17SpreadForwardShadow`', 1)
          text = text.replace('7. `runWowV17NFLPickemBoard`', '8. `runWowV17NFLPickemBoard`', 1)
          text = text.replace('8. a multi-page', '9. a multi-page', 1)
          text = text.replace('9. required V17 diagnostics', '10. required V17 diagnostics', 1)
          text = text.replace('10. `can_execute=false`', '11. `can_execute=false`', 1)
          sync_doc.write_text(text, encoding='utf-8')

          text = attestation.read_text(encoding='utf-8')
          text = text.replace('SINGLE_DOMAIN_SINGLE_ACTION_SET_20_OPERATIONS', 'SINGLE_DOMAIN_SINGLE_ACTION_SET_23_OPERATIONS')
          text = text.replace('exact 20-operation Action surface', 'exact 23-operation Action surface')
          text = text.replace('single canonical 20-operation WOW Action schema', 'single canonical 23-operation WOW Action schema')
          text = text.replace('importing the single canonical 20-operation WOW Action schema', 'importing the single canonical 23-operation WOW Action schema')
          att_anchor = '/score-pick-request operationId = scoreWowPickRequest\n'
          text = replace_once(text, att_anchor, att_anchor + '/v17/daily-snapshot-submit operationId = submitWowV17DailySnapshot\n/v17/daily-snapshot-run/{run_id} operationId = getWowV17DailySnapshotRun\n', 'attestation daily operations')
          paragraph_anchor = 'The three run-control operations and the research-only NCAAF spread forward-shadow operation are merged into the canonical primary schema for live-editor installation; the standalone run-control schema remains a repository/reference contract only.\n'
          paragraph_new = 'The durable Daily submit/status operations, three run-control operations, NFL pick\'em operation, and research-only NCAAF spread forward-shadow operation are merged into the canonical primary schema for live-editor installation; the standalone run-control schema remains a repository/reference contract only. Full current-board requests must prefer durable Daily submit/poll over the long synchronous Daily route.\n'
          text = replace_once(text, paragraph_anchor, paragraph_new, 'attestation orchestration paragraph')
          attestation.write_text(text, encoding='utf-8')

          # 5. Deterministic packet tests.
          text = packet_test.read_text(encoding='utf-8')
          text = text.replace('module.REQUIRED_OPERATION_COUNT == 21', 'module.REQUIRED_OPERATION_COUNT == 23')
          text = text.replace('manifest["action_operation_count"] == 21', 'manifest["action_operation_count"] == 23')
          text = text.replace('"IMPORT_SINGLE_CANONICAL_ACTION_SCHEMA_WITH_21_OPERATIONS"', '"IMPORT_SINGLE_CANONICAL_ACTION_SCHEMA_WITH_23_OPERATIONS"')
          test_anchor = '    assert "FRESH_CHAT_SCORE_WOW_V17_SPREAD_FORWARD_SHADOW" in manifest["acceptance_required"]\n'
          text = replace_once(text, test_anchor, '    assert "FRESH_CHAT_SUBMIT_AND_POLL_DURABLE_WOW_V17_DAILY_SNAPSHOT" in manifest["acceptance_required"]\n' + test_anchor, 'packet test acceptance')
          packet_test.write_text(text, encoding='utf-8')

          # 6. Focused contract regression: live schema exposes durable Daily
          # transport and instructions forbid synchronous-first full-board flow.
          contract_test.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nSCHEMA = ROOT / "openapi.wow-betting-engine.v17.yaml"\nINSTRUCTIONS = ROOT.parent / "WOW_V17_CUSTOM_GPT_INSTRUCTIONS.txt"\n\n\ndef test_canonical_action_exposes_durable_daily_submit_and_status():\n    text = SCHEMA.read_text(encoding="utf-8")\n    assert text.count("operationId:") == 23\n    assert "operationId: submitWowV17DailySnapshot" in text\n    assert "operationId: getWowV17DailySnapshotRun" in text\n    assert "schema: {$ref: '#/components/schemas/AsyncDailySubmitRequest'}" in text\n    assert "x-openai-isConsequential: false" in text\n\n\ndef test_full_board_instructions_prefer_durable_daily_transport():\n    text = INSTRUCTIONS.read_text(encoding="utf-8")\n    assert "Full current-board/all-sport scans: call submitWowV17DailySnapshot first" in text\n    assert "poll getWowV17DailySnapshotRun to terminal" in text\n    assert "Do not start full-board work with synchronous runWowV17DailySnapshot" in text\n    assert "can_execute=false" in text\n''', encoding='utf-8')

          # Ensure the editor packet remains inside the product safety margin.
          size = len(instructions.read_bytes())
          if size > 7500:
              raise SystemExit(f'instructions exceed byte safety ceiling after patch: {size}')

          # Remove this one-shot workflow from the final PR diff.
          workflow.unlink()
          PY

          git config user.name "WOW Engineering Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose durable Daily Actions for V17 full-board orchestration"
          git push origin HEAD:fix/v17-durable-daily-full-board

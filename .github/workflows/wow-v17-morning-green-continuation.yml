name: wow-v17-morning-green-continuation

on:
  workflow_run:
    workflows: ["wow-verify", "wow-engine-verify"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional Morning-Green PR number to evaluate immediately
        required: false

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: wow-v17-morning-green-${{ github.event.workflow_run.head_sha || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  continue-repair:
    name: Resume Morning-Green repair after CI
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve eligible Morning-Green PR
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_PR: ${{ inputs.pr_number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${EXPLICIT_PR:-}" ]; then
            pr_number="$EXPLICIT_PR"
          else
            pr_number=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '[.[] | select(.head.sha == env.EVENT_HEAD_SHA and .head.repo.full_name == env.GITHUB_REPOSITORY)] | first | .number // empty')
          fi
          if [ -z "${pr_number:-}" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No open same-repository PR matches this completed CI head SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          body=$(jq -r '.body // ""' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          draft=$(jq -r '.draft' <<<"$pr_json")
          state=$(jq -r '.state' <<<"$pr_json")
          if [ "$state" != "open" ] || [ "$draft" != "false" ] || [ "$base_ref" != "main" ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Fq 'Morning-Green-Autonomous: true' <<<"$body"; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          risk=$(sed -n 's/^Morning-Green-Risk:[[:space:]]*//p' <<<"$body" | head -n1 | tr -d '\r')
          case "$risk" in R0|R1|R2-restorative) ;; *) echo "eligible=false" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          acceptance=$(sed -n 's/^Morning-Green-Acceptance-Workflow:[[:space:]]*//p' <<<"$body" | head -n1 | tr -d '\r')
          case "${acceptance:-none}" in none|wow-v17-nightly-multiscout.yml|wow-v17-nightly-engineering-scan.yml) ;; *) echo "eligible=false" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
          echo "acceptance=${acceptance:-none}" >> "$GITHUB_OUTPUT"

      - name: Re-verify all protected checks on exact head SHA
        id: gates
        if: steps.resolve.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          checks=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" -H 'Accept: application/vnd.github+json' --jq '.check_runs')
          required=("WOW governed probability backend" "WOW required-three regression" "WOW additional required regression")
          ready=true
          failed=false
          failed_json='[]'
          pending_json='[]'
          for name in "${required[@]}"; do
            latest=$(jq --arg name "$name" '[.[] | select(.name == $name)] | sort_by(.started_at // .created_at) | last // {}' <<<"$checks")
            status=$(jq -r '.status // "missing"' <<<"$latest")
            conclusion=$(jq -r '.conclusion // "missing"' <<<"$latest")
            details_url=$(jq -r '.details_url // ""' <<<"$latest")
            check_id=$(jq -r '.id // empty' <<<"$latest")
            summary=$(jq -r '.output.summary // .output.text // ""' <<<"$latest" | tr '\n' ' ' | cut -c1-1000)
            echo "${name}: status=${status} conclusion=${conclusion}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "completed" ]; then
              ready=false
              pending_json=$(jq --arg name "$name" --arg status "$status" --arg details "$details_url" '. + [{name:$name,status:$status,details_url:$details}]' <<<"$pending_json")
            elif [ "$conclusion" != "success" ]; then
              failed=true
              failed_json=$(jq --arg name "$name" --arg conclusion "$conclusion" --arg details "$details_url" --arg check_id "$check_id" --arg summary "$summary" '. + [{name:$name,conclusion:$conclusion,details_url:$details,check_id:$check_id,summary:$summary}]' <<<"$failed_json")
            fi
          done
          echo "failed_checks=$(jq -c . <<<"$failed_json")" >> "$GITHUB_OUTPUT"
          echo "pending_checks=$(jq -c . <<<"$pending_json")" >> "$GITHUB_OUTPUT"
          if [ "$failed" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ready" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted Morning-Green guard from protected main
        if: steps.resolve.outputs.eligible == 'true' && steps.gates.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify Morning-Green diff scope
        id: scope
        if: steps.resolve.outputs.eligible == 'true' && steps.gates.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RISK: ${{ steps.resolve.outputs.risk }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wow-scope"
          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          actual_head=$(jq -r '.head.sha' <<<"$pr_json")
          jq -r '.body // ""' <<<"$pr_json" > "$RUNNER_TEMP/wow-scope/pr-body.md"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[]' \
            | jq -s '.' > "$RUNNER_TEMP/wow-scope/pr-files.json"
          python -m py_compile .github/scripts/morning_green_scope_guard.py
          set +e
          python .github/scripts/morning_green_scope_guard.py \
            --body-file "$RUNNER_TEMP/wow-scope/pr-body.md" \
            --files-json "$RUNNER_TEMP/wow-scope/pr-files.json" \
            --protected-paths .github/morning-green-protected-paths.txt \
            --risk "$RISK" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --actual-head "$actual_head" \
            | tee "$RUNNER_TEMP/wow-scope/scope-result.json"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$RUNNER_TEMP/wow-scope/scope-result.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "Morning-Green autonomous merge denied by diff-scope guard." >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

      - name: Persist machine-readable closure state
        id: closure
        if: always() && steps.resolve.outputs.eligible == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RISK: ${{ steps.resolve.outputs.risk }}
          READY: ${{ steps.gates.outputs.ready }}
          FAILED: ${{ steps.gates.outputs.failed }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          FAILED_CHECKS: ${{ steps.gates.outputs.failed_checks }}
          PENDING_CHECKS: ${{ steps.gates.outputs.pending_checks }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wow-closure"
          state="CI_WAIT"
          if [ "${FAILED:-false}" = "true" ]; then state="CI_REWORK"; elif [ "${SCOPE_OUTCOME:-skipped}" = "failure" ]; then state="SCOPE_REWORK"; elif [ "${READY:-false}" = "true" ] && [ "${SCOPE_OUTCOME:-skipped}" = "success" ]; then state="MERGING"; fi
          jq -n --arg incident_id "PR-${PR_NUMBER}" --arg risk "$RISK" --arg state "$state" --arg head_sha "$HEAD_SHA" --argjson failed_checks "${FAILED_CHECKS:-[]}" --argjson pending_checks "${PENDING_CHECKS:-[]}" '{incident_id:$incident_id,risk:$risk,state:$state,head_sha:$head_sha,failed_checks:$failed_checks,pending_checks:$pending_checks,can_execute:false}' > "$RUNNER_TEMP/wow-closure/closure-state.json"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/wow-closure/closure-state.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload closure state evidence
        if: always() && steps.resolve.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-closure-state-${{ steps.resolve.outputs.pr_number }}-${{ steps.resolve.outputs.head_sha }}
          path: ${{ runner.temp }}/wow-closure/closure-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve nonterminal Morning-Green state without poisoning main deploy checks
        if: always() && steps.resolve.outputs.eligible == 'true' && (steps.gates.outputs.ready != 'true' || steps.scope.outcome != 'success')
        shell: bash
        env:
          CLOSURE_STATE: ${{ steps.closure.outputs.state }}
          INCIDENT_HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          echo "Morning-Green incident remains nonterminal (${CLOSURE_STATE}) on ${INCIDENT_HEAD_SHA}. Merge remains blocked; durable closure evidence has been persisted. The workflow_run continuation check is attached by GitHub to protected main, so this deferred state must not fail and poison an unrelated production checksPass deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "deferred=true" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Merge protected Morning-Green repair
        id: merge
        if: steps.resolve.outputs.eligible == 'true' && steps.gates.outputs.ready == 'true' && steps.scope.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
          merge_sha=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha')
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Resume required main checks after bot merge
        if: steps.merge.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run wow-engine-verify.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run wow-verify.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run wow-v17-render-production-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Resume whitelisted acceptance workflow after bot merge
        if: steps.merge.outcome == 'success' && steps.resolve.outputs.acceptance != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_WORKFLOW: ${{ steps.resolve.outputs.acceptance }}
        run: |
          set -euo pipefail
          gh workflow run "$ACCEPTANCE_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main

      - name: Record resumable continuation state
        if: always() && steps.resolve.outputs.eligible == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          RISK: ${{ steps.resolve.outputs.risk }}
          ACCEPTANCE: ${{ steps.resolve.outputs.acceptance }}
          READY: ${{ steps.gates.outputs.ready }}
          FAILED: ${{ steps.gates.outputs.failed }}
          CLOSURE_STATE: ${{ steps.closure.outputs.state }}
        run: |
          {
            echo "### Morning-Green continuation"
            echo "- PR: #${PR_NUMBER}"
            echo "- Head SHA: ${HEAD_SHA}"
            echo "- Merge SHA: ${MERGE_SHA:-not-merged}"
            echo "- Risk: ${RISK}"
            echo "- Acceptance workflow: ${ACCEPTANCE:-none}"
            echo "- Closure state: ${CLOSURE_STATE:-unknown}"
            echo "- Required checks ready: ${READY:-false}"
            echo "- Required check failure detected: ${FAILED:-false}"
            echo "- can_execute: false"
          } >> "$GITHUB_STEP_SUMMARY"

name: wow-v17-morning-green-continuation

on:
  workflow_run:
    workflows: ["wow-verify", "wow-engine-verify"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional Morning-Green PR number to evaluate immediately
        required: false

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: wow-v17-morning-green-${{ github.event.workflow_run.head_sha || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  continue-repair:
    name: Resume Morning-Green repair after CI
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve eligible Morning-Green PR
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_PR: ${{ inputs.pr_number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -n "${EXPLICIT_PR:-}" ]; then
            pr_number="$EXPLICIT_PR"
          elif [ -n "${EVENT_HEAD_SHA:-}" ]; then
            pr_number=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
              --jq '[.[] | select(.head.sha == env.EVENT_HEAD_SHA and .head.repo.full_name == env.GITHUB_REPOSITORY)] | first | .number // empty')
          else
            pr_number=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
              --jq '[.[] | select(.draft == false and .head.repo.full_name == env.GITHUB_REPOSITORY and ((.body // "") | contains("Morning-Green-Autonomous: true")))] | sort_by(.created_at) | first | .number // empty')
          fi

          if [ -z "${pr_number:-}" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No eligible open same-repository Morning-Green PR found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr_json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          body=$(jq -r '.body // ""' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          draft=$(jq -r '.draft' <<<"$pr_json")
          state=$(jq -r '.state' <<<"$pr_json")

          if [ "$state" != "open" ] || [ "$draft" != "false" ] || [ "$base_ref" != "main" ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "PR #${pr_number} is not an open, non-draft, same-repository PR targeting main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! grep -Fq 'Morning-Green-Autonomous: true' <<<"$body"; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "PR #${pr_number} is not explicitly authorized for Morning-Green autonomous continuation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          risk=$(sed -n 's/^Morning-Green-Risk:[[:space:]]*//p' <<<"$body" | head -n1 | tr -d '\r')
          case "$risk" in
            R0|R1|R2-restorative) ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "PR #${pr_number} has missing or non-autonomous Morning-Green risk classification: ${risk:-unset}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          acceptance=$(sed -n 's/^Morning-Green-Acceptance-Workflow:[[:space:]]*//p' <<<"$body" | head -n1 | tr -d '\r')
          case "${acceptance:-none}" in
            none|wow-v17-nightly-multiscout.yml|wow-v17-nightly-engineering-scan.yml) ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "PR #${pr_number} requested non-whitelisted acceptance workflow: ${acceptance}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
          echo "acceptance=${acceptance:-none}" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #${pr_number} at ${head_sha} as autonomous ${risk}; acceptance=${acceptance:-none}." >> "$GITHUB_STEP_SUMMARY"

      - name: Re-verify all protected checks on exact head SHA
        id: gates
        if: steps.resolve.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail

          checks=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            -H 'Accept: application/vnd.github+json' \
            --jq '.check_runs')

          required=(
            "WOW governed probability backend"
            "WOW required-three regression"
            "WOW additional required regression"
          )

          ready=true
          failed=false
          failed_names=""
          failed_job_ids=""
          for name in "${required[@]}"; do
            latest=$(jq --arg name "$name" '[.[] | select(.name == $name)] | sort_by(.started_at // .created_at) | last // {}' <<<"$checks")
            status=$(jq -r '.status // "missing"' <<<"$latest")
            conclusion=$(jq -r '.conclusion // "missing"' <<<"$latest")
            details_url=$(jq -r '.details_url // ""' <<<"$latest")
            echo "${name}: status=${status} conclusion=${conclusion}" >> "$GITHUB_STEP_SUMMARY"

            if [ "$status" != "completed" ]; then
              ready=false
            elif [ "$conclusion" != "success" ]; then
              failed=true
              ready=false
              failed_names="${failed_names}${failed_names:+|}${name}"
              job_id=$(sed -n 's#.*\/job\/\([0-9][0-9]*\).*#\1#p' <<<"$details_url")
              if [ -n "$job_id" ]; then
                failed_job_ids="${failed_job_ids}${failed_job_ids:+,}${job_id}"
              fi
            fi
          done

          echo "failed_names=$failed_names" >> "$GITHUB_OUTPUT"
          echo "failed_job_ids=$failed_job_ids" >> "$GITHUB_OUTPUT"

          if [ "$failed" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "At least one protected check failed. Morning-Green will retry once, then surface deterministic engineering rework; no merge attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$ready" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "Not all protected checks are complete yet. A later workflow_run completion or scheduled rescan will resume this repair." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo "All three protected checks are successful on exact head SHA ${HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"

      - name: Retry failed protected CI once
        id: retry
        if: steps.resolve.outputs.eligible == 'true' && steps.gates.outputs.failed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          FAILED_NAMES: ${{ steps.gates.outputs.failed_names }}
          FAILED_JOB_IDS: ${{ steps.gates.outputs.failed_job_ids }}
        run: |
          set -euo pipefail
          retry_marker="Morning-Green-CI-Retry: ${HEAD_SHA}"
          rework_marker="Morning-Green-Rework-Required: ${HEAD_SHA}"
          comments=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[].body // ""')

          if ! grep -Fq "$retry_marker" <<<"$comments"; then
            retried=0
            IFS=',' read -ra ids <<<"${FAILED_JOB_IDS:-}"
            for job_id in "${ids[@]}"; do
              [ -n "$job_id" ] || continue
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/rerun"
              retried=$((retried + 1))
            done
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "${retry_marker}

Protected CI failed on exact head ${HEAD_SHA}: ${FAILED_NAMES:-unknown}. Morning-Green automatically requested one bounded retry (${retried} job(s)). If the same exact-head failure persists, the repair remains open and is explicitly returned to engineering rework rather than reported as running or complete. can_execute=false."
            echo "retry_dispatched=true" >> "$GITHUB_OUTPUT"
            echo "Automatically retried ${retried} failed protected job(s) once for ${HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "retry_dispatched=false" >> "$GITHUB_OUTPUT"
          if ! grep -Fq "$rework_marker" <<<"$comments"; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "${rework_marker}

The bounded automatic CI retry for exact head ${HEAD_SHA} did not clear: ${FAILED_NAMES:-unknown}. Current state is CI_FAILED_REWORK_REQUIRED, not running and not complete. The next engineering continuation must inspect the exact failed job/log and make the smallest safe repair before rerunning protected CI. can_execute=false."
          fi
          echo "Repeated protected failure is now explicitly queued as engineering rework." >> "$GITHUB_STEP_SUMMARY"

      - name: Merge protected Morning-Green repair
        id: merge
        if: steps.resolve.outputs.eligible == 'true' && steps.gates.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --match-head-commit "$HEAD_SHA"
          merge_sha=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha')
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Merged Morning-Green PR #${PR_NUMBER} as ${merge_sha} after exact-SHA protected-check verification." >> "$GITHUB_STEP_SUMMARY"

      - name: Resume required main checks after bot merge
        if: steps.merge.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run wow-engine-verify.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run wow-verify.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Explicitly dispatched both protected main verification workflows because GITHUB_TOKEN-authored merges do not recursively trigger normal push workflows." >> "$GITHUB_STEP_SUMMARY"

      - name: Resume whitelisted acceptance workflow after bot merge
        if: steps.merge.outcome == 'success' && steps.resolve.outputs.acceptance != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_WORKFLOW: ${{ steps.resolve.outputs.acceptance }}
        run: |
          set -euo pipefail
          gh workflow run "$ACCEPTANCE_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched whitelisted post-merge acceptance workflow: ${ACCEPTANCE_WORKFLOW}." >> "$GITHUB_STEP_SUMMARY"

      - name: Record resumable continuation state
        if: always() && steps.resolve.outputs.eligible == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          RISK: ${{ steps.resolve.outputs.risk }}
          ACCEPTANCE: ${{ steps.resolve.outputs.acceptance }}
          READY: ${{ steps.gates.outputs.ready }}
          FAILED: ${{ steps.gates.outputs.failed }}
          RETRY_DISPATCHED: ${{ steps.retry.outputs.retry_dispatched }}
        run: |
          {
            echo "### Morning-Green continuation"
            echo "- PR: #${PR_NUMBER}"
            echo "- Head SHA: ${HEAD_SHA}"
            echo "- Merge SHA: ${MERGE_SHA:-not-merged}"
            echo "- Risk: ${RISK}"
            echo "- Acceptance workflow: ${ACCEPTANCE:-none}"
            echo "- Required checks ready: ${READY:-false}"
            echo "- Required check failure detected: ${FAILED:-false}"
            echo "- Automatic CI retry dispatched: ${RETRY_DISPATCHED:-false}"
            echo "- can_execute: false"
          } >> "$GITHUB_STEP_SUMMARY"

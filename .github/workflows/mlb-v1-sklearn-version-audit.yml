name: MLB V1 sklearn version audit

on:
  push:
    branches:
      - research/mlb-v1-repro-20260827
    paths:
      - ".github/workflows/mlb-v1-sklearn-version-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sklearn: ["1.5.2", "1.6.1", "1.7.2", "1.8.0", "1.9.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install versioned sklearn
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-learn==${{ matrix.sklearn }}" joblib
      - name: Reproduce fingerprint
        run: |
          python research/mlb-v1-repro/mlb_v1_reproduce_and_v11.py \
            --out "research/mlb-v1-version-${{ matrix.sklearn }}" \
            --bootstraps 50
          echo "SKLEARN_VERSION=${{ matrix.sklearn }}"
          cat "research/mlb-v1-version-${{ matrix.sklearn }}/reconstruction_status.json"

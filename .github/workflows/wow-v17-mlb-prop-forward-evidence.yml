name: wow-v17-mlb-prop-forward-evidence

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wow-v17-production-source-heavy-prop-evidence
  cancel-in-progress: false

jobs:
  seed-forward-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WOW_SERVICE_URL: https://wow-governed-probability-engine.onrender.com
      WOW_OIDC_AUDIENCE: wow-v17-multiscout
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert fail-closed context
        shell: bash
        run: |
          set -euo pipefail
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Seed bounded MLB pitcher-route evidence
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) separator='&' ;; esac
          issue_oidc_token() {
            local token_json
            token_json="$(curl --silent --show-error --fail --connect-timeout 15 --max-time 30 \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${WOW_OIDC_AUDIENCE}")"
            python -c 'import json,sys; value=json.load(sys.stdin).get("value"); assert isinstance(value,str) and value.strip(); print(value.strip())' <<<"${token_json}"
          }

          health_code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/wow-live.json --write-out '%{http_code}' \
            "${WOW_SERVICE_URL}/health/live" || true)"
          if [ "${health_code}" -lt 200 ] || [ "${health_code}" -ge 300 ]; then
            echo "WOW runtime is not live (HTTP ${health_code:-000})." >&2
            exit 1
          fi

          rotation=$(( GITHUB_RUN_NUMBER % 6 ))
          candidate_offset=$(( rotation * 24 ))
          today="$(TZ=America/Chicago date +%F)"
          tomorrow="$(TZ=America/Chicago date -d '+1 day' +%F)"

          for slate_date in "${today}" "${tomorrow}"; do
            body="$(printf '{"requested_date":"%s","requested_timezone":"America/Chicago","candidate_offset":%s,"max_candidates":24}' "${slate_date}" "${candidate_offset}")"
            oidc_token="$(issue_oidc_token)"
            http_code="$(curl --silent --show-error --connect-timeout 20 --max-time 180 \
              --output "/tmp/mlb-forward-${slate_date}.json" --write-out '%{http_code}' \
              --request POST --header "Authorization: Bearer ${oidc_token}" \
              --header 'Content-Type: application/json' --data "${body}" \
              "${WOW_SERVICE_URL}/internal/v17/mlb-prop-forward-evidence/acquire" || true)"
            unset oidc_token
            if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "MLB forward evidence endpoint failed for ${slate_date} (HTTP ${http_code:-000})." >&2
              test -f "/tmp/mlb-forward-${slate_date}.json" && head -c 2000 "/tmp/mlb-forward-${slate_date}.json" >&2 || true
              exit 1
            fi
            SLATE_DATE="${slate_date}" python - <<'PY'
          import json, os
          from pathlib import Path
          slate = os.environ['SLATE_DATE']
          payload = json.loads(Path(f'/tmp/mlb-forward-{slate}.json').read_text())
          if payload.get('can_execute') is not False:
              raise SystemExit('MLB forward evidence must keep can_execute=false')
          if payload.get('automatic_certification') is not False:
              raise SystemExit('MLB forward evidence cannot auto-certify')
          if payload.get('automatic_promotion') is not False:
              raise SystemExit('MLB forward evidence cannot auto-promote')
          if payload.get('probability_publishable') is not False:
              raise SystemExit('MLB evidence producer cannot publish probability')
          if payload.get('status') in {'DATA_UNOBTAINABLE','RUN_INVALID_PROP_SNAPSHOT_WRITE_FAILURE'}:
              raise SystemExit(f"MLB forward evidence failed: {payload.get('status')} blockers={payload.get('blockers')}")
          print(json.dumps({k: payload.get(k) for k in (
              'status','requested_date','candidate_offset','total_candidates','window_candidate_n',
              'attempted','already_captured','hydrated','persisted','held','next_offset','can_execute'
          )}, sort_keys=True))
          PY
          done

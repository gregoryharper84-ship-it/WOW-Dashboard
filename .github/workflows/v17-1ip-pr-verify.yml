name: v17-1ip-pr-verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/wow-engine/**'
      - '.github/workflows/v17-1ip-pr-verify.yml'
      - '.github/workflows/v17-1ip-artifact-research-test.yml'
      - '.github/workflows/v17-1ip-line-expansion-validation.yml'

permissions:
  contents: read

concurrency:
  group: v17-1ip-pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-1ip:
    name: V17 1IP focused regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run 1IP-focused regressions
        run: |
          python -m pytest -q --tb=short \
            tests/test_v17_mlb_1ip*.py \
            tests/test_v17_1ip*.py \
            2>/dev/null || \
          python -m pytest -q --tb=short \
            $(find tests -maxdepth 1 -type f \( -name '*1ip*.py' -o -name '*first_inning*.py' \) -print)

      - name: Record full-suite ownership
        run: |
          {
            echo '## Full-suite ownership'
            echo 'The protected `WOW governed probability backend` check owns complete wow-engine coverage.'
            echo 'This specialized workflow intentionally runs only the 1IP regression surface to avoid a duplicate serial full-suite execution.'
            echo '`can_execute=false`'
          } >> "$GITHUB_STEP_SUMMARY"

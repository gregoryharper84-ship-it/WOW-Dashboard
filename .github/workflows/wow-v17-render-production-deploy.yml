name: wow-v17-render-production-deploy

on:
  workflow_run:
    workflows: ["wow-verify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  deployments: write

concurrency:
  group: wow-v17-render-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy exact protected-main SHA to Render
    # The protected GitHub checks remain the release gate. After they pass,
    # this controller performs one explicit Render control-plane handoff and
    # verifies that the exact current-main SHA reaches live. This avoids the
    # native checksPass listener silently missing an otherwise valid release.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      GH_API_TOKEN: ${{ github.token }}
      WOW_QA_APP_ID: ${{ vars.WOW_QA_APP_ID }}
      WOW_RELEASE_APP_ID: ${{ vars.WOW_RELEASE_APP_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      WOW_RENDER_SERVICE_ID: "srv-da7sa9gu01pc73brt80g"
    steps:
      - name: Assert deployment governance
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$GH_API_TOKEN"
          test -n "$RENDER_API_KEY"
          test -n "$WOW_RENDER_SERVICE_ID"

      - name: Verify protected-main gates and deploy exact SHA
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          MAX_WORKFLOW_RUN_ATTEMPTS = 3
          DEPLOY_WORKFLOW_PATH = ".github/workflows/wow-v17-render-production-deploy.yml"
          RENDER_AUTO_DEPLOY_TRIGGER = "checksPass"

          repo = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          render_service_id = os.environ["WOW_RENDER_SERVICE_ID"]
          render_api_key = os.environ["RENDER_API_KEY"]
          receipt_path = os.path.join(os.environ["RUNNER_TEMP"], "wow-v17-render-deploy-receipt.json")

          def emit_receipt(payload):
              body = dict(payload)
              body.setdefault("can_execute", False)
              body["workflow_run_id"] = str(os.environ.get("GITHUB_RUN_ID") or "")
              body["workflow_run_attempt"] = str(os.environ.get("GITHUB_RUN_ATTEMPT") or "")
              if "lease_identity" in globals():
                  body["deploy_lease_identity"] = lease_identity
              with open(receipt_path, "w", encoding="utf-8") as handle:
                  json.dump(body, handle, sort_keys=True)
                  handle.write("\n")
              print(json.dumps(body, sort_keys=True))
              return body

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as handle:
              event = json.load(handle)

          if event_name == "workflow_run":
              workflow_run = event.get("workflow_run") or {}
              target_sha = str(workflow_run.get("head_sha") or "")
              head_branch = str(workflow_run.get("head_branch") or "")
              conclusion = str(workflow_run.get("conclusion") or "")
              if head_branch != "main":
                  emit_receipt({"status":"NON_MAIN_NO_DEPLOY","target_sha":target_sha,"can_execute":False})
                  raise SystemExit(0)
              if conclusion != "success":
                  emit_receipt({"status":"UPSTREAM_NOT_SUCCESS_NO_DEPLOY","target_sha":target_sha,"can_execute":False})
                  raise SystemExit(0)
          else:
              target_sha = str(os.environ.get("GITHUB_SHA") or "")
          if not target_sha:
              raise RuntimeError("RENDER_DEPLOY_TARGET_SHA_MISSING")

          def github_deployment_journal_preflight(
              *, writer_inventory_complete, render_auto_deploy_trigger, competing_deploy_writers
          ):
              blockers = ["GITHUB_DEPLOYMENT_CREATE_HAS_NO_ATOMIC_IDEMPOTENCY"]
              if not writer_inventory_complete:
                  blockers.append("RENDER_SERVICE_WRITER_INVENTORY_UNVERIFIED")
              if render_auto_deploy_trigger != "off":
                  blockers.append("RENDER_NATIVE_AUTO_DEPLOY_WRITER_ENABLED")
              if competing_deploy_writers:
                  blockers.append("ADDITIONAL_RENDER_DEPLOY_WRITER_PRESENT")
              return {
                  "eligible": False,
                  "status": "RELEASE_JOURNAL_PREFLIGHT_HOLD_NO_DEPLOY",
                  "blockers": blockers,
              }

          def guarded_render_post(preflight, render_json, path, payload):
              if not preflight["eligible"]:
                  raise RuntimeError("RENDER_RELEASE_JOURNAL_PREFLIGHT_HOLD")
              return render_json("POST", path, payload)

          journal_preflight = github_deployment_journal_preflight(
              writer_inventory_complete=False,
              render_auto_deploy_trigger=RENDER_AUTO_DEPLOY_TRIGGER,
              competing_deploy_writers=["wow-v17-secret-sync"],
          )
          if not journal_preflight["eligible"]:
              emit_receipt({
                  "status": journal_preflight["status"],
                  "target_sha": target_sha,
                  "render_service_id": render_service_id,
                  "obstruction": "GITHUB_DEPLOYMENT_JOURNAL_CANNOT_PROVE_SINGLE_WRITER_EXACT_ONCE",
                  "blocking_evidence": journal_preflight["blockers"],
                  "next_action": "Keep Render POSTs blocked until an atomic service-wide intent and exclusive writer authority are independently proven.",
                  "runtime_generation": "V17_ACTIVE",
                  "terminal_authority": "V17_TERMINAL_REDUCER",
                  "custom_gpt_identity": "WOW_BETTING_ENGINE",
                  "DRY_RUN_ONLY_NO_LIVE_TRADING_NO_MARKET_ORDERS": True,
                  "can_execute": False,
              })
              raise SystemExit(0)

          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_API_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_json(path):
              request = urllib.request.Request(f"https://api.github.com/repos/{repo}{path}", headers=github_headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def validate_deployment_lease_identity(run, *, repository, event, run_id, run_attempt):
              if not isinstance(run, dict):
                  raise RuntimeError("RENDER_DEPLOY_LEASE_IDENTITY_INVALID")
              if not str(run_id).isdigit() or not str(run_attempt).isdigit():
                  raise RuntimeError("RENDER_DEPLOY_LEASE_IDENTITY_INVALID")
              attempt = int(run_attempt)
              if attempt < 1 or attempt > MAX_WORKFLOW_RUN_ATTEMPTS:
                  raise RuntimeError("RENDER_DEPLOY_ATTEMPT_LIMIT_EXCEEDED")
              run_path = str(run.get("path") or "").split("@", 1)[0]
              if (
                  str(run.get("id") or "") != str(run_id)
                  or run_path != DEPLOY_WORKFLOW_PATH
                  or str((run.get("repository") or {}).get("full_name") or "") != repository
                  or str(run.get("event") or "") != event
                  or str(run.get("head_branch") or "") != "main"
                  or str(run.get("status") or "") != "in_progress"
                  or str(run.get("run_attempt") or "") != str(attempt)
              ):
                  raise RuntimeError("RENDER_DEPLOY_LEASE_IDENTITY_MISMATCH")
              return f"{repository}:{DEPLOY_WORKFLOW_PATH}:{run_id}:{attempt}"

          def render_deploy_payload(commit_sha):
              if len(commit_sha) != 40 or any(char not in "0123456789abcdef" for char in commit_sha):
                  raise RuntimeError("RENDER_DEPLOY_TARGET_SHA_INVALID")
              return {"clearCache": "do_not_clear", "commitId": commit_sha}

          def is_current_main_sha(target_sha, current_main_sha):
              return (
                  len(target_sha) == 40
                  and all(char in "0123456789abcdef" for char in target_sha)
                  and current_main_sha == target_sha
              )

          def validate_release_provenance(*, target_sha, repository, pull_requests, merged_pr,
                                          check_runs, qa_app_id, release_app_id):
              """Require one merged same-repo PR plus independent exact-head App checks.

              Three successful regression checks on a merge commit are necessary but
              never sufficient evidence of independent release authorization.
              """
              if not (str(qa_app_id).isdigit() and str(release_app_id).isdigit()):
                  raise RuntimeError("RENDER_RELEASE_APP_IDENTITIES_UNBOUND")
              if int(qa_app_id) == int(release_app_id):
                  raise RuntimeError("RENDER_RELEASE_APP_IDENTITIES_NOT_DISTINCT")
              if not isinstance(pull_requests, list) or not isinstance(merged_pr, dict):
                  raise RuntimeError("RENDER_RELEASE_PR_EVIDENCE_INVALID")
              matching = [
                  pr for pr in pull_requests
                  if isinstance(pr, dict)
                  and str(pr.get("merge_commit_sha") or "") == target_sha
                  and (pr.get("base") or {}).get("ref") == "main"
                  and str((pr.get("base") or {}).get("repo", {}).get("full_name") or "") == repository
                  and pr.get("merged_at")
                  and not pr.get("draft")
              ]
              if len(matching) != 1 or matching[0].get("number") != merged_pr.get("number"):
                  raise RuntimeError("RENDER_RELEASE_MERGED_PR_NOT_UNIQUE")
              if not merged_pr.get("merged") or str(merged_pr.get("merge_commit_sha") or "") != target_sha:
                  raise RuntimeError("RENDER_RELEASE_PR_MERGE_IDENTITY_MISMATCH")
              if str((merged_pr.get("base") or {}).get("ref") or "") != "main":
                  raise RuntimeError("RENDER_RELEASE_PR_BASE_MISMATCH")
              if str((merged_pr.get("head") or {}).get("repo", {}).get("full_name") or "") != repository:
                  raise RuntimeError("RENDER_RELEASE_PR_FORK_UNVERIFIED")
              source_head = str((merged_pr.get("head") or {}).get("sha") or "")
              if len(source_head) != 40 or any(c not in "0123456789abcdef" for c in source_head.lower()):
                  raise RuntimeError("RENDER_RELEASE_PR_HEAD_INVALID")
              if not isinstance(check_runs, list):
                  raise RuntimeError("RENDER_RELEASE_CHECK_EVIDENCE_INVALID")
              required_roles = {
                  "WOW Independent QA exact-head": int(qa_app_id),
                  "WOW Release Authority exact-head": int(release_app_id),
              }
              for name, role_app_id in required_roles.items():
                  from_role = [
                      check for check in check_runs
                      if isinstance(check, dict)
                      and str(check.get("name") or "") == name
                      and str(check.get("head_sha") or "") == source_head
                      and (check.get("app") or {}).get("id") == role_app_id
                  ]
                  if not from_role:
                      raise RuntimeError("RENDER_RELEASE_ROLE_CHECK_MISSING_OR_FOREIGN:" + name)
                  latest = max(from_role, key=lambda check: int(check.get("id") or 0))
                  if latest.get("status") != "completed" or latest.get("conclusion") != "success":
                      raise RuntimeError("RENDER_RELEASE_ROLE_CHECK_NOT_SUCCESS:" + name)
              return source_head

          required = {
              "WOW additional required regression",
              "WOW governed probability backend",
              "WOW required-three regression",
          }
          check_deadline = time.time() + 900
          while True:
              checks = github_json(f"/commits/{urllib.parse.quote(target_sha, safe='')}/check-runs?per_page=100").get("check_runs") or []
              latest = {}
              for check in checks:
                  name = str(check.get("name") or "")
                  if name not in required:
                      continue
                  prior = latest.get(name)
                  if prior is None or int(check.get("id") or 0) > int(prior.get("id") or 0):
                      latest[name] = check
              missing = sorted(required - set(latest))
              pending = sorted(name for name, check in latest.items() if check.get("status") != "completed")
              failed = sorted(
                  name
                  for name, check in latest.items()
                  if check.get("status") == "completed" and check.get("conclusion") != "success"
              )
              if failed:
                  raise RuntimeError("RENDER_DEPLOY_REQUIRED_CHECK_FAILED:" + ",".join(failed))
              if not missing and not pending:
                  break
              if time.time() >= check_deadline:
                  raise RuntimeError("RENDER_DEPLOY_REQUIRED_CHECK_TIMEOUT:" + ",".join(missing + pending))
              time.sleep(15)

          # Verify the independent QA and Release App checks on the exact
          # source PR head. Checks on the merge commit alone do not authorize
          # deployment, and an owner-authored trust-root PR cannot self-certify.
          merged_candidates = github_json(
              f"/commits/{urllib.parse.quote(target_sha, safe='')}/pulls?per_page=100"
          )
          if not isinstance(merged_candidates, list):
              raise RuntimeError("RENDER_RELEASE_PR_LOOKUP_INVALID")
          matching_candidates = [
              item for item in merged_candidates
              if isinstance(item, dict) and str(item.get("merge_commit_sha") or "") == target_sha
          ]
          if len(matching_candidates) != 1:
              raise RuntimeError("RENDER_RELEASE_MERGED_PR_NOT_UNIQUE")
          source_pr = github_json(f"/pulls/{int(matching_candidates[0]['number'])}")
          source_head = str((source_pr.get("head") or {}).get("sha") or "")
          source_checks = github_json(
              f"/commits/{urllib.parse.quote(source_head, safe='')}/check-runs?per_page=100"
          )
          try:
              authorized_pr_head = validate_release_provenance(
                  target_sha=target_sha,
                  repository=repo,
                  pull_requests=merged_candidates,
                  merged_pr=source_pr,
                  check_runs=(source_checks or {}).get("check_runs"),
                  qa_app_id=os.environ.get("WOW_QA_APP_ID", ""),
                  release_app_id=os.environ.get("WOW_RELEASE_APP_ID", ""),
              )
          except RuntimeError as exc:
              emit_receipt({
                  "status": "RELEASE_AUTHORIZATION_HOLD_NO_DEPLOY",
                  "target_sha": target_sha,
                  "hold_reason": str(exc),
                  "next_action": "Obtain valid independent QA and Release approvals for the exact merged PR head before retrying.",
                  "can_execute": False,
              })
              raise SystemExit(0)
          print(json.dumps({
              "status": "RENDER_RELEASE_PROVENANCE_VERIFIED",
              "merge_sha": target_sha,
              "source_pr": int(source_pr["number"]),
              "source_pr_head": authorized_pr_head,
              "qa_release_checks": ["WOW Independent QA exact-head", "WOW Release Authority exact-head"],
              "can_execute": False,
          }, sort_keys=True))

          main_sha = str(((github_json("/branches/main").get("commit") or {}).get("sha")) or "")
          if not is_current_main_sha(target_sha, main_sha):
              emit_receipt({
                  "status":"STALE_SHA_NO_DEPLOY",
                  "target_sha":target_sha,
                  "current_main_sha":main_sha,
                  "can_execute":False,
              })
              raise SystemExit(0)

          render_headers = {
              "Accept": "application/json",
              "Authorization": f"Bearer {render_api_key}",
          }
          render_base = "https://api.render.com/v1"
          service_path = urllib.parse.quote(render_service_id, safe="")

          def render_json(method, path, payload=None):
              body = None
              headers = dict(render_headers)
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  f"{render_base}{path}",
                  data=body,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f"RENDER_DEPLOY_API_HTTP_{exc.code}") from exc
              except (urllib.error.URLError, TimeoutError) as exc:
                  raise RuntimeError("RENDER_DEPLOY_API_UNREACHABLE") from exc
              if not raw:
                  return None
              try:
                  return json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise RuntimeError("RENDER_DEPLOY_API_INVALID_JSON") from exc

          def list_deploys():
              data = render_json("GET", f"/services/{service_path}/deploys?limit=20")
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict) and isinstance(data.get("deploys"), list):
                  items = data["deploys"]
              else:
                  raise RuntimeError("RENDER_DEPLOY_LIST_INVALID")

              deploys = []
              for item in items:
                  if isinstance(item, dict) and isinstance(item.get("deploy"), dict):
                      deploys.append(item["deploy"])
                  elif isinstance(item, dict):
                      deploys.append(item)
              return deploys

          def commit_sha(deploy):
              commit = deploy.get("commit") if isinstance(deploy, dict) else None
              return str((commit or {}).get("id") or "")

          def exact_target_deploys(deploys=None):
              return [
                  deploy for deploy in (deploys if deploys is not None else list_deploys())
                  if commit_sha(deploy) == target_sha
              ]

          def rollback_after_sha_mismatch(previous_live, mismatch_sha, mismatch_deploy_id):
              previous_id = str((previous_live or {}).get("id") or "")
              previous_sha = commit_sha(previous_live or {})
              rollback_terminal_failures = {
                  "build_failed", "update_failed", "pre_deploy_failed", "canceled", "cancelled",
              }
              mismatch_terminal_states = rollback_terminal_failures | {"deactivated"}
              if not mismatch_deploy_id:
                  current_deploys = list_deploys()
                  mismatch_deploy_id = str(next((
                      deploy.get("id") for deploy in current_deploys
                      if commit_sha(deploy) == mismatch_sha
                      and str(deploy.get("id") or "") != previous_id
                      and deploy.get("id")
                  ), "") or "")
              else:
                  current_deploys = list_deploys()
              if not previous_id or len(previous_sha) != 40 or not mismatch_deploy_id:
                  emit_receipt({
                      "status": "DEPLOY_SHA_MISMATCH_HOLD",
                      "target_sha": target_sha,
                      "observed_sha": mismatch_sha,
                      "rollback_status": "ROLLBACK_IDENTITY_UNVERIFIED",
                      "next_action": "Release Authority must inspect Render and restore the previously approved live deploy before retrying.",
                      "can_execute": False,
                  })
                  raise SystemExit(0)
              rollback_deadline = time.time() + 900
              rollback_attempts = 0
              rollback_id = ""
              known_deploy_ids = {
                  str(deploy.get("id") or "")
                  for deploy in current_deploys
                  if isinstance(deploy, dict)
              }
              next_rollback_at = 0
              rollback_error = ""
              while True:
                  rollback_deploys = current_deploys
                  if not rollback_id:
                      rollback_id = str(next((
                          deploy.get("id") for deploy in rollback_deploys
                          if commit_sha(deploy) == previous_sha
                          and str(deploy.get("id") or "") not in known_deploy_ids
                          and deploy.get("id")
                      ), "") or "")
                  rollback_deploy = next(
                      (deploy for deploy in rollback_deploys if str(deploy.get("id") or "") == rollback_id),
                      None,
                  )
                  mismatched_deploy = next(
                      (
                          deploy for deploy in rollback_deploys
                          if str(deploy.get("id") or "") == mismatch_deploy_id
                      ),
                      None,
                  )
                  rollback_status = str((rollback_deploy or {}).get("status") or "")
                  mismatch_status = str((mismatched_deploy or {}).get("status") or "")
                  if (
                      rollback_deploy is not None
                      and rollback_status == "live"
                      and commit_sha(rollback_deploy) == previous_sha
                      and mismatch_status in mismatch_terminal_states
                  ):
                      emit_receipt({
                          "status": "DEPLOY_SHA_MISMATCH_ROLLED_BACK",
                          "target_sha": target_sha,
                          "observed_sha": mismatch_sha,
                          "rollback_deploy_id": rollback_id,
                          "restored_commit_sha": previous_sha,
                          "can_execute": False,
                      })
                      raise SystemExit(0)
                  if rollback_status in rollback_terminal_failures:
                      known_deploy_ids.add(rollback_id)
                      rollback_id = ""
                      rollback_error = "RENDER_ROLLBACK_DEPLOY_TERMINAL_FAILURE:" + rollback_status
                      next_rollback_at = min(next_rollback_at, time.time())
                  now = time.time()
                  if (
                      rollback_attempts < 3
                      and now >= next_rollback_at
                      and (not rollback_id or mismatch_status == "live")
                  ):
                      known_deploy_ids.update(
                          str(deploy.get("id") or "")
                          for deploy in rollback_deploys
                          if isinstance(deploy, dict)
                      )
                      try:
                          rollback_created = guarded_render_post(
                              journal_preflight,
                              render_json,
                              f"/services/{service_path}/rollback",
                              {"deployId": previous_id},
                          )
                          if isinstance(rollback_created, dict) and isinstance(rollback_created.get("deploy"), dict):
                              rollback_created = rollback_created["deploy"]
                          rollback_id = str(
                              (rollback_created.get("id") or "")
                              if isinstance(rollback_created, dict)
                              else ""
                          )
                          if rollback_id == previous_id:
                              rollback_id = ""
                              rollback_error = "RENDER_ROLLBACK_DEPLOY_ID_INVALID"
                          else:
                              rollback_error = ""
                      except (RuntimeError, urllib.error.URLError, TimeoutError) as exc:
                          rollback_id = ""
                          rollback_error = str(exc)
                      rollback_attempts += 1
                      next_rollback_at = now + 30
                  if now >= rollback_deadline:
                      emit_receipt({
                          "status": "DEPLOY_SHA_MISMATCH_HOLD",
                          "target_sha": target_sha,
                          "observed_sha": mismatch_sha,
                          "rollback_status": "VERIFICATION_TIMEOUT",
                          "rollback_attempts": rollback_attempts,
                          "rollback_error": rollback_error,
                          "previous_live_sha": previous_sha,
                          "mismatched_deploy_id": mismatch_deploy_id,
                          "mismatched_deploy_status": mismatch_status,
                          "next_action": "Release Authority must continue Render rollback and verify the mismatched deploy is terminal and the prior SHA is live.",
                          "can_execute": False,
                      })
                      raise SystemExit(0)
                  time.sleep(10)
                  current_deploys = list_deploys()

          lease_path = f"/actions/runs/{urllib.parse.quote(str(os.environ.get('GITHUB_RUN_ID') or ''), safe='')}"
          try:
              lease_identity = validate_deployment_lease_identity(
                  github_json(lease_path),
                  repository=repo,
                  event=event_name,
                  run_id=os.environ.get("GITHUB_RUN_ID", ""),
                  run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              )
          except RuntimeError as exc:
              emit_receipt({
                  "status": "DEPLOY_LEASE_HOLD_NO_DEPLOY",
                  "target_sha": target_sha,
                  "hold_reason": str(exc),
                  "next_action": "A verified protected-main deployment workflow run with an allowed attempt is required.",
                  "can_execute": False,
              })
              raise SystemExit(0)
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
              emit_receipt({
                  "status": "DEPLOY_LEASE_HOLD_NO_DEPLOY",
                  "target_sha": target_sha,
                  "hold_reason": "RENDER_DEPLOY_LEASE_IDENTITY_UNREADABLE",
                  "next_action": "Restore GitHub Actions read access and retry within the bounded attempt limit.",
                  "can_execute": False,
              })
              raise SystemExit(0)

          source_checks = github_json(
              f"/commits/{urllib.parse.quote(authorized_pr_head, safe='')}/check-runs?per_page=100"
          )
          try:
              authorized_pr_head = validate_release_provenance(
                  target_sha=target_sha,
                  repository=repo,
                  pull_requests=merged_candidates,
                  merged_pr=source_pr,
                  check_runs=(source_checks or {}).get("check_runs"),
                  qa_app_id=os.environ.get("WOW_QA_APP_ID", ""),
                  release_app_id=os.environ.get("WOW_RELEASE_APP_ID", ""),
              )
          except RuntimeError as exc:
              emit_receipt({
                  "status": "RELEASE_AUTHORIZATION_HOLD_NO_DEPLOY",
                  "target_sha": target_sha,
                  "hold_reason": str(exc),
                  "next_action": "Obtain valid independent QA and Release approvals for the exact merged PR head before retrying.",
                  "can_execute": False,
              })
              raise SystemExit(0)

          deploys_before_post = list_deploys()
          previous_live = next(
              (deploy for deploy in deploys_before_post if str(deploy.get("status") or "") == "live"),
              None,
          )
          existing = [deploy for deploy in deploys_before_post if commit_sha(deploy) == target_sha]
          for deploy in existing:
              if str(deploy.get("status") or "") == "live":
                  live_main_sha = str(((github_json("/branches/main").get("commit") or {}).get("sha")) or "")
                  if not is_current_main_sha(target_sha, live_main_sha):
                      emit_receipt({
                          "status":"DEPLOY_SUPERSEDED_BY_NEW_MAIN",
                          "target_sha":target_sha,
                          "current_main_sha":live_main_sha,
                          "deploy_id":str(deploy.get("id") or ""),
                          "can_execute":False,
                      })
                      raise SystemExit(0)
                  emit_receipt({
                      "status":"EXACT_SHA_ALREADY_LIVE",
                      "commit_sha":target_sha,
                      "deploy_id":str(deploy.get("id") or ""),
                      "deploy_authority":"GOVERNED_RENDER_API_HANDOFF",
                      "required_checks":sorted(required),
                      "can_execute":False,
                  })
                  raise SystemExit(0)

          terminal_failures = {
              "build_failed",
              "update_failed",
              "pre_deploy_failed",
              "deactivated",
              "canceled",
              "cancelled",
          }
          active = None
          for deploy in existing:
              status = str(deploy.get("status") or "")
              if status in terminal_failures:
                  raise RuntimeError(f"RENDER_TARGET_DEPLOY_TERMINAL_FAILURE:{status}")
              if status:
                  active = deploy
                  break

          if active is None:
              latest_main_sha = str(((github_json("/branches/main").get("commit") or {}).get("sha")) or "")
              if not is_current_main_sha(target_sha, latest_main_sha):
                  emit_receipt({
                      "status": "STALE_SHA_NO_DEPLOY",
                      "target_sha": target_sha,
                      "current_main_sha": latest_main_sha,
                      "can_execute": False,
                  })
                  raise SystemExit(0)
              created = guarded_render_post(
                  journal_preflight,
                  render_json,
                  f"/services/{service_path}/deploys",
                  render_deploy_payload(target_sha),
              )
              created_deploy = created
              if isinstance(created, dict) and isinstance(created.get("deploy"), dict):
                  created_deploy = created["deploy"]
              created_sha = commit_sha(created_deploy)
              if created_sha and created_sha != target_sha:
                  rollback_after_sha_mismatch(
                      previous_live, created_sha, str((created_deploy or {}).get("id") or "")
                  )
              if isinstance(created_deploy, dict) and created_deploy.get("id"):
                  deploy_id = str(created_deploy["id"])
              else:
                  # A successful Render POST can be acknowledged without a top-level
                  # deploy object. Reconcile the exact target SHA from Render's
                  # authoritative deploy list instead of reporting a false failure.
                  deploy_id = ""
          else:
              deploy_id = str(active.get("id") or "")
              if not deploy_id:
                  raise RuntimeError("RENDER_ACTIVE_DEPLOY_ID_MISSING")

          deploy_deadline = time.time() + 900
          prior_deploy_ids = {
              str(deploy.get("id") or "")
              for deploy in deploys_before_post
              if isinstance(deploy, dict)
          }
          while True:
              current_deploys = list_deploys()
              matching = exact_target_deploys(current_deploys)
              target = next((deploy for deploy in matching if str(deploy.get("id") or "") == deploy_id), None)
              if target is None and matching:
                  target = matching[0]
                  deploy_id = str(target.get("id") or deploy_id)
              observed = next(
                  (
                      deploy for deploy in current_deploys
                      if (str(deploy.get("id") or "") == deploy_id and deploy_id)
                      or (
                          not deploy_id
                          and str(deploy.get("id") or "") not in prior_deploy_ids
                          and str(deploy.get("id") or "")
                      )
                  ),
                  None,
              )
              if observed is not None:
                  observed_sha = commit_sha(observed or {})
                  if observed_sha and observed_sha != target_sha:
                      rollback_after_sha_mismatch(
                          previous_live, observed_sha, str(observed.get("id") or "")
                      )
              if target is not None:
                  status = str(target.get("status") or "")
                  if status == "live":
                      live_main_sha = str(((github_json("/branches/main").get("commit") or {}).get("sha")) or "")
                      if not is_current_main_sha(target_sha, live_main_sha):
                          rollback_after_sha_mismatch(previous_live, target_sha, str(target.get("id") or ""))
                      emit_receipt({
                          "status":"EXACT_SHA_RENDER_DEPLOY_LIVE",
                          "commit_sha":target_sha,
                          "deploy_id":str(target.get("id") or deploy_id),
                          "deploy_authority":"GOVERNED_RENDER_API_HANDOFF",
                          "required_checks":sorted(required),
                          "can_execute":False,
                      })
                      break
                  if status in terminal_failures:
                      raise RuntimeError(f"RENDER_TARGET_DEPLOY_TERMINAL_FAILURE:{status}")
              current_main_sha = str(((github_json("/branches/main").get("commit") or {}).get("sha")) or "")
              if current_main_sha != target_sha:
                  rollback_after_sha_mismatch(previous_live, target_sha, deploy_id)
              if time.time() >= deploy_deadline:
                  raise RuntimeError("RENDER_EXACT_SHA_DEPLOY_TIMEOUT")
              time.sleep(10)
          PY

      - name: Preserve release preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-v17-render-release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wow-v17-render-deploy-receipt.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Checkout deployment-pointer reconciler
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Reconcile exact Render receipt to durable deployment pointer
        shell: bash
        run: |
          python artifacts/wow-engine/v17/render_deployment_pointer.py \
            "$RUNNER_TEMP/wow-v17-render-deploy-receipt.json"

      - name: Fail closed when no exact deployment advanced
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          receipt_path = os.path.join(os.environ["RUNNER_TEMP"], "wow-v17-render-deploy-receipt.json")
          with open(receipt_path, "r", encoding="utf-8") as handle:
              receipt = json.load(handle)
          status = str(receipt.get("status") or "")
          advancing = {"EXACT_SHA_RENDER_DEPLOY_LIVE", "EXACT_SHA_ALREADY_LIVE"}
          non_advancing = {
              "NON_MAIN_NO_DEPLOY",
              "UPSTREAM_NOT_SUCCESS_NO_DEPLOY",
              "STALE_SHA_NO_DEPLOY",
              "DEPLOY_SUPERSEDED_BY_NEW_MAIN",
              "DEPLOY_LEASE_HOLD_NO_DEPLOY",
              "DEPLOY_SHA_MISMATCH_HOLD",
              "DEPLOY_SHA_MISMATCH_ROLLED_BACK",
              "RELEASE_AUTHORIZATION_HOLD_NO_DEPLOY",
              "RELEASE_JOURNAL_PREFLIGHT_HOLD_NO_DEPLOY",
          }
          if status in advancing:
              print(json.dumps({"status":"EXACT_DEPLOY_ACCEPTED_FOR_CANARIES","source_receipt_status":status,"can_execute":False}, sort_keys=True))
              raise SystemExit(0)
          if status in non_advancing:
              print(json.dumps({"status":"POST_DEPLOY_CANARIES_BLOCKED","source_receipt_status":status,"can_execute":False}, sort_keys=True))
              raise SystemExit(1)
          raise RuntimeError(f"RENDER_DEPLOY_RECEIPT_STATUS_UNRECOGNIZED:{status or 'MISSING'}")
          PY

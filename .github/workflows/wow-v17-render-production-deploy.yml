name: wow-v17-render-production-deploy

on:
  workflow_run:
    workflows: ["wow-verify"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: wow-v17-render-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Release native checksPass deploy after required checks
    # Render checksPass auto-deploy is the sole production deploy authority.
    # This check must finish after validating the protected-main gates; it must
    # not wait for Render, otherwise Render can wait on this in-progress check
    # and both sides deadlock.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - name: Assert deployment governance
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$GH_API_TOKEN"

      - name: Verify protected-main required checks and release native deploy gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as handle:
              event = json.load(handle)

          if event_name == "workflow_run":
              workflow_run = event.get("workflow_run") or {}
              target_sha = str(workflow_run.get("head_sha") or "")
              head_branch = str(workflow_run.get("head_branch") or "")
              conclusion = str(workflow_run.get("conclusion") or "")
              if head_branch != "main":
                  print(json.dumps({"status":"NON_MAIN_NO_DEPLOY_RELEASE","target_sha":target_sha,"can_execute":False}, sort_keys=True))
                  raise SystemExit(0)
              if conclusion != "success":
                  print(json.dumps({"status":"UPSTREAM_NOT_SUCCESS_NO_DEPLOY_RELEASE","target_sha":target_sha,"can_execute":False}, sort_keys=True))
                  raise SystemExit(0)
          else:
              target_sha = str(os.environ.get("GITHUB_SHA") or "")
          if not target_sha:
              raise RuntimeError("RENDER_DEPLOY_TARGET_SHA_MISSING")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_API_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_json(path):
              request = urllib.request.Request(f"https://api.github.com/repos/{repo}{path}", headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          required = {
              "WOW additional required regression",
              "WOW governed probability backend",
              "WOW required-three regression",
          }
          deadline = time.time() + 900
          while True:
              checks = github_json(f"/commits/{urllib.parse.quote(target_sha, safe='')}/check-runs?per_page=100").get("check_runs") or []
              latest = {}
              for check in checks:
                  name = str(check.get("name") or "")
                  if name not in required:
                      continue
                  prior = latest.get(name)
                  if prior is None or int(check.get("id") or 0) > int(prior.get("id") or 0):
                      latest[name] = check
              missing = sorted(required - set(latest))
              pending = sorted(name for name, check in latest.items() if check.get("status") != "completed")
              failed = sorted(name for name, check in latest.items() if check.get("status") == "completed" and check.get("conclusion") != "success")
              if failed:
                  raise RuntimeError("RENDER_DEPLOY_REQUIRED_CHECK_FAILED:" + ",".join(failed))
              if not missing and not pending:
                  break
              if time.time() >= deadline:
                  raise RuntimeError("RENDER_DEPLOY_REQUIRED_CHECK_TIMEOUT:" + ",".join(missing + pending))
              time.sleep(15)

          main_sha = str(((github_json("/branches/main").get("commit") or {}).get("sha")) or "")
          if main_sha != target_sha:
              print(json.dumps({"status":"STALE_SHA_NO_DEPLOY_RELEASE","target_sha":target_sha,"current_main_sha":main_sha,"can_execute":False}, sort_keys=True))
              raise SystemExit(0)

          print(json.dumps({
              "status": "CHECKSPASS_DEPLOY_GATE_RELEASED",
              "commit_sha": target_sha,
              "required_checks": sorted(required),
              "deploy_authority": "RENDER_CHECKSPASS",
              "can_execute": False,
          }, sort_keys=True))
          PY

name: wow-v17-first-six-model-maintenance

on:
  schedule:
    - cron: "10 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wow-v17-first-six-model-maintenance.yml"
      - "artifacts/wow-engine/FIRST_SIX_CERTIFICATION_CHECKPOINT.md"
      - "artifacts/wow-engine/LLP_TEAM_STATE_ACCURACY_V1.md"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/v17/model_source_entitlements.py"
      - "artifacts/wow-engine/v17/team_event_certification_replay.py"
      - "artifacts/wow-engine/v17/team_event_specialist_ownership.py"
      - "artifacts/wow-engine/v17/team_state_intelligence.py"
      - "artifacts/wow-engine/v17/team_state_challenger_training.py"
      - "artifacts/wow-engine/v17/team_state_challenger_maintenance.py"
      - "artifacts/wow-engine/v17/team_state_scoped_maintenance.py"
      - "artifacts/wow-engine/v17/ncaaf_result_form_candidate.py"
      - "artifacts/wow-engine/v17/ncaaf_model_maintenance.py"
      - "artifacts/wow-engine/v17/multiclass_candidate_lifecycle.py"
      - "artifacts/wow-engine/v17/ncaab_sportsdataverse_candidate.py"
      - "artifacts/wow-engine/v17/soccer_openfootball_candidate.py"
      - "artifacts/wow-engine/v17/tennis_valuebet_candidate.py"
      - "artifacts/wow-engine/v17/first_six_open_data_maintenance.py"
      - "artifacts/wow-engine/v17/basketball_model_maintenance.py"
      - "artifacts/wow-engine/basketball_event_hydration_runtime.py"
      - "artifacts/wow-engine/basketball_training_replay.py"
      - "artifacts/wow-engine/basketball_specialist_pipeline.py"
      - "artifacts/wow-engine/test_v17_model_source_entitlements.py"
      - "artifacts/wow-engine/test_v17_team_event_certification_replay.py"
      - "artifacts/wow-engine/test_v17_first_six_workflow_retry_contract.py"
      - "artifacts/wow-engine/test_v17_first_six_certification.py"
      - "artifacts/wow-engine/test_v17_first_six_source_contracts.py"
      - "artifacts/wow-engine/test_v17_team_state_intelligence.py"
      - "artifacts/wow-engine/test_v17_team_state_challenger_training.py"
      - "artifacts/wow-engine/test_v17_team_state_scoped_maintenance.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
      - "artifacts/wow-engine/test_v17_maintenance_terminal_truth.py"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-first-six-model-maintenance.yml"
      - "artifacts/wow-engine/LLP_TEAM_STATE_ACCURACY_V1.md"
      - "artifacts/wow-engine/v17/model_source_entitlements.py"
      - "artifacts/wow-engine/v17/team_event_certification_replay.py"
      - "artifacts/wow-engine/v17/team_state_intelligence.py"
      - "artifacts/wow-engine/v17/team_state_challenger_training.py"
      - "artifacts/wow-engine/v17/team_state_challenger_maintenance.py"
      - "artifacts/wow-engine/v17/team_state_scoped_maintenance.py"
      - "artifacts/wow-engine/v17/ncaab_sportsdataverse_candidate.py"
      - "artifacts/wow-engine/v17/soccer_openfootball_candidate.py"
      - "artifacts/wow-engine/v17/tennis_valuebet_candidate.py"
      - "artifacts/wow-engine/v17/first_six_open_data_maintenance.py"
      - "artifacts/wow-engine/test_v17_model_source_entitlements.py"
      - "artifacts/wow-engine/test_v17_team_event_certification_replay.py"
      - "artifacts/wow-engine/test_v17_first_six_workflow_retry_contract.py"
      - "artifacts/wow-engine/test_v17_team_state_intelligence.py"
      - "artifacts/wow-engine/test_v17_team_state_challenger_training.py"
      - "artifacts/wow-engine/test_v17_team_state_scoped_maintenance.py"
      - "artifacts/wow-engine/test_v17_first_six_certification.py"
      - "artifacts/wow-engine/test_v17_first_six_source_contracts.py"
      - "artifacts/wow-engine/test_v17_maintenance_terminal_truth.py"

permissions:
  contents: read

concurrency:
  group: wow-v17-first-six-model-maintenance
  cancel-in-progress: false

jobs:
  verify:
    name: Verify first-six model contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run first-six certification regressions
        run: >-
          python -m pytest -q
          test_v17_model_source_entitlements.py
          test_v17_team_event_certification_replay.py
          test_v17_first_six_workflow_retry_contract.py
          test_v17_first_six_certification.py
          test_v17_first_six_source_contracts.py
          test_v17_team_event_specialist_ownership.py
          test_v17_ncaaf_model_maintenance.py
          test_v17_basketball_model_maintenance.py
          test_v17_team_state_intelligence.py
          test_v17_team_state_challenger_training.py
          test_v17_team_state_scoped_maintenance.py
          test_v17_github_oidc.py
          test_v17_maintenance_terminal_truth.py

  maintain:
    name: Advance first-six candidate evidence
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[RUN_FIRST_SIX]'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert non-execution governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Advance governed model-development lanes and team-state challengers
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          origin = os.environ["WOW_ACTION_ORIGIN"].rstrip("/")
          program = "LLP_DYNAMIC_TEAM_STATE_CHALLENGER_V1"
          team_state_scopes = [
              "NFL", "NBA", "WNBA", "NCAAF", "MLB", "NCAAB",
              "SOCCER_EPL", "SOCCER_BUNDESLIGA", "SOCCER_LALIGA",
              "SOCCER_SERIE_A", "SOCCER_LIGUE_1",
          ]
          ancillary_endpoints = [
              ("BASKETBALL", "/internal/v17/basketball-model-maintenance"),
              ("NCAAF", "/internal/v17/ncaaf-model-maintenance"),
              ("NCAAB", "/internal/v17/ncaab-model-maintenance"),
              ("SOCCER", "/internal/v17/soccer-model-maintenance"),
              ("TENNIS", "/internal/v17/tennis-model-maintenance"),
          ]

          def fresh_oidc_token():
              oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              oidc_url += ("&" if "?" in oidc_url else "?") + urllib.parse.urlencode({"audience":"wow-v17-multiscout"})
              token_request = urllib.request.Request(
                  oidc_url,
                  headers={"Authorization":f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
              )
              with urllib.request.urlopen(token_request, timeout=20) as response:
                  return json.load(response)["value"]

          def transport_block(name, code, detail=None):
              return {
                  "status": "BLOCKED",
                  "code": code,
                  "detail": detail or {},
                  "automatic_certification": False,
                  "automatic_promotion": False,
                  "probability_publishable": False,
                  "can_execute": False,
              }

          def retryable_application_block(payload):
              if not isinstance(payload, dict) or payload.get("status") != "BLOCKED":
                  return False
              code = str(payload.get("code") or "").upper()
              transient_markers = (
                  "HTTP_ERROR", "HTTP_FAILED", "HTTP_429", "HTTP_502", "HTTP_503", "HTTP_504",
                  "TRANSPORT_ERROR", "TRANSPORT_UNAVAILABLE",
              )
              return any(marker in code for marker in transient_markers)

          def post_bounded(name, path, *, attempts=2, timeout=180):
              last_code = f"{name}_MAINTENANCE_TRANSPORT_UNAVAILABLE"
              last_detail = {}
              for attempt in range(attempts):
                  token = fresh_oidc_token()
                  request = urllib.request.Request(
                      origin + path, data=b"", method="POST",
                      headers={"Authorization":f"Bearer {token}","Content-Type":"application/json"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          payload = json.load(response)
                      if not retryable_application_block(payload) or attempt + 1 >= attempts:
                          return payload
                      last_code = str(payload.get("code") or last_code)
                      last_detail = {"application_status": payload.get("status"), "application_code": payload.get("code")}
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      if exc.code in {401, 403}:
                          raise RuntimeError(f"{name}_AUTH_HTTP_{exc.code}:{body[:500]}") from exc
                      last_code = f"{name}_HTTP_{exc.code}"
                      last_detail = {"http_status": exc.code, "body_prefix": body[:500]}
                      if exc.code not in {404, 429, 502, 503, 504}:
                          break
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last_code = f"{name}_TRANSPORT_ERROR"
                      last_detail = {"error_type": type(exc).__name__}
                  if attempt + 1 < attempts:
                      time.sleep(10 * (attempt + 1))
              return transport_block(name, last_code, last_detail)

          nfl = post_bounded(
              "TEAM_STATE_NFL",
              "/internal/v17/team-state-challenger-maintenance/NFL",
              attempts=36,
              timeout=180,
          )
          assert nfl.get("program") == program, nfl
          assert isinstance(nfl.get("rows"), list) and nfl.get("rows"), nfl

          team_state_results = {"NFL": nfl}
          for scope in team_state_scopes[1:]:
              payload = post_bounded(
                  f"TEAM_STATE_{scope}",
                  f"/internal/v17/team-state-challenger-maintenance/{scope}",
                  attempts=3,
                  timeout=180,
              )
              team_state_results[scope] = payload

          governed_team_state_payloads = [
              payload for payload in team_state_results.values()
              if payload.get("program") == program
          ]
          assert governed_team_state_payloads, team_state_results
          for payload in governed_team_state_payloads:
              assert payload.get("can_execute") is False, payload
              assert payload.get("probability_publishable") is False, payload
              assert payload.get("automatic_certification") is False, payload
              assert payload.get("automatic_promotion") is False, payload
              assert isinstance(payload.get("rows"), list) and payload.get("rows"), payload
              assert all(row.get("can_execute") is False for row in payload["rows"]), payload
              assert all(row.get("probability_publishable") is False for row in payload["rows"]), payload

          ancillary_results = {}
          for name, path in ancillary_endpoints:
              payload = post_bounded(name, path, attempts=3, timeout=180)
              assert payload.get("can_execute") is False, (name, payload)
              assert payload.get("probability_publishable") is False, (name, payload)
              if "automatic_certification" in payload:
                  assert payload.get("automatic_certification") is False, (name, payload)
              if "automatic_promotion" in payload:
                  assert payload.get("automatic_promotion") is False, (name, payload)
              ancillary_results[name] = payload

          scope_updated = sum(int(payload.get("candidate_rows_updated") or 0) for payload in governed_team_state_payloads)
          scope_blocked = sum(int(payload.get("candidate_rows_blocked") or 0) for payload in governed_team_state_payloads)
          transport_blocked_scopes = [
              scope for scope, payload in team_state_results.items()
              if payload.get("program") != program
          ]
          blocked_ancillary = {
              name: {
                  "status": payload.get("status"),
                  "code": payload.get("code"),
                  "blockers": payload.get("blockers"),
              }
              for name, payload in ancillary_results.items()
              if payload.get("status") == "BLOCKED"
          }
          print(json.dumps({
              "checkpoint": {
                  "TEAM_STATE": "SCOPED_MAINTENANCE_COMPLETED",
                  "team_state_scopes_attempted": len(team_state_results),
                  "team_state_scopes_with_governed_response": len(governed_team_state_payloads),
                  "team_state_candidate_rows_updated": scope_updated,
                  "team_state_candidate_rows_blocked": scope_blocked,
                  "team_state_transport_blocked_scopes": transport_blocked_scopes,
                  "ancillary_statuses": {name: payload.get("status") for name, payload in ancillary_results.items()},
                  "blocked_ancillary": blocked_ancillary,
                  "can_execute": False,
              },
              "team_state": team_state_results,
              "ancillary": ancillary_results,
          }, sort_keys=True))
          if blocked_ancillary:
              raise RuntimeError("FIRST_SIX_ANCILLARY_MAINTENANCE_BLOCKED:" + json.dumps(blocked_ancillary, sort_keys=True))
          PY

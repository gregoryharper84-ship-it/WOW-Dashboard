      - "artifacts/wow-engine/v17/soccer_openfootball_candidate.py"
      - "artifacts/wow-engine/v17/tennis_valuebet_candidate.py"
      - "artifacts/wow-engine/v17/first_six_open_data_maintenance.py"
      - "artifacts/wow-engine/v17/basketball_model_maintenance.py"
      - "artifacts/wow-engine/basketball_event_hydration_runtime.py"
      - "artifacts/wow-engine/basketball_training_replay.py"
      - "artifacts/wow-engine/basketball_specialist_pipeline.py"
      - "artifacts/wow-engine/test_v17_model_source_entitlements.py"
      - "artifacts/wow-engine/test_v17_team_event_certification_replay.py"
      - "artifacts/wow-engine/test_v17_first_six_workflow_retry_contract.py"
      - "artifacts/wow-engine/test_v17_first_six_ncaaf_hydrate_order.py"

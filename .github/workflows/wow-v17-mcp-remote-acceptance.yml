name: wow-v17-mcp-remote-acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wow-v17-mcp-remote-acceptance.yml"
      - "artifacts/mcp-server/src/v17_remote_acceptance.js"
      - "artifacts/mcp-server/src/v17_backend.js"
      - "artifacts/mcp-server/src/v17_contract.js"
      - "artifacts/mcp-server/src/v17_server.js"
      - "artifacts/mcp-server/src/v17_http.js"
      - "artifacts/mcp-server/src/v17_oauth.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-v17-mcp-remote-acceptance
  cancel-in-progress: false

jobs:
  remote-acceptance:
    name: WOW V17 MCP remote acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WOW_MCP_AUTH_TOKEN: ${{ secrets.WOW_MCP_AUTH_TOKEN }}
      WOW_MCP_REMOTE_URL: https://wow-v17-mcp-acceptance-main.onrender.com/mcp
      WOW_MCP_ACCEPTANCE_SERVICE_ID: srv-dapfrkrbc2fs73fjjsig
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Install MCP package from frozen workspace lockfile
        run: pnpm install --frozen-lockfile --filter @workspace/mcp-server...

      # Do not give this test workflow any Render account API key.
      # The pre-provisioned MCP test token has no Render deployment permissions.
      - name: Require isolated MCP acceptance token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WOW_MCP_AUTH_TOKEN:-}" ]; then
            echo "::error::MCP_ACCEPTANCE_TOKEN_UNCONFIGURED"
            exit 1
          fi

      - name: Run authenticated remote MCP acceptance
        run: pnpm --filter @workspace/mcp-server acceptance:remote:v17

      - name: Record non-execution invariant
        run: |
          echo "WOW_V17_MCP_REMOTE_ACCEPTANCE_COMPLETE can_execute=false terminal_authority=V17_TERMINAL_REDUCER"

name: wow-v17-governance-dispatcher
run-name: wow-v17-governance-dispatcher event=${{ github.event_name }} pr=${{ inputs.pr_number || 'AUTO' }}

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional same-repository PR number; empty reconciles a rotating bounded page.
        required: false
        type: string

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: wow-v17-governance-dispatcher
  cancel-in-progress: false

jobs:
  route:
    if: github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' && github.ref == 'refs/heads/main'
    environment: wow-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact protected source SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          [ "$actual" = "$EXPECTED_SHA" ] || {
            echo "::error::DISPATCHER_SOURCE_SHA_MISMATCH"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Reconcile exact-head governance evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          WOW_DISPATCH_JOURNAL_HMAC_KEY: ${{ secrets.WOW_DISPATCH_JOURNAL_HMAC_KEY }}
          WOW_QA_ZERO_CREDIT_MODE: ${{ vars.WOW_QA_ZERO_CREDIT_MODE }}
          WOW_QA_INDEPENDENT_REVIEW_ACTIVE: ${{ vars.WOW_QA_INDEPENDENT_REVIEW_ACTIVE }}
        run: |
          set -euo pipefail
          python artifacts/wow-engine/v17/governance_dispatcher_github.py \
            | tee -a "$GITHUB_STEP_SUMMARY"

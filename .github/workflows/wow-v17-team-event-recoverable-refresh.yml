name: wow-v17-team-event-recoverable-refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/wow-v17-team-event-recoverable-refresh.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/v17/team_event_recoverable_hold_overlay.py"
      - "artifacts/wow-engine/v17/daily_snapshot_runtime.py"
      - "artifacts/wow-engine/tests/test_v17_team_event_recoverable_holds.py"
      - "artifacts/wow-engine/tests/test_v17_team_event_recoverable_refresh.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"

permissions:
  contents: read

concurrency:
  group: wow-v17-team-event-recoverable-refresh
  cancel-in-progress: false

jobs:
  verify:
    name: Verify recoverable refresh contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run recoverable-refresh regressions
        run: >-
          python -m pytest -q
          tests/test_v17_team_event_recoverable_holds.py
          tests/test_v17_team_event_recoverable_refresh.py
          test_v17_github_oidc.py

  refresh:
    name: Refresh recoverable MONEYLINE holds
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_USER_TIMEZONE: America/Chicago
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert non-execution governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Run governed canonical MONEYLINE refresh
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def fresh_oidc_token():
              oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              oidc_url += ("&" if "?" in oidc_url else "?") + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
              req = urllib.request.Request(
                  oidc_url,
                  headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)["value"]

          slate_date = datetime.now(ZoneInfo(os.environ["WOW_USER_TIMEZONE"])).date().isoformat()
          payload = {
              "requested_slate_date": slate_date,
              "requested_timezone": os.environ["WOW_USER_TIMEZONE"],
              "lanes": ["MONEYLINE"],
              "max_props": 0,
              "max_team_events": 24,
              "response_mode": "COMPACT",
          }
          body = json.dumps(payload).encode("utf-8")
          endpoint = os.environ["WOW_ACTION_ORIGIN"].rstrip("/") + "/internal/v17/daily-snapshot"

          result = None
          for attempt in range(1, 7):
              token = fresh_oidc_token()
              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=240) as response:
                      result = json.load(response)
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in {404, 429, 502, 503, 504} or attempt == 6:
                      raise
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 6:
                      raise
              time.sleep(20 * attempt)

          if not isinstance(result, dict):
              raise RuntimeError("TEAM_EVENT_RECOVERABLE_REFRESH_RESPONSE_MISSING")
          if str(result.get("run_status") or "").startswith("RUN_INVALID"):
              raise AssertionError("TEAM_EVENT_RECOVERABLE_REFRESH_RUN_INVALID")
          if result.get("can_execute") is not False:
              raise AssertionError("TEAM_EVENT_RECOVERABLE_REFRESH_CAN_EXECUTE_INVARIANT_FAILED")
          if result.get("global_terminal_authority") != "V17_TERMINAL_REDUCER":
              raise AssertionError("TEAM_EVENT_RECOVERABLE_REFRESH_TERMINAL_AUTHORITY_MISMATCH")
          if result.get("automation_auth") != "GITHUB_ACTIONS_OIDC":
              raise AssertionError("TEAM_EVENT_RECOVERABLE_REFRESH_OIDC_AUTH_NOT_PROVEN")

          reconciliation = result.get("reconciliation") or {}
          if reconciliation.get("balanced") is not True:
              raise AssertionError("TEAM_EVENT_RECOVERABLE_REFRESH_RECONCILIATION_FAILED")
          lane = (result.get("lane_reconciliation") or {}).get("MONEYLINE") or {}
          if lane.get("requested_row_limit") != 24:
              raise AssertionError("TEAM_EVENT_RECOVERABLE_REFRESH_ROW_LIMIT_MISMATCH")
          cross = result.get("cross_sport_discovery_audit") or {}
          cross_reconciliation = cross.get("reconciliation") or {}
          if cross_reconciliation.get("row_reconciliation") != "PASS":
              raise AssertionError("TEAM_EVENT_RECOVERABLE_REFRESH_CROSS_SPORT_RECONCILIATION_FAILED")

          print(json.dumps({
              "watcher_mode": "HOURLY_CANONICAL_FULL_SLATE_REFRESH",
              "run_id": result.get("run_id"),
              "run_status": result.get("run_status"),
              "rows_completed": reconciliation.get("rows_completed"),
              "rows_held": reconciliation.get("rows_held"),
              "rows_rejected": reconciliation.get("rows_rejected"),
              "cross_sport_row_reconciliation": cross_reconciliation.get("row_reconciliation"),
              "global_terminal_authority": "V17_TERMINAL_REDUCER",
              "can_execute": False,
          }, sort_keys=True))
          PY

name: wow-v17-chatgpt-engineering-dispatch-bridge

on:
  issues:
    types: [reopened]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    name: Dispatch fresh ChatGPT Engineering run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.number == 542 &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch worker on protected main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/wow-v17-chatgpt-engineering-worker.yml/dispatches" \
            -f ref=main

          sleep 3
          latest=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow wow-v17-chatgpt-engineering-worker.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,headSha,status,conclusion,url,createdAt)

          {
            echo "# ChatGPT Engineering dispatch bridge"
            echo
            echo "- control issue: #542"
            echo "- requested ref: main"
            echo "- provider: OpenAI/ChatGPT"
            echo "- can_execute: false (worker contract unchanged)"
            echo "- newest workflow_dispatch run:"
            echo '```json'
            echo "$latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-close reusable control issue
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "/repos/${GITHUB_REPOSITORY}/issues/542" \
            -f state=closed \
            -f state_reason=completed >/dev/null

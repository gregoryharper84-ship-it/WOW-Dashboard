name: MLB V2 2026 fresh confirmation

on:
  push:
    branches:
      - research/mlb-v2-2026-confirmation-20260827
    paths:
      - "research/mlb-v2-pregame/**"
      - ".github/workflows/mlb-v2-2026-confirmation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated confirmation branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn joblib

      - name: Run pre-registered 2026 confirmation
        working-directory: research/mlb-v2-pregame
        run: |
          python confirm_mlb_v2_2026.py \
            --out ../../mlb-v2-2026-confirmation-out \
            --bootstraps 10000 \
            --workers 20

      - name: Print confirmation evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mlb-v2-2026-confirmation-out/mlb_v2_2026_confirmation.json')
          if not p.exists():
              raise SystemExit('CONFIRMATION_RESULT_MISSING')
          d=json.loads(p.read_text())
          print(json.dumps({
              'as_of': d['as_of'],
              'source_2026_audit': d['source_2026_audit'],
              'split_counts': d['split_counts'],
              'test_date_range': d['test_date_range'],
              'frozen_transport': d['frozen_transport'],
              'rolling_refit': d['rolling_refit'],
              'confirmation_gate': d['confirmation_gate'],
              'governance': d['governance'],
          }, indent=2))
          PY

      - name: Assert pre-registration and fail-closed governance
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mlb-v2-2026-confirmation-out/mlb_v2_2026_confirmation.json')
          if not p.exists():
              raise SystemExit('CONFIRMATION_RESULT_MISSING')
          d=json.loads(p.read_text())
          pre=d['pre_registered_before_2026_outcome_read']
          assert pre['no_2026_model_family_selection'] is True
          assert pre['no_2026_calibrator_selection'] is True
          g=d['governance']
          assert g['PROMOTED'] is False
          assert g['ACTIVE'] is False
          assert g['probability_publishable'] is False
          assert g['governed_probability_capability'] == 'UNAVAILABLE'
          assert g['can_execute'] is False
          print('PRE_REGISTRATION_ASSERTION=PASS')
          print('GOVERNANCE_FAIL_CLOSED=PASS')
          PY

      - name: Upload confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-v2-2026-fresh-confirmation
          path: |
            mlb-v2-2026-confirmation-out/mlb_v2_2026_confirmation.json
            mlb-v2-2026-confirmation-out/mlb_v2_2026_predictions.csv
            mlb-v2-2026-confirmation-out/frozen_v2_base_model.joblib
            mlb-v2-2026-confirmation-out/frozen_v2_platt.joblib
            mlb-v2-2026-confirmation-out/rolling_v2_base_model.joblib
            mlb-v2-2026-confirmation-out/rolling_v2_platt.joblib
            mlb-v2-2026-confirmation-out/governance.json
          if-no-files-found: warn
          retention-days: 7

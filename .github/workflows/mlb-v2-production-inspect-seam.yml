name: MLB V2 production seam inspection

on:
  push:
    branches:
      - feature/mlb-v2-governed-probability-20260827
    paths:
      - ".github/workflows/mlb-v2-production-inspect-seam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact production specialist seam
        shell: bash
        run: |
          echo '=== moneyline_probability registry/model/audit/scorer ==='
          sed -n '1,130p' artifacts/flask-scoring-api/gate_engine/moneyline_probability.py
          sed -n '330,760p' artifacts/flask-scoring-api/gate_engine/moneyline_probability.py
          echo '=== app production invocation ==='
          sed -n '23260,23415p' artifacts/flask-scoring-api/app.py
          echo '=== existing moneyline tests around live scorer ==='
          sed -n '1280,1620p' artifacts/flask-scoring-api/tests/test_moneyline_architecture.py
          echo '=== requirements ==='
          cat artifacts/flask-scoring-api/requirements.txt

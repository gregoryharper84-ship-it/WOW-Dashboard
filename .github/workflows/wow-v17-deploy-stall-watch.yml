name: wow-v17-deploy-stall-watch

# GET-only optional observer (WOW-V17-DEPLOY-RELIABILITY-P0 / #2422).
# Compares authorized exact-main (3 required checks green) to live web/worker
# deploy covering. Alerts at 15 minutes without a covering deploy; escalates
# at 30. Also reports dual-writer residue while native checksPass remains on.
# Step-isolated so it cannot poison protected main. can_execute=false.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: wow-v17-deploy-stall-watch
  cancel-in-progress: false

jobs:
  stall-watch:
    name: Watch main-to-production deploy stall
    if: >-
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: wow-release
    env:
      STALL_RECEIPT: wow-v17-deploy-stall-watch.json
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Checkout protected main (read-only)
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Observe authorization clock vs live covering deploys
        id: stall
        continue-on-error: true
        working-directory: artifacts/wow-engine
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if ! python -m v17.deploy_stall_watch; then
            echo "::error::DEPLOY_STALL_WATCH_INCOMPLETE: observer exited non-zero; receipt may be partial."
            echo "DEPLOY_STALL_WATCH_INCOMPLETE can_execute=false" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Preserve stall receipt
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-v17-deploy-stall-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wow-engine/wow-v17-deploy-stall-watch.json
          if-no-files-found: warn
          retention-days: 30

      - name: Disclosure
        continue-on-error: true
        if: always()
        run: |
          echo "GET-only stall watch; not a release gate or model certification." >> "$GITHUB_STEP_SUMMARY"
          echo "Stall step outcome: ${{ steps.stall.outcome }} (optional observer)." >> "$GITHUB_STEP_SUMMARY"
          echo "Sole writer: wow-v17-required-checks-deploy.yml; can_execute=false." >> "$GITHUB_STEP_SUMMARY"

name: v17-1ip-line-expansion-patch-branch

on:
  push:
    branches:
      - chatgpt/v17-1ip-line-expansion-20260916
    paths:
      - ".github/workflows/v17-1ip-line-expansion-patch-branch.yml"
      - "artifacts/wow-engine/scripts/patch_v17_1ip_line_expansion_branch.py"

permissions:
  contents: write

jobs:
  patch-branch:
    if: github.ref == 'refs/heads/chatgpt/v17-1ip-line-expansion-20260916'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v17-1ip-line-expansion-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply surgical wiring patch and self-delete helpers
        run: python artifacts/wow-engine/scripts/patch_v17_1ip_line_expansion_branch.py
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "V17 1IP: wire exact-line certification control plane"
          git push origin HEAD:chatgpt/v17-1ip-line-expansion-20260916

name: wow-v17-ncaaf-model-maintenance

on:
  schedule:
    - cron: "35 13 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-ncaaf-model-maintenance.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/ncaaf_cfbd_client.py"
      - "artifacts/wow-engine/ncaaf_cfbd_hydrator.py"
      - "artifacts/wow-engine/ncaaf_prop_historical_adapter.py"
      - "artifacts/wow-engine/ncaaf_training_materializer.py"
      - "artifacts/wow-engine/ncaaf_evidence_ingestion.py"
      - "artifacts/wow-engine/ncaaf_feature_compiler.py"
      - "artifacts/wow-engine/ncaaf_candidate_training_runner.py"
      - "artifacts/wow-engine/ncaaf_three_way_trainer.py"
      - "artifacts/wow-engine/ncaaf_trainer.py"
      - "artifacts/wow-engine/ncaaf_logistic_adapter.py"
      - "artifacts/wow-engine/v17/ncaaf_model_maintenance.py"
      - "artifacts/wow-engine/v17/ncaaf_prop_history_maintenance.py"
      - "artifacts/wow-engine/v17/capability_build_registry.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/test_ncaaf_cfbd_client.py"
      - "artifacts/wow-engine/test_ncaaf_cfbd_hydrator.py"
      - "artifacts/wow-engine/ncaaf_cfbd_player_outcome_normalization_v1.sql"
      - "artifacts/wow-engine/test_ncaaf_cfbd_player_outcome_normalization_contract.py"
      - "artifacts/wow-engine/test_ncaaf_cfbd_snapshot_write_size.py"
      - "artifacts/wow-engine/test_ncaaf_prop_historical_adapter.py"
      - "artifacts/wow-engine/test_ncaaf_feature_compiler.py"
      - "artifacts/wow-engine/test_v17_ncaaf_model_maintenance.py"
      - "artifacts/wow-engine/test_v17_ncaaf_prop_history_maintenance.py"
      - "artifacts/wow-engine/test_ncaaf_logistic_adapter.py"
      - "artifacts/wow-engine/test_v17_capability_build_registry.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
      - "artifacts/wow-engine/test_v17_maintenance_terminal_truth.py"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-ncaaf-model-maintenance.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/ncaaf_cfbd_client.py"
      - "artifacts/wow-engine/ncaaf_cfbd_hydrator.py"
      - "artifacts/wow-engine/ncaaf_prop_historical_adapter.py"
      - "artifacts/wow-engine/ncaaf_training_materializer.py"
      - "artifacts/wow-engine/ncaaf_evidence_ingestion.py"
      - "artifacts/wow-engine/ncaaf_feature_compiler.py"
      - "artifacts/wow-engine/ncaaf_candidate_training_runner.py"
      - "artifacts/wow-engine/ncaaf_three_way_trainer.py"
      - "artifacts/wow-engine/ncaaf_trainer.py"
      - "artifacts/wow-engine/ncaaf_logistic_adapter.py"
      - "artifacts/wow-engine/v17/ncaaf_model_maintenance.py"
      - "artifacts/wow-engine/v17/ncaaf_prop_history_maintenance.py"
      - "artifacts/wow-engine/v17/capability_build_registry.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/test_ncaaf_cfbd_client.py"
      - "artifacts/wow-engine/test_ncaaf_cfbd_hydrator.py"
      - "artifacts/wow-engine/ncaaf_cfbd_player_outcome_normalization_v1.sql"
      - "artifacts/wow-engine/test_ncaaf_cfbd_player_outcome_normalization_contract.py"
      - "artifacts/wow-engine/test_ncaaf_cfbd_snapshot_write_size.py"
      - "artifacts/wow-engine/test_ncaaf_prop_historical_adapter.py"
      - "artifacts/wow-engine/test_ncaaf_feature_compiler.py"
      - "artifacts/wow-engine/test_v17_ncaaf_model_maintenance.py"
      - "artifacts/wow-engine/test_v17_ncaaf_prop_history_maintenance.py"
      - "artifacts/wow-engine/test_ncaaf_logistic_adapter.py"
      - "artifacts/wow-engine/test_v17_capability_build_registry.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
      - "artifacts/wow-engine/test_v17_maintenance_terminal_truth.py"

permissions:
  contents: read

# PR verification gets its own group so it never queues behind (or cancels) live runs.
concurrency:
  group: wow-v17-ncaaf-model-maintenance-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify NCAAF maintenance contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run NCAAF model-development regressions
        run: >-
          python -m pytest -q
          test_ncaaf_cfbd_client.py
          test_ncaaf_cfbd_hydrator.py
          test_ncaaf_cfbd_player_outcome_normalization_contract.py
          test_ncaaf_cfbd_snapshot_write_size.py
          test_ncaaf_prop_historical_adapter.py
          test_v17_ncaaf_prop_history_maintenance.py
          test_ncaaf_feature_compiler.py
          test_v17_ncaaf_model_maintenance.py
          test_ncaaf_candidate_training_runner.py
          test_ncaaf_logistic_adapter.py
          test_v17_capability_build_registry.py
          test_v17_github_oidc.py
          test_v17_maintenance_terminal_truth.py

  maintain:
    name: Advance NCAAF research candidate evidence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert non-execution governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Acquire governed NCAAF player-prop history
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          oidc_url += separator + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
          oidc_request = urllib.request.Request(
              oidc_url,
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(oidc_request, timeout=20) as response:
              oidc_token = json.load(response)["value"]

          endpoint = os.environ["WOW_ACTION_ORIGIN"].rstrip("/") + "/internal/v17/ncaaf-prop-history-maintenance"
          request = urllib.request.Request(
              endpoint,
              data=b"",
              method="POST",
              headers={
                  "Authorization": f"Bearer {oidc_token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=1200) as response:
              payload = json.load(response)

          assert payload.get("can_execute") is False
          assert payload.get("automatic_certification") is False
          assert payload.get("automatic_promotion") is False
          assert payload.get("probability_publishable") is False
          assert payload.get("model_build_ready") is False
          profile = payload.get("player_stat_profile") or {}
          print(json.dumps({
              "status": payload.get("status"),
              "source_snapshot_n": payload.get("source_snapshot_n"),
              "source_snapshot_persisted_n": payload.get("source_snapshot_persisted_n"),
              "schema_status": profile.get("status"),
              "game_n": profile.get("game_n"),
              "participant_id_n": profile.get("participant_id_n"),
              "athlete_stat_n": profile.get("athlete_stat_n"),
              "category_types": profile.get("category_types"),
              "next_gate": payload.get("next_gate"),
              "can_execute": False,
          }, sort_keys=True))
          if payload.get("status") == "BLOCKED":
              raise RuntimeError("NCAAF_PROP_HISTORY_BLOCKED:" + json.dumps({
                  "code": payload.get("code"),
                  "blocked_stage": payload.get("blocked_stage"),
                  "detail": payload.get("detail"),
              }, sort_keys=True))
          PY

      - name: Run governed NCAAF model maintenance
        if: always() && github.event_name != 'push'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          oidc_url += separator + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
          oidc_request = urllib.request.Request(
              oidc_url,
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(oidc_request, timeout=20) as response:
              oidc_token = json.load(response)["value"]

          endpoint = os.environ["WOW_ACTION_ORIGIN"].rstrip("/") + "/internal/v17/ncaaf-model-maintenance"
          request = urllib.request.Request(
              endpoint,
              data=b"",
              method="POST",
              headers={
                  "Authorization": f"Bearer {oidc_token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=1200) as response:
              payload = json.load(response)

          assert payload.get("can_execute") is False
          assert payload.get("automatic_certification") is False
          assert payload.get("automatic_promotion") is False
          assert payload.get("probability_publishable") is False
          feature = payload.get("feature_compilation") or {}
          assert feature.get("market_features_used") in (False, None)
          candidate = payload.get("candidate_training") or {}
          if candidate:
              assert candidate.get("lifecycle_state") == "CANDIDATE"
              assert candidate.get("probability_publishable") is False
              assert candidate.get("can_execute") is False
          print(json.dumps({
              "status": payload.get("status"),
              "complete_feature_rows": feature.get("complete_feature_rows"),
              "training_blocker": (payload.get("training_blocker") or {}).get("code"),
              "blockers": payload.get("blockers"),
              "can_execute": False,
          }, sort_keys=True))
          if payload.get("status") == "BLOCKED":
              raise RuntimeError("NCAAF_MAINTENANCE_BLOCKED:" + json.dumps({
                  "status": payload.get("status"),
                  "training_blocker": (payload.get("training_blocker") or {}).get("code"),
                  "blockers": payload.get("blockers"),
              }, sort_keys=True))
          PY

  exact-candidate-replay-once:
    name: Real-data NCAAF exact candidate replay (read-only)
    # Intentional one-shot. This workflow is already an allowed protected-main
    # GitHub OIDC identity; it does not add a new trusted workflow or bearer key.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'NCAAF-ONE-SHOT-REPLAY-20261022')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      CANDIDATE_ID: 44d3dec0-e775-483f-b948-930214b69034
    steps:
      - name: Bind the protected main OIDC context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Replay exact 3691-row fitted candidate without persistence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          assert os.environ["WOW_CAN_EXECUTE"] == "false"
          assert os.environ["WOW_DRY_RUN_ONLY"] == "true"
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          expected_candidate = "44d3dec0-e775-483f-b948-930214b69034"
          assert os.environ["CANDIDATE_ID"] == expected_candidate

          oidc_base = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_base else "?"
          oidc_url = oidc_base + separator + urllib.parse.urlencode(
              {"audience": "wow-v17-multiscout"}
          )
          request = urllib.request.Request(
              oidc_url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              oidc_token = json.load(response)["value"]

          endpoint = (
              os.environ["WOW_ACTION_ORIGIN"].rstrip("/")
              + "/internal/v17/ncaaf-result-form-candidate-replay/"
              + expected_candidate
          )
          request = urllib.request.Request(
              endpoint, data=b"", method="POST",
              headers={
                  "Authorization": "Bearer " + oidc_token,
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=1180) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              # No token, request headers or response body in logs.
              raise RuntimeError(f"NCAAF_EXACT_REPLAY_HTTP_ERROR:{exc.code}") from None

          expected_status = "NCAAF_RESULT_FORM_DETERMINISTIC_REPLAY_PASS_SOURCE_HOLD"
          result = {
              "status": payload.get("status"),
              "code": payload.get("code"),
              "candidate_id": payload.get("candidate_id"),
              "model_artifact_version": payload.get("model_artifact_version"),
              "artifact_checksum": payload.get("artifact_checksum"),
              "dataset_hash": payload.get("dataset_hash"),
              "training_rows_replayed": payload.get("training_rows_replayed"),
              "deterministic_replay_status": payload.get("deterministic_replay_status"),
              "source_attestation_status": payload.get("source_attestation_status"),
              "source_hold_code": payload.get("source_hold_code"),
              "calibration_status": payload.get("calibration_status"),
              "certification_granted": payload.get("certification_granted"),
              "probability_publishable": payload.get("probability_publishable"),
              "can_execute": payload.get("can_execute"),
              "head_sha": os.environ["GITHUB_SHA"],
          }
          assert payload.get("candidate_id") == expected_candidate
          assert payload.get("certification_granted") is False
          assert payload.get("probability_publishable") is False
          assert payload.get("can_execute") is False
          assert payload.get("model_probability") is None
          assert payload.get("calibrated_lower_bound") is None
          assert payload.get("source_attestation_status") == "HOLD"
          print(json.dumps(result, sort_keys=True, indent=2))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## NCAAF exact fitted candidate replay — read-only\n")
              f.write("Commit: `" + os.environ["GITHUB_SHA"] + "`\n\n")
              f.write("Status: `" + str(result["status"]) + "`\n\n")
              f.write("Source attestation: **HOLD**. Publication/execution: **disabled**.\n")

          if payload.get("status") != expected_status or payload.get("training_rows_replayed") != 3691:
              raise RuntimeError(
                  "NCAAF_EXACT_REAL_CORPUS_REPLAY_NOT_VERIFIED:"
                  + str(payload.get("code") or payload.get("status"))
              )
          PY

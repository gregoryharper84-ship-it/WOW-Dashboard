name: v17-1ip-shadow-research

on:
  push:
    branches:
      - chatgpt/v17-1ip-artifact-research-20260901
    paths:
      - "artifacts/wow-engine/scripts/build_mlb_1ip_shadow_packet.py"
      - ".github/workflows/v17-1ip-shadow-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-shadow-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build temporal shadow packet
        env:
          PYTHONPATH: .
          MLB_1IP_RESEARCH_OUT: /tmp/mlb-1ip-shadow
        run: python scripts/build_mlb_1ip_shadow_packet.py
      - name: Upload immutable research packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-1ip-shadow-research-${{ github.sha }}
          path: /tmp/mlb-1ip-shadow
          if-no-files-found: error
          retention-days: 30

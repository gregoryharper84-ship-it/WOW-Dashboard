name: wow-v17-scout-source-refresh

on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "30 16 * * *"
    - cron: "30 22 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_SCOUT_DATABASE_URL: ${{ secrets.WOW_SCOUT_DATABASE_URL }}
      WOW_SPORTSDATAIO_API_KEY: ${{ secrets.WOW_SPORTSDATAIO_API_KEY }}
      WOW_CAN_EXECUTE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enforce research-only governance
        run: test "$WOW_CAN_EXECUTE" = "false"
      - name: Refresh raw structured source snapshots
        id: refresh
        # Always runs. Missing configuration is typed BLOCKED_SOURCE_CONFIGURATION
        # inside the receipt and exits non-zero; no provider or DB call is made.
        run: |
          mkdir -p "$RUNNER_TEMP/scout-source-refresh"
          python v17/scout_source_refresh.py --output "$RUNNER_TEMP/scout-source-refresh/receipt.json"
      - name: Ensure typed source refresh receipt exists
        if: always()
        shell: bash
        # Independent of checkout so a receipt is still written if setup failed.
        working-directory: ${{ runner.temp }}
        run: |
          receipt="$RUNNER_TEMP/scout-source-refresh/receipt.json"
          mkdir -p "$(dirname "$receipt")"
          if [ ! -s "$receipt" ]; then
            printf '%s\n' '{"schema_version":"wow.v17.scout_source_refresh.v2","status":"BLOCKED_REFRESH_EXCEPTION","health":"BLOCKED","error_type":"REFRESH_CLI_DID_NOT_EMIT_RECEIPT","blocker_codes":["REFRESH_EXCEPTION:REFRESH_CLI_DID_NOT_EMIT_RECEIPT"],"attempted_count":0,"successful_count":0,"blocked_count":0,"successful_snapshots":[],"blocked_snapshots":[],"prediction_authority":false,"can_execute":false}' > "$receipt"
            echo "::error::Scout source refresh CLI emitted no receipt; wrote BLOCKED_REFRESH_EXCEPTION fallback."
            exit 3
          fi
      - name: Summarize source refresh receipt
        if: always()
        shell: bash
        # Independent of checkout so a receipt is still written if setup failed.
        working-directory: ${{ runner.temp }}
        run: |
          {
            echo '### Scout structured-source refresh receipt'
            echo '```json'
            cat "$RUNNER_TEMP/scout-source-refresh/receipt.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source refresh receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-scout-source-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scout-source-refresh/receipt.json
          if-no-files-found: error
          retention-days: 90

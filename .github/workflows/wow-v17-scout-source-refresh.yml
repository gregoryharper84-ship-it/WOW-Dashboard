name: wow-v17-scout-source-refresh

on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "30 16 * * *"
    - cron: "30 22 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_SCOUT_DATABASE_URL: ${{ secrets.WOW_SCOUT_DATABASE_URL }}
      WOW_SPORTSDATAIO_API_KEY: ${{ secrets.WOW_SPORTSDATAIO_API_KEY }}
      WOW_CAN_EXECUTE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enforce research-only governance
        run: test "$WOW_CAN_EXECUTE" = "false"
      - name: Check source credentials
        id: credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scout-source-refresh"
          database_configured=false
          provider_configured=false
          [ -n "$WOW_SCOUT_DATABASE_URL" ] && database_configured=true
          [ -n "$WOW_SPORTSDATAIO_API_KEY" ] && provider_configured=true

          echo "database_configured=$database_configured" >> "$GITHUB_OUTPUT"
          echo "provider_configured=$provider_configured" >> "$GITHUB_OUTPUT"

          if [ "$database_configured" = "true" ] && [ "$provider_configured" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Scout structured-source refresh is blocked by missing runtime configuration."
          fi

      - name: Write blocked source refresh receipt
        if: steps.credentials.outputs.configured != 'true'
        shell: bash
        env:
          DATABASE_CONFIGURED: ${{ steps.credentials.outputs.database_configured }}
          PROVIDER_CONFIGURED: ${{ steps.credentials.outputs.provider_configured }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": "wow.v17.scout_source_refresh.v2",
              "status": "BLOCKED_SOURCE_CONFIGURATION",
              "configuration": {
                  "database_configured": os.environ.get("DATABASE_CONFIGURED") == "true",
                  "sportsdataio_configured": os.environ.get("PROVIDER_CONFIGURED") == "true",
              },
              "successful_snapshots": [],
              "blocked_snapshots": [],
              "prediction_authority": False,
              "can_execute": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "scout-source-refresh" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, sort_keys=True))
          PY
          cat "$RUNNER_TEMP/scout-source-refresh/receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh raw structured source snapshots
        if: steps.credentials.outputs.configured == 'true'
        run: |
          python v17/scout_source_refresh.py --output "$RUNNER_TEMP/scout-source-refresh/receipt.json"
          cat "$RUNNER_TEMP/scout-source-refresh/receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source refresh receipt
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-scout-source-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scout-source-refresh/receipt.json
          if-no-files-found: error
          retention-days: 90

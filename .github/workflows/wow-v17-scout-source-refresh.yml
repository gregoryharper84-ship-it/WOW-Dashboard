name: wow-v17-scout-source-refresh

on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "30 16 * * *"
    - cron: "30 22 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_SCOUT_DATABASE_URL: ${{ secrets.WOW_SCOUT_DATABASE_URL }}
      WOW_SPORTSDATAIO_API_KEY: ${{ secrets.WOW_SPORTSDATAIO_API_KEY }}
      # Optional public-web enrichment. Off unless explicitly configured.
      WOW_FIRECRAWL_ENABLED: ${{ vars.WOW_FIRECRAWL_ENABLED || 'false' }}
      WOW_FIRECRAWL_API_KEY: ${{ secrets.WOW_FIRECRAWL_API_KEY }}
      WOW_FIRECRAWL_ALLOWED_DOMAINS: ${{ vars.WOW_FIRECRAWL_ALLOWED_DOMAINS }}
      WOW_FIRECRAWL_TARGETS_JSON: ${{ vars.WOW_FIRECRAWL_TARGETS_JSON || '[]' }}
      # Public GDELT Project research needs no API key, license flag or DB.
      WOW_CAN_EXECUTE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enforce research-only governance
        run: test "$WOW_CAN_EXECUTE" = "false"
      - name: Public GDELT research discovery (independent of database)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/gdelt-public-news"
          python v17/public_gdelt_discovery.py --output "$RUNNER_TEMP/gdelt-public-news/receipt.json"
          cat "$RUNNER_TEMP/gdelt-public-news/receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Report public news acquisition health (nonblocking)
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "gdelt-public-news" / "receipt.json"
          receipt = json.loads(p.read_text()) if p.exists() else {}
          status = receipt.get("source_status", "MISSING")
          code = receipt.get("source_code", "RECEIPT_MISSING")
          articles = len(receipt.get("articles") or [])
          print(f"WOW_NEWS_SOURCE_STATUS={status} code={code} articles={articles}")
          if status != "OK" or not articles:
              print(f"::warning title=WOW News Feed Degraded::news_status={status} code={code} articles={articles}")
              raise SystemExit(1)
          PY
      - name: Build user-readable research newsfeed and coverage receipt
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gdelt-public-news"
          python v17/public_news_feed_report.py \
            --input "$RUNNER_TEMP/gdelt-public-news/receipt.json" \
            --output-json "$RUNNER_TEMP/gdelt-public-news/newsfeed.json" \
            --output-md "$RUNNER_TEMP/gdelt-public-news/newsfeed.md" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gdelt-public-news" / "newsfeed.json").read_text())
          assert report["can_execute"] is False
          assert report["probability_authority"] is False
          assert report["model_rescore_verified"] is False
          print(f"WOW_PUBLIC_NEWSFEED_STATUS={report['status']} sampled_sport={report['sampled_sport']} headline_groups={len(report['headlines'])}")
          PY
      - name: Upload public news evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-gdelt-public-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gdelt-public-news/receipt.json
            ${{ runner.temp }}/gdelt-public-news/newsfeed.json
            ${{ runner.temp }}/gdelt-public-news/newsfeed.md
          if-no-files-found: warn
          retention-days: 90
      - name: Check source credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$WOW_SCOUT_DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            if [ -z "$WOW_SPORTSDATAIO_API_KEY" ]; then
              echo "SportsDataIO credential missing: structured provider will emit typed blockers; optional permitted news can still run." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Scout source refresh blocked: database credential is unconfigured; no provider acquisition attempted." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Write blocked configuration receipt
        if: steps.credentials.outputs.configured != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/scout-source-refresh"
          cat > "$RUNNER_TEMP/scout-source-refresh/receipt.json" <<'JSON'
          {
            "schema_version": "wow.v17.scout_source_refresh.v1",
            "status": "BLOCKED_SOURCE_CONFIGURATION",
            "source_code": "SOURCE_DATABASE_UNCONFIGURED",
            "successful_snapshots": [],
            "blocked_snapshots": [
              {"provider": "SCOUT_SOURCE", "source_status": "BLOCKED",
               "source_code": "SOURCE_DATABASE_UNCONFIGURED",
               "prediction_authority": false, "can_execute": false}
            ],
            "prediction_authority": false,
            "can_execute": false
          }
          JSON
      - name: Refresh raw structured source snapshots
        if: steps.credentials.outputs.configured == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/scout-source-refresh"
          python v17/scout_source_refresh.py --output "$RUNNER_TEMP/scout-source-refresh/receipt.json"
          cat "$RUNNER_TEMP/scout-source-refresh/receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source refresh receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-scout-source-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scout-source-refresh/receipt.json
          if-no-files-found: error
          retention-days: 90

name: wow-v17-claude-engineering-worker
run-name: >-
  wow-v17-claude-engineering-worker lease=${{ inputs.lease_group || 'GLOBAL' }} incident=${{ inputs.target_incident || 'AUTO' }}

on:
  workflow_dispatch:
    inputs:
      fallback_reason:
        description: Typed reason the primary OpenAI worker could not run.
        required: false
        default: MANUAL_OR_UNSPECIFIED
      parent_run_id:
        description: Primary/dispatcher workflow run that caused this fallback.
        required: false
        default: ""
      target_incident:
        description: Optional exact P0 incident selected by domain-scoped rapid dispatch.
        required: false
        default: ""
      lease_group:
        description: Domain-scoped implementation lease group.
        required: false
        default: GLOBAL

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: wow-v17-engineering-domain-${{ inputs.lease_group || 'GLOBAL' }}
  cancel-in-progress: false

jobs:
  multi-agent-engineering:
    name: WOW V17 Claude fallback engineering team
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r artifacts/wow-engine/requirements.txt
          pip install PyYAML openapi-spec-validator
          python artifacts/wow-engine/v17/engineering_agent_team.py self-check
          python artifacts/wow-engine/v17/engineering_dispatch_queue.py validate \
            --manifest artifacts/wow-engine/v17/engineering_dispatch_manifest.json

      - name: Build live dual-stream dispatch plan
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_INCIDENT: ${{ inputs.target_incident }}
          REQUESTED_LEASE_GROUP: ${{ inputs.lease_group }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/wow-engine/v17/.agent-handoff
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 200 \
            --json number,title,body,state,updatedAt \
            > "$RUNNER_TEMP/wow-open-issues.json"
          python artifacts/wow-engine/v17/engineering_dispatch_queue.py build \
            --manifest artifacts/wow-engine/v17/engineering_dispatch_manifest.json \
            --issues "$RUNNER_TEMP/wow-open-issues.json" \
            --output "$RUNNER_TEMP/wow-dispatch-queue.json" \
            > /dev/null
          if [ -n "${TARGET_INCIDENT:-}" ]; then
            record=$(jq -c --arg id "$TARGET_INCIDENT" '[.records[] | select(.incident_id == $id)] | first // empty' "$RUNNER_TEMP/wow-dispatch-queue.json")
            [ -n "$record" ] || { echo "TARGET_INCIDENT_NOT_ACTIONABLE:$TARGET_INCIDENT" >&2; exit 1; }
            severity=$(jq -r '.severity' <<<"$record")
            lane=$(jq -r '.execution_lane' <<<"$record")
            lease_group=$(jq -r '.lease_group' <<<"$record")
            [ "$severity" = "P0" ] && [ "$lane" = "RAPID" ] || { echo "TARGET_INCIDENT_NOT_RAPID_P0:$TARGET_INCIDENT" >&2; exit 1; }
            [ "$lease_group" = "${REQUESTED_LEASE_GROUP:-GLOBAL}" ] || {
              echo "TARGET_INCIDENT_LEASE_MISMATCH:$TARGET_INCIDENT:$lease_group:${REQUESTED_LEASE_GROUP:-GLOBAL}" >&2
              exit 1
            }
            decision=$(jq -n --arg id "$TARGET_INCIDENT" --arg severity "$severity" '{
              restoration:{incident_id:$id,severity:$severity,state:"OPEN",reason:"Domain-scoped exact P0 target.",frontier_allowed:false},
              acceleration:{incident_id:null,severity:"NONE",state:"NONE",reason:"Disabled for domain-scoped P0 writer.",frontier_allowed:false},
              acceleration_blocked_reason:"DOMAIN_SCOPED_P0_LEASE",
              can_execute:false,
              terminal_authority:"V17_TERMINAL_REDUCER"
            }')
          else
            jq '.records |= map(select(.severity != "P0" or .execution_lane != "RAPID"))' \
              "$RUNNER_TEMP/wow-dispatch-queue.json" > "$RUNNER_TEMP/wow-standard-dispatch-queue.json"
            decision=$(python artifacts/wow-engine/v17/engineering_agent_team.py dual-priority \
              --ledger "$RUNNER_TEMP/wow-standard-dispatch-queue.json")
          fi
          cp "$RUNNER_TEMP/wow-dispatch-queue.json" artifacts/wow-engine/v17/.agent-handoff/dispatch-queue.json
          printf '%s\n' "$decision" > artifacts/wow-engine/v17/.agent-handoff/dispatch.json
          restoration=$(jq -r '.restoration.incident_id // ""' <<<"$decision")
          acceleration=$(jq -r '.acceleration.incident_id // ""' <<<"$decision")
          queue_depth=$(jq -r '.queue_depth // 0' "$RUNNER_TEMP/wow-dispatch-queue.json")
          echo "restoration=$restoration" >> "$GITHUB_OUTPUT"
          echo "acceleration=$acceleration" >> "$GITHUB_OUTPUT"
          lease_group=$(jq -r --arg id "$restoration" '[.records[] | select(.incident_id == $id)] | first | .lease_group // "GLOBAL"' "$RUNNER_TEMP/wow-dispatch-queue.json")
          echo "queue_depth=$queue_depth" >> "$GITHUB_OUTPUT"
          echo "lease_group=$lease_group" >> "$GITHUB_OUTPUT"

      - name: Initialize persistent-worker safety state
        id: safety
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORATION: ${{ steps.dispatch.outputs.restoration }}
          ACCELERATION: ${{ steps.dispatch.outputs.acceleration }}
          LEASE_GROUP: ${{ steps.dispatch.outputs.lease_group }}
        run: |
          set -euo pipefail
          marker="<!-- WOW_DUAL_STREAM_HEARTBEAT:${LEASE_GROUP:-GLOBAL} -->"
          comments=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/1138/comments?per_page=100")
          previous_body=$(jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker))][0].body // ""' <<<"$comments")
          previous_epoch=$(sed -n 's/^- lease_epoch: \([0-9][0-9]*\)$/\1/p' <<<"$previous_body" | head -1)
          previous_epoch=${previous_epoch:-0}
          lease_epoch=$((previous_epoch + 1))
          worker_id="github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:anthropic"
          expires_at=$(date -u -d '+180 minutes' +%Y-%m-%dT%H:%M:%SZ)

          PYTHONPATH=artifacts/wow-engine python - "$RUNNER_TEMP/wow-dispatch-queue.json" "$RESTORATION" "$ACCELERATION" "$worker_id" "$lease_epoch" "$expires_at" "$LEASE_GROUP" <<'PY'
          import json, sys
          from pathlib import Path
          from v17.persistent_worker_safety import Lease, build_ticket_context, circuit_mode, CircuitState

          queue_path, restoration, acceleration, worker_id, epoch, expires_at, lease_group = sys.argv[1:]
          queue = json.loads(Path(queue_path).read_text())
          by_id = {str(row["incident_id"]): row for row in queue["records"]}
          out = Path("artifacts/wow-engine/v17/.agent-handoff")
          out.mkdir(parents=True, exist_ok=True)

          def write_context(name, incident_id):
              if not incident_id:
                  return
              record = by_id[incident_id]
              context = build_ticket_context(
                  {
                      "incident_id": incident_id,
                      "severity": record.get("severity"),
                      "state": record.get("state"),
                      "defect_contract": record.get("body"),
                      "reproduction_evidence": [],
                      "acceptance_criteria": [],
                      "relevant_paths": [],
                      "governance_invariants": {
                          "can_execute": False,
                          "terminal_authority": "V17_TERMINAL_REDUCER",
                      },
                      "same_ticket_attempts": [],
                      "branch": "",
                      "commit_sha": "",
                  },
                  execution_id=f"{worker_id}:{incident_id}:{epoch}",
              )
              (out / name).write_text(json.dumps(context, indent=2, sort_keys=True) + "\n")

          write_context("restoration-context.json", restoration)
          write_context("acceleration-context.json", acceleration)
          mode = circuit_mode(CircuitState(
              total_recent_items=0,
              systemic_failures=0,
              rollback_failures=0,
              provider_failures=0,
          )).value
          lease = Lease(restoration or "NONE", worker_id, int(epoch), expires_at)
          (out / "lease.json").write_text(json.dumps({
              "work_item_id": lease.work_item_id,
              "worker_id": lease.worker_id,
              "lease_epoch": lease.lease_epoch,
              "expires_at": lease.expires_at,
              "worker_mode": mode,
              "lease_group": lease_group or "GLOBAL",
              "can_execute": False,
              "terminal_authority": "V17_TERMINAL_REDUCER",
          }, indent=2, sort_keys=True) + "\n")
          PY

          body=$(cat <<EOF
          $marker
          ### WOW V17 dual-stream dispatcher heartbeat
          - workflow_run_id: $GITHUB_RUN_ID
          - provider: Anthropic fallback
          - queue_depth: ${{ steps.dispatch.outputs.queue_depth }}
          - current_restoration_target: ${RESTORATION:-NONE}
          - current_acceleration_target: ${ACCELERATION:-NONE}
          - lease_group: ${LEASE_GROUP:-GLOBAL}
          - lease_epoch: $lease_epoch
          - worker_id: $worker_id
          - lease_expires_at: $expires_at
          - worker_mode: RUNNING
          - restoration_action: CLAIMED
          - last_acceleration_advancement: CLAIMED
          - acceleration_next_action: TRIAGE
          - retry_dlq_state: NONE
          - safe_hold_state: RUNNING
          - duplicate_incident_created: false
          - can_execute: false
          - terminal_authority: V17_TERMINAL_REDUCER
          EOF
          )
          comment_id=$(jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker))][0].id // empty' <<<"$comments")
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/1138/comments" -f body="$body" >/dev/null
          fi
          echo "lease_epoch=$lease_epoch" >> "$GITHUB_OUTPUT"
          echo "worker_id=$worker_id" >> "$GITHUB_OUTPUT"
          echo "expires_at=$expires_at" >> "$GITHUB_OUTPUT"
          echo "worker_mode=RUNNING" >> "$GITHUB_OUTPUT"

      - name: Verify Anthropic authentication
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::Anthropic fallback authentication is missing."
            exit 1
          fi

      - name: Engineering Lead agent
        id: lead_agent
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 ENGINEERING_LEAD_AGENT running on Anthropic/Claude fallback tooling.
            OpenAI primary engineering is unavailable for this run because: ${{ inputs.fallback_reason }}.
            Read repository governance, .agents/skills/wow-engineering-lead-agent/SKILL.md,
            artifacts/wow-engine/v17/.agent-handoff/dispatch.json,
            artifacts/wow-engine/v17/.agent-handoff/restoration-context.json, and current local CI/PR evidence.
            The deterministic dispatcher has already selected the restoration target. Use that exact
            restoration incident; do not reprioritize or substitute another issue. If the restoration
            incident is null, return NO_ACTION. Do not edit files. You own restoration dispatch only;
            do not diagnose, implement, approve, merge, deploy, or change sporting probability behavior.
            Preserve can_execute=false and V17_TERMINAL_REDUCER.
          output_schema: '{"type":"object","properties":{"action":{"type":"string","enum":["REPAIR","VERIFY_RELEASE","NO_ACTION"]},"incident_id":{"type":"string"},"severity":{"type":"string"},"current_state":{"type":"string"},"reason":{"type":"string"},"frontier_allowed":{"type":"boolean"}},"required":["action","incident_id","severity","current_state","reason","frontier_allowed"],"additionalProperties":false}'

      - name: Normalize Lead dispatch
        id: lead
        shell: bash
        env:
          RESULT: ${{ steps.lead_agent.outputs.structured_output }}
          EXPECTED_INCIDENT: ${{ steps.dispatch.outputs.restoration }}
        run: |
          set -euo pipefail
          action=$(jq -r '.action' <<<"$RESULT")
          incident=$(jq -r '.incident_id' <<<"$RESULT")
          if [ -n "${EXPECTED_INCIDENT:-}" ] && [ "$incident" != "$EXPECTED_INCIDENT" ]; then
            echo "::error::Lead incident $incident does not match deterministic restoration target $EXPECTED_INCIDENT."
            exit 1
          fi
          if [ -z "${EXPECTED_INCIDENT:-}" ] && [ "$action" != "NO_ACTION" ]; then
            echo "::error::Lead must return NO_ACTION when dispatcher has no restoration target."
            exit 1
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/wow-engine/v17/.agent-handoff
          printf '%s\n' "$RESULT" > artifacts/wow-engine/v17/.agent-handoff/lead.json

      - name: Acceleration evidence / triage agent
        id: acceleration_agent
        if: steps.dispatch.outputs.acceleration != ''
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 ACCELERATION_TRIAGE_AGENT running on fallback tooling.
            Read artifacts/wow-engine/v17/.agent-handoff/dispatch.json and
            artifacts/wow-engine/v17/.agent-handoff/acceleration-context.json.
            Work only on the exact acceleration incident selected by the deterministic dispatcher.
            Advance that existing issue with concrete repository evidence: verify its current state,
            narrow its next safe implementation slice, identify tests and exact blockers, and avoid
            duplicating any incident or scheduler. Do not edit files, approve work, merge, deploy, or
            change sporting probability behavior. Preserve V17_TERMINAL_REDUCER and can_execute=false.
          output_schema: '{"type":"object","properties":{"incident_id":{"type":"string"},"advancement":{"type":"string"},"evidence":{"type":"array","items":{"type":"string"}},"next_action":{"type":"string"},"conflict_keys_verified":{"type":"boolean"},"hard_boundary":{"type":"string"}},"required":["incident_id","advancement","evidence","next_action","conflict_keys_verified","hard_boundary"],"additionalProperties":false}'

      - name: Normalize acceleration handoff
        id: acceleration
        if: steps.acceleration_agent.outcome == 'success'
        shell: bash
        env:
          RESULT: ${{ steps.acceleration_agent.outputs.structured_output }}
          EXPECTED_INCIDENT: ${{ steps.dispatch.outputs.acceleration }}
        run: |
          set -euo pipefail
          incident=$(jq -r '.incident_id' <<<"$RESULT")
          if [ "$incident" != "${EXPECTED_INCIDENT:-}" ]; then
            echo "::error::Acceleration incident $incident does not match deterministic target $EXPECTED_INCIDENT."
            exit 1
          fi
          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          echo "advancement<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.advancement' <<<"$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "next_action<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.next_action' <<<"$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RESULT" > artifacts/wow-engine/v17/.agent-handoff/acceleration.json

      - name: Research / Root-Cause Triage agent
        id: triage_agent
        if: steps.lead.outputs.action == 'REPAIR'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 RESEARCH_TRIAGE_AGENT running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-research-triage-agent/SKILL.md and
            artifacts/wow-engine/v17/.agent-handoff/lead.json.
            Reproduce the selected defect, isolate the first failing stage, distinguish symptom
            from root cause, define objective acceptance criteria and the smallest fix boundary.
            Preserve the exact typed failure. Do not edit files. Preserve V17 terminal authority,
            exact-once semantics, and can_execute=false. Never substitute market evidence for model probability.
          output_schema: '{"type":"object","properties":{"incident_id":{"type":"string"},"repairable":{"type":"boolean"},"reproduction_status":{"type":"string"},"root_cause":{"type":"string"},"risk_class":{"type":"string","enum":["R0","R1","R2-restorative","R2-repair-policy","R3","NONE"]},"primary_subsystem":{"type":"string"},"typed_failure":{"type":"string"},"acceptance_criteria":{"type":"array","items":{"type":"string"}},"recommended_fix_boundary":{"type":"string"},"hard_boundary":{"type":"string"}},"required":["incident_id","repairable","reproduction_status","root_cause","risk_class","primary_subsystem","typed_failure","acceptance_criteria","recommended_fix_boundary","hard_boundary"],"additionalProperties":false}'

      - name: Normalize Triage packet
        id: triage
        if: steps.lead.outputs.action == 'REPAIR'
        shell: bash
        env:
          RESULT: ${{ steps.triage_agent.outputs.structured_output }}
          EXPECTED_INCIDENT: ${{ steps.lead.outputs.incident }}
        run: |
          set -euo pipefail
          repairable=$(jq -r '.repairable' <<<"$RESULT")
          risk=$(jq -r '.risk_class' <<<"$RESULT")
          incident=$(jq -r '.incident_id' <<<"$RESULT")
          if [ -z "${EXPECTED_INCIDENT:-}" ] || [ "$incident" != "$EXPECTED_INCIDENT" ]; then
            echo "::error::Triage incident $incident does not match Lead incident ${EXPECTED_INCIDENT:-MISSING}."
            exit 1
          fi
          subsystem=$(jq -r '.primary_subsystem // "UNKNOWN"' <<<"$RESULT")
          failure=$(jq -r '.typed_failure // "NONE"' <<<"$RESULT")
          echo "repairable=$repairable" >> "$GITHUB_OUTPUT"
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          echo "subsystem=$subsystem" >> "$GITHUB_OUTPUT"
          echo "failure=$failure" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RESULT" > artifacts/wow-engine/v17/.agent-handoff/triage.json

      - name: Route specialist subagent
        id: specialist_route
        if: steps.lead.outputs.action == 'REPAIR'
        shell: bash
        env:
          TYPED_FAILURE: ${{ steps.triage.outputs.failure }}
          PRIMARY_SUBSYSTEM: ${{ steps.triage.outputs.subsystem }}
        run: |
          set -euo pipefail
          route=$(python artifacts/wow-engine/v17/engineering_agent_team.py support-route \
            --typed-failure "$TYPED_FAILURE" \
            --subsystem "$PRIMARY_SUBSYSTEM")
          echo "subagent=$(jq -r '.subagent' <<<"$route")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$route" > artifacts/wow-engine/v17/.agent-handoff/specialist-route.json

      - name: Specialist diagnostic subagent
        id: specialist_agent
        if: steps.lead.outputs.action == 'REPAIR'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 ${{ steps.specialist_route.outputs.subagent }} running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-specialist-subagents/SKILL.md,
            artifacts/wow-engine/v17/.agent-handoff/triage.json, and
            artifacts/wow-engine/v17/.agent-handoff/specialist-route.json.
            Stay on the same parent incident. Verify or challenge triage, identify the first failing
            boundary, collect evidence, inspect adjacent risks, and recommend narrow tests.
            Do not edit files, approve implementation, or change sporting probability behavior.
            Preserve can_execute=false.
          output_schema: '{"type":"object","properties":{"incident_id":{"type":"string"},"subagent":{"type":"string"},"hypothesis_status":{"type":"string","enum":["CONFIRMED","NARROWED","REJECTED","INCONCLUSIVE"]},"evidence_verified":{"type":"array","items":{"type":"string"}},"first_failing_boundary":{"type":"string"},"adjacent_risks":{"type":"array","items":{"type":"string"}},"recommended_tests":{"type":"array","items":{"type":"string"}},"next_non_conflicting_action":{"type":"string"},"hard_boundary":{"type":"string"}},"required":["incident_id","subagent","hypothesis_status","evidence_verified","first_failing_boundary","adjacent_risks","recommended_tests","next_non_conflicting_action","hard_boundary"],"additionalProperties":false}'

      - name: Normalize specialist packet
        id: specialist
        if: steps.lead.outputs.action == 'REPAIR'
        shell: bash
        env:
          RESULT: ${{ steps.specialist_agent.outputs.structured_output }}
          EXPECTED_INCIDENT: ${{ steps.triage.outputs.incident }}
          EXPECTED_SUBAGENT: ${{ steps.specialist_route.outputs.subagent }}
        run: |
          set -euo pipefail
          incident=$(jq -r '.incident_id' <<<"$RESULT")
          hypothesis=$(jq -r '.hypothesis_status' <<<"$RESULT")
          subagent=$(jq -r '.subagent' <<<"$RESULT")
          if [ -z "${EXPECTED_INCIDENT:-}" ] || [ "$incident" != "$EXPECTED_INCIDENT" ]; then
            echo "::error::Specialist incident $incident does not match Triage incident ${EXPECTED_INCIDENT:-MISSING}."
            exit 1
          fi
          if [ -z "${EXPECTED_SUBAGENT:-}" ] || [ "$subagent" != "$EXPECTED_SUBAGENT" ]; then
            echo "::error::Specialist identity $subagent does not match routed specialist ${EXPECTED_SUBAGENT:-MISSING}."
            exit 1
          fi
          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          echo "hypothesis=$hypothesis" >> "$GITHUB_OUTPUT"
          echo "subagent=$subagent" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RESULT" > artifacts/wow-engine/v17/.agent-handoff/specialist.json

      - name: Deny policy-changing implementation lease
        if: steps.lead.outputs.action == 'REPAIR' && (steps.triage.outputs.risk == 'R2-repair-policy' || steps.triage.outputs.risk == 'R3')
        run: echo "Governed hard boundary; implementation lease denied." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce mutation safety gate
        id: mutation_gate
        if: >-
          steps.triage.outputs.repairable == 'true' &&
          (steps.specialist.outputs.hypothesis == 'CONFIRMED' ||
           steps.specialist.outputs.hypothesis == 'NARROWED') &&
          (steps.triage.outputs.risk == 'R0' ||
           steps.triage.outputs.risk == 'R1' ||
           steps.triage.outputs.risk == 'R2-restorative')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_INCIDENT: ${{ steps.dispatch.outputs.restoration }}
          EXPECTED_EPOCH: ${{ steps.safety.outputs.lease_epoch }}
          EXPECTED_WORKER: ${{ steps.safety.outputs.worker_id }}
          LEASE_GROUP: ${{ steps.dispatch.outputs.lease_group }}
        run: |
          set -euo pipefail
          marker="<!-- WOW_DUAL_STREAM_HEARTBEAT:${LEASE_GROUP:-GLOBAL} -->"
          comments=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/1138/comments?per_page=100")
          body=$(jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker))][0].body // ""' <<<"$comments")
          latest_epoch=$(sed -n 's/^- lease_epoch: \([0-9][0-9]*\)$/\1/p' <<<"$body" | head -1)
          latest_worker=$(sed -n 's/^- worker_id: \(.*\)$/\1/p' <<<"$body" | head -1)
          PYTHONPATH=artifacts/wow-engine python - "$EXPECTED_INCIDENT" "$EXPECTED_EPOCH" "$EXPECTED_WORKER" "$latest_epoch" "$latest_worker" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from v17.persistent_worker_safety import Lease, lease_allows_mutation

          incident, expected_epoch, expected_worker, latest_epoch, latest_worker = sys.argv[1:]
          lease_data = json.loads(Path("artifacts/wow-engine/v17/.agent-handoff/lease.json").read_text())
          if lease_data.get("worker_mode") != "RUNNING":
              raise SystemExit("SAFE_HOLD: mutation denied")
          lease = Lease(
              lease_data["work_item_id"],
              lease_data["worker_id"],
              int(lease_data["lease_epoch"]),
              lease_data["expires_at"],
          )
          allowed = lease_allows_mutation(
              lease,
              expected_work_item_id=incident,
              latest_epoch=int(latest_epoch or -1),
              current_worker_id=latest_worker,
              now=datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          )
          if not allowed or str(lease.lease_epoch) != expected_epoch or lease.worker_id != expected_worker:
              raise SystemExit("LEASE_FENCE_REJECTED: mutation denied")
          PY
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Implementation agent
        id: implementation_agent
        if: >-
          steps.mutation_gate.outputs.allowed == 'true' &&
          steps.triage.outputs.repairable == 'true' &&
          (steps.specialist.outputs.hypothesis == 'CONFIRMED' ||
           steps.specialist.outputs.hypothesis == 'NARROWED') &&
          (steps.triage.outputs.risk == 'R0' ||
           steps.triage.outputs.risk == 'R1' ||
           steps.triage.outputs.risk == 'R2-restorative')
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":workspace"
          prompt: |
            You are the WOW V17 ENGINEERING_AGENT running on Anthropic/Claude fallback tooling
            and hold the single implementation lease for domain group ${{ steps.dispatch.outputs.lease_group }}.
            Read .agents/skills/wow-engineering-implementation-agent/SKILL.md,
            .agents/skills/wow-replit-patch-governor/SKILL.md,
            artifacts/wow-engine/v17/.agent-handoff/triage.json, and
            artifacts/wow-engine/v17/.agent-handoff/specialist.json.
            Implement only the proven root cause and acceptance criteria. Do not diagnose another
            incident, edit .github/workflows/**, or touch .agent-handoff/**.
            Run the narrowest reproduction first and relevant regressions. Preserve can_execute=false,
            DRY_RUN_ONLY_NO_LIVE_TRADING_NO_MARKET_ORDERS=true, exact typed failures, exact-once
            behavior, V17_TERMINAL_REDUCER, and all probability governance. No Class C change is authorized.
          output_schema: '{"type":"object","properties":{"changed":{"type":"boolean"},"incident_id":{"type":"string"},"risk_class":{"type":"string","enum":["R0","R1","R2-restorative","R2-repair-policy","R3","NONE"]},"summary":{"type":"string"},"tests":{"type":"string"},"hard_boundary":{"type":"string"}},"required":["changed","incident_id","risk_class","summary","tests","hard_boundary"],"additionalProperties":false}'

      - name: Normalize Implementation result
        id: impl
        if: steps.implementation_agent.outcome == 'success'
        shell: bash
        env:
          RESULT: ${{ steps.implementation_agent.outputs.structured_output }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_INCIDENT: ${{ steps.triage.outputs.incident }}
          EXPECTED_RISK: ${{ steps.triage.outputs.risk }}
        run: |
          set -euo pipefail
          changed=$(jq -r '.changed' <<<"$RESULT")
          risk=$(jq -r '.risk_class' <<<"$RESULT")
          incident=$(jq -r '.incident_id' <<<"$RESULT")
          if [ -z "${EXPECTED_INCIDENT:-}" ] || [ "$incident" != "$EXPECTED_INCIDENT" ]; then
            echo "::error::Engineering incident $incident does not match Triage incident ${EXPECTED_INCIDENT:-MISSING}."
            exit 1
          fi
          if [ -z "${EXPECTED_RISK:-}" ] || [ "$risk" != "$EXPECTED_RISK" ]; then
            echo "::error::Engineering risk $risk does not match Triage risk ${EXPECTED_RISK:-MISSING}."
            exit 1
          fi
          branch=""
          head_sha=""
          rm -f artifacts/wow-engine/v17/.agent-handoff/lead.json \
            artifacts/wow-engine/v17/.agent-handoff/triage.json \
            artifacts/wow-engine/v17/.agent-handoff/specialist.json \
            artifacts/wow-engine/v17/.agent-handoff/specialist-route.json
          if [ "$changed" = "true" ]; then
            git diff --quiet --exit-code && { echo "::error::Claude reported changes but returned no working-tree diff."; exit 1; }
            branch="claude/engineering/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add --all
            git commit -m "Claude Engineering: ${incident:-fallback-repair}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --set-upstream origin "$branch"
            head_sha=$(git rev-parse HEAD)
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout implementation branch
        if: steps.impl.outputs.changed == 'true'
        run: |
          git fetch origin "${{ steps.impl.outputs.branch }}"
          git switch "${{ steps.impl.outputs.branch }}"

      - name: Independent Review agent
        id: review_agent
        if: steps.impl.outputs.changed == 'true'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 INDEPENDENT_REVIEW_AGENT running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-independent-review-agent/SKILL.md.
            Review the complete current-branch diff against main. You did not write this patch.
            Do not edit files. Verify root-cause repair, minimal scope, test quality, V17 ownership,
            typed failures, security, exact-once behavior, terminal authority, and can_execute=false.
            State whether independent SYSTEM_ARCHITECT_AGENT review is required.
          output_schema: '{"type":"object","properties":{"decision":{"type":"string","enum":["PASS","REJECT"]},"system_architect_required":{"type":"boolean"},"findings":{"type":"array","items":{"type":"string"}},"residual_risks":{"type":"array","items":{"type":"string"}}},"required":["decision","system_architect_required","findings","residual_risks"],"additionalProperties":false}'

      - name: Normalize Review
        id: review
        if: steps.impl.outputs.changed == 'true'
        env:
          RESULT: ${{ steps.review_agent.outputs.structured_output }}
        run: |
          echo "decision=$(jq -r '.decision' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          echo "architect=$(jq -r '.system_architect_required' <<<"$RESULT")" >> "$GITHUB_OUTPUT"

      - name: System Architect agent
        id: architect_agent
        if: steps.review.outputs.decision == 'PASS' && steps.review.outputs.architect == 'true'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 SYSTEM_ARCHITECT_AGENT running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-system-architect-agent/SKILL.md.
            Review the current diff for protected-contract changes. Do not edit. Reject hidden ownership
            changes, probability substitution, terminal-authority drift, typed-failure collapse,
            unsafe auth/execution changes, or ungoverned Class C behavior.
          output_schema: '{"type":"object","properties":{"decision":{"type":"string","enum":["PASS","REJECT"]},"findings":{"type":"array","items":{"type":"string"}}},"required":["decision","findings"],"additionalProperties":false}'

      - name: Normalize Architect decision
        id: architect
        if: steps.review.outputs.decision == 'PASS'
        shell: bash
        env:
          REQUIRED: ${{ steps.review.outputs.architect }}
          RESULT: ${{ steps.architect_agent.outputs.structured_output }}
        run: |
          if [ "$REQUIRED" = "true" ]; then
            echo "decision=$(jq -r '.decision' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          else
            echo "decision=NOT_APPLICABLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Deterministic QA regression
        id: regression
        if: steps.review.outputs.decision == 'PASS' && (steps.architect.outputs.decision == 'PASS' || steps.architect.outputs.decision == 'NOT_APPLICABLE')
        shell: bash
        working-directory: artifacts/wow-engine
        run: |
          set +e
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/qa-regression.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: QA Verification agent
        id: qa_agent
        if: steps.impl.outputs.changed == 'true' && steps.regression.outputs.status == '0'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 QA_VERIFICATION_AGENT running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-qa-verification-agent/SKILL.md.
            Review the current diff and deterministic regression evidence. You did not implement the patch.
            Verify acceptance criteria, adjacent-lane safety, exact typed failures, probability/lower-bound
            integrity when applicable, immutable/exact-once behavior, terminal authority, and can_execute=false.
            Do not edit files.
          output_schema: '{"type":"object","properties":{"decision":{"type":"string","enum":["PASS","REJECT"]},"acceptance_status":{"type":"string"},"findings":{"type":"array","items":{"type":"string"}}},"required":["decision","acceptance_status","findings"],"additionalProperties":false}'

      - name: Normalize QA
        id: qa
        if: steps.impl.outputs.changed == 'true' && steps.regression.outputs.status == '0'
        env:
          RESULT: ${{ steps.qa_agent.outputs.structured_output }}
        run: echo "decision=$(jq -r '.decision' <<<"$RESULT")" >> "$GITHUB_OUTPUT"


      - name: Write exact-head governance receipt
        if: steps.impl.outputs.changed == 'true'
        shell: bash
        env:
          IMPLEMENTATION_BRANCH: ${{ steps.impl.outputs.branch }}
          IMPLEMENTATION_HEAD_SHA: ${{ steps.impl.outputs.head_sha }}
          INCIDENT: ${{ steps.impl.outputs.incident }}
          RISK: ${{ steps.impl.outputs.risk }}
          LEAD_ACTION: ${{ steps.lead.outputs.action }}
          LEAD_INCIDENT: ${{ steps.lead.outputs.incident }}
          TRIAGE_REPAIRABLE: ${{ steps.triage.outputs.repairable }}
          TRIAGE_INCIDENT: ${{ steps.triage.outputs.incident }}
          SPECIALIST: ${{ steps.specialist.outputs.subagent }}
          SPECIALIST_INCIDENT: ${{ steps.specialist.outputs.incident }}
          SPECIALIST_HYPOTHESIS: ${{ steps.specialist.outputs.hypothesis }}
          REVIEW_DECISION: ${{ steps.review.outputs.decision }}
          ARCHITECT_DECISION: ${{ steps.architect.outputs.decision }}
          REGRESSION_STATUS: ${{ steps.regression.outputs.status }}
          QA_DECISION: ${{ steps.qa.outputs.decision }}
        run: |
          set -euo pipefail
          governance_complete=false
          if [ -n "${IMPLEMENTATION_HEAD_SHA:-}" ] &&
             [ -n "${IMPLEMENTATION_BRANCH:-}" ] &&
             [ -n "${INCIDENT:-}" ] &&
             [ "${LEAD_ACTION:-}" = "REPAIR" ] &&
             [ "${LEAD_INCIDENT:-}" = "${INCIDENT:-}" ] &&
             [ "${TRIAGE_REPAIRABLE:-}" = "true" ] &&
             [ "${TRIAGE_INCIDENT:-}" = "${INCIDENT:-}" ] &&
             [ -n "${SPECIALIST:-}" ] && [ "${SPECIALIST:-}" != "NOT_RUN" ] &&
             [ "${SPECIALIST_INCIDENT:-}" = "${INCIDENT:-}" ] &&
             { [ "${SPECIALIST_HYPOTHESIS:-}" = "CONFIRMED" ] || [ "${SPECIALIST_HYPOTHESIS:-}" = "NARROWED" ]; } &&
             [ "${REVIEW_DECISION:-}" = "PASS" ] &&
             { [ "${ARCHITECT_DECISION:-}" = "PASS" ] || [ "${ARCHITECT_DECISION:-}" = "NOT_APPLICABLE" ]; } &&
             [ "${REGRESSION_STATUS:-}" = "0" ] &&
             [ "${QA_DECISION:-}" = "PASS" ]; then
            governance_complete=true
          fi

          receipt="$RUNNER_TEMP/wow-engineering-governance-receipt.json"
          jq -n \
            --arg schema_version "1" \
            --arg workflow_name "wow-v17-claude-engineering-worker" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg branch "${IMPLEMENTATION_BRANCH:-}" \
            --arg head_sha "${IMPLEMENTATION_HEAD_SHA:-}" \
            --arg incident "${INCIDENT:-}" \
            --arg risk "${RISK:-}" \
            --arg lead_action "${LEAD_ACTION:-NOT_RUN}" \
            --arg lead_incident "${LEAD_INCIDENT:-}" \
            --arg triage_repairable "${TRIAGE_REPAIRABLE:-false}" \
            --arg triage_incident "${TRIAGE_INCIDENT:-}" \
            --arg specialist "${SPECIALIST:-NOT_RUN}" \
            --arg specialist_incident "${SPECIALIST_INCIDENT:-}" \
            --arg specialist_hypothesis "${SPECIALIST_HYPOTHESIS:-NOT_RUN}" \
            --arg review "${REVIEW_DECISION:-NOT_RUN}" \
            --arg architect "${ARCHITECT_DECISION:-NOT_RUN}" \
            --arg regression "${REGRESSION_STATUS:-NOT_RUN}" \
            --arg qa "${QA_DECISION:-NOT_RUN}" \
            --argjson governance_complete "$governance_complete" \
            '{
              receipt_schema_version: ($schema_version | tonumber),
              workflow_name: $workflow_name,
              repository: $repository,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              created_at_utc: $utc,
              implementation: {
                changed: true,
                branch: $branch,
                head_sha: $head_sha,
                incident_id: $incident,
                risk_class: $risk
              },
              handoff: {
                lead_dispatch: {decision: $lead_action, incident_id: $lead_incident},
                triage: {
                  repairable: ($triage_repairable == "true"),
                  incident_id: $triage_incident
                },
                specialist: {name: $specialist, incident_id: $specialist_incident, hypothesis: $specialist_hypothesis},
                engineering: {changed: true, incident_id: $incident},
                independent_review: {decision: $review},
                system_architect: {decision: $architect},
                deterministic_regression: {status: $regression},
                qa: {decision: $qa}
              },
              governance_complete: $governance_complete,
              terminal_authority: "V17_TERMINAL_REDUCER",
              can_execute: false
            }' > "$receipt"
          sha256sum "$receipt" | awk '{print $1}' > "$RUNNER_TEMP/wow-engineering-governance-receipt.sha256"

      - name: Upload exact-head governance receipt
        if: steps.impl.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-engineering-governance-${{ steps.impl.outputs.head_sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/wow-engineering-governance-receipt.json
            ${{ runner.temp }}/wow-engineering-governance-receipt.sha256

      - name: Open governed engineering PR
        if: steps.impl.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.impl.outputs.branch }}
          INCIDENT: ${{ steps.impl.outputs.incident }}
          RISK: ${{ steps.impl.outputs.risk }}
          REVIEW: ${{ steps.review.outputs.decision }}
          ARCHITECT: ${{ steps.architect.outputs.decision }}
          REGRESSION: ${{ steps.regression.outputs.status }}
          QA: ${{ steps.qa.outputs.decision }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$BRANCH" --json number --jq '.[0].number // empty')
          [ -n "$existing" ] && { echo "Existing PR #$existing." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          compare=$(gh api "/repos/${GITHUB_REPOSITORY}/compare/main...${BRANCH}")
          mapfile -t files < <(jq -r '.files[].filename' <<<"$compare")
          gates=FAIL
          if [ "$REVIEW" = "PASS" ] &&
             { [ "$ARCHITECT" = "PASS" ] || [ "$ARCHITECT" = "NOT_APPLICABLE" ]; } &&
             [ "$REGRESSION" = "0" ] && [ "$QA" = "PASS" ]; then
            gates=PASS
          fi
          body="$RUNNER_TEMP/pr.md"
          {
            echo "## WOW V17 Claude fallback Engineering repair"
            echo
            echo "Incident: \`$INCIDENT\`"
            echo "Risk: \`$RISK\`"
            echo "Fallback reason: \`${{ inputs.fallback_reason }}\`"
            echo "Parent run: \`${{ inputs.parent_run_id }}\`"
            echo "Independent review: \`${REVIEW:-NOT_RUN}\`"
            echo "System architect: \`${ARCHITECT:-NOT_RUN}\`"
            echo "Deterministic regression: \`${REGRESSION:-NOT_RUN}\`"
            echo "QA agent: \`${QA:-NOT_RUN}\`"
            echo "Pre-PR agent gates: \`$gates\`"
            echo
            echo "### Changed files"
            for file in "${files[@]}"; do echo "- \`$file\`"; done
            echo
            echo "### Governance"
            echo "- Anthropic/Claude is a fallback engineering provider only"
            echo "- can_execute=false remains binding"
            echo "- DRY_RUN_ONLY_NO_LIVE_TRADING_NO_MARKET_ORDERS=true remains binding"
            echo "- V17_TERMINAL_REDUCER remains sole global terminal authority"
            echo "- No Class C probability change is authorized"
            echo "- Lead, Triage, Specialist, Implementation, Review, Architect, and QA are independent agent invocations"
            if [ "$gates" = "PASS" ] && { [ "$RISK" = "R0" ] || [ "$RISK" = "R1" ] || [ "$RISK" = "R2-restorative" ]; }; then
              echo
              echo "Morning-Green-Autonomous: true"
              echo "Morning-Green-Risk: $RISK"
              echo "Morning-Green-Acceptance-Workflow: wow-v17-nightly-engineering-scan.yml"
              echo
              echo '```morning-green-scope'
              echo "risk_class: $RISK"
              echo "allowed_files:"
              for file in "${files[@]}"; do echo "  - $file"; done
              echo "protected_files: []"
              echo '```'
            fi
          } > "$body"
          title="Claude Engineering: ${INCIDENT:-fallback-repair}"
          if [ "$gates" = "PASS" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body-file "$body" --draft
          fi

      # Do not let an actionable REPAIR run appear green if it produced no governed PR.
      # NO_ACTION and VERIFY_RELEASE are distinct legitimate no-PR outcomes and never enter this step.
      # Every REPAIR that ends without an exact-head PR fails closed with a cause-specific typed code;
      # governed denials are never collapsed into ACTIONABLE_REPAIR_NO_DELIVERABLE.
      # Runs before heartbeat persistence so the typed outcome reaches the durable record.
      - name: Enforce actionable repair delivery
        id: delivery
        if: always() && steps.lead.outputs.action == 'REPAIR'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT: ${{ steps.lead.outputs.incident }}
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
          TRIAGE_REPAIRABLE: ${{ steps.triage.outputs.repairable }}
          TRIAGE_RISK: ${{ steps.triage.outputs.risk }}
          SPECIALIST_HYPOTHESIS: ${{ steps.specialist.outputs.hypothesis }}
          MUTATION_GATE_OUTCOME: ${{ steps.mutation_gate.outcome }}
          IMPLEMENTATION_OUTCOME: ${{ steps.implementation_agent.outcome }}
          IMPL_OUTCOME: ${{ steps.impl.outcome }}
          CHANGED: ${{ steps.impl.outputs.changed }}
          BRANCH: ${{ steps.impl.outputs.branch }}
          EXPECTED_HEAD: ${{ steps.impl.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Disposition per sole-owner ruling (2026-10-08): a governance policy boundary is
          # BLOCKED_WITH_EXACT_REASON, re-entered only by protected authorization change; every
          # other non-delivery stays a distinct typed failure on an unresolved incident.
          plan() {
            case "$1" in
              ACTIONABLE_REPAIR_POLICY_BOUNDARY)
                disposition=BLOCKED_WITH_EXACT_REASON
                next_action="Protected reviewer/owner authorization change for risk ${TRIAGE_RISK:-UNKNOWN}; no automatic retry or provider failover."
                revisit="Protected reviewer/owner authorization change only." ;;
              ACTIONABLE_REPAIR_TRIAGE_FAILED|ACTIONABLE_REPAIR_TRIAGE_NOT_REPAIRABLE|ACTIONABLE_REPAIR_HYPOTHESIS_UNCONFIRMED|ACTIONABLE_REPAIR_RISK_UNRECOGNIZED)
                disposition=UNRESOLVED_TYPED_FAILURE
                next_action="Re-triage with new reproducible evidence."
                revisit="New evidence or next dispatcher cycle." ;;
              ACTIONABLE_REPAIR_MUTATION_DENIED)
                disposition=UNRESOLVED_TYPED_FAILURE
                next_action="Re-acquire a valid implementation lease (fence, epoch, SAFE_HOLD cleared)."
                revisit="Lease release or expiry." ;;
              ACTIONABLE_REPAIR_IMPLEMENTATION_FAILED|ACTIONABLE_REPAIR_NO_DELIVERABLE)
                disposition=UNRESOLVED_TYPED_FAILURE
                next_action="Re-dispatch implementation under a fresh lease."
                revisit="Next dispatcher cycle." ;;
              *)
                disposition=UNRESOLVED_TYPED_FAILURE
                next_action="Operator inspects implementation branch and PR state for this run."
                revisit="Operator review." ;;
            esac
            {
              echo "disposition=$disposition"
              echo "next_action=$next_action"
              echo "revisit_trigger=$revisit"
            } >> "$GITHUB_OUTPUT"
          }
          fail() {
            plan "$1"
            echo "code=$1" >> "$GITHUB_OUTPUT"
            echo "delivery=FAILED" >> "$GITHUB_OUTPUT"
            echo "::error::$1: incident=${INCIDENT:-UNKNOWN}; $2"
            echo "Repair delivery: \`$1\` for ${INCIDENT:-UNKNOWN} ($2)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          # Upstream causes, most specific first. Each is a distinct typed outcome.
          if [ "${TRIAGE_OUTCOME:-}" != "success" ]; then
            fail ACTIONABLE_REPAIR_TRIAGE_FAILED "triage outcome=${TRIAGE_OUTCOME:-NOT_RUN}."
          fi
          case "${TRIAGE_RISK:-}" in
            R2-repair-policy|R3) fail ACTIONABLE_REPAIR_POLICY_BOUNDARY "risk=$TRIAGE_RISK; governed implementation lease denied." ;;
          esac
          if [ "${TRIAGE_REPAIRABLE:-}" != "true" ]; then
            fail ACTIONABLE_REPAIR_TRIAGE_NOT_REPAIRABLE "triage repairable=${TRIAGE_REPAIRABLE:-MISSING}."
          fi
          case "${SPECIALIST_HYPOTHESIS:-}" in
            CONFIRMED|NARROWED) ;;
            *) fail ACTIONABLE_REPAIR_HYPOTHESIS_UNCONFIRMED "specialist hypothesis=${SPECIALIST_HYPOTHESIS:-MISSING}." ;;
          esac
          case "${TRIAGE_RISK:-}" in
            R0|R1|R2-restorative) ;;
            *) fail ACTIONABLE_REPAIR_RISK_UNRECOGNIZED "risk=${TRIAGE_RISK:-MISSING}." ;;
          esac
          if [ "${MUTATION_GATE_OUTCOME:-}" != "success" ]; then
            fail ACTIONABLE_REPAIR_MUTATION_DENIED "mutation gate outcome=${MUTATION_GATE_OUTCOME:-NOT_RUN}."
          fi
          if [ "${IMPLEMENTATION_OUTCOME:-}" != "success" ] || [ "${IMPL_OUTCOME:-}" != "success" ]; then
            fail ACTIONABLE_REPAIR_IMPLEMENTATION_FAILED "agent=${IMPLEMENTATION_OUTCOME:-NOT_RUN}; normalize=${IMPL_OUTCOME:-NOT_RUN}."
          fi
          # Implementation ran cleanly; from here a missing artifact is a delivery failure.
          if [ "${CHANGED:-}" != "true" ] || [ -z "${BRANCH:-}" ]; then
            fail ACTIONABLE_REPAIR_NO_DELIVERABLE "implementation reported no committed branch."
          fi
          if ! [[ "${EXPECTED_HEAD:-}" =~ ^[0-9a-f]{40}$ ]]; then
            fail ACTIONABLE_REPAIR_HEAD_INVALID "implementation head SHA missing or malformed."
          fi
          if ! [[ "$BRANCH" =~ ^claude/engineering/[0-9]+-[0-9]+$ ]]; then
            fail ACTIONABLE_REPAIR_BRANCH_INVALID "unexpected implementation branch name."
          fi
          if ! prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$BRANCH" --json number,isDraft,headRefOid); then
            fail ACTIONABLE_REPAIR_PR_LOOKUP_FAILED "GitHub PR lookup failed for branch=$BRANCH."
          fi
          count=$(jq 'length' <<<"$prs")
          if [ "$count" = "0" ]; then
            fail ACTIONABLE_REPAIR_PR_MISSING "branch=$BRANCH."
          fi
          if [ "$count" != "1" ]; then
            fail ACTIONABLE_REPAIR_PR_AMBIGUOUS "branch=$BRANCH matched $count open PRs."
          fi
          pr=$(jq -r '.[0].number' <<<"$prs")
          is_draft=$(jq -r '.[0].isDraft' <<<"$prs")
          pr_head=$(jq -r '.[0].headRefOid' <<<"$prs")
          if [ "$pr_head" != "$EXPECTED_HEAD" ]; then
            fail ACTIONABLE_REPAIR_PR_HEAD_MISMATCH "branch=$BRANCH; PR #$pr head does not match implementation head."
          fi
          # A draft PR is a governed deliverable whose pre-PR agent gates did not all pass.
          if [ "$is_draft" = "true" ]; then
            delivery=DRAFT_PR_GATES_FAILED
          else
            delivery=PR_READY
          fi
          if [ "$delivery" = "PR_READY" ]; then
            next_action="Independent trust-root/QA review of PR #$pr at exact head; no merge or deploy without authorization."
          else
            next_action="Resolve failed pre-PR gates on draft PR #$pr; a draft does not authorize merge or deploy."
          fi
          {
            echo "code=NONE"
            echo "delivery=$delivery"
            echo "pr=$pr"
            echo "disposition=PR_CREATED"
            echo "next_action=$next_action"
            echo "revisit_trigger=PR review outcome or new exact-head CI result."
          } >> "$GITHUB_OUTPUT"
          echo "Repair artifact: PR #$pr at $EXPECTED_HEAD for ${INCIDENT:-UNKNOWN} (delivery=$delivery)." >> "$GITHUB_STEP_SUMMARY"

      - name: Persist dual-stream heartbeat and receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORATION: ${{ steps.dispatch.outputs.restoration }}
          ACCELERATION: ${{ steps.dispatch.outputs.acceleration }}
          QUEUE_DEPTH: ${{ steps.dispatch.outputs.queue_depth }}
          LEAD_ACTION: ${{ steps.lead.outputs.action }}
          DELIVERY: ${{ steps.delivery.outputs.delivery }}
          DELIVERY_CODE: ${{ steps.delivery.outputs.code }}
          DELIVERY_DISPOSITION: ${{ steps.delivery.outputs.disposition }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          ACCEL_ADVANCEMENT: ${{ steps.acceleration.outputs.advancement }}
          ACCEL_NEXT: ${{ steps.acceleration.outputs.next_action }}
          LEASE_EPOCH: ${{ steps.safety.outputs.lease_epoch }}
          WORKER_ID: ${{ steps.safety.outputs.worker_id }}
          LEASE_EXPIRES_AT: ${{ steps.safety.outputs.expires_at }}
          WORKER_MODE: ${{ steps.safety.outputs.worker_mode }}
          LEASE_GROUP: ${{ steps.dispatch.outputs.lease_group }}
        run: |
          set -euo pipefail
          # A REPAIR whose delivery step did not report is itself a typed failure, never blank.
          if [ "${LEAD_ACTION:-}" = "REPAIR" ] && [ -z "${DELIVERY_CODE:-}" ]; then
            DELIVERY=FAILED
            DELIVERY_CODE="ACTIONABLE_REPAIR_DELIVERY_UNVERIFIED:${DELIVERY_OUTCOME:-NOT_RUN}"
            DELIVERY_DISPOSITION=UNRESOLVED_TYPED_FAILURE
          fi
          receipt="$RUNNER_TEMP/wow-dual-stream-receipt.json"
          jq -n \
            --arg utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg provider "anthropic" \
            --arg restoration "${RESTORATION:-}" \
            --arg acceleration "${ACCELERATION:-}" \
            --arg queue_depth "${QUEUE_DEPTH:-0}" \
            --arg lead_action "${LEAD_ACTION:-NOT_RUN}" \
            --arg delivery "${DELIVERY:-NOT_APPLICABLE}" \
            --arg delivery_code "${DELIVERY_CODE:-NONE}" \
            --arg delivery_disposition "${DELIVERY_DISPOSITION:-NOT_APPLICABLE}" \
            --arg acceleration_advancement "${ACCEL_ADVANCEMENT:-NOT_RUN}" \
            --arg acceleration_next "${ACCEL_NEXT:-NOT_RUN}" \
            --arg lease_epoch "${LEASE_EPOCH:-0}" \
            --arg worker_id "${WORKER_ID:-UNKNOWN}" \
            --arg lease_expires_at "${LEASE_EXPIRES_AT:-UNKNOWN}" \
            --arg worker_mode "${WORKER_MODE:-SAFE_HOLD}" \
            --arg lease_group "${LEASE_GROUP:-GLOBAL}" \
            '{
              utc: $utc,
              workflow_run_id: $run_id,
              provider: $provider,
              queue_depth: ($queue_depth | tonumber? // 0),
              current_restoration_target: (if ($restoration | length) > 0 then $restoration else null end),
              current_acceleration_target: (if ($acceleration | length) > 0 then $acceleration else null end),
              restoration_action: $lead_action,
              restoration_delivery: $delivery,
              restoration_delivery_code: $delivery_code,
              restoration_disposition: $delivery_disposition,
              last_acceleration_advancement: $acceleration_advancement,
              acceleration_next_action: $acceleration_next,
              lease_epoch: ($lease_epoch | tonumber? // 0),
              worker_id: $worker_id,
              lease_expires_at: $lease_expires_at,
              worker_mode: $worker_mode,
              lease_group: $lease_group,
              retry_dlq_state: "NONE",
              safe_hold_state: $worker_mode,
              duplicate_incident_created: false,
              can_execute: false,
              terminal_authority: "V17_TERMINAL_REDUCER"
            }' > "$receipt"

          marker="<!-- WOW_DUAL_STREAM_HEARTBEAT:${LEASE_GROUP:-GLOBAL} -->"
          body=$(cat <<EOF
          $marker
          ### WOW V17 dual-stream dispatcher heartbeat
          - workflow_run_id: $GITHUB_RUN_ID
          - provider: Anthropic fallback
          - queue_depth: ${QUEUE_DEPTH:-0}
          - current_restoration_target: ${RESTORATION:-NONE}
          - current_acceleration_target: ${ACCELERATION:-NONE}
          - lease_group: ${LEASE_GROUP:-GLOBAL}
          - lease_epoch: ${LEASE_EPOCH:-0}
          - worker_id: ${WORKER_ID:-UNKNOWN}
          - lease_expires_at: ${LEASE_EXPIRES_AT:-UNKNOWN}
          - worker_mode: ${WORKER_MODE:-SAFE_HOLD}
          - restoration_action: ${LEAD_ACTION:-NOT_RUN}
          - restoration_delivery: ${DELIVERY:-NOT_APPLICABLE}
          - restoration_delivery_code: ${DELIVERY_CODE:-NONE}
          - restoration_disposition: ${DELIVERY_DISPOSITION:-NOT_APPLICABLE}
          - last_acceleration_advancement: ${ACCEL_ADVANCEMENT:-NOT_RUN}
          - acceleration_next_action: ${ACCEL_NEXT:-NOT_RUN}
          - retry_dlq_state: NONE
          - safe_hold_state: ${WORKER_MODE:-SAFE_HOLD}
          - duplicate_incident_created: false
          - can_execute: false
          - terminal_authority: V17_TERMINAL_REDUCER
          EOF
          )
          comments=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/1138/comments?per_page=100")
          comment_id=$(jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker))][0].id // empty' <<<"$comments")
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/1138/comments" -f body="$body" >/dev/null
          fi

      # Append-only per-incident delivery receipt (never PATCHed). Built inline from step outputs:
      # the working tree is agent-authored after "Checkout implementation branch", so no repository
      # script may construct or influence this record. It is not QA or trust-root approval.
      - name: Append incident delivery receipt
        if: always() && steps.lead.outputs.action == 'REPAIR'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT: ${{ steps.lead.outputs.incident }}
          DELIVERY: ${{ steps.delivery.outputs.delivery }}
          CODE: ${{ steps.delivery.outputs.code }}
          DISPOSITION: ${{ steps.delivery.outputs.disposition }}
          NEXT_ACTION: ${{ steps.delivery.outputs.next_action }}
          REVISIT: ${{ steps.delivery.outputs.revisit_trigger }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          PR: ${{ steps.delivery.outputs.pr }}
          HEAD: ${{ steps.impl.outputs.head_sha }}
          TRIAGE_RISK: ${{ steps.triage.outputs.risk }}
          LEASE_GROUP: ${{ steps.dispatch.outputs.lease_group }}
          LEASE_EPOCH: ${{ steps.safety.outputs.lease_epoch }}
          WORKER_ID: ${{ steps.safety.outputs.worker_id }}
        run: |
          set -euo pipefail
          if [ -z "${CODE:-}" ]; then
            DELIVERY=FAILED
            CODE="ACTIONABLE_REPAIR_DELIVERY_UNVERIFIED:${DELIVERY_OUTCOME:-NOT_RUN}"
            DISPOSITION=UNRESOLVED_TYPED_FAILURE
            NEXT_ACTION="Operator inspects why the delivery gate did not report."
            REVISIT="Operator review."
          fi
          if ! [[ "${INCIDENT:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::ACTIONABLE_REPAIR_RECEIPT_INCIDENT_INVALID: incident is not an issue number."
            exit 1
          fi
          if ! owner=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${INCIDENT}" --jq '[.assignees[].login] | join(",")'); then
            echo "::error::ACTIONABLE_REPAIR_RECEIPT_PERSIST_FAILED: incident=$INCIDENT; issue lookup failed."
            exit 1
          fi
          owner="${owner:-$GITHUB_REPOSITORY_OWNER}"
          body=$(cat <<EOF
          <!-- WOW_REPAIR_DELIVERY_RECEIPT:run=${GITHUB_RUN_ID}:attempt=${GITHUB_RUN_ATTEMPT} -->
          ### WOW V17 repair delivery receipt (append-only)
          - incident: #${INCIDENT}
          - disposition: ${DISPOSITION:-UNRESOLVED_TYPED_FAILURE}
          - delivery: ${DELIVERY:-FAILED}
          - delivery_code: ${CODE}
          - accountable_owner: ${owner}
          - next_authorized_action: ${NEXT_ACTION:-Operator review.}
          - revisit_trigger: ${REVISIT:-Operator review.}
          - workflow_run_id: ${GITHUB_RUN_ID}
          - run_attempt: ${GITHUB_RUN_ATTEMPT}
          - provider: Anthropic fallback
          - risk_class: ${TRIAGE_RISK:-UNKNOWN}
          - lease_group: ${LEASE_GROUP:-GLOBAL}
          - lease_epoch: ${LEASE_EPOCH:-0}
          - worker_id: ${WORKER_ID:-UNKNOWN}
          - implementation_head_sha: ${HEAD:-NONE}
          - pull_request: ${PR:-NONE}
          - independent_qa_approval: false
          - merge_or_deploy_authorized: false
          - can_execute: false
          - terminal_authority: V17_TERMINAL_REDUCER
          EOF
          )
          if ! gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${INCIDENT}/comments" -f body="$body" >/dev/null; then
            echo "::error::ACTIONABLE_REPAIR_RECEIPT_PERSIST_FAILED: incident=$INCIDENT; receipt comment not written."
            exit 1
          fi
          echo "Incident #$INCIDENT receipt appended: ${DISPOSITION:-UNRESOLVED_TYPED_FAILURE} / ${CODE}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dual-stream dispatch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-dual-stream-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/wow-dual-stream-receipt.json

      - name: Record team receipt
        if: always()
        run: |
          {
            echo "# WOW V17 Claude Fallback Engineering Team"
            echo "- UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- fallback_reason: ${{ inputs.fallback_reason }}"
            echo "- parent_run_id: ${{ inputs.parent_run_id }}"
            echo "- Queue depth: ${{ steps.dispatch.outputs.queue_depth || '0' }}"
            echo "- Restoration target: ${{ steps.dispatch.outputs.restoration || 'NONE' }}"
            echo "- Acceleration target: ${{ steps.dispatch.outputs.acceleration || 'NONE' }}"
            echo "- Lead: ${{ steps.lead.outputs.action || 'NOT_RUN' }}"
            echo "- Incident: ${{ steps.lead.outputs.incident || 'NONE' }}"
            echo "- Acceleration advancement: ${{ steps.acceleration.outputs.advancement || 'NOT_RUN' }}"
            echo "- Triage repairable: ${{ steps.triage.outputs.repairable || 'NOT_RUN' }}"
            echo "- Specialist: ${{ steps.specialist.outputs.subagent || 'NOT_RUN' }}"
            echo "- Specialist hypothesis: ${{ steps.specialist.outputs.hypothesis || 'NOT_RUN' }}"
            echo "- Implementation changed: ${{ steps.impl.outputs.changed || 'false' }}"
            echo "- Review: ${{ steps.review.outputs.decision || 'NOT_RUN' }}"
            echo "- Architect: ${{ steps.architect.outputs.decision || 'NOT_RUN' }}"
            echo "- Regression: ${{ steps.regression.outputs.status || 'NOT_RUN' }}"
            echo "- QA: ${{ steps.qa.outputs.decision || 'NOT_RUN' }}"
            echo "- Repair delivery: ${{ steps.delivery.outputs.delivery || 'NOT_APPLICABLE' }}"
            echo "- Repair delivery code: ${{ steps.delivery.outputs.code || 'NONE' }}"
            echo "- Repair disposition: ${{ steps.delivery.outputs.disposition || 'NOT_APPLICABLE' }}"
            echo "- provider: Anthropic/Claude"
            echo "- duplicate incident created: false"
            echo "- can_execute: false"
            echo "- terminal_authority: V17_TERMINAL_REDUCER"
          } >> "$GITHUB_STEP_SUMMARY"

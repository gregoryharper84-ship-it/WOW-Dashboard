name: wow-v17-claude-engineering-worker

on:
  workflow_dispatch:
    inputs:
      fallback_reason:
        description: Typed reason the primary OpenAI worker could not run.
        required: false
        default: MANUAL_OR_UNSPECIFIED
      parent_run_id:
        description: Primary/dispatcher workflow run that caused this fallback.
        required: false
        default: ""

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: wow-v17-claude-engineering-worker
  cancel-in-progress: false

jobs:
  multi-agent-engineering:
    name: WOW V17 Claude fallback engineering team
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r artifacts/wow-engine/requirements.txt
          pip install PyYAML openapi-spec-validator
          python artifacts/wow-engine/v17/engineering_agent_team.py self-check

      - name: Verify Anthropic authentication
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::Anthropic fallback authentication is missing."
            exit 1
          fi

      - name: Engineering Lead agent
        id: lead_agent
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 ENGINEERING_LEAD_AGENT running on Anthropic/Claude fallback tooling.
            OpenAI primary engineering is unavailable for this run because: ${{ inputs.fallback_reason }}.
            Read repository governance, .agents/skills/wow-engineering-lead-agent/SKILL.md,
            artifacts/wow-engine/v17/incident-ledger.json, and current local CI/PR evidence.
            Run `python artifacts/wow-engine/v17/engineering_agent_team.py priority`.
            Select exactly one durable actionable incident or NO_ACTION. Do not edit files.
            You own priority only; do not diagnose, implement, approve, merge, deploy, or change
            sporting probability behavior. Preserve can_execute=false and V17_TERMINAL_REDUCER.
          output_schema: '{"type":"object","properties":{"action":{"type":"string","enum":["REPAIR","VERIFY_RELEASE","NO_ACTION"]},"incident_id":{"type":"string"},"severity":{"type":"string"},"current_state":{"type":"string"},"reason":{"type":"string"},"frontier_allowed":{"type":"boolean"}},"required":["action","incident_id","severity","current_state","reason","frontier_allowed"],"additionalProperties":false}'

      - name: Normalize Lead dispatch
        id: lead
        shell: bash
        env:
          RESULT: ${{ steps.lead_agent.outputs.structured_output }}
        run: |
          set -euo pipefail
          echo "action=$(jq -r '.action' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          echo "incident=$(jq -r '.incident_id' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/wow-engine/v17/.agent-handoff
          printf '%s\n' "$RESULT" > artifacts/wow-engine/v17/.agent-handoff/lead.json

      - name: Research / Root-Cause Triage agent
        id: triage_agent
        if: steps.lead.outputs.action == 'REPAIR'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 RESEARCH_TRIAGE_AGENT running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-research-triage-agent/SKILL.md and
            artifacts/wow-engine/v17/.agent-handoff/lead.json.
            Reproduce the selected defect, isolate the first failing stage, distinguish symptom
            from root cause, define objective acceptance criteria and the smallest fix boundary.
            Preserve the exact typed failure. Do not edit files. Preserve V17 terminal authority,
            exact-once semantics, and can_execute=false. Never substitute market evidence for model probability.
          output_schema: '{"type":"object","properties":{"incident_id":{"type":"string"},"repairable":{"type":"boolean"},"reproduction_status":{"type":"string"},"root_cause":{"type":"string"},"risk_class":{"type":"string","enum":["R0","R1","R2-restorative","R2-repair-policy","R3","NONE"]},"primary_subsystem":{"type":"string"},"typed_failure":{"type":"string"},"acceptance_criteria":{"type":"array","items":{"type":"string"}},"recommended_fix_boundary":{"type":"string"},"hard_boundary":{"type":"string"}},"required":["incident_id","repairable","reproduction_status","root_cause","risk_class","primary_subsystem","typed_failure","acceptance_criteria","recommended_fix_boundary","hard_boundary"],"additionalProperties":false}'

      - name: Normalize Triage packet
        id: triage
        if: steps.lead.outputs.action == 'REPAIR'
        shell: bash
        env:
          RESULT: ${{ steps.triage_agent.outputs.structured_output }}
        run: |
          set -euo pipefail
          repairable=$(jq -r '.repairable' <<<"$RESULT")
          risk=$(jq -r '.risk_class' <<<"$RESULT")
          incident=$(jq -r '.incident_id' <<<"$RESULT")
          subsystem=$(jq -r '.primary_subsystem // "UNKNOWN"' <<<"$RESULT")
          failure=$(jq -r '.typed_failure // "NONE"' <<<"$RESULT")
          echo "repairable=$repairable" >> "$GITHUB_OUTPUT"
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          echo "subsystem=$subsystem" >> "$GITHUB_OUTPUT"
          echo "failure=$failure" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RESULT" > artifacts/wow-engine/v17/.agent-handoff/triage.json

      - name: Route specialist subagent
        id: specialist_route
        if: steps.lead.outputs.action == 'REPAIR'
        shell: bash
        env:
          TYPED_FAILURE: ${{ steps.triage.outputs.failure }}
          PRIMARY_SUBSYSTEM: ${{ steps.triage.outputs.subsystem }}
        run: |
          set -euo pipefail
          route=$(python artifacts/wow-engine/v17/engineering_agent_team.py support-route \
            --typed-failure "$TYPED_FAILURE" \
            --subsystem "$PRIMARY_SUBSYSTEM")
          echo "subagent=$(jq -r '.subagent' <<<"$route")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$route" > artifacts/wow-engine/v17/.agent-handoff/specialist-route.json

      - name: Specialist diagnostic subagent
        id: specialist_agent
        if: steps.lead.outputs.action == 'REPAIR'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 ${{ steps.specialist_route.outputs.subagent }} running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-specialist-subagents/SKILL.md,
            artifacts/wow-engine/v17/.agent-handoff/triage.json, and
            artifacts/wow-engine/v17/.agent-handoff/specialist-route.json.
            Stay on the same parent incident. Verify or challenge triage, identify the first failing
            boundary, collect evidence, inspect adjacent risks, and recommend narrow tests.
            Do not edit files, approve implementation, or change sporting probability behavior.
            Preserve can_execute=false.
          output_schema: '{"type":"object","properties":{"incident_id":{"type":"string"},"subagent":{"type":"string"},"hypothesis_status":{"type":"string","enum":["CONFIRMED","NARROWED","REJECTED","INCONCLUSIVE"]},"evidence_verified":{"type":"array","items":{"type":"string"}},"first_failing_boundary":{"type":"string"},"adjacent_risks":{"type":"array","items":{"type":"string"}},"recommended_tests":{"type":"array","items":{"type":"string"}},"next_non_conflicting_action":{"type":"string"},"hard_boundary":{"type":"string"}},"required":["incident_id","subagent","hypothesis_status","evidence_verified","first_failing_boundary","adjacent_risks","recommended_tests","next_non_conflicting_action","hard_boundary"],"additionalProperties":false}'

      - name: Normalize specialist packet
        id: specialist
        if: steps.lead.outputs.action == 'REPAIR'
        shell: bash
        env:
          RESULT: ${{ steps.specialist_agent.outputs.structured_output }}
        run: |
          set -euo pipefail
          echo "hypothesis=$(jq -r '.hypothesis_status' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          echo "subagent=$(jq -r '.subagent' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RESULT" > artifacts/wow-engine/v17/.agent-handoff/specialist.json

      - name: Deny policy-changing implementation lease
        if: steps.lead.outputs.action == 'REPAIR' && (steps.triage.outputs.risk == 'R2-repair-policy' || steps.triage.outputs.risk == 'R3')
        run: echo "Governed hard boundary; implementation lease denied." >> "$GITHUB_STEP_SUMMARY"

      - name: Implementation agent
        id: implementation_agent
        if: >-
          steps.triage.outputs.repairable == 'true' &&
          (steps.specialist.outputs.hypothesis == 'CONFIRMED' ||
           steps.specialist.outputs.hypothesis == 'NARROWED') &&
          (steps.triage.outputs.risk == 'R0' ||
           steps.triage.outputs.risk == 'R1' ||
           steps.triage.outputs.risk == 'R2-restorative')
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":workspace"
          prompt: |
            You are the WOW V17 ENGINEERING_AGENT running on Anthropic/Claude fallback tooling
            and hold the single implementation lease.
            Read .agents/skills/wow-engineering-implementation-agent/SKILL.md,
            .agents/skills/wow-replit-patch-governor/SKILL.md,
            artifacts/wow-engine/v17/.agent-handoff/triage.json, and
            artifacts/wow-engine/v17/.agent-handoff/specialist.json.
            Implement only the proven root cause and acceptance criteria. Do not diagnose another
            incident, edit .github/workflows/**, or touch .agent-handoff/**.
            Run the narrowest reproduction first and relevant regressions. Preserve can_execute=false,
            DRY_RUN_ONLY_NO_LIVE_TRADING_NO_MARKET_ORDERS=true, exact typed failures, exact-once
            behavior, V17_TERMINAL_REDUCER, and all probability governance. No Class C change is authorized.
          output_schema: '{"type":"object","properties":{"changed":{"type":"boolean"},"incident_id":{"type":"string"},"risk_class":{"type":"string","enum":["R0","R1","R2-restorative","R2-repair-policy","R3","NONE"]},"summary":{"type":"string"},"tests":{"type":"string"},"hard_boundary":{"type":"string"}},"required":["changed","incident_id","risk_class","summary","tests","hard_boundary"],"additionalProperties":false}'

      - name: Normalize Implementation result
        id: impl
        if: steps.implementation_agent.outcome == 'success'
        shell: bash
        env:
          RESULT: ${{ steps.implementation_agent.outputs.structured_output }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=$(jq -r '.changed' <<<"$RESULT")
          risk=$(jq -r '.risk_class' <<<"$RESULT")
          incident=$(jq -r '.incident_id' <<<"$RESULT")
          branch=""
          rm -rf artifacts/wow-engine/v17/.agent-handoff
          if [ "$changed" = "true" ]; then
            git diff --quiet --exit-code && { echo "::error::Claude reported changes but returned no working-tree diff."; exit 1; }
            branch="claude/engineering/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add --all
            git commit -m "Claude Engineering: ${incident:-fallback-repair}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --set-upstream origin "$branch"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout implementation branch
        if: steps.impl.outputs.changed == 'true'
        run: |
          git fetch origin "${{ steps.impl.outputs.branch }}"
          git switch "${{ steps.impl.outputs.branch }}"

      - name: Independent Review agent
        id: review_agent
        if: steps.impl.outputs.changed == 'true'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 INDEPENDENT_REVIEW_AGENT running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-independent-review-agent/SKILL.md.
            Review the complete current-branch diff against main. You did not write this patch.
            Do not edit files. Verify root-cause repair, minimal scope, test quality, V17 ownership,
            typed failures, security, exact-once behavior, terminal authority, and can_execute=false.
            State whether independent SYSTEM_ARCHITECT_AGENT review is required.
          output_schema: '{"type":"object","properties":{"decision":{"type":"string","enum":["PASS","REJECT"]},"system_architect_required":{"type":"boolean"},"findings":{"type":"array","items":{"type":"string"}},"residual_risks":{"type":"array","items":{"type":"string"}}},"required":["decision","system_architect_required","findings","residual_risks"],"additionalProperties":false}'

      - name: Normalize Review
        id: review
        if: steps.impl.outputs.changed == 'true'
        env:
          RESULT: ${{ steps.review_agent.outputs.structured_output }}
        run: |
          echo "decision=$(jq -r '.decision' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          echo "architect=$(jq -r '.system_architect_required' <<<"$RESULT")" >> "$GITHUB_OUTPUT"

      - name: System Architect agent
        id: architect_agent
        if: steps.review.outputs.decision == 'PASS' && steps.review.outputs.architect == 'true'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 SYSTEM_ARCHITECT_AGENT running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-system-architect-agent/SKILL.md.
            Review the current diff for protected-contract changes. Do not edit. Reject hidden ownership
            changes, probability substitution, terminal-authority drift, typed-failure collapse,
            unsafe auth/execution changes, or ungoverned Class C behavior.
          output_schema: '{"type":"object","properties":{"decision":{"type":"string","enum":["PASS","REJECT"]},"findings":{"type":"array","items":{"type":"string"}}},"required":["decision","findings"],"additionalProperties":false}'

      - name: Normalize Architect decision
        id: architect
        if: steps.review.outputs.decision == 'PASS'
        shell: bash
        env:
          REQUIRED: ${{ steps.review.outputs.architect }}
          RESULT: ${{ steps.architect_agent.outputs.structured_output }}
        run: |
          if [ "$REQUIRED" = "true" ]; then
            echo "decision=$(jq -r '.decision' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          else
            echo "decision=NOT_APPLICABLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Deterministic QA regression
        id: regression
        if: steps.review.outputs.decision == 'PASS' && (steps.architect.outputs.decision == 'PASS' || steps.architect.outputs.decision == 'NOT_APPLICABLE')
        shell: bash
        run: |
          set +e
          python -m pytest -q artifacts/wow-engine 2>&1 | tee "$RUNNER_TEMP/qa-regression.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: QA Verification agent
        id: qa_agent
        if: steps.impl.outputs.changed == 'true' && steps.regression.outputs.status == '0'
        uses: ./.github/actions/wow-claude-agent
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_profile: ":read-only"
          prompt: |
            You are the independent WOW V17 QA_VERIFICATION_AGENT running on Anthropic/Claude fallback tooling.
            Read .agents/skills/wow-engineering-qa-verification-agent/SKILL.md.
            Review the current diff and deterministic regression evidence. You did not implement the patch.
            Verify acceptance criteria, adjacent-lane safety, exact typed failures, probability/lower-bound
            integrity when applicable, immutable/exact-once behavior, terminal authority, and can_execute=false.
            Do not edit files.
          output_schema: '{"type":"object","properties":{"decision":{"type":"string","enum":["PASS","REJECT"]},"acceptance_status":{"type":"string"},"findings":{"type":"array","items":{"type":"string"}}},"required":["decision","acceptance_status","findings"],"additionalProperties":false}'

      - name: Normalize QA
        id: qa
        if: steps.impl.outputs.changed == 'true' && steps.regression.outputs.status == '0'
        env:
          RESULT: ${{ steps.qa_agent.outputs.structured_output }}
        run: echo "decision=$(jq -r '.decision' <<<"$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Open governed engineering PR
        if: steps.impl.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.impl.outputs.branch }}
          INCIDENT: ${{ steps.impl.outputs.incident }}
          RISK: ${{ steps.impl.outputs.risk }}
          REVIEW: ${{ steps.review.outputs.decision }}
          ARCHITECT: ${{ steps.architect.outputs.decision }}
          REGRESSION: ${{ steps.regression.outputs.status }}
          QA: ${{ steps.qa.outputs.decision }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$BRANCH" --json number --jq '.[0].number // empty')
          [ -n "$existing" ] && { echo "Existing PR #$existing." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          compare=$(gh api "/repos/${GITHUB_REPOSITORY}/compare/main...${BRANCH}")
          mapfile -t files < <(jq -r '.files[].filename' <<<"$compare")
          gates=FAIL
          if [ "$REVIEW" = "PASS" ] &&
             { [ "$ARCHITECT" = "PASS" ] || [ "$ARCHITECT" = "NOT_APPLICABLE" ]; } &&
             [ "$REGRESSION" = "0" ] && [ "$QA" = "PASS" ]; then
            gates=PASS
          fi
          body="$RUNNER_TEMP/pr.md"
          {
            echo "## WOW V17 Claude fallback Engineering repair"
            echo
            echo "Incident: \`$INCIDENT\`"
            echo "Risk: \`$RISK\`"
            echo "Fallback reason: \`${{ inputs.fallback_reason }}\`"
            echo "Parent run: \`${{ inputs.parent_run_id }}\`"
            echo "Independent review: \`${REVIEW:-NOT_RUN}\`"
            echo "System architect: \`${ARCHITECT:-NOT_RUN}\`"
            echo "Deterministic regression: \`${REGRESSION:-NOT_RUN}\`"
            echo "QA agent: \`${QA:-NOT_RUN}\`"
            echo "Pre-PR agent gates: \`$gates\`"
            echo
            echo "### Changed files"
            for file in "${files[@]}"; do echo "- \`$file\`"; done
            echo
            echo "### Governance"
            echo "- Anthropic/Claude is a fallback engineering provider only"
            echo "- can_execute=false remains binding"
            echo "- DRY_RUN_ONLY_NO_LIVE_TRADING_NO_MARKET_ORDERS=true remains binding"
            echo "- V17_TERMINAL_REDUCER remains sole global terminal authority"
            echo "- No Class C probability change is authorized"
            echo "- Lead, Triage, Specialist, Implementation, Review, Architect, and QA are independent agent invocations"
            if [ "$gates" = "PASS" ] && { [ "$RISK" = "R0" ] || [ "$RISK" = "R1" ] || [ "$RISK" = "R2-restorative" ]; }; then
              echo
              echo "Morning-Green-Autonomous: true"
              echo "Morning-Green-Risk: $RISK"
              echo "Morning-Green-Acceptance-Workflow: wow-v17-nightly-engineering-scan.yml"
              echo
              echo '```morning-green-scope'
              echo "risk_class: $RISK"
              echo "allowed_files:"
              for file in "${files[@]}"; do echo "  - $file"; done
              echo "protected_files: []"
              echo '```'
            fi
          } > "$body"
          title="Claude Engineering: ${INCIDENT:-fallback-repair}"
          if [ "$gates" = "PASS" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body-file "$body" --draft
          fi

      - name: Record team receipt
        if: always()
        run: |
          {
            echo "# WOW V17 Claude Fallback Engineering Team"
            echo "- UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- fallback_reason: ${{ inputs.fallback_reason }}"
            echo "- parent_run_id: ${{ inputs.parent_run_id }}"
            echo "- Lead: ${{ steps.lead.outputs.action || 'NOT_RUN' }}"
            echo "- Incident: ${{ steps.lead.outputs.incident || 'NONE' }}"
            echo "- Triage repairable: ${{ steps.triage.outputs.repairable || 'NOT_RUN' }}"
            echo "- Specialist: ${{ steps.specialist.outputs.subagent || 'NOT_RUN' }}"
            echo "- Specialist hypothesis: ${{ steps.specialist.outputs.hypothesis || 'NOT_RUN' }}"
            echo "- Implementation changed: ${{ steps.impl.outputs.changed || 'false' }}"
            echo "- Review: ${{ steps.review.outputs.decision || 'NOT_RUN' }}"
            echo "- Architect: ${{ steps.architect.outputs.decision || 'NOT_RUN' }}"
            echo "- Regression: ${{ steps.regression.outputs.status || 'NOT_RUN' }}"
            echo "- QA: ${{ steps.qa.outputs.decision || 'NOT_RUN' }}"
            echo "- provider: Anthropic/Claude"
            echo "- can_execute: false"
          } >> "$GITHUB_STEP_SUMMARY"

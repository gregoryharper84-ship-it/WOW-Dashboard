name: wow-v17-rundown-full-sweep-validation

on:
  push:
    branches:
      - fix/v17-rundown-authenticated-full-sweep
    paths:
      - ".github/workflows/wow-v17-rundown-full-sweep-validation.yml"
      - "artifacts/wow-engine/requirements.txt"
      - "artifacts/wow-engine/v17/rundown_authenticated_scout.py"
      - "artifacts/wow-engine/v17/rundown_authenticated_scout_browser_transport.py"
      - "artifacts/wow-engine/v17/rundown_authenticated_scout_v2.py"
      - "artifacts/wow-engine/v17/rundown_authenticated_scout_v3.py"
      - "artifacts/wow-engine/v17/rundown_authenticated_scout_v4.py"
      - "artifacts/wow-engine/v17/rundown_authenticated_scout_v5.py"
      - "artifacts/wow-engine/test_v17_rundown_authenticated_scout.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      WOW_SCOUT_HORIZON_HOURS: "36"
      WOW_RUNDOWN_MARKETS_PER_REQUEST: "12"
      WOW_RUNDOWN_REQUEST_DELAY_MS: "150"
      RUNDOWN_EMAIL: ${{ secrets.RUNDOWN_EMAIL }}
      RUNDOWN_PASSWORD: ${{ secrets.RUNDOWN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run TheRundown normalization regressions
        run: pytest -q test_v17_rundown_authenticated_scout.py

      - name: Run authenticated full-slate sweep
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rundown-full-sweep"
          python -m v17.rundown_authenticated_scout_v5 \
            --output "$RUNNER_TEMP/rundown-full-sweep/model-handoff.json"

      - name: Verify full-slate acceptance contract
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'rundown-full-sweep' / 'model-handoff.json'
          data = json.loads(path.read_text())
          assert data['status'] in {'DISCOVERY_COMPLETE', 'DISCOVERY_COMPLETE_WITH_SOURCE_BLOCKERS'}, data.get('reason_code')
          assert data['provider'] == 'THERUNDOWN_AUTHENTICATED_BOARD'
          assert data['acquisition_transport'] == 'PLAYWRIGHT_APP_NETWORK_PLUS_CURRENT_SESSION'
          assert data['can_execute'] is False
          assert data['prediction_authority'] is False
          assert data['research_ceiling'] == 'RESEARCH_INTEREST'
          assert data['acquisition_budget']['market_ids_per_request'] <= 12
          inventory = [row for row in data['coverage'] if row.get('scope') == 'provider_inventory']
          assert inventory and inventory[-1]['sports_discovered'] >= 30, inventory
          assert inventory[-1].get('auth_session_ready') is True
          assert inventory[-1].get('native_request_context_ready') is True
          excluded = [row for row in data['coverage'] if row.get('status') == 'NON_SPORT_INVENTORY_EXCLUDED']
          assert any(row.get('sport') == 'Politics' for row in excluded), excluded
          handoff = data['model_handoff']
          team = handoff['team_event_candidates']
          props = handoff['prop_candidates']
          assert team, 'No team/event candidates were captured from the authenticated board'
          assert props, 'No player-prop candidates were captured from the authenticated board'
          assert all(row.get('route') == 'LLP_TEAM_BETTING_ENGINE' for row in team)
          assert all(row.get('route') == 'WOW_PROP_LANE' for row in props)
          assert all(row.get('research_ceiling') == 'RESEARCH_INTEREST' for row in team + props)
          assert all(row.get('can_execute') is False for row in team + props)
          assert all(row.get('probability_authority') is False for row in team + props)
          blob = path.read_text().lower()
          for forbidden in ('rundown_email', 'rundown_password', 'authorization', 'refresh_token', 'access_token', 'cookie'):
              assert forbidden not in blob, forbidden
          event_rows = [row for row in data['coverage'] if row.get('scope') == 'event']
          sports_scanned = [row for row in data['coverage'] if row.get('scope') == 'sport' and row.get('status') == 'SCANNED']
          print('RUNDOWN_FULL_SWEEP=PASS')
          print(json.dumps({
              'status': data['status'],
              'transport': data['acquisition_transport'],
              'sports_discovered': inventory[-1]['sports_discovered'],
              'sports_scanned': len(sports_scanned),
              'events_scanned': len(event_rows),
              'team_event_candidates': len(team),
              'prop_candidates': len(props),
              'bookmakers': data['sportsbook_coverage']['bookmaker_count'],
              'source_blockers': len(data.get('source_blockers') or []),
              'can_execute': data['can_execute'],
          }, sort_keys=True))
          PY

      - name: Upload sanitized sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-rundown-full-sweep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rundown-full-sweep/model-handoff.json
          if-no-files-found: warn
          retention-days: 7

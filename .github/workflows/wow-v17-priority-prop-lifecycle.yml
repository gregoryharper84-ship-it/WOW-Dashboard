name: wow-v17-priority-prop-lifecycle

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-priority-prop-lifecycle.yml"
      - "artifacts/wow-engine/v17/nfl_prop_evidence_control_plane.py"
      - "artifacts/wow-engine/v17/mlb_prop_evidence_control_plane.py"
      - "artifacts/wow-engine/v17/wnba_prop_evidence_control_plane.py"
      - "artifacts/wow-engine/v17/fantasy_score_pick_request_bridge.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: wow-v17-priority-prop-lifecycle
  cancel-in-progress: false

jobs:
  priority-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sport: NFL
            producer_path: /internal/v17/nfl-prop-forward-evidence/acquire
            max_candidates: 8
            routes_json: '["NFL:PASSING_YARDS","NFL:RUSHING_YARDS","NFL:RECEIVING_YARDS","NFL:ANYTIME_TD"]'
          - sport: MLB
            producer_path: /internal/v17/mlb-prop-forward-evidence/acquire
            max_candidates: 8
            routes_json: '["MLB:PITCHER_STRIKEOUTS","MLB:PITCHING_OUTS","MLB:STRIKES_THROWN","MLB:BALLS_THROWN"]'
          - sport: WNBA
            producer_path: /internal/v17/wnba-prop-forward-evidence/acquire
            max_candidates: 8
            routes_json: '["WNBA:POINTS","WNBA:REBOUNDS","WNBA:ASSISTS","WNBA:THREE_POINTERS_MADE"]'
    env:
      WOW_SERVICE_URL: https://wow-governed-probability-engine.onrender.com
      WOW_OIDC_AUDIENCE: wow-v17-multiscout
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      SPORT: ${{ matrix.sport }}
      PRODUCER_PATH: ${{ matrix.producer_path }}
      MAX_CANDIDATES: ${{ matrix.max_candidates }}
      ROUTES_JSON: ${{ matrix.routes_json }}
    steps:
      - name: Assert fail-closed context
        shell: bash
        run: |
          set -euo pipefail
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Seed bounded priority evidence then run exact-route lifecycle
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) separator='&' ;; esac

          issue_oidc_token() {
            local token_json
            token_json="$(curl --silent --show-error --fail --connect-timeout 15 --max-time 30 \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${WOW_OIDC_AUDIENCE}")"
            python -c 'import json,sys; value=json.load(sys.stdin).get("value"); assert isinstance(value,str) and value.strip(); print(value.strip())' <<<"${token_json}"
          }

          wait_for_live() {
            local attempt health_code curl_rc
            for attempt in $(seq 1 10); do
              set +e
              health_code="$(curl --silent --show-error --connect-timeout 3 --max-time 5 \
                --output /tmp/wow-live.json --write-out '%{http_code}' \
                "${WOW_SERVICE_URL}/health/live")"
              curl_rc=$?
              set -e
              if [ "${curl_rc}" -eq 0 ] && [ "${health_code}" -ge 200 ] && [ "${health_code}" -lt 300 ]; then
                return 0
              fi
              echo "WOW runtime health attempt ${attempt}/10 unavailable (curl_rc=${curl_rc}, HTTP ${health_code:-000}); bounded release-handoff retry." >&2
              if [ "${attempt}" -lt 10 ]; then
                sleep 10
              fi
            done
            echo "WOW_RUNTIME_HEALTH_UNAVAILABLE_AFTER_BOUNDED_RELEASE_HANDOFF_RETRIES" >&2
            return 1
          }

          wait_for_live

          seed_date() {
            local slate_date="$1"
            local body
            case "${SPORT}" in
              NFL)
                body="$(printf '{"requested_date":"%s","candidate_offset":0,"max_candidates":%s}' "${slate_date}" "${MAX_CANDIDATES}")"
                ;;
              MLB|WNBA)
                body="$(printf '{"requested_date":"%s","requested_timezone":"America/Chicago","candidate_offset":0,"max_candidates":%s}' "${slate_date}" "${MAX_CANDIDATES}")"
                ;;
              *)
                echo "Unsupported priority sport ${SPORT}." >&2
                return 1
                ;;
            esac

            local oidc_token
            oidc_token="$(issue_oidc_token)"
            set +e
            local http_code
            http_code="$(curl --silent --show-error --connect-timeout 20 --max-time 120 \
              --output "/tmp/${SPORT}-evidence-${slate_date}.json" --write-out '%{http_code}' \
              --request POST --header "Authorization: Bearer ${oidc_token}" \
              --header 'Content-Type: application/json' --data "${body}" \
              "${WOW_SERVICE_URL}${PRODUCER_PATH}")"
            local curl_rc=$?
            set -e
            unset oidc_token
            if [ "${curl_rc}" -ne 0 ] || [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "${SPORT} evidence producer transport was ambiguous for ${slate_date} (curl_rc=${curl_rc}, HTTP ${http_code:-000}); lifecycle will still consume any durable rows." >&2
              test -f "/tmp/${SPORT}-evidence-${slate_date}.json" && head -c 2000 "/tmp/${SPORT}-evidence-${slate_date}.json" >&2 || true
              return 1
            fi

            SPORT_NAME="${SPORT}" SLATE_DATE="${slate_date}" python - <<'PY'
          import json, os
          from pathlib import Path
          sport=os.environ['SPORT_NAME']
          slate=os.environ['SLATE_DATE']
          payload=json.loads(Path(f'/tmp/{sport}-evidence-{slate}.json').read_text())
          for key in ('can_execute','automatic_certification','automatic_promotion','probability_publishable'):
              if payload.get(key) is not False:
                  raise SystemExit(f'{sport}: {key} must remain false')
          if payload.get('status') in {'DATA_UNOBTAINABLE','RUN_INVALID_PROP_SNAPSHOT_WRITE_FAILURE'}:
              raise SystemExit(f"{sport}: evidence production failed: {payload.get('status')} blockers={payload.get('blockers')}")
          print(json.dumps({
              'sport': sport,
              'requested_date': slate,
              'status': payload.get('status'),
              'total_candidates': payload.get('total_candidates'),
              'attempted': payload.get('attempted'),
              'already_captured': payload.get('already_captured'),
              'hydrated': payload.get('hydrated'),
              'persisted': payload.get('persisted'),
              'held': payload.get('held'),
              'next_offset': payload.get('next_offset'),
              'can_execute': False,
          }, sort_keys=True))
          PY
          }

          run_route_lifecycle() {
            local route="$1"
            local route_slug body oidc_token http_code curl_rc
            route_slug="$(printf '%s' "${route}" | tr ':/' '__')"
            body="$(ROUTE="${route}" python -c 'import json,os; print(json.dumps({"routes":[os.environ["ROUTE"]],"max_snapshots_per_route":1,"settlement_limit":5,"persist_health":True},separators=(",",":")))')"

            wait_for_live
            oidc_token="$(issue_oidc_token)"
            set +e
            http_code="$(curl --silent --show-error --connect-timeout 15 --max-time 75 \
              --output "/tmp/${SPORT}-${route_slug}-lifecycle.json" --write-out '%{http_code}' \
              --request POST --header "Authorization: Bearer ${oidc_token}" \
              --header 'Content-Type: application/json' --data "${body}" \
              "${WOW_SERVICE_URL}/v17/prop-lifecycle-autopilot-run")"
            curl_rc=$?
            set -e
            unset oidc_token
            if [ "${curl_rc}" -ne 0 ] || [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "${SPORT} exact-route lifecycle failed route=${route} curl_rc=${curl_rc} HTTP=${http_code:-000}." >&2
              test -f "/tmp/${SPORT}-${route_slug}-lifecycle.json" && head -c 2000 "/tmp/${SPORT}-${route_slug}-lifecycle.json" >&2 || true
              return 1
            fi

            SPORT_NAME="${SPORT}" ROUTE_NAME="${route}" ROUTE_SLUG="${route_slug}" python - <<'PY'
          import json, os
          from pathlib import Path
          sport=os.environ['SPORT_NAME']
          route=os.environ['ROUTE_NAME']
          slug=os.environ['ROUTE_SLUG']
          payload=json.loads(Path(f'/tmp/{sport}-{slug}-lifecycle.json').read_text())
          if payload.get('can_execute') is not False: raise SystemExit(f'{route}: can_execute invariant failed')
          if payload.get('automatic_certification') is not False: raise SystemExit(f'{route}: automatic certification must remain disabled')
          if payload.get('automatic_promotion') is not False: raise SystemExit(f'{route}: automatic promotion must remain disabled')
          if payload.get('artifact_isolation_enforced') is not True: raise SystemExit(f'{route}: artifact isolation proof missing')
          if payload.get('run_status') not in {'COMPLETED','COMPLETED_WITH_STAGE_BLOCKERS'}:
              raise SystemExit(f"{route}: unexpected lifecycle status {payload.get('run_status')}")
          requested=int(payload.get('routes_requested') or 0)
          if requested != 1: raise SystemExit(f'{route}: expected 1 exact route, got {requested}')
          dashboard=payload.get('dashboard') or {}
          kpi=dashboard.get('kpi') or {}
          if int(kpi.get('improperly_promoted_route_n') or 0) != 0:
              raise SystemExit(f'{route}: improperly promoted route detected')
          print(json.dumps({
              'sport':sport,
              'route':route,
              'run_status':payload.get('run_status'),
              'cycle_id':payload.get('cycle_id'),
              'routes_requested':requested,
              'failed_stages':payload.get('failed_stages') or [],
              'artifact_forward_prediction_n':kpi.get('artifact_forward_prediction_n'),
              'artifact_forward_settled_n':kpi.get('artifact_forward_settled_n'),
              'artifact_eligible_n':kpi.get('artifact_eligible_n'),
              'improperly_promoted_route_n':kpi.get('improperly_promoted_route_n'),
              'can_execute':False,
          }, sort_keys=True))
          PY
          }

          today="$(TZ=America/Chicago date +%F)"
          tomorrow="$(TZ=America/Chicago date -d '+1 day' +%F)"
          seed_failures=0
          if ! seed_date "${today}"; then seed_failures=$((seed_failures + 1)); fi
          if ! seed_date "${tomorrow}"; then seed_failures=$((seed_failures + 1)); fi

          mapfile -t lifecycle_routes < <(python -c 'import json,os; [print(v) for v in json.loads(os.environ["ROUTES_JSON"])]')
          lifecycle_failures=0
          for route in "${lifecycle_routes[@]}"; do
            if ! run_route_lifecycle "${route}"; then
              lifecycle_failures=$((lifecycle_failures + 1))
            fi
            sleep 3
          done

          if [ "${lifecycle_failures}" -ne 0 ]; then
            echo "${SPORT} exact-route lifecycle completed with ${lifecycle_failures} route transport or typed failure(s)." >&2
            exit 1
          fi
          if [ "${seed_failures}" -ne 0 ]; then
            echo "${SPORT} lifecycle completed, but ${seed_failures} evidence seed call(s) had transport or typed failures." >&2
            exit 1
          fi

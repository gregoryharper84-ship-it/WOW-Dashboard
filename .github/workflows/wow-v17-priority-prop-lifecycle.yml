name: wow-v17-priority-prop-lifecycle

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["wow-v17-render-production-deploy"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: wow-v17-priority-prop-lifecycle
  cancel-in-progress: false

jobs:
  priority-lifecycle:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 11
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sport: NFL
            producer_path: /internal/v17/nfl-prop-forward-evidence/acquire
            max_candidates: 8
            routes_json: '["NFL:PASSING_YARDS","NFL:RUSHING_YARDS","NFL:RECEIVING_YARDS","NFL:ANYTIME_TD"]'
          - sport: MLB
            producer_path: /internal/v17/mlb-prop-forward-evidence/acquire
            max_candidates: 8
            routes_json: '["MLB:PITCHER_STRIKEOUTS","MLB:PITCHING_OUTS","MLB:STRIKES_THROWN","MLB:BALLS_THROWN"]'
          - sport: WNBA
            producer_path: /internal/v17/wnba-prop-forward-evidence/acquire
            max_candidates: 8
            routes_json: '["WNBA:POINTS","WNBA:REBOUNDS","WNBA:ASSISTS","WNBA:THREE_POINTERS_MADE"]'
    env:
      WOW_SERVICE_URL: https://wow-governed-probability-engine.onrender.com
      WOW_OIDC_AUDIENCE: wow-v17-multiscout
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      SPORT: ${{ matrix.sport }}
      PRODUCER_PATH: ${{ matrix.producer_path }}
      MAX_CANDIDATES: ${{ matrix.max_candidates }}
      ROUTES_JSON: ${{ matrix.routes_json }}
    steps:
      - name: Assert fail-closed context
        shell: bash
        run: |
          set -euo pipefail
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Seed evidence, settle exact outcomes, and persist durable lifecycle audit
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) separator='&' ;; esac

          issue_oidc_token() {
            local token_json
            token_json="$(curl --silent --show-error --fail --connect-timeout 15 --max-time 30 \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${WOW_OIDC_AUDIENCE}")"
            python -c 'import json,sys; value=json.load(sys.stdin).get("value"); assert isinstance(value,str) and value.strip(); print(value.strip())' <<<"${token_json}"
          }

          wait_for_live() {
            local attempt health_code curl_rc
            for attempt in $(seq 1 10); do
              set +e
              health_code="$(curl --silent --show-error --connect-timeout 3 --max-time 5 \
                --output /tmp/wow-live.json --write-out '%{http_code}' \
                "${WOW_SERVICE_URL}/health/live")"
              curl_rc=$?
              set -e
              if [ "${curl_rc}" -eq 0 ] && [ "${health_code}" -ge 200 ] && [ "${health_code}" -lt 300 ]; then
                return 0
              fi
              echo "WOW runtime health attempt ${attempt}/10 unavailable (curl_rc=${curl_rc}, HTTP ${health_code:-000}); bounded release-handoff retry." >&2
              if [ "${attempt}" -lt 10 ]; then sleep 10; fi
            done
            echo "WOW_RUNTIME_HEALTH_UNAVAILABLE_AFTER_BOUNDED_RELEASE_HANDOFF_RETRIES" >&2
            return 1
          }

          post_oidc_json() {
            local path="$1"
            local body="$2"
            local output="$3"
            local max_time="$4"
            local oidc_token http_code curl_rc
            oidc_token="$(issue_oidc_token)"
            set +e
            http_code="$(curl --silent --show-error --connect-timeout 20 --max-time "${max_time}" \
              --output "${output}" --write-out '%{http_code}' \
              --request POST --header "Authorization: Bearer ${oidc_token}" \
              --header 'Content-Type: application/json' --data "${body}" \
              "${WOW_SERVICE_URL}${path}")"
            curl_rc=$?
            set -e
            unset oidc_token
            if [ "${curl_rc}" -ne 0 ] || [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "${SPORT} ${path} transport failed (curl_rc=${curl_rc}, HTTP ${http_code:-000})." >&2
              test -f "${output}" && head -c 2000 "${output}" >&2 || true
              return 1
            fi
          }

          post_oidc_json_file() {
            local path="$1"
            local request_file="$2"
            local output="$3"
            local max_time="$4"
            local oidc_token http_code curl_rc
            oidc_token="$(issue_oidc_token)"
            set +e
            http_code="$(curl --silent --show-error --connect-timeout 20 --max-time "${max_time}" \
              --output "${output}" --write-out '%{http_code}' \
              --request POST --header "Authorization: Bearer ${oidc_token}" \
              --header 'Content-Type: application/json' --data-binary "@${request_file}" \
              "${WOW_SERVICE_URL}${path}")"
            curl_rc=$?
            set -e
            unset oidc_token
            if [ "${curl_rc}" -ne 0 ] || [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "${SPORT} ${path} transport failed (curl_rc=${curl_rc}, HTTP ${http_code:-000})." >&2
              test -f "${output}" && head -c 2000 "${output}" >&2 || true
              return 1
            fi
          }

          wait_for_live

          wnba_bridge_ready=1
          wnba_schedule_file=/tmp/wnba-official-schedule.json
          if [ "${SPORT}" = "WNBA" ]; then
            set +e
            curl --silent --show-error --fail --location --compressed \
              --connect-timeout 15 --max-time 30 \
              --header 'Accept: application/json, text/plain, */*' \
              --header 'Origin: https://www.wnba.com' \
              --header 'Referer: https://www.wnba.com/' \
              --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
              --output "${wnba_schedule_file}" \
              'https://cdn.wnba.com/static/json/staticData/scheduleLeagueV2.json'
            wnba_curl_rc=$?
            set -e
            if [ "${wnba_curl_rc}" -ne 0 ]; then
              echo "WNBA_OIDC_OFFICIAL_SCHEDULE_FETCH_FAILED:curl_rc=${wnba_curl_rc}; falling back to backend governed identity recovery." >&2
              wnba_bridge_ready=0
            elif ! WNBA_SCHEDULE_FILE="${wnba_schedule_file}" python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['WNBA_SCHEDULE_FILE'])
          payload=json.loads(path.read_text())
          league=payload.get('leagueSchedule') if isinstance(payload,dict) else None
          blocks=league.get('gameDates') if isinstance(league,dict) else None
          if not isinstance(blocks,list) or not blocks:
              raise SystemExit('WNBA_OIDC_SCHEDULE_PAYLOAD_INVALID:leagueSchedule.gameDates')
          valid=False
          for block in blocks:
              games=block.get('games') if isinstance(block,dict) else None
              if not isinstance(games,list): continue
              for game in games:
                  if not isinstance(game,dict): continue
                  home=game.get('homeTeam'); away=game.get('awayTeam')
                  if ((game.get('gameId') or game.get('gameID')) and
                      (game.get('gameDateTimeUTC') or game.get('gameDateUTC')) and
                      isinstance(home,dict) and isinstance(away,dict) and
                      home.get('teamId') and away.get('teamId')):
                      valid=True; break
              if valid: break
          if not valid:
              raise SystemExit('WNBA_OIDC_SCHEDULE_PAYLOAD_INVALID:no_exact_game_identity')
          print(json.dumps({'provider':'WNBA_CDN_SCHEDULE_GITHUB_OIDC_BRIDGE','game_date_blocks':len(blocks),'can_execute':False},sort_keys=True))
          PY
            then
              echo "WNBA_OIDC_OFFICIAL_SCHEDULE_VALIDATION_FAILED; falling back to backend governed identity recovery." >&2
              wnba_bridge_ready=0
            fi
          fi

          seed_date() {
            local slate_date="$1"
            local body request_file
            case "${SPORT}" in
              NFL)
                body="$(printf '{"requested_date":"%s","candidate_offset":0,"max_candidates":%s}' "${slate_date}" "${MAX_CANDIDATES}")"
                if ! post_oidc_json "${PRODUCER_PATH}" "${body}" "/tmp/${SPORT}-evidence-${slate_date}.json" 120; then
                  echo "${SPORT} evidence producer transport was ambiguous for ${slate_date}; durable settlement/audit will still inspect persisted rows." >&2
                  return 1
                fi
                ;;
              MLB)
                body="$(printf '{"requested_date":"%s","requested_timezone":"America/Chicago","candidate_offset":0,"max_candidates":%s}' "${slate_date}" "${MAX_CANDIDATES}")"
                if ! post_oidc_json "${PRODUCER_PATH}" "${body}" "/tmp/${SPORT}-evidence-${slate_date}.json" 120; then
                  echo "${SPORT} evidence producer transport was ambiguous for ${slate_date}; durable settlement/audit will still inspect persisted rows." >&2
                  return 1
                fi
                ;;
              WNBA)
                if [ "${wnba_bridge_ready}" -eq 1 ]; then
                  request_file="/tmp/${SPORT}-request-${slate_date}.json"
                  SLATE_DATE="${slate_date}" MAX_CANDIDATES_VALUE="${MAX_CANDIDATES}" \
                    WNBA_SCHEDULE_FILE="${wnba_schedule_file}" REQUEST_FILE="${request_file}" python - <<'PY'
          import json, os
          from pathlib import Path
          schedule=json.loads(Path(os.environ['WNBA_SCHEDULE_FILE']).read_text())
          body={
              'requested_date':os.environ['SLATE_DATE'],
              'requested_timezone':'America/Chicago',
              'candidate_offset':0,
              'max_candidates':int(os.environ['MAX_CANDIDATES_VALUE']),
              'official_schedule_provider':'WNBA_CDN_SCHEDULE_GITHUB_OIDC_BRIDGE',
              'official_schedule':schedule,
          }
          Path(os.environ['REQUEST_FILE']).write_text(json.dumps(body,separators=(',',':')))
          PY
                  if ! post_oidc_json_file "${PRODUCER_PATH}" "${request_file}" "/tmp/${SPORT}-evidence-${slate_date}.json" 120; then
                    echo "${SPORT} evidence producer transport was ambiguous for ${slate_date}; durable settlement/audit will still inspect persisted rows." >&2
                    return 1
                  fi
                else
                  body="$(printf '{"requested_date":"%s","requested_timezone":"America/Chicago","candidate_offset":0,"max_candidates":%s}' "${slate_date}" "${MAX_CANDIDATES}")"
                  if ! post_oidc_json "${PRODUCER_PATH}" "${body}" "/tmp/${SPORT}-evidence-${slate_date}.json" 120; then
                    echo "${SPORT} backend identity-recovery transport was ambiguous for ${slate_date}; durable settlement/audit will still inspect persisted rows." >&2
                    return 1
                  fi
                fi
                ;;
              *)
                echo "Unsupported priority sport ${SPORT}." >&2
                return 1
                ;;
            esac
            SPORT_NAME="${SPORT}" SLATE_DATE="${slate_date}" python - <<'PY'
          import json, os
          from pathlib import Path
          sport=os.environ['SPORT_NAME']; slate=os.environ['SLATE_DATE']
          payload=json.loads(Path(f'/tmp/{sport}-evidence-{slate}.json').read_text())
          for key in ('can_execute','automatic_certification','automatic_promotion','probability_publishable'):
              if payload.get(key) is not False:
                  raise SystemExit(f'{sport}: {key} must remain false')
          if payload.get('status') in {'DATA_UNOBTAINABLE','RUN_INVALID_PROP_SNAPSHOT_WRITE_FAILURE'}:
              raise SystemExit(f"{sport}: evidence production failed: {payload.get('status')} blockers={payload.get('blockers')} source_diagnostics={payload.get('source_diagnostics')}")
          print(json.dumps({
              'sport':sport,'requested_date':slate,'status':payload.get('status'),
              'total_candidates':payload.get('total_candidates'),'attempted':payload.get('attempted'),
              'already_captured':payload.get('already_captured'),'hydrated':payload.get('hydrated'),
              'persisted':payload.get('persisted'),'held':payload.get('held'),
              'next_offset':payload.get('next_offset'),'source_diagnostics':payload.get('source_diagnostics') or [],
              'schedule_source_provider':payload.get('schedule_source_provider'),
              'can_execute':False,
          }, sort_keys=True))
          PY
          }

          today="$(TZ=America/Chicago date +%F)"
          tomorrow="$(TZ=America/Chicago date -d '+1 day' +%F)"
          seed_failures=0
          if ! seed_date "${today}"; then seed_failures=$((seed_failures + 1)); fi
          if ! seed_date "${tomorrow}"; then seed_failures=$((seed_failures + 1)); fi

          settlement_failures=0
          settlement_body="$(printf '{"routes":%s,"limit":20}' "${ROUTES_JSON}")"
          if ! post_oidc_json "/v17/prop-priority-settlement-run" "${settlement_body}" "/tmp/${SPORT}-priority-settlement.json" 120; then
            settlement_failures=1
          else
            python - <<'PY'
          import json, os
          from pathlib import Path
          sport=os.environ['SPORT']; payload=json.loads(Path(f'/tmp/{sport}-priority-settlement.json').read_text())
          if payload.get('can_execute') is not False: raise SystemExit(f'{sport}: settlement can_execute invariant failed')
          if payload.get('automatic_certification') is not False: raise SystemExit(f'{sport}: settlement automatic certification must remain disabled')
          if payload.get('automatic_promotion') is not False: raise SystemExit(f'{sport}: settlement automatic promotion must remain disabled')
          print(json.dumps({
              'sport':sport,'settlement_considered':payload.get('considered'),
              'settled':payload.get('settled'),'held':payload.get('held'),'can_execute':False,
          }, sort_keys=True))
          PY
          fi

          audit_body="$(printf '{"routes":%s}' "${ROUTES_JSON}")"
          post_oidc_json "/v17/prop-priority-durable-audit-run" "${audit_body}" "/tmp/${SPORT}-priority-audit.json" 120

          python - <<'PY'
          import json, os
          from pathlib import Path
          sport=os.environ['SPORT']; payload=json.loads(Path(f'/tmp/{sport}-priority-audit.json').read_text())
          if payload.get('can_execute') is not False: raise SystemExit(f'{sport}: audit can_execute invariant failed')
          if payload.get('automatic_certification') is not False: raise SystemExit(f'{sport}: automatic certification must remain disabled')
          if payload.get('automatic_promotion') is not False: raise SystemExit(f'{sport}: automatic promotion must remain disabled')
          if payload.get('artifact_isolation_enforced') is not True: raise SystemExit(f'{sport}: artifact isolation proof missing')
          if payload.get('run_status') not in {'COMPLETED','COMPLETED_WITH_STAGE_BLOCKERS'}:
              raise SystemExit(f"{sport}: unexpected durable audit status {payload.get('run_status')}")
          requested=int(payload.get('routes_requested') or 0)
          if requested != 4: raise SystemExit(f'{sport}: expected 4 core routes, got {requested}')
          persistence=payload.get('health_persistence') or {}
          if persistence.get('status') != 'PASS' or int(persistence.get('persisted_n') or 0) <= 0:
              raise SystemExit(f'{sport}: lifecycle health persistence failed: {persistence}')
          kpi=(payload.get('dashboard') or {}).get('kpi') or {}
          if int(kpi.get('improperly_promoted_route_n') or 0) != 0:
              raise SystemExit(f'{sport}: improperly promoted route detected')
          print(json.dumps({
              'sport':sport,'run_status':payload.get('run_status'),'cycle_id':payload.get('cycle_id'),
              'routes_requested':requested,'failed_stages':payload.get('failed_stages') or [],
              'artifact_forward_prediction_n':kpi.get('artifact_forward_prediction_n'),
              'artifact_forward_settled_n':kpi.get('artifact_forward_settled_n'),
              'artifact_eligible_n':kpi.get('artifact_eligible_n'),
              'calibrator_review_packet_ready_n':kpi.get('calibrator_review_packet_ready_n'),
              'improperly_promoted_route_n':kpi.get('improperly_promoted_route_n'),
              'persisted_health_n':persistence.get('persisted_n'),'can_execute':False,
          }, sort_keys=True))
          PY

          if [ "${seed_failures}" -ne 0 ] || [ "${settlement_failures}" -ne 0 ]; then
            echo "${SPORT} durable audit persisted, but seed_failures=${seed_failures} settlement_failures=${settlement_failures}." >&2
            exit 1
          fi

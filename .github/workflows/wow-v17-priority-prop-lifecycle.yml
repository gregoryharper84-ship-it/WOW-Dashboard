name: wow-v17-priority-prop-lifecycle

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wow-v17-priority-prop-lifecycle
  cancel-in-progress: false

jobs:
  priority-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WOW_SERVICE_URL: https://wow-governed-probability-engine.onrender.com
      WOW_OIDC_AUDIENCE: wow-v17-multiscout
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert fail-closed context
        shell: bash
        run: |
          set -euo pipefail
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Run bounded sport-scoped lifecycle batches
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) separator='&' ;; esac
          issue_oidc_token() {
            local token_json
            token_json="$(curl --silent --show-error --fail --connect-timeout 15 --max-time 30 \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${WOW_OIDC_AUDIENCE}")"
            python -c 'import json,sys; value=json.load(sys.stdin).get("value"); assert isinstance(value,str) and value.strip(); print(value.strip())' <<<"${token_json}"
          }

          health_code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/wow-live.json --write-out '%{http_code}' \
            "${WOW_SERVICE_URL}/health/live" || true)"
          if [ "${health_code}" -lt 200 ] || [ "${health_code}" -ge 300 ]; then
            echo "WOW runtime is not live (HTTP ${health_code:-000})." >&2
            exit 1
          fi

          run_batch() {
            local sport="$1"
            local routes_json="$2"
            local body
            body="$(printf '{"routes":%s,"max_snapshots_per_route":2,"settlement_limit":20,"persist_health":true}' "${routes_json}")"
            local oidc_token
            oidc_token="$(issue_oidc_token)"
            set +e
            local http_code
            http_code="$(curl --silent --show-error --connect-timeout 20 --max-time 210 \
              --output "/tmp/${sport}-priority-lifecycle.json" --write-out '%{http_code}' \
              --request POST --header "Authorization: Bearer ${oidc_token}" \
              --header 'Content-Type: application/json' --data "${body}" \
              "${WOW_SERVICE_URL}/v17/prop-lifecycle-autopilot-run")"
            local curl_rc=$?
            set -e
            unset oidc_token
            if [ "${curl_rc}" -ne 0 ] || [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "${sport} priority lifecycle failed (curl_rc=${curl_rc}, HTTP ${http_code:-000})." >&2
              test -f "/tmp/${sport}-priority-lifecycle.json" && head -c 2000 "/tmp/${sport}-priority-lifecycle.json" >&2 || true
              return 1
            fi
            SPORT="${sport}" python - <<'PY'
          import json, os
          from pathlib import Path
          sport=os.environ['SPORT']
          payload=json.loads(Path(f'/tmp/{sport}-priority-lifecycle.json').read_text())
          if payload.get('can_execute') is not False: raise SystemExit(f'{sport}: can_execute invariant failed')
          if payload.get('automatic_certification') is not False: raise SystemExit(f'{sport}: automatic certification must remain disabled')
          if payload.get('automatic_promotion') is not False: raise SystemExit(f'{sport}: automatic promotion must remain disabled')
          if payload.get('artifact_isolation_enforced') is not True: raise SystemExit(f'{sport}: artifact isolation proof missing')
          if payload.get('run_status') not in {'COMPLETED','COMPLETED_WITH_STAGE_BLOCKERS'}:
              raise SystemExit(f"{sport}: unexpected lifecycle status {payload.get('run_status')}")
          requested=int(payload.get('routes_requested') or 0)
          if requested != 4: raise SystemExit(f'{sport}: expected 4 core routes, got {requested}')
          dashboard=payload.get('dashboard') or {}
          kpi=dashboard.get('kpi') or {}
          if int(kpi.get('improperly_promoted_route_n') or 0) != 0:
              raise SystemExit(f'{sport}: improperly promoted route detected')
          print(json.dumps({
              'sport':sport,
              'run_status':payload.get('run_status'),
              'cycle_id':payload.get('cycle_id'),
              'routes_requested':requested,
              'failed_stages':payload.get('failed_stages') or [],
              'artifact_forward_prediction_n':kpi.get('artifact_forward_prediction_n'),
              'artifact_forward_settled_n':kpi.get('artifact_forward_settled_n'),
              'artifact_eligible_n':kpi.get('artifact_eligible_n'),
              'improperly_promoted_route_n':kpi.get('improperly_promoted_route_n'),
              'can_execute':False,
          }, sort_keys=True))
          PY
          }

          run_batch NFL '["NFL:PASSING_YARDS","NFL:RUSHING_YARDS","NFL:RECEIVING_YARDS","NFL:ANYTIME_TD"]'
          run_batch MLB '["MLB:PITCHER_STRIKEOUTS","MLB:PITCHING_OUTS","MLB:STRIKES_THROWN","MLB:BALLS_THROWN"]'
          run_batch WNBA '["WNBA:POINTS","WNBA:REBOUNDS","WNBA:ASSISTS","WNBA:THREE_POINTERS_MADE"]'

name: wow-v17-action-origin-keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: wow-v17-action-origin-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Keep V17 Action origin warm
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          url="https://wow-governed-probability-engine.onrender.com/health/live"
          curl_status=0
          code="$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 45 \
            --retry 2 \
            --retry-all-errors \
            --output "$RUNNER_TEMP/wow-v17-health-live.json" \
            --write-out '%{http_code}' \
            "$url")" || curl_status=$?
          if [ "$curl_status" -ne 0 ] || [ "$code" != "200" ]; then
            echo "::error::ACTION_ORIGIN_KEEPALIVE_UNREACHABLE: GET /health/live returned ${code:-no-response} (curl exit ${curl_status})."
            echo "ACTION_ORIGIN_KEEPALIVE_UNREACHABLE http=${code:-none} curl_exit=${curl_status} can_execute=false" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ACTION_ORIGIN_KEEPALIVE_OK http=200 can_execute=false" >> "$GITHUB_STEP_SUMMARY"
          echo "V17 Action origin keepalive PASS ($code)"

name: wow-v17-cross-sport-geometry-audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wow-v17-cross-sport-geometry-audit.yml"
      - "artifacts/wow-engine/v17/experiments/cross_sport_geometry_audit.py"
      - "artifacts/wow-engine/v17/experiments/cross_sport_audit_edge_fetch.py"
      - "artifacts/wow-engine/v17/experiments/cross_sport_geometry_audit_bundle.py"
      - "artifacts/wow-engine/v17/experiments/test_cross_sport_geometry_audit.py"
      - "artifacts/wow-engine/v17/experiments/cross_sport_stationarity_triage.py"
      - "artifacts/wow-engine/v17/experiments/test_cross_sport_stationarity_triage.py"
      - "artifacts/wow-engine/v17/supabase/functions/wow-v17-cross-sport-audit-feed/index.ts"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wow-v17-cross-sport-geometry-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only cross-sport model geometry audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_SCOUT_DATABASE_URL: ${{ secrets.WOW_SCOUT_DATABASE_URL }}
      WOW_CROSS_SPORT_AUDIT_FEED_URL: "https://iczfhsmjrrafhvcpmqhr.supabase.co/functions/v1/wow-v17-cross-sport-audit-feed"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve governed read path
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${WOW_SCOUT_DATABASE_URL:-}" ]; then
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            echo "Using configured masked direct read path." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Direct DB credential absent; using short-lived GitHub OIDC to governed Supabase read-only feed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run deterministic experiment tests
        run: |
          python -m pytest -q \
            v17/experiments/test_cross_sport_geometry_audit.py \
            v17/experiments/test_cross_sport_stationarity_triage.py

      - name: Fetch immutable D1 evidence through governed OIDC feed
        if: steps.source.outputs.mode == 'oidc'
        run: |
          python -m v17.experiments.cross_sport_audit_edge_fetch \
            --output "$RUNNER_TEMP/cross-sport-audit-bundle.json"

      - name: Run direct read-only cross-sport audit
        if: steps.source.outputs.mode == 'direct'
        shell: bash
        run: |
          set -euo pipefail
          python -m v17.experiments.cross_sport_geometry_audit \
            --output "$RUNNER_TEMP/cross-sport-geometry-audit.json" \
            | tee "$RUNNER_TEMP/cross-sport-geometry-audit.log"

      - name: Run OIDC-bundle cross-sport audit
        if: steps.source.outputs.mode == 'oidc'
        shell: bash
        run: |
          set -euo pipefail
          python -m v17.experiments.cross_sport_geometry_audit_bundle \
            --input "$RUNNER_TEMP/cross-sport-audit-bundle.json" \
            --output "$RUNNER_TEMP/cross-sport-geometry-audit.json" \
            | tee "$RUNNER_TEMP/cross-sport-geometry-audit.log"

      - name: Run Wave-1 stationarity challenger triage
        shell: bash
        run: |
          set -euo pipefail
          python -m v17.experiments.cross_sport_stationarity_triage \
            --input "$RUNNER_TEMP/cross-sport-geometry-audit.json" \
            --output "$RUNNER_TEMP/cross-sport-stationarity-triage.json" \
            | tee "$RUNNER_TEMP/cross-sport-stationarity-triage.log"

      - name: Assert fail-closed governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("cross-sport-geometry-audit.json")
              .read_text(encoding="utf-8")
          )
          assert result["can_execute"] is False
          assert result["probability_publishable"] is False
          assert result["automatic_promotion"] is False
          sports = result.get("sports") or {}
          expected = {
              "MLB","NFL","NBA","WNBA","NCAAF","NCAAB","NHL",
              "SOCCER","TENNIS","PGA","MMA","BOXING","CRICKET",
          }
          assert set(sports) == expected
          for sport, payload in sports.items():
              assert payload.get("can_execute") is False
              for lane in payload.get("lanes") or []:
                  assert lane.get("can_execute") is False
                  assert lane.get("probability_publishable") is False
                  assert lane.get("automatic_promotion") is False
          triage = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("cross-sport-stationarity-triage.json")
              .read_text(encoding="utf-8")
          )
          assert triage["can_execute"] is False
          assert triage["probability_publishable"] is False
          assert triage["automatic_promotion"] is False
          assert triage["terminal_authority"] == "V17_TERMINAL_REDUCER"
          assert triage["terminal_state"] == "EXPERIMENT_CREATED"
          lanes = {
              (row.get("sport"), row.get("league"))
              for row in triage.get("lanes") or []
          }
          assert lanes == {
              ("MLB", "MLB"),
              ("NCAAB", "NCAAB"),
              ("SOCCER", "BUNDESLIGA"),
              ("SOCCER", "EPL"),
              ("SOCCER", "LALIGA"),
              ("SOCCER", "SERIE_A"),
          }
          for row in triage.get("lanes") or []:
              assert row.get("can_execute") is False
              if row.get("status") == "EXPERIMENT_CREATED":
                  assert row.get("probability_publishable") is False
                  assert row.get("automatic_promotion") is False
          print(
              "CROSS_SPORT_AUDIT_GOVERNANCE_PASS "
              "STATIONARITY_TRIAGE_GOVERNANCE_PASS can_execute=false"
          )
          PY

      - name: Publish compact audit receipt
        shell: bash
        run: |
          {
            echo "# WOW V17 Cross-Sport Geometry Audit"
            echo
            echo "- issue: #1347"
            echo "- data_path: ${{ steps.source.outputs.mode }}"
            echo "- mode: READ_ONLY_RESEARCH"
            echo "- probability_publishable: false"
            echo "- automatic_promotion: false"
            echo "- can_execute: false"
            echo
            echo "Audit output:"
            cat "$RUNNER_TEMP/cross-sport-geometry-audit.log"
            echo
            echo "Wave-1 stationarity triage:"
            cat "$RUNNER_TEMP/cross-sport-stationarity-triage.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-cross-sport-geometry-audit
          path: |
            ${{ runner.temp }}/cross-sport-geometry-audit.json
            ${{ runner.temp }}/cross-sport-geometry-audit.log
            ${{ runner.temp }}/cross-sport-audit-bundle.json
            ${{ runner.temp }}/cross-sport-stationarity-triage.json
            ${{ runner.temp }}/cross-sport-stationarity-triage.log
          if-no-files-found: warn
          retention-days: 90

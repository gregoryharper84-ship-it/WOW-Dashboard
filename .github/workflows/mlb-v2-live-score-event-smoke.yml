name: MLB V2 live score-event smoke

on:
  push:
    branches: [feature/mlb-v2-governed-probability-20260827]
    paths:
      - "artifacts/flask-scoring-api/app.py"
      - "artifacts/flask-scoring-api/gate_engine/mlb_v2_*"
      - ".github/workflows/mlb-v2-live-score-event-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCORING_API_KEY: live-smoke-key
      API_KEY: live-smoke-key
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: artifacts/flask-scoring-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run actual protected score-event path on today's preview slate
        working-directory: artifacts/flask-scoring-api
        run: |
          python - <<'PY'
          import json
          from datetime import date
          import gate_engine.daily_run_lifecycle as lifecycle

          # Isolate this route/network smoke from the unrelated DB-backed daily
          # manifest boot prerequisite. Production startup remains unchanged and
          # continues to fail closed when that database is unavailable.
          lifecycle.ensure_manifest_ready = lambda: None

          import app as app_module
          from gate_engine.mlb_v2_hydrator import _schedule

          target=date(2026,8,27)
          games=[g for g in _schedule(target) if g.get('abstract_state')=='Preview' and g.get('home_starter_id') and g.get('away_starter_id')]
          if not games:
              raise SystemExit('LIVE_SMOKE_NO_PREVIEW_GAMES_WITH_BOTH_STARTERS')
          client=app_module.app.test_client()
          attempts=[]
          success=None
          for g in games:
              body={
                  'sport':'MLB',
                  'market_family':'OUTRIGHT_WINNER',
                  'team':g['home_team'],
                  'opponent':g['away_team'],
                  'game_date':target.isoformat(),
                  'gamePk':g['gamePk'],
              }
              r=client.post('/wow/score-event',json=body,headers={'X-API-Key':'live-smoke-key'})
              d=r.get_json()
              attempts.append({'gamePk':g['gamePk'],'status':r.status_code,'code':d.get('code'),'blockers':d.get('blockers')})
              if r.status_code==200:
                  success=d
                  break
          print(json.dumps({'attempts':attempts,'success':success},indent=2))
          assert success is not None, 'NO_CURRENT_PREVIEW_GAME_PASSED_GOVERNED_SCORE_EVENT'
          assert success['code']=='GOVERNED_EVENT_MODEL_AVAILABLE'
          assert success['governed_probability_capability']=='AVAILABLE'
          assert success['governed_probability_status']=='PRODUCED'
          assert success['probability_publishable'] is True
          assert 0 < success['probability'] < 1
          assert success['probability_lower_bound'] <= success['probability'] <= success['probability_upper_bound']
          assert abs((success['home_probability'] + success['away_probability']) - 1.0) < 1e-9
          assert success['market_weight_in_point_probability'] == 0.0
          assert success['hydration']['strict_prior_date_only'] is True
          assert success['hydration']['same_day_results_used'] is False
          assert success['can_execute'] is False
          assert success['can_approve_bets'] is False
          print('MLB_V2_LIVE_SCORE_EVENT_SMOKE=PASS')
          PY

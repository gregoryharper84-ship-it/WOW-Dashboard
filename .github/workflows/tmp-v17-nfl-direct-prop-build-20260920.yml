name: tmp-v17-nfl-direct-prop-build-20260920

on:
  push:
    branches:
      - feature/v17-nfl-direct-props-20260920

permissions:
  contents: write

jobs:
  train:
    if: ${{ !contains(github.event.head_commit.message, '[generated-nfl-props]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v17-nfl-direct-props-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install WOW dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r artifacts/wow-engine/requirements.txt
      - name: Train governed NFL direct-prop candidates
        run: |
          python artifacts/wow-engine/scripts/train_nfl_direct_props.py --output-dir artifacts/wow-engine/data | tee /tmp/nfl-direct-prop-training.json
          cat artifacts/wow-engine/data/wow_nfl_direct_prop_training_report_v1.json
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/wow-engine/data/wow_nfl_direct_prop_artifacts_v1.json artifacts/wow-engine/data/wow_nfl_direct_prop_training_report_v1.json
          if git diff --cached --quiet; then
            echo 'No generated artifact changes.'
            exit 0
          fi
          git commit -m 'data(nfl-props): generate governed direct-prop artifacts [generated-nfl-props]'
          git push origin HEAD:feature/v17-nfl-direct-props-20260920

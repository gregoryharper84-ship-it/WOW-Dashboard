name: tmp-v17-nfl-direct-prop-build-20260920

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  build:
    if: github.event.pull_request.head.ref == 'feature/v17-nfl-direct-props-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v17-nfl-direct-props-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install WOW dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r artifacts/wow-engine/requirements.txt
          pip install PyYAML openapi-spec-validator
      - name: Implement governed NFL direct player props
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: feature/v17-nfl-direct-props-20260920
          branch_prefix: claude/nfl-direct-props/
          display_report: 'false'
          show_full_output: 'false'
          prompt: |
            Implement the complete governed WOW V17 NFL direct player-prop capability. This is an explicitly authorized sporting-model build on a feature branch, not an R0/R1 repair. Do not merge or deploy.

            Read CLAUDE.md and V17 governance first. Preserve V17_TERMINAL_REDUCER and can_execute=false. Never use sportsbook implied probability, external projections, recent hit rate alone, or generic AI reasoning as model probability. Unsupported or uncertified routes must fail closed.

            Production target routes, all WOW prop lane:
            - NFL PASSING_YARDS
            - NFL RUSHING_YARDS
            - NFL RECEIVING_YARDS
            - NFL ANYTIME_TD
            Use one explicit controlling specialist identity, preferably wow.nfl-player-prop-probability-expert, with a versioned specialist identity in artifacts. ANYTIME_TD MUST NOT count passing TDs. It means player scored via rushing, receiving, or special-teams/return if the approved source supplies it. If exact source coverage is insufficient, leave that route blocked rather than redefining the market.

            Data/model constraints:
            - Only approved nflverse player_stats/schedules/players under nflverse_dataset_policy_v1.json. No excluded FTN participation/charting.
            - player_stats CSV source is https://github.com/nflverse/nflverse-data/releases/download/player_stats/player_stats_<YEAR>.csv . Prefer CSV/httpx/pandas already installed.
            - Build a real fitted model, NOT gate_engine's old PROVISIONAL Poisson/Bernoulli registry.
            - Yardage: leakage-safe strictly-prior-game features and a fitted empirical/residual or statistically justified non-market distribution.
            - Anytime TD: separately fitted binary model/prior using strictly prior data.
            - Whole-event/week chronological train/calibration/untouched-test split. No target-game leakage. Validate against a naive baseline. Record holdout metrics. Only promote routes that pass deterministic validation gates.
            - Runtime Phase-A PRECALIBRATION_SHRINKAGE is allowed under current prop_calibration_adapters.py if supplied genuine calibration evidence. It must emit calibrated probability + lower/upper bounds and money_qualified=false.
            - Continuous exact-line support only inside artifact-supported numeric ranges; reject OOD otherwise.

            Runtime integration:
            1. Add NFL aliases in pick_request_runtime_core.py: Pass Yards/PASS_YARDS -> PASSING_YARDS; Rush Yards/RUSH_YARDS -> RUSHING_YARDS; Receiving Yards/REC_YARDS -> RECEIVING_YARDS; Anytime TDs/ANYTIME_TDS/TD -> ANYTIME_TD where unambiguous for this route.
            2. Add dedicated NFL direct-prop model adapter and calibration registration via existing prop_model_adapters / prop_calibration_adapters seams.
            3. Add NFL auto hydration, ideally new nfl_prop_auto_hydration.py. Acquire >=10 completed games strictly before event_start, cross-season if needed; aligned game_log + nonempty box_score_log; role/team/position; opportunity_ledger; source timestamps; evidence version; rate provenance. Validate player/current team against exact target event. Bad board identities such as a player whose verified team is not in target event must terminate PROP_EVENT_IDENTITY_CONFLICT. Do not silently correct caller event.
            4. Add routes to v17/prop_capability_manifest.py only at achieved lifecycle.
            5. Add additive Supabase migration preserving every existing wow_controlling_specialist case while adding exact NFL direct routes; seed fitted artifacts only for routes that pass validation; candidate/nonpassing inactive/unpromoted.
            6. Preserve exact wow_prop_certified_model_artifact lifecycle requirements and specialist identity.
            7. Tests: aliases, fitted distribution, calibration/bounds, cross-season hydration chronology, event/player mismatch, OOD, specialist identity, route preflight, adapter registration, can_execute=false, and deterministic /score-pick-request happy path.
            8. Do NOT edit Custom GPT Instructions/OpenAPI/Knowledge unless Action contract truly needs it. It should not.

            Training artifacts:
            - Add deterministic trainer under artifacts/wow-engine/scripts/ and run it here if network is available. Store JSON artifact/report under artifacts/wow-engine/data/ with source hashes, training_dataset_hash, training_code_sha, artifact_checksum, validation metrics, supported line ranges, versions.
            - Historical completed seasons may train the model; runtime hydration must support 2026 + prior season history.
            - If a route fails validation, leave it fail-closed. Never weaken validation to force all four through.

            Run targeted tests and strongest feasible touched regressions. Inspect git diff for accidental scope. Do not touch .github/workflows/**. Commit implementation changes to the Claude-created branch. Final response must state exact certified routes, blocked routes, and tests.
          claude_args: >-
            --max-turns 300
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python *),Bash(python -m pytest *),Bash(git status),Bash(git diff *),Bash(git log *),Bash(curl *),Bash(ls *),Bash(cat *),Bash(find *),Bash(pip *),Bash(pytest *)"

name: wow-v17-required-checks-deploy

# Sole authorized production deploy writer (WOW-V17-DEPLOY-RELIABILITY-P0 /
# #2422). Native Render checksPass is retired as a competing writer. Once the
# 3 required checks are green on the exact current main SHA and Render has not
# started a deploy of it, POST one deploy per missing service, then require
# both LIVE on that SHA plus health.
# Sanctioned Render writer (v17.github_release_journal.SOLE_ACTIVE_RENDER_WRITER):
# method "POST" to https://api.render.com/v1/services/<id>/deploys only.
# Non-advancing outcomes (incl. a transient read failure before any write)
# end green so this job never blocks protected main. Redirects are refused.
# wow-release: same environment the scheduled lean readback uses with
# RENDER_API_KEY (run 44665491538, 2026-11-20, no approval wait).
# Never touches env vars, plans or services. can_execute=false.
on:
  workflow_run:
    workflows: [wow-verify, wow-engine-verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  # Both upstream completions for one SHA serialize; the first usually sees
  # the other required check pending and exits green.
  group: wow-v17-required-checks-deploy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact main SHA after the 3 required checks
    if: >-
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: wow-release
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_RECEIPT: wow-v17-required-checks-deploy.json
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Checkout protected main (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Deploy exact current main SHA once required checks are green
        working-directory: artifacts/wow-engine
        env:
          # Credentials reach this step only (not checkout/setup/upload).
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python -m v17.required_checks_deploy

      - name: Preserve typed deploy receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-v17-required-checks-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wow-engine/wow-v17-required-checks-deploy.json
          if-no-files-found: warn
          retention-days: 30

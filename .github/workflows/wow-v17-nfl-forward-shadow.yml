name: wow-v17-nfl-forward-shadow

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-nfl-forward-shadow.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/v17/nfl_forward_shadow.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/test_v17_nfl_forward_shadow.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"
  pull_request:
    paths:
      - ".github/workflows/wow-v17-nfl-forward-shadow.yml"
      - "artifacts/wow-engine/github_actions_oidc.py"
      - "artifacts/wow-engine/v17/nfl_forward_shadow.py"
      - "artifacts/wow-engine/team_event_request_runtime.py"
      - "artifacts/wow-engine/test_v17_nfl_forward_shadow.py"
      - "artifacts/wow-engine/test_v17_github_oidc.py"

permissions:
  contents: read

concurrency:
  group: wow-v17-nfl-forward-shadow
  cancel-in-progress: false

jobs:
  verify:
    name: Verify NFL forward-shadow contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run forward-shadow and OIDC regressions
        run: >-
          python -m pytest -q
          test_v17_nfl_forward_shadow.py
          test_v17_github_oidc.py

  forward-shadow:
    name: Grade immutable NFL forward predictions
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      WOW_ACTION_ORIGIN: https://wow-governed-probability-engine.onrender.com
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Assert non-execution governance and OIDC context
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Run governed NFL forward-shadow grading
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          oidc_url += separator + urllib.parse.urlencode({"audience": "wow-v17-multiscout"})
          oidc_request = urllib.request.Request(
              oidc_url,
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(oidc_request, timeout=20) as response:
              oidc_token = json.load(response)["value"]

          endpoint = os.environ["WOW_ACTION_ORIGIN"].rstrip("/") + "/internal/v17/nfl-forward-shadow"
          request = urllib.request.Request(
              endpoint,
              data=b"",
              method="POST",
              headers={
                  "Authorization": f"Bearer {oidc_token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              payload = json.load(response)

          assert payload.get("can_execute") is False
          assert payload.get("automatic_certification") is False
          assert payload.get("automatic_promotion") is False
          health = payload.get("calibration_health") or {}
          assert health.get("can_execute") is False
          assert health.get("certification_recommendation") in {
              "DO_NOT_CERTIFY_YET",
              "FORWARD_EVIDENCE_PASS",
          }
          print(json.dumps({
              "status": payload.get("status"),
              "canonical_events": payload.get("canonical_events"),
              "graded_events": payload.get("graded_events"),
              "new_grades_persisted": payload.get("new_grades_persisted"),
              "forward_health": health.get("status"),
              "certification_recommendation": health.get("certification_recommendation"),
              "can_execute": False,
          }, sort_keys=True))
          PY

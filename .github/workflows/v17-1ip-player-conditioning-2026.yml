name: v17-1ip-player-conditioning-2026

on:
  push:
    branches:
      - chatgpt/fix-1ip-player-discrimination-20260914
    paths:
      - "artifacts/wow-engine/mlb_1ip_bf_mixture.py"
      - "artifacts/wow-engine/mlb_1ip_live_acquisition.py"
      - "artifacts/wow-engine/research-fixtures/mlb_1ip_player_conditioning_dev_bundle_20260914.json"
      - "artifacts/wow-engine/scripts/validate_mlb_1ip_player_conditioning_2026.py"
      - "artifacts/wow-engine/tests/test_mlb_1ip_bf_mixture.py"
      - ".github/workflows/v17-1ip-player-conditioning-2026.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  untouched-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: artifacts/wow-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/wow-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit regression
        run: python -m pytest -q tests/test_mlb_1ip_bf_model.py tests/test_mlb_1ip_bf_mixture.py
      - name: Run untouched 2026 player-discrimination test
        env:
          PYTHONPATH: .
          MLB_1IP_PLAYER_CONDITIONING_OUT: /tmp/mlb-1ip-player-conditioning
        run: python scripts/validate_mlb_1ip_player_conditioning_2026.py
      - name: Upload immutable validation packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-1ip-player-conditioning-2026-${{ github.sha }}
          path: /tmp/mlb-1ip-player-conditioning
          if-no-files-found: error
          retention-days: 30

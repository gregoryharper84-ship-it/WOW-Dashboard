name: wow-v17-scout-persist-resume

on:
  workflow_run:
    workflows: ["wow-v17-morning-green-continuation"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# One global group let a */15 cron tick and a workflow_run trigger contend for
# the single pending slot, so queued runs cancelled each other. Key the group by
# trigger source (and, for workflow_run, by the SHA being resumed) so a
# SHA-specific resume is never cancelled by an unrelated scheduled sweep.
concurrency:
  group: wow-v17-scout-persist-resume-${{ github.event_name == 'workflow_run' && format('sha-{0}', github.event.workflow_run.head_sha) || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resume-persistence:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || '' }}
    steps:
      - name: Resolve completed Multi-Scout source run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_run_id=""
          force_replay="false"

          if [ -n "$TARGET_SHA" ]; then
            for _ in $(seq 1 4); do
              source_run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=30" \
                --jq '[.workflow_runs[] | select(.name == "wow-v17-nightly-multiscout" and .status == "completed" and .conclusion != "cancelled")] | first | .id // ""')
              if [ -n "$source_run_id" ]; then
                break
              fi
              sleep 5
            done

            # Merge/configuration SHAs commonly have no Multi-Scout run of their
            # own. That is not a valid reason to report recovery success without
            # exercising the persistence path. Fall back to the newest completed
            # non-PR main run and force a fresh replay through current main.
            if [ -z "$source_run_id" ]; then
              source_run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/wow-v17-nightly-multiscout.yml/runs?branch=main&status=completed&per_page=20" \
                --jq '[.workflow_runs[] | select(.event != "pull_request" and .conclusion != "cancelled")] | first | .id // ""')
              force_replay="true"
            fi
          else
            source_run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/wow-v17-nightly-multiscout.yml/runs?branch=main&status=completed&per_page=20" \
              --jq '[.workflow_runs[] | select(.event != "pull_request" and .conclusion != "cancelled")] | first | .id // ""')
          fi

          if [ -z "$source_run_id" ]; then
            echo "No completed recoverable Multi-Scout run found; fail closed." >&2
            exit 1
          fi

          echo "run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "force_replay=$force_replay" >> "$GITHUB_OUTPUT"
          if [ "$force_replay" = "true" ]; then
            echo "No Multi-Scout run existed for target SHA ${TARGET_SHA}; forcing a fresh replay of recoverable source run ${source_run_id} through current main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Resolved Multi-Scout source run: $source_run_id" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify recoverable discovery artifact exists
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          discovery_count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | test("^wow-v17-multiscout-wow-scout-.*-discovery$")))] | length')
          if [ "$discovery_count" -lt 1 ]; then
            echo "Multi-Scout run ${SOURCE_RUN_ID} has no recoverable discovery artifact; refusing to fabricate persistence input." >&2
            exit 1
          fi

      - name: Capture persistence receipt baseline
        id: baseline
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          receipt_name="wow-v17-scout-brain-persistence-${SOURCE_RUN_ID}"
          count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${receipt_name}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Persistence receipt baseline for ${SOURCE_RUN_ID}: ${count}." >> "$GITHUB_STEP_SUMMARY"

      - name: Allow native workflow_run persistence to win first
        if: steps.source.outputs.force_replay != 'true'
        run: sleep 30

      - name: Check for existing persistence receipt
        id: existing
        if: steps.source.outputs.force_replay != 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          receipt_name="wow-v17-scout-brain-persistence-${SOURCE_RUN_ID}"
          receipt_count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${receipt_name}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          if [ "$receipt_count" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Persistence receipt already exists for source run ${SOURCE_RUN_ID}; no scheduled replay needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect same-source persistence writer state
        id: writer
        if: steps.source.outputs.force_replay == 'true' || steps.existing.outputs.present != 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          display_title="wow-v17-scout-brain-persist source=${SOURCE_RUN_ID}"
          persist_runs=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/wow-v17-scout-brain-persist.yml/runs?branch=main&per_page=100")

          active_run_id=$(printf '%s' "$persist_runs" | jq -r \
            --arg title "$display_title" \
            '[.workflow_runs[] | select(.display_title == $title and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | first | .id // ""')

          # Idempotency: a successful persistence writer for this source run that
          # already ran on the current main tip means the replay this run would
          # dispatch has been performed. Re-dispatching it writes the same
          # discovery payload into the Scout brain a second time.
          replayed_run_id=$(printf '%s' "$persist_runs" | jq -r \
            --arg title "$display_title" --arg sha "$main_sha" \
            '[.workflow_runs[] | select(.display_title == $title and .status == "completed" and .conclusion == "success" and .head_sha == $sha)] | first | .id // ""')

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          if [ -n "$active_run_id" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$active_run_id" >> "$GITHUB_OUTPUT"
            echo "Existing same-source persistence writer ${active_run_id} is active for source run ${SOURCE_RUN_ID}; monitoring it instead of dispatching a duplicate writer." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$replayed_run_id" ]; then
            echo "replayed=true" >> "$GITHUB_OUTPUT"
            echo "replayed_run_id=$replayed_run_id" >> "$GITHUB_OUTPUT"
            echo "Source run ${SOURCE_RUN_ID} was already persisted through current main (${main_sha}) by run ${replayed_run_id}; skipping redundant re-dispatch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "replayed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explicitly resume Scout persistence
        if: (steps.source.outputs.force_replay == 'true' || steps.existing.outputs.present != 'true') && steps.writer.outputs.active != 'true' && steps.writer.outputs.replayed != 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          gh workflow run wow-v17-scout-brain-persist.yml --repo "$GITHUB_REPOSITORY" --ref main -f run_id="$SOURCE_RUN_ID"
          echo "Explicitly dispatched governed Scout persistence for source run ${SOURCE_RUN_ID} on current main." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify persistence receipt appears
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          BASELINE_COUNT: ${{ steps.baseline.outputs.count }}
          # Only a replay this run actually dispatched may demand a *new*
          # receipt. When the current-main replay already happened, the existing
          # receipt is the evidence.
          EXPECT_FRESH_RECEIPT: ${{ steps.source.outputs.force_replay == 'true' && steps.writer.outputs.replayed != 'true' }}
        run: |
          set -euo pipefail
          receipt_name="wow-v17-scout-brain-persistence-${SOURCE_RUN_ID}"
          # The canonical writer is allowed 45 minutes. Give it a small buffer
          # rather than declaring recovery failure after only ten minutes.
          for _ in $(seq 1 200); do
            receipt_count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${receipt_name}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
            if [ "$EXPECT_FRESH_RECEIPT" = "true" ]; then
              if [ "$receipt_count" -gt "$BASELINE_COUNT" ]; then
                echo "Fresh Scout persistence receipt verified for source run ${SOURCE_RUN_ID}: ${BASELINE_COUNT} -> ${receipt_count}." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            elif [ "$receipt_count" -gt 0 ]; then
              echo "Scout persistence receipt verified for source run ${SOURCE_RUN_ID}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          if [ "$EXPECT_FRESH_RECEIPT" = "true" ]; then
            echo "Fresh persistence receipt did not appear for source run ${SOURCE_RUN_ID}; current-main replay acceptance remains open." >&2
          else
            echo "Persistence receipt did not appear for source run ${SOURCE_RUN_ID}; acceptance remains open." >&2
          fi
          exit 1

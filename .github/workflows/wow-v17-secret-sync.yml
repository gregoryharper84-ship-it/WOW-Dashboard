name: wow-v17-secret-sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Secret synchronization direction
        required: true
        default: both
        type: choice
        options:
          - both
          - github-to-render
          - render-to-github
      dry_run:
        description: Inspect reconciliation without mutating either store
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-secret-sync.yml"
      - "artifacts/wow-engine/v17/secret_sync.py"
      - "artifacts/wow-engine/v17/secret_sync_manifest.json"

permissions:
  contents: read
  actions: write

concurrency:
  group: wow-v17-secret-sync
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile GitHub and Render secrets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      WOW_SECRET_SYNC_RENDER_API_KEY: ${{ secrets.WOW_SECRET_SYNC_RENDER_API_KEY }}
      WOW_GITHUB_SECRET_SYNC_TOKEN: ${{ secrets.WOW_GITHUB_SECRET_SYNC_TOKEN }}
      THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
      RUNDOWN_API_KEY: ${{ secrets.RUNDOWN_API_KEY }}
      SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert execution governance
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"

      - name: Reconcile explicitly owned secrets and create release request
        id: reconcile
        shell: bash
        run: |
          mode="${{ inputs.mode }}"
          dry_run="${{ inputs.dry_run }}"
          if [ -z "$mode" ]; then
            mode="both"
          fi
          args=(--manifest v17/secret_sync_manifest.json --mode "$mode")
          if [ "$dry_run" = "true" ]; then
            args+=(--dry-run)
          fi
          python v17/secret_sync.py \
            "${args[@]}" \
            --release-request-file "$RUNNER_TEMP/wow-v17-secret-env-release-request.json"

      - name: Detect durable secret-change request
        if: always()
        id: release-request
        shell: bash
        run: |
          receipt="$RUNNER_TEMP/wow-v17-secret-env-release-request.json"
          if [ -f "$receipt" ] && \
             [ "$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$receipt")" = "SECRET_ENV_CHANGED_RELEASE_REQUEST" ]; then
            echo "release_request=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_request=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist typed secret-change release request
        if: always() && steps.release-request.outputs.release_request == 'true'
        id: persist-request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-v17-secret-env-release-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wow-v17-secret-env-release-request.json
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch protected Render release controller
        if: always() && steps.release-request.outputs.release_request == 'true' && steps.persist-request.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run wow-v17-render-production-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f secret_sync_request_run_id="$GITHUB_RUN_ID" \
            -f secret_sync_request_run_attempt="$GITHUB_RUN_ATTEMPT" \
            -f secret_sync_request_sha="$GITHUB_SHA"

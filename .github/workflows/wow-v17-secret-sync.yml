name: wow-v17-secret-sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Secret synchronization direction
        required: true
        default: both
        type: choice
        options:
          - both
          - github-to-render
          - render-to-github
      dry_run:
        description: Inspect reconciliation without mutating either store
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wow-v17-secret-sync.yml"
      - "artifacts/wow-engine/v17/secret_sync.py"
      - "artifacts/wow-engine/v17/secret_sync_manifest.json"

permissions:
  contents: read

concurrency:
  group: wow-v17-secret-sync
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile GitHub and Render secrets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: artifacts/wow-engine
    env:
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      WOW_GITHUB_SECRET_SYNC_TOKEN: ${{ secrets.WOW_GITHUB_SECRET_SYNC_TOKEN }}
      RUNDOWN_API_KEY: ${{ secrets.RUNDOWN_API_KEY }}
      SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert execution governance
        shell: bash
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"

      - name: Reconcile explicitly owned secrets
        shell: bash
        run: |
          mode="${{ inputs.mode }}"
          dry_run="${{ inputs.dry_run }}"
          if [ -z "$mode" ]; then
            mode="both"
          fi
          args=(--manifest v17/secret_sync_manifest.json --mode "$mode")
          if [ "$dry_run" = "true" ]; then
            args+=(--dry-run)
          fi
          python v17/secret_sync.py "${args[@]}"

name: wow-v17-post-deploy-verification-orchestrator

on:
  workflow_run:
    workflows: ["wow-v17-lean-production-readback"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current protected-main SHA to verify on BOTH services (never deploy)
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: wow-v17-post-deploy-verification-orchestrator
  cancel-in-progress: false

jobs:
  deployment-readback:
    name: Authenticate trigger and read exact current-main web/worker deployments
    if: >-
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: wow-release
    outputs:
      already_accepted: ${{ steps.dedupe.outputs.already_accepted }}
      deploy_pending: ${{ steps.readback.outputs.deploy_pending }}
    env:
      GH_TOKEN: ${{ github.token }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha }}
      SOURCE_EVENT: ${{ github.event_name }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_KIND: production_observer
      READBACK_RECEIPT: wow-v17-post-deploy-readback.json
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Checkout protected main (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Verify execution and checkout identity
        run: |
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Fresh authenticated exact-SHA readback of BOTH native deployments
        id: readback
        # The upstream observer is nonblocking. Its success is only a trigger;
        # fresh GET-only service/deploy/current-main evidence gates these lanes.
        # A live-SHA mismatch on a recent main commit is a typed bounded PENDING
        # (deploy_pending=true): the job must not fail on the commit Render is
        # still evaluating for native checksPass deployment. Outside the grace
        # window, or for any other reason, the readback still fails closed.
        run: python artifacts/wow-engine/v17/lean_production_readback.py

      - name: Skip repeat acceptance only for the identical deployment
        id: dedupe
        if: steps.readback.outputs.deploy_pending != 'true'
        # The hourly observer re-triggers this workflow on unchanged deployments.
        # The fresh readback above still ran (drift fails the job). Expensive
        # lanes are skipped only when a prior successful run observed the same
        # SHA AND the same live web and worker deploy IDs; a redeploy of the same
        # SHA gets new deploy IDs and runs everything. Any doubt fails closed.
        run: python artifacts/wow-engine/v17/post_deploy_dedupe.py

      - name: Preserve readback receipt (observation, never SIRT approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-v17-post-deploy-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: wow-v17-post-deploy-readback.json
          if-no-files-found: error
          retention-days: 30

  spread-forward:
    name: Run spread-forward production canaries
    needs: deployment-readback
    if: >-
      needs.deployment-readback.result == 'success' &&
      needs.deployment-readback.outputs.deploy_pending != 'true' &&
      needs.deployment-readback.outputs.already_accepted != 'true'
    uses: ./.github/workflows/wow-v17-spread-forward-production-canary.yml
    secrets: inherit

  spread-certification:
    name: Run spread certification replay
    needs: [deployment-readback, spread-forward]
    if: >-
      always() &&
      needs.deployment-readback.result == 'success' &&
      needs.deployment-readback.outputs.deploy_pending != 'true' &&
      needs.deployment-readback.outputs.already_accepted != 'true' &&
      needs.spread-forward.result == 'success'
    uses: ./.github/workflows/wow-v17-spread-certification-replay.yml
    secrets: inherit

  priority-props:
    name: Run bounded priority prop smoke
    needs: [deployment-readback, spread-forward, spread-certification]
    if: >-
      always() &&
      needs.deployment-readback.result == 'success' &&
      needs.deployment-readback.outputs.deploy_pending != 'true' &&
      needs.deployment-readback.outputs.already_accepted != 'true'
    uses: ./.github/workflows/wow-v17-priority-prop-lifecycle.yml
    with:
      post_deploy_smoke: true
    secrets: inherit

  golden-full-slate:
    name: Run post-deploy Golden Path full-slate acceptance
    needs: [deployment-readback, priority-props]
    if: >-
      always() &&
      needs.deployment-readback.result == 'success' &&
      needs.deployment-readback.outputs.deploy_pending != 'true' &&
      needs.deployment-readback.outputs.already_accepted != 'true'
    uses: ./.github/workflows/wow-v17-daily-snapshot.yml
    with:
      post_deploy_acceptance: true
    secrets: inherit

  acceptance-receipts:
    name: Reconcile serialized domain-isolated post-deploy receipts
    needs: [deployment-readback, spread-forward, spread-certification, priority-props, golden-full-slate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: wow-release
    env:
      GH_TOKEN: ${{ github.token }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha }}
      SOURCE_EVENT: ${{ github.event_name }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_KIND: production_observer
      READBACK_RECEIPT: wow-v17-post-deploy-final-readback.json
      WOW_CAN_EXECUTE: "false"
      WOW_DRY_RUN_ONLY: "true"
    steps:
      - name: Publish domain receipt matrix
        shell: bash
        env:
          DEPLOYMENT_READBACK: ${{ needs.deployment-readback.result }}
          ALREADY_ACCEPTED: ${{ needs.deployment-readback.outputs.already_accepted }}
          DEPLOY_PENDING: ${{ needs.deployment-readback.outputs.deploy_pending }}
          SPREAD_FORWARD: ${{ needs.spread-forward.result }}
          SPREAD_CERTIFICATION: ${{ needs.spread-certification.result }}
          PRIORITY_PROPS: ${{ needs.priority-props.result }}
          GOLDEN_FULL_SLATE: ${{ needs.golden-full-slate.result }}
        run: |
          set -euo pipefail
          test "$WOW_CAN_EXECUTE" = "false"
          test "$WOW_DRY_RUN_ONLY" = "true"
          {
            echo "### Serialized domain-isolated post-deploy acceptance"
            echo "| Lane | Result |"
            echo "| --- | --- |"
            echo "| exact-current-main web/worker readback | ${DEPLOYMENT_READBACK} |"
            echo "| spread-forward | ${SPREAD_FORWARD} |"
            echo "| spread-certification | ${SPREAD_CERTIFICATION} |"
            echo "| priority-props | ${PRIORITY_PROPS} |"
            echo "| golden-full-slate | ${GOLDEN_FULL_SLATE} |"
            echo
            echo "terminal_authority=V17_TERMINAL_REDUCER"
            echo "can_execute=false"
            echo "Independent SIRT/model qualification remains required; lane success is not production approval."
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          # Bounded pending deploy: the merged SHA is not live yet, so no
          # acceptance lane ran against stale production. This is a typed
          # PENDING observation, never acceptance; a later observer run past
          # the grace window fails if the deployment never arrives.
          if [ "${DEPLOY_PENDING:-}" = "true" ]; then
            [ "$DEPLOYMENT_READBACK" = "success" ] || failed=1
            echo "READBACK_PENDING_DEPLOY: acceptance lanes deferred until both services are live on the exact SHA; production_verified=false." >> "$GITHUB_STEP_SUMMARY"
            exit "$failed"
          fi

          # Identical deployment (SHA + web/worker deploy IDs) already accepted: lanes not
          # repeated. Only a verified-success readback may take this path.
          if [ "${ALREADY_ACCEPTED:-}" = "true" ]; then
            [ "$DEPLOYMENT_READBACK" = "success" ] || failed=1
            echo "Lanes skipped: this exact deployment already passed all acceptance lanes." >> "$GITHUB_STEP_SUMMARY"
            exit "$failed"
          fi

          # Manual and observer-triggered acceptance require every lane.
          # A skipped readback or full-slate lane is missing evidence.
          for result in "$DEPLOYMENT_READBACK" "$SPREAD_FORWARD" "$SPREAD_CERTIFICATION" "$PRIORITY_PROPS" "$GOLDEN_FULL_SLATE"; do
            [ "$result" = "success" ] || failed=1
          done

          exit "$failed"

      - name: Checkout the previously authenticated SHA for final identity readback
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify checkout still matches accepted SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Reject main or deployment changes during acceptance
        id: final-readback
        run: python artifacts/wow-engine/v17/lean_production_readback.py

      - name: Preserve final observation receipt (independent acceptance still required)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-v17-post-deploy-final-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: wow-v17-post-deploy-final-readback.json
          if-no-files-found: error
          retention-days: 30

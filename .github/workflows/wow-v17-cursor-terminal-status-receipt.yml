name: wow-v17-cursor-terminal-status-receipt

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *' # Read-only check runs even with held writer; mutation separately serialized.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wow-v17-cursor-terminal-status-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terminal-status:
    if: >-
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: wow-engineering
    timeout-minutes: 5
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Collect read-only Cursor run and source receipt
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python artifacts/wow-engine/v17/cursor_terminal_status_receipt.py \
            --receipt "$RUNNER_TEMP/cursor-terminal-status-receipt.json"

      - name: Upload sanitized status receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-cursor-terminal-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cursor-terminal-status-receipt.json
          if-no-files-found: error

  reconcile-terminal-writer:
    needs: terminal-status
    if: >-
      github.repository == 'gregoryharper84-ship-it/WOW-Dashboard' &&
      github.ref == 'refs/heads/main'
    # Collector stays read-only; only this job can mutate the #1138 lease.
    permissions:
      contents: read
      pull-requests: read
      issues: write
    concurrency:
      group: wow-v17-engineering-implementation-single-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: wow-engineering
    timeout-minutes: 5
    steps:
      - name: Checkout protected exact-head reconciliation source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify terminal run, reservation and PR ancestry then release
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python artifacts/wow-engine/v17/cursor_terminal_lease_release.py \
            --receipt "$RUNNER_TEMP/cursor-lease-release-receipt.json"

      - name: Upload terminal lease reconciliation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow-v17-cursor-lease-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cursor-lease-release-receipt.json
          if-no-files-found: error

# ACTIVE production Blueprint only.
# Dormant / approval-gated Agent Runtime Phase 2 resources live in
# render.agent-runtime-phase2.example.yaml and must not be added here until
# their paid Render resources are explicitly approved.
services:
  - type: web
    name: wow-governed-probability-engine
    runtime: python
    plan: free
    region: oregon
    rootDir: artifacts/wow-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_ncaaf_acceptance:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: "checksPass"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: WOW_ACTION_API_KEY
        sync: false
      - key: balldontlie
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: WOW_CLAUDE_RUNTIME_ENABLED
        value: "1"
      - key: WOW_CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: WOW_PROP_SELF_ACCEPTANCE
        value: "1"
      - key: WOW_CALIBRATION_PUBLICATION_LANE_SEPARATION
        value: "1"
      - key: WOW_V17_ACTIVE
        value: "1"
      - key: WOW_PROP_EVIDENCE_ACQUISITION_ENABLED
        # Keep the multi-minute autonomous MLB evidence sweep out of the
        # 512-MB interactive web process. It is forward-cohort evidence only;
        # user-supplied boards continue through canonical score-pick-request
        # hydration. Re-enable only on an isolated governed worker/runtime.
        value: "0"
      - key: WOW_PROP_EVIDENCE_ACQUISITION_INTERVAL_SECONDS
        value: "1800"
      - key: WOW_PROP_EVIDENCE_ACQUISITION_MAX_CANDIDATES
        value: "100"
      - key: WOW_PROP_EVIDENCE_ACQUISITION_FORWARD_DAYS
        value: "2"
      - key: WOW_PROP_LIFECYCLE_AUTOPILOT_ENABLED
        # GitHub's protected-main OIDC workflow is the single scheduler. The
        # endpoint remains installed, but a second in-process cycle must not
        # overlap the externally audited universal cycle.
        value: "0"
      - key: WOW_PROP_LIFECYCLE_AUTOPILOT_INTERVAL_SECONDS
        value: "900"
      - key: WOW_PROP_LIFECYCLE_AUTOPILOT_MAX_SNAPSHOTS_PER_ROUTE
        value: "50"
      - key: WOW_PROP_LIFECYCLE_AUTOPILOT_SETTLEMENT_LIMIT
        value: "500"
      - key: WOW_PROP_LIFECYCLE_AUTOPILOT_INITIAL_DELAY_SECONDS
        value: "45"
      - key: WOW_KALSHI_WEATHER_V2_ACTIVE
        value: "1"
      - key: WOW_KALSHI_WEATHER_EMPIRICAL_COHORT_ENABLED
        value: "1"
      - key: WOW_KALSHI_WEATHER_EMPIRICAL_COHORT_INTERVAL_SECONDS
        value: "900"
      - key: WOW_KALSHI_WEATHER_COHORT_KEY
        sync: false
      - key: WOW_V17_MLB_BRIDGE_SELF_ACCEPTANCE
        value: "1"
      - key: WOW_NCAAF_MARKET_FEED_URL
        sync: false
      - key: WOW_NCAAF_MARKET_FEED_TOKEN
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: WOLFRAM_ALPHA_APP_ID
        sync: false
      - key: WOW_WOLFRAM_ARITHMETIC_AUDIT_ENABLED
        value: "1"
      - key: WOW_WOLFRAM_TIMEOUT_SECONDS
        value: "5"
      - key: WOW_CAN_EXECUTE
        value: "false"
      - key: WOW_DRY_RUN_ONLY
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: WOW_ENVIRONMENT
        value: "production"

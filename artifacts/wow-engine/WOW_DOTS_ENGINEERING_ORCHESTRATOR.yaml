contract_version: 2
identity: WOW_DOTS_ENGINEERING_ORCHESTRATOR
skill_identity: wow.dots-engineering-orchestrator
status: ACTIVE
runtime_generation: V17_ACTIVE
terminal_authority: V17_TERMINAL_REDUCER
custom_gpt_identity: WOW_BETTING_ENGINE
can_execute: false
dry_run_only_no_live_trading_no_market_orders: true

control_plane:
  framework: LANGGRAPH
  change_class: B
  implementation: artifacts/flask-scoring-api/services/wow_engineering_control_plane.py
  graph_name: WOW_V17_ENGINEERING_CONTROL_PLANE
  max_repair_attempts: 3
  parallel_evidence_lanes:
    - DIAGNOSTICS
    - DATA_AUDIT
  join_before_root_cause: true
  test_checkpointer: InMemorySaver
  production_checkpointer: PostgresSaver
  production_checkpoint_env: WOW_ENGINEERING_CHECKPOINT_DB_URI
  checkpoint_strict_msgpack: true
  thread_identity: issue_id
  probability_authority: NONE
  production_promotion_default: false
  class_c_release_allowed: false
  durable_resume_required: true
  trace_events_required: true
  silent_drop_allowed: false

ticket_queue:
  change_class: B
  table: public.wow_engineering_backlog
  implementation: artifacts/flask-scoring-api/services/wow_engineering_ticket_queue.py
  migration: artifacts/wow-engine/migrations/20261001224500_engineering_ticket_ttl_parking.sql
  execution_state_column: queue_status
  states:
    - ACTIONABLE
    - IN_PROGRESS
    - PARKED
    - COMPLETED
    - FAILED
  parked_reason_column: parked_reason
  parked_context_column: parked_context
  parked_until_column: parked_until
  wake_count_column: wake_count
  claim_owner_column: claim_owner
  claimed_at_column: claimed_at
  claim_rpc: wow_claim_engineering_tickets
  wake_up_mode: ORCHESTRATOR_POLL_QUERY
  intended_poll_interval_seconds: 3600
  external_cron_required: false
  default_batch_size: 5
  max_batch_size: 25
  atomic_claim_required: true
  row_locking: FOR_UPDATE_SKIP_LOCKED
  blocker_recheck_before_execution: true
  cleared_blocker_retains_in_progress_claim: true
  max_wakes: 6
  ttl_seconds:
    api_rate_limit: 900
    upstream_dependency: 3600
    awaiting_pr_review: 14400
  ttl_multiplier: min_wake_count_plus_one_6
  unknown_reason_default_ttl_seconds: 3600
  max_wake_terminal: BLOCKED_WITH_EXACT_REASON
  max_wake_escalation: V17_GOVERNANCE_HUMAN_INTERVENTION
  probability_authority: NONE
  can_execute: false

delegation:
  skill: wow-autonomous-product-qa-engineering-recovery
  canonical_workflow:
    - REPORTER_INTAKE
    - RESEARCH_TRIAGE
    - ENGINEERING
    - INDEPENDENT_REVIEW
    - QA_VERIFICATION
    - RELEASE_OBSERVABILITY
    - REPORTER_CLOSURE
  langgraph_expansion:
    - REPORTER_INTAKE
    - RESEARCH_TRIAGE
    - DIAGNOSTICS
    - DATA_AUDIT
    - ROOT_CAUSE
    - ENGINEERING
    - SANDBOX_TEST
    - V17_GOVERNANCE
    - INDEPENDENT_REVIEW
    - GOVERNANCE_GATE
    - RELEASE_OBSERVABILITY
    - QA_VERIFICATION
    - REPORTER_CLOSURE
  self_approval_allowed: false
  production_fix_requires_qa: true
  production_fix_requires_production_verification: true

platform:
  default_mode: WORK_SURROGATE
  supported_modes:
    - WORK_SURROGATE
    - DOTS_NATIVE
  dots_native_requires:
    - account_workspace_access_proven
  unproven_native_access_behavior: WORK_SURROGATE
  native_mode_may_change_probability_governance: false

probability_governance:
  exactly_one_controlling_fitted_specialist: true
  orchestrator_may_originate_probability: false
  orchestrator_may_substitute_probability: false
  orchestrator_may_blend_probability: false
  orchestrator_may_override_probability: false
  orchestrator_may_publish_probability: false
  forbidden_probability_substitutes:
    - sportsbook_implied_probability
    - no_vig_market_probability
    - scout_research
    - recent_results
    - external_projection
    - market_consensus
    - generic_llm_reasoning
  preserve_typed_failures_exactly: true
  model_unavailable_is_catch_all: false

priority:
  severity_order:
    - P0
    - P1
    - P2
    - P3
  class_order_while_degraded:
    - governed_scoring_safety_reconciliation_publication
    - ci_deploy_runtime_verification
    - evidence_identity_hydration_persistence_handoffs
    - reliability_observability_recurrence_prevention
    - model_improvement_experiments
    - new_features
  blocked_item_stalls_independent_queue: false
  resume_existing_before_duplicate_creation: true
  deduplicate_before_create: true

change_classes:
  A: ordinary_reliability_non_probability
  B: orchestration_routing_hydration_registration_persistence_reconciliation_data_integration
  C: probability_producing_math_artifacts_coefficients_distributions_calibration_bounds_thresholds
  dots_orchestration_class: B
  class_c_requires:
    - challenger
    - historical_replay
    - counterexample_review
    - holdout_or_forward_validation
    - regression
    - governed_review

terminal_dispositions:
  - FIXED_AND_VERIFIED
  - PR_CREATED
  - EXPERIMENT_CREATED
  - DUPLICATE
  - NOT_REPRODUCIBLE
  - BLOCKED_WITH_EXACT_REASON
  - DEFERRED_WITH_JUSTIFICATION

connectors:
  GitHub:
    role: canonical_code_ci_issue_pr_source
    default_access: read_then_governed_write
    protected_branch_bypass_allowed: false
  Render:
    role: deployment_runtime_health_logs_metrics
    exact_sha_verification_required: true
  Supabase:
    role: operational_prediction_evidence_learning_state
    default_access: least_privilege
    destructive_or_secret_mutation_allowed: false
  Files:
    role: supporting_evidence_and_artifacts
  Communications:
    role: handoffs_and_operator_receipts
    may_manufacture_closure: false

hard_boundaries:
  examples:
    - native_dots_access_unavailable_or_unproven
    - live_custom_gpt_editor_access_unavailable
    - workspace_or_admin_approval_required
    - external_provider_outage_without_safe_governed_fallback
    - production_permission_unavailable
    - class_c_promotion_awaiting_governed_review
  exact_terminal: BLOCKED_WITH_EXACT_REASON
  require_smallest_remaining_action: true
  continue_independent_queue: true

receipt_fields:
  - PLATFORM_MODE
  - OPEN_AT_START
  - NEW_INCIDENTS
  - ACTIVE_ITEM
  - FIXED_AND_VERIFIED
  - PRS_CREATED
  - PRS_MERGED
  - DEPLOYS_VERIFIED
  - HARD_BLOCKED
  - UNFINISHED
  - REGRESSIONS
  - EXPERIMENTS
  - NEXT_ACTIONS
  - CAN_EXECUTE
  - TERMINAL_AUTHORITY

activation:
  repository_build_complete_requires:
    - supervisor_skill_merged
    - machine_readable_contract_merged
    - langgraph_control_plane_merged
    - langgraph_regression_tests_green
    - pilot_acceptance_receipt_merged
  operational_mode_until_native_access_proven: WORK_SURROGATE
  switch_to_dots_native_changes_only_platform_mode: true

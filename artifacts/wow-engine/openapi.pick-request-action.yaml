openapi: 3.1.0
info:
  title: WOW Pick Request Action
  version: 1.2.0
  description: Governed analytical ingress plus immutable write-before-display and settlement traceability. This action never places, routes, modifies, or cancels wagers. can_execute is always false.
servers:
  - url: https://REPLACE_WITH_RENDER_SERVICE_HOST
paths:
  /score-pick-request:
    post:
      operationId: scoreWowPickRequest
      summary: Normalize, hydrate, freeze, and score a batch of prop candidates
      description: >-
        Each row terminates independently as COMPLETED, HELD, or REJECTED.
        Unsupported model routes fail closed and one invalid row cannot erase valid
        siblings. The caller may supply auditable raw pregame evidence, or omit
        evidence when the exact sport/stat route has certified backend automatic
        hydration. Missing evidence never authorizes a qualitative or L5/L10
        fallback. Probabilities, model artifacts, calibration outputs, edge, and
        approval labels are always backend-owned. can_execute=false.
      security:
        - actionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickRequestBatch'
      responses:
        '200':
          description: Row-isolated governed batch result with exact reconciliation.
          content:
            application/json:
              schema:
                type: object
                required: [rows_in, rows_completed, rows_held, rows_rejected, reconciliation_pass, rows, can_execute]
                properties:
                  request_id: {type: [string, 'null']}
                  run_controller_status:
                    type: string
                    enum: [COMPLETE, DEGRADED, BLOCKED]
                  rows_in: {type: integer}
                  rows_completed: {type: integer}
                  rows_held: {type: integer}
                  rows_rejected: {type: integer}
                  reconciliation_pass: {type: boolean}
                  telemetry:
                    type: object
                    additionalProperties: true
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  can_execute:
                    type: boolean
                    const: false
                additionalProperties: true
        '401':
          description: Missing, malformed, or incorrect Action credential.
        '422':
          description: Batch request shape is invalid.
  /record-recommendations:
    post:
      operationId: recordWowRecommendations
      summary: Persist every terminal WOW recommendation before display
      description: >-
        Mandatory write-before-display contract for cross-sport recommendations.
        The caller must not display a recommendation unless display_authorized=true.
        Research-only and blocked rows are recorded without entering governed
        probability calibration tables. can_execute=false.
      security:
        - actionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationBatch'
      responses:
        '200':
          description: All rows are durably recorded and may be displayed.
        '401':
          description: Missing, malformed, or incorrect Action credential.
        '422':
          description: Invalid or non-pregame recommendation contract.
        '503':
          description: Ledger write is missing or unproven; display is not authorized.
  /settle-recommendations:
    post:
      operationId: settleWowRecommendations
      summary: Link settled results and position economics to displayed recommendations
      security:
        - actionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationSettlementBatch'
      responses:
        '200':
          description: Settlement rows were durably linked and reconciled.
        '401':
          description: Missing, malformed, or incorrect Action credential.
        '422':
          description: A referenced recommendation record does not exist.
        '503':
          description: Settlement write failed.
components:
  securitySchemes:
    actionBearer:
      type: http
      scheme: bearer
      bearerFormat: WOW_ACTION_API_KEY
  schemas:
    RecommendationBatch:
      type: object
      additionalProperties: false
      required: [research_run_id, host_identity, model_identity, source_type, rows]
      properties:
        research_run_id: {type: string}
        request_id: {type: [string, 'null']}
        host_identity: {type: string}
        model_identity: {type: string}
        source_type: {type: string}
        source_conversation_ref: {type: [string, 'null']}
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RecommendationRow'
    RecommendationRow:
      type: object
      additionalProperties: false
      required: [row_key, sport, event_id, event_start_time, participant, selection, terminal_label]
      properties:
        row_key: {type: string}
        sport: {type: string}
        league: {type: [string, 'null']}
        event_id: {type: string}
        event_start_time: {type: string, format: date-time}
        participant: {type: string}
        opponent: {type: [string, 'null']}
        market_family: {type: string, default: OUTRIGHT_WINNER}
        selection: {type: string}
        terminal_label: {type: string}
        probability_publishable: {type: boolean, default: false}
        model_probability: {type: [number, 'null'], exclusiveMinimum: 0, exclusiveMaximum: 1}
        calibrated_probability: {type: [number, 'null'], exclusiveMinimum: 0, exclusiveMaximum: 1}
        calibrated_probability_lower_bound: {type: [number, 'null'], exclusiveMinimum: 0, exclusiveMaximum: 1}
        governed_prediction_table: {type: [string, 'null']}
        governed_prediction_id: {type: [string, 'null'], format: uuid}
        source_snapshot_id: {type: [string, 'null'], format: uuid}
        evidence_fingerprint: {type: [string, 'null']}
        blockers:
          type: array
          items: {type: string}
        display_payload:
          type: object
          additionalProperties: true
    RecommendationSettlementBatch:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RecommendationSettlementRow'
    RecommendationSettlementRow:
      type: object
      additionalProperties: false
      required: [recommendation_record_id, settled_at, settled_result, settlement_source]
      properties:
        recommendation_record_id: {type: string, format: uuid}
        settled_at: {type: string, format: date-time}
        settled_result: {type: string, enum: [WIN, LOSS, PUSH, VOID]}
        official_result: {type: [string, 'null']}
        settlement_source: {type: string}
        settlement_evidence_ref: {type: [string, 'null']}
        position_reference: {type: [string, 'null']}
        position_structure: {type: [string, 'null']}
        underlying_market_count: {type: [integer, 'null'], minimum: 1}
        entry_cost: {type: [number, 'null'], minimum: 0}
        payout: {type: [number, 'null'], minimum: 0}
        profit_loss: {type: [number, 'null']}
        displayed_roi: {type: [number, 'null']}
    PickRequestBatch:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        request_id: {type: [string, 'null']}
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PickRequestRow'
    PickRequestRow:
      type: object
      additionalProperties: false
      required: [event_id, event_start_time, sport, player, stat_type, line, direction]
      properties:
        row_key: {type: [string, 'null']}
        event_id: {type: string}
        event_start_time: {type: string, format: date-time}
        sport: {type: string}
        player: {type: string}
        stat_type: {type: string}
        line: {type: number}
        direction: {type: string, enum: [MORE, LESS]}
        source_type:
          type: string
          enum: [SCREENSHOT, PDF, AUTONOMOUS_DISCOVERY, PASTED_BOARD, NORMALIZED]
          default: NORMALIZED
        platform: {type: [string, 'null']}
        league: {type: [string, 'null']}
        opponent: {type: [string, 'null']}
        source_capture_timestamp:
          type: [string, 'null']
          format: date-time
        seed: {type: integer, default: 0}
        money_lane_status: {type: string, default: PAYOUT_UNRESOLVED}
        market_side_a: {type: [object, 'null'], additionalProperties: true}
        market_side_b: {type: [object, 'null'], additionalProperties: true}
        evidence:
          anyOf:
            - $ref: '#/components/schemas/RawPropEvidence'
            - type: 'null'
          description: >-
            Optional auditable raw pregame evidence. Omit or use null only when the
            backend supports certified automatic hydration for the exact route.
    RawPropEvidence:
      type: object
      additionalProperties: false
      required: [captured_at, game_log, box_score_log, role_status, role_timestamp, opportunity_ledger, source_timestamps, rate_provenance]
      properties:
        captured_at: {type: string, format: date-time}
        game_log:
          type: array
          minItems: 10
          items: {type: number}
        box_score_log:
          type: array
          minItems: 10
          items:
            type: object
            minProperties: 1
            additionalProperties: true
        role_status:
          type: object
          minProperties: 1
          additionalProperties: true
        role_timestamp: {type: string, format: date-time}
        opportunity_ledger:
          type: object
          minProperties: 1
          additionalProperties: true
        source_timestamps:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            format: date-time
        evidence_version: {type: string, default: PROP_EVIDENCE_V1}
        rate_provenance: {type: string}

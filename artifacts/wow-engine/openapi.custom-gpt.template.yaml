openapi: 3.1.0
info:
  title: WOW Governed Probability Engine Action
  version: 1.2.0
  description: >-
    Custom GPT Action contract for the external governed WOW probability backend.
    This API is analytical only. It never places, routes, modifies, or cancels a
    wager. can_execute remains false. Read /governance before governed scoring.
    A fail-closed 409 must never be bypassed with a qualitative, manual, market-only,
    or wrong-contract scoring route.
servers:
  - url: https://REPLACE_WITH_RENDER_SERVICE_HOST
    description: Replace with the exact HTTPS Render service origin after deployment.
paths:
  /health:
    get:
      operationId: getWowProbabilityHealth
      summary: Check backend host health
      description: Public, read-only host and provider health check.
      responses:
        '200':
          description: Backend health state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /governance:
    get:
      operationId: getWowProbabilityGovernance
      summary: Read governed probability capability state
      description: >-
        Public and read-only. Call this before governed scoring. If
        governed_probability_capability is not AVAILABLE or probability_publishable
        is not true, preserve the returned hold state. Do not invent a governed
        probability.
      responses:
        '200':
          description: Current deployment, calibration, runtime-capability, ratification, and publication state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  governed_probability_capability:
                    type: string
                    enum: [UNAVAILABLE, AVAILABLE]
                  governed_probability_status:
                    type: string
                  deployment_contract_status:
                    type: string
                  calibration_health_status:
                    type: string
                  calibration_health_assessed_at:
                    type: [string, 'null']
                    format: date-time
                  runtime_capability_status:
                    type: string
                  runtime_capability_updated_at:
                    type: [string, 'null']
                    format: date-time
                  ratification_status:
                    type: string
                  ratification_id:
                    type: [string, 'null']
                  ratification_created_at:
                    type: [string, 'null']
                    format: date-time
                  production_feature_ready:
                    type: boolean
                  probability_publishable:
                    type: boolean
                  can_execute:
                    type: boolean
                  patch_id:
                    type: string
                  patch_revision:
                    type: string
                  note:
                    type: string
                additionalProperties: true
  /score-prop:
    post:
      operationId: scoreWowProp
      summary: Score one supported prop through the governed probability pipeline
      description: >-
        Authenticated analytical prop scoring only. Never use this operation for
        team/event moneylines. A 409 is a governed hold, not permission to retry
        through a qualitative or invented-probability fallback. This operation
        does not place or authorize a wager.
      security:
        - actionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScorePropRequest'
      responses:
        '200':
          description: Complete publishable governed prop probability row persisted by the backend.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing, malformed, or incorrect Action credential.
        '409':
          description: Governed prop probability capability is unavailable; fail closed.
        '422':
          description: Candidate failed publication requirements; probability remains non-publishable.
        '501':
          description: Real fitted sport/stat parameters are not registered.
  /score-event:
    post:
      operationId: scoreWowEvent
      summary: Score one MLB full-game outright-winner event through the governed event lane
      description: >-
        Authenticated analytical MLB event contract. A 200 response has two governed
        modes. REAL_FITTED_MODEL_PATH_PROVEN is a held fitted-model proof and contains
        no numeric probability fields. GOVERNED_PROBABILITY_PUBLISHED may contain
        numeric event probabilities only after all live deployment, calibration,
        runtime-capability, ratification, latest-material-snapshot, official-lineup,
        and post-lineup-score gates pass. Both modes keep can_execute=false. A 409 is
        a fail-closed event/model/evidence hold and must not be bypassed through
        /score-prop or a manual/market-only estimate labeled as governed output.
      security:
        - actionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreEventRequest'
      responses:
        '200':
          description: >-
            Governed held-model proof or separately ratified publishable MLB event
            probability. Inspect code, probability_fields_withheld,
            probability_publishable, and can_execute before using the response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing, malformed, or incorrect Action credential.
        '409':
          description: >-
            Event identity, model evidence, material freshness, lineup freshness,
            calibration, runtime capability, or ratification is held/blocked.
            No fail-open alternate route is permitted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Event identity, market family, settlement, slate, or request contract is invalid.
        '500':
          description: Backend blocked a held-probability leak or an invalid publishable numeric contract.
        '503':
          description: Governed event bridge is unavailable or returned an invalid backend payload.
  /settle:
    post:
      operationId: settleWowPrediction
      summary: Attach an official result to an existing governed prop prediction
      description: >-
        Authenticated outcome-recording operation for an already-created prop
        prediction. It does not place, route, modify, or cancel a wager and must
        only be used with a verified official result. Event settlement uses a
        separate event-outcome contract in a future certified phase.
      security:
        - actionBearer: []
      parameters:
        - name: prediction_id
          in: query
          required: true
          schema:
            type: string
          description: Existing WOW prop prediction identifier.
        - name: official_result
          in: query
          required: true
          schema:
            type: string
          description: Verified official result label.
        - name: actual_stat
          in: query
          required: true
          schema:
            type: number
          description: Verified realized value for the scored statistic.
        - name: hit
          in: query
          required: true
          schema:
            type: boolean
          description: Whether the frozen prop prediction side hit under its settlement rules.
      responses:
        '200':
          description: Outcome row recorded successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing, malformed, or incorrect Action credential.
components:
  securitySchemes:
    actionBearer:
      type: http
      scheme: bearer
      bearerFormat: WOW_ACTION_API_KEY
  schemas:
    ScorePropRequest:
      type: object
      required:
        - event_id
        - event_start_time
        - sport
        - stat_type
        - line
        - direction
        - source_snapshot_id
      properties:
        event_id:
          type: string
        event_start_time:
          type: string
          format: date-time
          description: Exact event start time with timezone.
        sport:
          type: string
        player:
          type: [string, 'null']
        stat_type:
          type: string
        line:
          type: number
        direction:
          type: string
          description: Exact governed candidate direction, such as MORE or LESS.
        source_snapshot_id:
          type: string
          description: Immutable identifier for the evidence snapshot used by the model.
        seed:
          type: integer
          default: 0
        money_lane_status:
          type: string
          default: PAYOUT_UNRESOLVED
    EventMarketPrior:
      type: object
      additionalProperties: false
      required:
        - home_probability
        - away_probability
        - timestamp
      properties:
        home_probability:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        away_probability:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        timestamp:
          type: string
          format: date-time
        quality:
          type: [string, 'null']
        source:
          type: [string, 'null']
      description: >-
        Optional current two-way no-vig market prior. This is context/prior evidence,
        not permission to synthesize a model probability when the fitted MLB model is unavailable.
    ScoreEventRequest:
      type: object
      additionalProperties: false
      required:
        - research_run_id
        - requested_slate_date
        - requested_timezone
        - scan_stage
        - event_key
        - official_event_id
        - event_start_time_utc
        - sport
        - league
        - market_family
        - settlement_basis
        - home_team
        - away_team
        - venue
        - home_starting_pitcher
        - away_starting_pitcher
        - home_starter_status
        - away_starter_status
        - home_lineup_status
        - away_lineup_status
        - source_snapshot_id
      properties:
        research_run_id:
          type: string
        requested_slate_date:
          type: string
          format: date
        requested_timezone:
          type: string
        scan_stage:
          type: string
          enum: [PREGAME]
        event_key:
          type: string
        official_event_id:
          type: string
        event_start_time_utc:
          type: string
          format: date-time
        sport:
          type: string
          enum: [MLB]
        league:
          type: string
          enum: [MLB]
        market_family:
          type: string
          enum: [OUTRIGHT_WINNER]
        settlement_basis:
          type: string
          enum: [FULL_GAME_INCLUDING_EXTRA_INNINGS]
        home_team:
          type: string
        away_team:
          type: string
        venue:
          type: string
        home_starting_pitcher:
          type: string
        away_starting_pitcher:
          type: string
        home_starter_status:
          type: string
        away_starter_status:
          type: string
        home_lineup_status:
          type: string
        away_lineup_status:
          type: string
        latest_material_update_timestamp:
          type: [string, 'null']
          format: date-time
        source_snapshot_id:
          type: string
          format: uuid
        market_prior:
          anyOf:
            - $ref: '#/components/schemas/EventMarketPrior'
            - type: 'null'

openapi: 3.1.0
info:
  title: LLP Team Betting Engine v17 Action
  version: 17.0.0
  description: >-
    PRODUCTION SOURCE CONTRACT. LLP Team Betting Engine owns team/game/event
    winner, favorite, underdog, upset and governed point-spread intelligence.
    It has no player-prop scoring operation. Shared market, portfolio and global
    terminal authority remain in the WOW governed core. Install this schema in
    the live LLP Custom GPT editor when editor access is available.
    can_execute is always false.
servers:
  - url: https://wow-governed-probability-engine.onrender.com
paths:
  /health:
    get:
      operationId: getLlpV17BackendHealth
      x-openai-isConsequential: false
      responses:
        '200': {description: Backend health state}
  /governance:
    get:
      operationId: getLlpV17Governance
      x-openai-isConsequential: false
      responses:
        '200': {description: Governed capability state}
  /v17/host-contract:
    get:
      operationId: getLlpV17HostContract
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      responses:
        '200': {description: Canonical v17 host/lane alignment contract}
        '401': {description: Authentication failed}
  /v17/daily-snapshot-run:
    post:
      operationId: runLlpV17FullSlate
      x-openai-isConsequential: false
      description: >-
        Canonical governed all-sports outright-winner board scan for LLP. This
        Action is MONEYLINE-only, retains every discovered row through typed
        reconciliation, and never substitutes provider or market probability for
        a fitted specialist. Use this before ranking an across-all-sports request.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LlpFullSlateRequest'}
      responses:
        '200': {description: Full governed Daily moneyline receipt including held rows and cross-sport reconciliation}
        '401': {description: Authentication failed}
        '422': {description: Invalid full-slate request}
  /v17/daily-snapshot-run/{run_id}/rows:
    get:
      operationId: readLlpV17FullSlateRows
      x-openai-isConsequential: false
      description: >-
        Read a bounded page of persisted full per-row evidence for the governed
        all-sports Daily run. Read-only; can_execute remains false.
      security: [{actionBearer: []}]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 25, default: 5}
      responses:
        '200': {description: One page of full all-sports row evidence}
        '401': {description: Authentication failed}
  /score-team-event:
    post:
      operationId: scoreLlpV17TeamEvent
      x-openai-isConsequential: false
      description: >-
        Canonical outright-winner team/event scoring ingress for
        LLP_TEAM_BETTING_ENGINE. Unregistered fitted routes fail closed as
        MODEL_UNAVAILABLE; no market/generic probability substitution. Spread
        scoring remains separate.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LlpTeamEventRequest'}
      responses:
        '200': {description: Governed team/event result or held model proof}
        '401': {description: Authentication failed}
        '409': {description: Controlling model/capability unavailable}
        '422': {description: Event/evidence/host contract invalid}
  /internal/v17/spread-forward-shadow:
    post:
      operationId: scoreLlpV17SpreadForwardShadow
      x-openai-isConsequential: false
      description: >-
        Research-only NCAAF exact-line spread forward shadow. Does not certify,
        promote, publish, rank, or execute. Exact spread is a post-fit threshold
        only; no moneyline-to-spread or market-probability substitution.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpreadForwardShadowRequest'}
      responses:
        '200': {description: Research-only fitted spread challenger shadow result or typed blocker}
        '401': {description: Authentication failed}
        '422': {description: Invalid NCAAF exact-line shadow request}
  /internal/v17/nfl-spread-forward-shadow:
    post:
      operationId: scoreLlpV17NFLSpreadForwardShadow
      x-openai-isConsequential: false
      description: >-
        Research-only NFL exact-line spread forward shadow using a fitted margin
        distribution. Does not certify, promote, publish, rank, or execute. Exact
        spread is a post-fit threshold; no market-probability substitution.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NFLSpreadForwardShadowRequest'}
      responses:
        '200': {description: Research-only NFL fitted spread shadow result or typed blocker}
        '401': {description: Authentication failed}
        '422': {description: Invalid NFL exact-line shadow request}
  /internal/v17/wnba-spread-forward-shadow:
    post:
      operationId: scoreLlpV17WNBASpreadForwardShadow
      x-openai-isConsequential: false
      description: >-
        Research-only WNBA exact-line spread forward shadow using verified ESPN
        event/team identity and a fitted margin distribution. Does not certify,
        promote, publish, rank, or execute; no market-probability substitution.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WNBASpreadForwardShadowRequest'}
      responses:
        '200': {description: Research-only WNBA fitted spread shadow result or typed blocker}
        '401': {description: Authentication failed}
        '422': {description: Invalid WNBA exact-line shadow request}
  /internal/v17/mlb-run-line-forward-shadow:
    post:
      operationId: scoreLlpV17MLBRunLineForwardShadow
      x-openai-isConsequential: false
      description: >-
        Research-only MLB exact run-line forward shadow using an immutable
        pregame score snapshot and fitted margin distribution. Does not certify,
        promote, publish, rank, or execute; no market-probability substitution.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MLBRunLineForwardShadowRequest'}
      responses:
        '200': {description: Research-only MLB fitted run-line shadow result or typed blocker}
        '401': {description: Authentication failed}
        '422': {description: Invalid MLB exact run-line shadow request}
  /record-recommendations:
    post:
      operationId: recordLlpV17Recommendations
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationBatch'}
      responses:
        '200': {description: Terminal recommendation records persisted}
        '503': {description: Write-before-display not proven}
  /settle-recommendations:
    post:
      operationId: settleLlpV17Recommendations
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationBatch'}
      responses:
        '200': {description: Linked recommendation settlement recorded}
        '409': {description: Settlement timing or integrity blocked}
components:
  securitySchemes:
    actionBearer:
      type: http
      scheme: bearer
  schemas:
    LlpFullSlateRequest:
      type: object
      additionalProperties: false
      required: [requested_slate_date, requested_timezone, lanes, max_props, max_team_events, response_mode]
      properties:
        requested_slate_date: {type: string, format: date}
        requested_timezone: {type: string, minLength: 1, maxLength: 64}
        lanes:
          type: array
          minItems: 1
          maxItems: 1
          items: {type: string, enum: [MONEYLINE]}
        max_props: {type: integer, enum: [0]}
        max_team_events: {type: integer, minimum: 1, maximum: 12}
        response_mode: {type: string, enum: [FULL]}
    SpreadForwardShadowRequest:
      type: object
      additionalProperties: false
      required: [sport, event_id, event_start_time, home_team, away_team, home_spread, season]
      properties:
        sport: {type: string, enum: [NCAAF]}
        event_id: {type: string, minLength: 1, maxLength: 128}
        event_start_time: {type: string, format: date-time}
        home_team: {type: string, minLength: 1, maxLength: 160}
        away_team: {type: string, minLength: 1, maxLength: 160}
        home_spread: {type: number, exclusiveMinimum: -100, exclusiveMaximum: 100}
        season: {type: integer, minimum: 2000, maximum: 2100}
    NFLSpreadForwardShadowRequest:
      type: object
      additionalProperties: false
      required: [sport, event_id, event_start_time, home_team, away_team, home_spread]
      properties:
        sport: {type: string, enum: [NFL]}
        event_id: {type: string, minLength: 1, maxLength: 128}
        event_start_time: {type: string, format: date-time}
        home_team: {type: string, minLength: 1, maxLength: 160}
        away_team: {type: string, minLength: 1, maxLength: 160}
        home_spread: {type: number, exclusiveMinimum: -30, exclusiveMaximum: 30}
    WNBASpreadForwardShadowRequest:
      type: object
      additionalProperties: false
      required: [sport, event_id, event_start_time, home_team_id, away_team_id, home_spread]
      properties:
        sport: {type: string, enum: [WNBA]}
        event_id: {type: string, pattern: '^espn-.+$', maxLength: 128}
        event_start_time: {type: string, format: date-time}
        home_team_id: {type: string, pattern: '^espn-.+$', maxLength: 128}
        away_team_id: {type: string, pattern: '^espn-.+$', maxLength: 128}
        home_spread: {type: number, exclusiveMinimum: -20, exclusiveMaximum: 20}
    MLBRunLineForwardShadowRequest:
      type: object
      additionalProperties: false
      required: [sport, score_snapshot_id, home_run_line]
      properties:
        sport: {type: string, enum: [MLB]}
        score_snapshot_id: {type: string, minLength: 1, maxLength: 128}
        home_run_line: {type: number, exclusiveMinimum: -10, exclusiveMaximum: 10}
    RecommendationBatch:
      type: object
      additionalProperties: true
      required: [records]
      properties:
        records:
          type: array
          items: {type: object, additionalProperties: true}
    LlpTeamEventRequest:
      type: object
      additionalProperties: false
      required:
        - requester_host_identity
        - research_run_id
        - requested_slate_date
        - requested_timezone
        - scan_stage
        - candidate_family
        - decision_intent
        - event_key
        - official_event_id
        - event_start_time_utc
        - sport
        - league
        - market_family
        - settlement_basis
        - home_team
        - away_team
        - source_snapshot_id
      properties:
        requester_host_identity: {type: string, enum: [LLP_TEAM_BETTING_ENGINE]}
        research_run_id: {type: string}
        requested_slate_date: {type: string, format: date}
        requested_timezone: {type: string}
        scan_stage: {type: string, enum: [PREGAME]}
        candidate_family:
          type: string
          enum: [TEAM_EVENT, OUTRIGHT_WINNER, MONEYLINE, FAVORITE, UNDERDOG, UPSET, MATCH_WINNER, FIGHT_WINNER]
        decision_intent: {type: string, enum: [WINNER, FAVORITE, UNDERDOG, UPSET, BEST_SIDE]}
        event_key: {type: string}
        official_event_id: {type: string}
        event_start_time_utc: {type: string, format: date-time}
        sport: {type: string}
        league: {type: string}
        market_family: {type: string, enum: [OUTRIGHT_WINNER]}
        settlement_basis: {type: string}
        home_team: {type: string}
        away_team: {type: string}
        source_snapshot_id: {type: string}
        latest_material_update_timestamp: {type: [string, 'null'], format: date-time}
        market_prior: {type: [object, 'null'], additionalProperties: true}
        sport_specific_evidence: {type: object, additionalProperties: true}

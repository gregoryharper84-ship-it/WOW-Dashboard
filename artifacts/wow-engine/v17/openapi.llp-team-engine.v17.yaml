openapi: 3.1.0
info:
  title: LLP Team Betting Engine v17 Action
  version: 17.0.0
  description: >-
    PRODUCTION SOURCE CONTRACT. LLP Team Betting Engine owns team/game/event
    winner, favorite, underdog, upset and governed point-spread intelligence.
    It has no player-prop scoring operation. Shared market, portfolio and global
    terminal authority remain in the WOW governed core. Install this schema in
    the live LLP Custom GPT editor when editor access is available.
    can_execute is always false.
servers:
  - url: https://wow-governed-probability-engine.onrender.com
paths:
  /health:
    get:
      operationId: getLlpV17BackendHealth
      x-openai-isConsequential: false
      responses:
        '200': {description: Backend health state}
  /governance:
    get:
      operationId: getLlpV17Governance
      x-openai-isConsequential: false
      responses:
        '200': {description: Governed capability state}
  /v17/host-contract:
    get:
      operationId: getLlpV17HostContract
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      responses:
        '200': {description: Canonical v17 host/lane alignment contract}
        '401': {description: Authentication failed}
  /score-team-event:
    post:
      operationId: scoreLlpV17TeamEvent
      x-openai-isConsequential: false
      description: >-
        Canonical outright-winner team/event scoring ingress. The request
        identity is fixed to LLP_TEAM_BETTING_ENGINE. A sport without an
        actually registered fitted team/event model and adapter fails closed as
        MODEL_UNAVAILABLE. Market implied probability and generic reasoning may
        not substitute. Point-spread scoring uses the distinct spread shadow
        operation while that lane remains uncertified.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LlpTeamEventRequest'}
      responses:
        '200': {description: Governed team/event result or held model proof}
        '401': {description: Authentication failed}
        '409': {description: Controlling model/capability unavailable}
        '422': {description: Event/evidence/host contract invalid}
  /internal/v17/spread-forward-shadow:
    post:
      operationId: scoreLlpV17SpreadForwardShadow
      x-openai-isConsequential: false
      description: >-
        Research-only NCAAF exact-line spread forward shadow owned by the LLP
        team/event lane. This surface does not certify, promote, publish, rank
        as production, or execute a spread probability. The exact spread is a
        post-fit threshold only; no moneyline-to-spread or market-probability
        substitution is allowed.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpreadForwardShadowRequest'}
      responses:
        '200': {description: Research-only fitted spread challenger shadow result or typed blocker}
        '401': {description: Authentication failed}
        '422': {description: Invalid NCAAF exact-line shadow request}
  /record-recommendations:
    post:
      operationId: recordLlpV17Recommendations
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationBatch'}
      responses:
        '200': {description: Terminal recommendation records persisted}
        '503': {description: Write-before-display not proven}
  /settle-recommendations:
    post:
      operationId: settleLlpV17Recommendations
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationBatch'}
      responses:
        '200': {description: Linked recommendation settlement recorded}
        '409': {description: Settlement timing or integrity blocked}
components:
  securitySchemes:
    actionBearer:
      type: http
      scheme: bearer
  schemas:
    SpreadForwardShadowRequest:
      type: object
      additionalProperties: false
      required: [sport, event_id, event_start_time, home_team, away_team, home_spread, season]
      properties:
        sport: {type: string, enum: [NCAAF]}
        event_id: {type: string, minLength: 1, maxLength: 128}
        event_start_time: {type: string, format: date-time}
        home_team: {type: string, minLength: 1, maxLength: 160}
        away_team: {type: string, minLength: 1, maxLength: 160}
        home_spread: {type: number, exclusiveMinimum: -100, exclusiveMaximum: 100}
        season: {type: integer, minimum: 2000, maximum: 2100}
    RecommendationBatch:
      type: object
      additionalProperties: true
      required: [records]
      properties:
        records:
          type: array
          items: {type: object, additionalProperties: true}
    LlpTeamEventRequest:
      type: object
      additionalProperties: false
      required:
        - requester_host_identity
        - research_run_id
        - requested_slate_date
        - requested_timezone
        - scan_stage
        - candidate_family
        - decision_intent
        - event_key
        - official_event_id
        - event_start_time_utc
        - sport
        - league
        - market_family
        - settlement_basis
        - home_team
        - away_team
        - source_snapshot_id
      properties:
        requester_host_identity: {type: string, enum: [LLP_TEAM_BETTING_ENGINE]}
        research_run_id: {type: string}
        requested_slate_date: {type: string, format: date}
        requested_timezone: {type: string}
        scan_stage: {type: string, enum: [PREGAME]}
        candidate_family:
          type: string
          enum: [TEAM_EVENT, OUTRIGHT_WINNER, MONEYLINE, FAVORITE, UNDERDOG, UPSET, MATCH_WINNER, FIGHT_WINNER]
        decision_intent: {type: string, enum: [WINNER, FAVORITE, UNDERDOG, UPSET, BEST_SIDE]}
        event_key: {type: string}
        official_event_id: {type: string}
        event_start_time_utc: {type: string, format: date-time}
        sport: {type: string}
        league: {type: string}
        market_family: {type: string, enum: [OUTRIGHT_WINNER]}
        settlement_basis: {type: string}
        home_team: {type: string}
        away_team: {type: string}
        source_snapshot_id: {type: string}
        latest_material_update_timestamp: {type: [string, 'null'], format: date-time}
        market_prior: {type: [object, 'null'], additionalProperties: true}
        sport_specific_evidence: {type: object, additionalProperties: true}

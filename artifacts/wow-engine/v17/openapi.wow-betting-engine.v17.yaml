openapi: 3.1.0
info:
  title: WOW Betting Engine v17 Action
  version: 17.0.0
  description: >-
    PRODUCTION SOURCE CONTRACT. WOW Betting Engine owns player/prop/scalar
    intelligence. Team/event requests may originate here but are routed by the
    backend to LLP_TEAM_BETTING_ENGINE as controlling engine. Install this schema
    in the live WOW Custom GPT editor when editor access is available. This API is
    analytical only and can_execute is always false.
servers:
  - url: https://wow-governed-probability-engine.onrender.com
paths:
  /health:
    get:
      operationId: getWowV17BackendHealth
      x-openai-isConsequential: false
      responses:
        '200': {description: Backend health state}
  /governance:
    get:
      operationId: getWowV17Governance
      x-openai-isConsequential: false
      responses:
        '200': {description: Governed capability state}
  /v17/host-contract:
    get:
      operationId: getWowV17HostContract
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      responses:
        '200': {description: Canonical v17 host/lane alignment contract}
        '401': {description: Authentication failed}
  /v17/detailed-evidence-contract:
    get:
      operationId: getWowV17DetailedEvidenceContract
      x-openai-isConsequential: false
      description: >-
        Reports the active V17 detailed-evidence boundary. Research evidence may
        supply typed model/regime/calibration candidates, but only the exact
        controlling specialist adapter grants numerical authority. Market
        evidence is never forwarded as sporting-model evidence.
      security: [{actionBearer: []}]
      responses:
        '200': {description: Active detailed-evidence governance contract}
        '401': {description: Authentication failed}
  /score-prop:
    post:
      operationId: scoreWowV17Prop
      x-openai-isConsequential: false
      description: >-
        WOW player-prop lane only. The X-WOW-Model-Identity header is fixed to
        WOW_BETTING_ENGINE. Never use this route for team/event winners.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScorePropRequest'}
      responses:
        '200': {description: Governed prop model result}
        '401': {description: Authentication failed}
        '409': {description: Governed lane/model capability held}
        '422': {description: Candidate/evidence/model publication contract failed}
  /v17/daily-snapshot-run:
    post:
      operationId: runWowV17DailySnapshot
      x-openai-isConsequential: false
      description: >-
        Canonical bounded Daily runner. The backend selects only governed,
        still-pregame snapshots, scores capped prop and moneyline rows through
        existing V17 ingress, and always returns one terminal receipt. Call
        this first for a V17 Daily request; never schedule row-by-row web
        discovery before it.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DailySnapshotRequest'}
      responses:
        '200': {description: Terminal bounded Daily receipt, including held rows}
        '401': {description: Authentication failed}
  /score-pick-request:
    post:
      operationId: scoreWowV17PickRequest
      x-openai-isConsequential: false
      description: >-
        Canonical prop batch bridge. When caller-owned raw evidence is supplied,
        it may include detailed_evidence using the governed V17 evidence envelope.
        The envelope is frozen into snapshot identity and never substitutes for
        the fitted specialist model.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PickRequestBatch'}
      responses:
        '200': {description: Row-isolated governed prop batch result}
        '401': {description: Authentication failed}
        '422': {description: Batch or detailed-evidence contract invalid}
  /score-team-event:
    post:
      operationId: scoreWowV17TeamEventFromWowHost
      x-openai-isConsequential: false
      description: >-
        Team/event ingress requested by WOW_BETTING_ENGINE. Backend must resolve
        controlling_engine_identity=LLP_TEAM_BETTING_ENGINE. Unsupported sport
        adapters fail closed as MODEL_UNAVAILABLE. Optional rich research is
        namespaced under sport_specific_evidence.v17_detailed_evidence; canonical
        server-owned event/lineup/starter evidence remains authoritative.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamEventRequest'}
      responses:
        '200': {description: Governed LLP-controlled team/event result}
        '401': {description: Authentication failed}
        '409': {description: Sport-specific model unavailable or held}
        '422': {description: Host/event/evidence contract invalid}
  /record-recommendations:
    post:
      operationId: recordWowV17Recommendations
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationBatch'}
      responses:
        '200': {description: Terminal recommendation records persisted}
        '503': {description: Write-before-display not proven}
  /settle-recommendations:
    post:
      operationId: settleWowV17Recommendations
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationBatch'}
      responses:
        '200': {description: Linked recommendation settlement recorded}
        '409': {description: Settlement timing or integrity blocked}
components:
  securitySchemes:
    actionBearer:
      type: http
      scheme: bearer
  schemas:
    ScorePropRequest:
      type: object
      additionalProperties: true
      required: [event_id, event_start_time, sport, stat_type, line, direction, source_snapshot_id]
      properties:
        requester_host_identity: {type: string, enum: [WOW_BETTING_ENGINE], default: WOW_BETTING_ENGINE}
        event_id: {type: string}
        event_start_time: {type: string, format: date-time}
        sport: {type: string}
        league: {type: [string, 'null']}
        player: {type: [string, 'null']}
        stat_type: {type: string}
        line: {type: number}
        direction: {type: string, enum: [MORE, LESS]}
        source_snapshot_id: {type: string}
        seed: {type: integer, default: 0}
        evidence: {type: [object, 'null'], additionalProperties: true}
    DailySnapshotRequest:
      type: object
      additionalProperties: false
      required: [requested_slate_date, requested_timezone]
      properties:
        requested_slate_date: {type: string, format: date}
        requested_timezone: {type: string}
        lanes:
          type: array
          items: {type: string, enum: [PROPS, MONEYLINE]}
          default: [PROPS, MONEYLINE]
        max_props: {type: integer, minimum: 0, maximum: 12, default: 6}
        max_team_events: {type: integer, minimum: 0, maximum: 12, default: 6}
    PickRequestBatch:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        request_id: {type: [string, 'null']}
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/PickRequestRow'}
    PickRequestRow:
      type: object
      additionalProperties: false
      required: [event_id, event_start_time, sport, player, stat_type, line, direction]
      properties:
        row_key: {type: [string, 'null']}
        event_id: {type: string}
        event_start_time: {type: string, format: date-time}
        sport: {type: string}
        player: {type: string}
        stat_type: {type: string}
        line: {type: number}
        direction: {type: string, enum: [MORE, LESS]}
        evidence:
          oneOf:
            - {$ref: '#/components/schemas/RawPropEvidence'}
            - {type: 'null'}
        source_type:
          type: string
          enum: [SCREENSHOT, PDF, AUTONOMOUS_DISCOVERY, PASTED_BOARD, NORMALIZED]
          default: NORMALIZED
        platform: {type: [string, 'null']}
        league: {type: [string, 'null']}
        opponent: {type: [string, 'null']}
        source_capture_timestamp: {type: [string, 'null'], format: date-time}
        seed: {type: integer, default: 0}
        money_lane_status: {type: string, default: PAYOUT_UNRESOLVED}
        market_side_a: {type: [object, 'null'], additionalProperties: true}
        market_side_b: {type: [object, 'null'], additionalProperties: true}
    RawPropEvidence:
      type: object
      additionalProperties: false
      required:
        - captured_at
        - game_log
        - box_score_log
        - role_status
        - role_timestamp
        - opportunity_ledger
        - source_timestamps
        - rate_provenance
      properties:
        captured_at: {type: string, format: date-time}
        game_log:
          type: array
          items: {type: number}
        box_score_log:
          type: array
          items: {type: object, additionalProperties: true}
        role_status: {type: object, additionalProperties: true}
        role_timestamp: {type: string, format: date-time}
        opportunity_ledger: {type: object, additionalProperties: true}
        source_timestamps:
          type: object
          additionalProperties: {type: string, format: date-time}
        evidence_version: {type: string, default: PROP_EVIDENCE_V1}
        rate_provenance: {type: string}
        lineup_evidence: {type: [object, 'null'], additionalProperties: true}
        opponent_context: {type: [object, 'null'], additionalProperties: true}
        detailed_evidence:
          oneOf:
            - {$ref: '#/components/schemas/DetailedEvidenceEnvelope'}
            - {type: 'null'}
    DetailedEvidenceEnvelope:
      type: object
      additionalProperties: true
      required: [candidate_id, sport, event_id, as_of, evidence_families, market_evidence]
      description: >-
        Rich pregame evidence packet. This is evidence, not a probability package.
        Every material item must carry source and as_of provenance and be typed as
        MODEL_INPUT, REGIME_INPUT, CALIBRATION_INPUT, MARKET_EVIDENCE, or
        EVIDENCE_ONLY. MARKET_EVIDENCE and EVIDENCE_ONLY are never forwarded as
        sporting-model numerical feature candidates.
      properties:
        candidate_id: {type: string}
        sport: {type: string}
        event_id: {type: string}
        as_of: {type: string, format: date-time}
        controlling_specialist: {type: [string, 'null']}
        evidence_families:
          type: object
          additionalProperties: true
          description: >-
            Must include recent_form, head_to_head, player_performance,
            lineup_availability_depth, tactical_style, match_context_stakes,
            environment, officiating, schedule_fatigue_travel, and
            advanced_statistics families. Each family records status, sample
            window/size, quality/certainty, and typed items with source/as_of.
        market_evidence:
          type: object
          additionalProperties: true
          description: >-
            Separate downstream market context with market_state EXACT_LINE,
            ADJACENT_LINE, or NO_MARKET. Implied/no-vig probabilities here are
            never governed sporting probabilities.
        source_conflicts:
          type: array
          items: {type: string}
        lineup_certainty: {type: [number, 'null'], minimum: 0, maximum: 1}
        role_certainty: {type: [number, 'null'], minimum: 0, maximum: 1}
        starter_certainty: {type: [number, 'null'], minimum: 0, maximum: 1}
        evidence_quality: {type: [number, 'null'], minimum: 0, maximum: 1}
        notes:
          type: array
          items: {type: string}
    RecommendationBatch:
      type: object
      additionalProperties: true
      required: [records]
      properties:
        records:
          type: array
          items: {type: object, additionalProperties: true}
    TeamEventRequest:
      type: object
      additionalProperties: false
      required:
        - requester_host_identity
        - research_run_id
        - requested_slate_date
        - requested_timezone
        - scan_stage
        - candidate_family
        - decision_intent
        - event_key
        - official_event_id
        - event_start_time_utc
        - sport
        - league
        - market_family
        - settlement_basis
        - home_team
        - away_team
        - source_snapshot_id
      properties:
        requester_host_identity: {type: string}
        research_run_id: {type: string}
        requested_slate_date: {type: string, format: date}
        requested_timezone: {type: string}
        scan_stage: {type: string, enum: [PREGAME]}
        candidate_family:
          type: string
          enum: [TEAM_EVENT, OUTRIGHT_WINNER, MONEYLINE, FAVORITE, UNDERDOG, UPSET, MATCH_WINNER, FIGHT_WINNER]
        decision_intent: {type: string, enum: [WINNER, FAVORITE, UNDERDOG, UPSET, BEST_SIDE]}
        event_key: {type: string}
        official_event_id: {type: string}
        event_start_time_utc: {type: string, format: date-time}
        sport: {type: string}
        league: {type: string}
        market_family: {type: string, enum: [OUTRIGHT_WINNER]}
        settlement_basis: {type: string}
        home_team: {type: string}
        away_team: {type: string}
        source_snapshot_id: {type: string}
        latest_material_update_timestamp: {type: [string, 'null'], format: date-time}
        market_prior: {type: [object, 'null'], additionalProperties: true}
        sport_specific_evidence:
          type: object
          additionalProperties: true
          description: >-
            Sport-specific evidence. For V17 rich research use the
            v17_detailed_evidence key containing a DetailedEvidenceEnvelope.
            Server-owned canonical identity, starters, lineups, venue, and
            lifecycle evidence remain authoritative and cannot be overwritten.

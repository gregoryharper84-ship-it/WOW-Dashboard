openapi: 3.1.0
info:
  title: WOW Betting Engine v17 Action
  version: 17.0.0
  description: >-
    PRODUCTION SOURCE CONTRACT. WOW Betting Engine owns player/prop/scalar
    intelligence. Team/event requests route to LLP_TEAM_BETTING_ENGINE.
    Analytical only; can_execute is always false.
servers:
  - url: https://wow-governed-probability-engine.onrender.com
paths:
  /health:
    get:
      operationId: getWowV17BackendHealth
      x-openai-isConsequential: false
      responses:
        '200': {description: Backend health state}
  /governance:
    get:
      operationId: getWowV17Governance
      x-openai-isConsequential: false
      responses:
        '200': {description: Governed capability state}
  /v17/host-contract:
    get:
      operationId: getWowV17HostContract
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      responses:
        '200': {description: Canonical v17 host/lane alignment contract}
        '401': {description: Authentication failed}
  /v17/detailed-evidence-contract:
    get:
      operationId: getWowV17DetailedEvidenceContract
      x-openai-isConsequential: false
      description: >-
        Reports the V17 detailed-evidence boundary. Only the exact controlling
        specialist adapter grants numerical authority; market evidence remains
        separate from sporting-model inputs.
      security: [{actionBearer: []}]
      responses:
        '200': {description: Active detailed-evidence governance contract}
        '401': {description: Authentication failed}
  /v17/capabilities:
    get:
      operationId: getWowV17Capabilities
      x-openai-isConsequential: false
      description: >-
        Read-only V17 capability matrix. Separates discovery, implementation,
        runtime registration, certification, publication eligibility and execution.
      security: [{actionBearer: []}]
      responses:
        '200': {description: Current V17 capability matrix}
        '401': {description: Authentication failed}
  /v17/market-health/rundown:
    get:
      operationId: getWowV17RundownMarketHealth
      x-openai-isConsequential: false
      description: >-
        Strict TheRundown health probe that requires catalog and event access.
        Market health never substitutes for sporting-model capability.
      security: [{actionBearer: []}]
      parameters:
        - name: sport_key
          in: query
          required: false
          schema: {type: string, default: baseball_mlb}
        - name: date
          in: query
          required: false
          schema: {type: string}
      responses:
        '200': {description: TheRundown catalog plus event endpoint health}
        '401': {description: Authentication failed}
        '422': {description: Invalid date or provider diagnostic request}
  /v17/market-health/odds-api:
    get:
      operationId: getWowV17OddsApiMarketHealth
      x-openai-isConsequential: false
      description: >-
        Read-only fallback-provider health probe. Reports credential/auth/rate state
        without exposing secret values or creating sporting probabilities.
      security: [{actionBearer: []}]
      responses:
        '200': {description: Odds API fallback health state}
        '401': {description: Authentication failed}
  /v17/discovery/espn-compact:
    get:
      operationId: getWowV17CompactEspnDiscovery
      x-openai-isConsequential: false
      description: >-
        Bounded identity-only ESPN discovery fallback. Provider event IDs remain
        aliases until canonical identity resolution and carry no prediction authority.
      security: [{actionBearer: []}]
      parameters:
        - name: sport_key
          in: query
          required: false
          schema: {type: string, default: baseball_mlb}
        - name: date
          in: query
          required: false
          schema: {type: string}
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 250, default: 100}
      responses:
        '200': {description: Compact paginated discovery identities}
        '401': {description: Authentication failed}
        '422': {description: Invalid date or pagination request}
  /score-prop:
    post:
      operationId: scoreWowProp
      x-openai-isConsequential: false
      description: >-
        WOW player-prop lane only. Never use this route for team/event winners.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScorePropRequest'}
      responses:
        '200': {description: Governed prop model result}
        '401': {description: Authentication failed}
        '409': {description: Governed lane/model capability held}
        '422': {description: Candidate/evidence/model publication contract failed}
  /v17/daily-snapshot-run:
    post:
      operationId: runWowV17DailySnapshot
      x-openai-isConsequential: false
      description: >-
        Canonical bounded Daily runner. Scores capped pregame prop and moneyline
        rows and returns one terminal receipt per row. COMPACT by default; read
        full per-row evidence via readWowV17DailySnapshotRowDetail.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DailySnapshotRequest'}
      responses:
        '200': {description: "Terminal bounded Daily receipt, including held rows"}
        '401': {description: Authentication failed}
  /v17/daily-snapshot-run/{run_id}/rows:
    get:
      operationId: readWowV17DailySnapshotRowDetail
      x-openai-isConsequential: false
      description: >-
        Read one bounded page of full per-row evidence for a Daily run, as
        referenced by a compact Daily response. Read-only.
      security: [{actionBearer: []}]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 25, default: 5}
      responses:
        '200': {description: One page of full Daily row evidence}
        '401': {description: Authentication failed}
  /score-pick-request:
    post:
      operationId: scoreWowPickRequest
      x-openai-isConsequential: false
      description: >-
        Canonical prop batch bridge. Caller evidence may include detailed_evidence;
        the envelope is frozen into snapshot identity and never substitutes for
        the fitted specialist model.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PickRequestBatch'}
      responses:
        '200': {description: Row-isolated governed prop batch result}
        '401': {description: Authentication failed}
        '422': {description: Batch or detailed-evidence contract invalid}
  /score-team-event:
    post:
      operationId: scoreWowV17TeamEventFromWowHost
      x-openai-isConsequential: false
      description: >-
        Team/event ingress from WOW_BETTING_ENGINE. Backend resolves
        LLP_TEAM_BETTING_ENGINE as controller. Unsupported sport adapters fail
        closed. Rich research may use v17_detailed_evidence; server identity,
        starters, lineups and venue remain authoritative.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamEventRequest'}
      responses:
        '200': {description: Governed LLP-controlled team/event result}
        '401': {description: Authentication failed}
        '409': {description: Sport-specific model unavailable or held}
        '422': {description: Host/event/evidence contract invalid}
  /v17/prediction-receipts/lookup:
    post:
      operationId: lookupWowV17PredictionReceipts
      x-openai-isConsequential: false
      description: >-
        Read-only immutable pregame prop receipt lookup. Prefer prediction_id;
        supplied identity must agree. Without prediction_id, exact
        event_id/player/stat_type/line/direction is required.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PredictionReceiptLookupBatch'}
      responses:
        '200': {description: Row-isolated immutable prediction receipt lookup}
        '401': {description: Authentication failed}
        '422': {description: Request validation failed}
        '503': {description: Prediction ledger unavailable}
  /record-recommendations:
    post:
      operationId: recordWowV17Recommendations
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationBatch'}
      responses:
        '200': {description: Terminal recommendation records persisted}
        '503': {description: Write-before-display not proven}
  /settle-recommendations:
    post:
      operationId: settleWowV17Recommendations
      x-openai-isConsequential: false
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationBatch'}
      responses:
        '200': {description: Linked recommendation settlement recorded}
        '409': {description: Settlement timing or integrity blocked}
  /v17/pick-request-runs/{request_id}:
    get:
      operationId: getWowV17PickRequestRunState
      x-openai-isConsequential: false
      description: >-
        Read the durable server-side manifest, worker job, and exact row state.
        Poll this after enqueue or a transport/session interruption; never
        reconstruct persisted row identity from chat memory.
      security: [{actionBearer: []}]
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 250, default: 100}
        - name: include_outcomes
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200': {description: Durable run manifest, worker job, and row state}
        '401': {description: Authentication failed}
        '404': {description: Run not found}
  /v17/pick-request-runs/resumable:
    post:
      operationId: runWowV17ResumablePickRequest
      x-openai-isConsequential: false
      description: >-
        Freeze the exact board manifest and enqueue a DB-leased scoring job.
        The Action returns without waiting for scoring; poll run state by
        request_id. The worker uses canonical scoring in <=50-row batches.
      security: [{actionBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResumablePickRunRequest'}
      responses:
        '200': {description: Durable enqueue acknowledgement and current job state}
        '401': {description: Authentication failed}
        '409': {description: Closed run or exact identity conflict}
        '422': {description: Invalid manifest or request}
        '503': {description: Durable state service unavailable}
  /v17/pick-request-runs/{request_id}/close:
    post:
      operationId: closeWowV17PickRequestRun
      x-openai-isConsequential: false
      description: >-
        Persist a typed terminal orchestration closure. Once closed, the same
        request_id cannot silently return to RUNNING. This never executes wagers.
      security: [{actionBearer: []}]
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClosePickRunRequest'}
      responses:
        '200': {description: Durable closure recorded}
        '401': {description: Authentication failed}
        '404': {description: Run not found}
        '422': {description: Invalid closure code}
components:
  securitySchemes:
    actionBearer:
      type: http
      scheme: bearer
  schemas:
    ResumablePickRunRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: {type: string, minLength: 1}
        rows:
          type: array
          maxItems: 1000
          default: []
          items: {$ref: '#/components/schemas/PickRequestRow'}
        response_mode:
          type: string
          enum: [COMPACT, FULL]
          default: COMPACT
        batch_size: {type: integer, minimum: 1, maximum: 50, default: 20}
        max_batches: {type: integer, minimum: 1, maximum: 25, default: 25}
    ClosePickRunRequest:
      type: object
      additionalProperties: false
      required: [closure_code]
      properties:
        closure_code: {type: string, minLength: 1}
        closure_reason: {type: string, maxLength: 2000, default: ''}
        reopen_allowed: {type: boolean, default: false}
        closure_metadata:
          type: object
          additionalProperties: true
          default: {}
    ScorePropRequest:
      type: object
      additionalProperties: true
      required: [event_id, event_start_time, sport, stat_type, line, direction, source_snapshot_id]
      properties:
        requester_host_identity: {type: string, enum: [WOW_BETTING_ENGINE], default: WOW_BETTING_ENGINE}
        event_id: {type: string}
        event_start_time: {type: string, format: date-time}
        sport: {type: string}
        league: {type: [string, 'null']}
        player: {type: [string, 'null']}
        stat_type: {type: string}
        line: {type: number}
        direction: {type: string, enum: [MORE, LESS]}
        source_snapshot_id: {type: string}
        seed: {type: integer, default: 0}
        evidence: {type: [object, 'null'], additionalProperties: true}
    DailySnapshotRequest:
      type: object
      additionalProperties: false
      required: [requested_slate_date, requested_timezone]
      properties:
        requested_slate_date: {type: string, format: date}
        requested_timezone: {type: string}
        lanes:
          type: array
          items: {type: string, enum: [PROPS, MONEYLINE]}
          default: [PROPS, MONEYLINE]
        max_props: {type: integer, minimum: 0, maximum: 12, default: 6}
        max_team_events: {type: integer, minimum: 0, maximum: 12, default: 6}
        response_mode:
          type: string
          enum: [COMPACT, FULL]
          default: COMPACT
    PickRequestBatch:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        request_id: {type: [string, 'null']}
        response_mode:
          type: string
          enum: [COMPACT, FULL]
          default: COMPACT
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/PickRequestRow'}
    PickRequestRow:
      type: object
      additionalProperties: false
      required: [event_id, event_start_time, sport, player, stat_type, line, direction]
      properties:
        row_key: {type: [string, 'null']}
        event_id: {type: string}
        event_start_time: {type: string, format: date-time}
        sport: {type: string}
        player: {type: string}
        stat_type: {type: string}
        line: {type: number}
        direction: {type: string, enum: [MORE, LESS]}
        evidence:
          oneOf:
            - {$ref: '#/components/schemas/RawPropEvidence'}
            - {type: 'null'}
        source_type:
          type: string
          enum: [SCREENSHOT, PDF, AUTONOMOUS_DISCOVERY, PASTED_BOARD, NORMALIZED]
          default: NORMALIZED
        platform: {type: [string, 'null']}
        league: {type: [string, 'null']}
        opponent: {type: [string, 'null']}
        source_capture_timestamp: {type: [string, 'null'], format: date-time}
        seed: {type: integer, default: 0}
        money_lane_status: {type: string, default: PAYOUT_UNRESOLVED}
        market_side_a: {type: [object, 'null'], additionalProperties: true}
        market_side_b: {type: [object, 'null'], additionalProperties: true}
    PredictionReceiptLookupBatch:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        request_id: {type: [string, 'null']}
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/PredictionReceiptLookupRow'}
    PredictionReceiptLookupRow:
      type: object
      additionalProperties: false
      anyOf:
        - required: [prediction_id]
        - required: [event_id, player, stat_type, line, direction]
      properties:
        row_key: {type: [string, 'null']}
        prediction_id: {type: [string, 'null']}
        event_id: {type: [string, 'null']}
        sport: {type: [string, 'null']}
        player: {type: [string, 'null']}
        team: {type: [string, 'null']}
        opponent: {type: [string, 'null']}
        stat_type: {type: [string, 'null']}
        line: {type: [number, 'null']}
        direction:
          anyOf:
            - {type: string, enum: [MORE, LESS]}
            - {type: 'null'}
        event_start_min: {type: [string, 'null'], format: date-time}
        event_start_max: {type: [string, 'null'], format: date-time}
    RawPropEvidence:
      type: object
      additionalProperties: false
      required:
        - captured_at
        - game_log
        - box_score_log
        - role_status
        - role_timestamp
        - opportunity_ledger
        - source_timestamps
        - rate_provenance
      properties:
        captured_at: {type: string, format: date-time}
        game_log:
          type: array
          items: {type: number}
        box_score_log:
          type: array
          items: {type: object, additionalProperties: true}
        role_status: {type: object, additionalProperties: true}
        role_timestamp: {type: string, format: date-time}
        opportunity_ledger: {type: object, additionalProperties: true}
        source_timestamps:
          type: object
          additionalProperties: {type: string, format: date-time}
        evidence_version: {type: string, default: PROP_EVIDENCE_V1}
        rate_provenance: {type: string}
        lineup_evidence: {type: [object, 'null'], additionalProperties: true}
        opponent_context: {type: [object, 'null'], additionalProperties: true}
        detailed_evidence:
          oneOf:
            - {$ref: '#/components/schemas/DetailedEvidenceEnvelope'}
            - {type: 'null'}
    DetailedEvidenceEnvelope:
      type: object
      additionalProperties: true
      required: [candidate_id, sport, event_id, as_of, evidence_families, market_evidence]
      description: >-
        Rich pregame evidence packet; not a probability package. Material items
        carry provenance and one typed feature status. MARKET_EVIDENCE and
        EVIDENCE_ONLY never become sporting-model numerical features.
      properties:
        candidate_id: {type: string, minLength: 1, maxLength: 256}
        sport: {type: string, minLength: 1, maxLength: 64}
        event_id: {type: string, minLength: 1, maxLength: 256}
        as_of: {type: string, format: date-time}
        controlling_specialist: {type: [string, 'null'], maxLength: 256}
        evidence_families: {$ref: '#/components/schemas/DetailedEvidenceFamilies'}
        market_evidence: {$ref: '#/components/schemas/DetailedMarketEvidence'}
        source_conflicts:
          type: array
          maxItems: 128
          items: {type: string}
        lineup_certainty: {type: [number, 'null'], minimum: 0, maximum: 1}
        role_certainty: {type: [number, 'null'], minimum: 0, maximum: 1}
        starter_certainty: {type: [number, 'null'], minimum: 0, maximum: 1}
        evidence_quality: {type: [number, 'null'], minimum: 0, maximum: 1}
        notes:
          type: array
          maxItems: 128
          items: {type: string}
    DetailedEvidenceFamilies:
      type: object
      additionalProperties: false
      required:
        - recent_form
        - head_to_head
        - player_performance
        - lineup_availability_depth
        - tactical_style
        - match_context_stakes
        - environment
        - officiating
        - schedule_fatigue_travel
        - advanced_statistics
      properties:
        recent_form: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
        head_to_head: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
        player_performance: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
        lineup_availability_depth: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
        tactical_style: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
        match_context_stakes: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
        environment: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
        officiating: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
        schedule_fatigue_travel: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
        advanced_statistics: {$ref: '#/components/schemas/DetailedEvidenceFamily'}
    DetailedEvidenceFamily:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: string
          enum: [AVAILABLE, PARTIAL, UNAVAILABLE, NOT_APPLICABLE]
        sample_window: {type: [string, 'null'], maxLength: 160}
        sample_size: {type: [integer, 'null'], minimum: 0}
        data_quality: {type: [number, 'null'], minimum: 0, maximum: 1}
        certainty: {type: [number, 'null'], minimum: 0, maximum: 1}
        items:
          type: array
          maxItems: 256
          default: []
          items: {$ref: '#/components/schemas/DetailedEvidenceItem'}
    DetailedEvidenceItem:
      type: object
      additionalProperties: true
      required: [name, feature_status, source, as_of]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        value: {}
        feature_status:
          type: string
          enum: [MODEL_INPUT, REGIME_INPUT, CALIBRATION_INPUT, MARKET_EVIDENCE, EVIDENCE_ONLY]
        source: {type: string, minLength: 1, maxLength: 512}
        source_type: {type: [string, 'null'], maxLength: 96}
        as_of: {type: string, format: date-time}
        sample_size: {type: [integer, 'null'], minimum: 0}
        data_quality: {type: [number, 'null'], minimum: 0, maximum: 1}
        certainty: {type: [number, 'null'], minimum: 0, maximum: 1}
        transform_version: {type: [string, 'null'], maxLength: 128}
    DetailedMarketEvidence:
      type: object
      additionalProperties: true
      required: [market_state]
      properties:
        market_state:
          type: string
          enum: [EXACT_LINE, ADJACENT_LINE, NO_MARKET]
        platform: {type: [string, 'null']}
        market: {type: [string, 'null']}
        side: {type: [string, 'null']}
        line: {type: [number, string, 'null']}
        price: {type: [number, string, 'null']}
        source: {type: [string, 'null']}
        as_of: {type: [string, 'null'], format: date-time}
        implied_probability: {type: [number, 'null'], minimum: 0, maximum: 1}
        no_vig_probability: {type: [number, 'null'], minimum: 0, maximum: 1}
    RecommendationBatch:
      type: object
      additionalProperties: true
      required: [records]
      properties:
        records:
          type: array
          items: {type: object, additionalProperties: true}
    TeamEventRequest:
      type: object
      additionalProperties: false
      required:
        - requester_host_identity
        - research_run_id
        - requested_slate_date
        - requested_timezone
        - scan_stage
        - candidate_family
        - decision_intent
        - event_key
        - official_event_id
        - event_start_time_utc
        - sport
        - league
        - market_family
        - settlement_basis
        - home_team
        - away_team
        - source_snapshot_id
      properties:
        requester_host_identity: {type: string}
        research_run_id: {type: string}
        requested_slate_date: {type: string, format: date}
        requested_timezone: {type: string}
        scan_stage: {type: string, enum: [PREGAME]}
        candidate_family:
          type: string
          enum: [TEAM_EVENT, OUTRIGHT_WINNER, MONEYLINE, FAVORITE, UNDERDOG, UPSET, MATCH_WINNER, FIGHT_WINNER]
        decision_intent: {type: string, enum: [WINNER, FAVORITE, UNDERDOG, UPSET, BEST_SIDE]}
        event_key: {type: string}
        official_event_id: {type: string}
        event_start_time_utc: {type: string, format: date-time}
        sport: {type: string}
        league: {type: string}
        market_family: {type: string, enum: [OUTRIGHT_WINNER]}
        settlement_basis: {type: string}
        home_team: {type: string}
        away_team: {type: string}
        source_snapshot_id: {type: string}
        latest_material_update_timestamp: {type: [string, 'null'], format: date-time}
        market_prior: {type: [object, 'null'], additionalProperties: true}
        sport_specific_evidence:
          type: object
          additionalProperties: true
          description: >-
            Sport-specific evidence. Rich V17 research uses v17_detailed_evidence.
            Server-owned identity, starters, lineups, venue and lifecycle remain
            authoritative and cannot be overwritten.

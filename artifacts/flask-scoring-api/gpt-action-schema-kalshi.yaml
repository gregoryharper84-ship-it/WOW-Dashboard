openapi: 3.1.0
info:
  title: WOW Kalshi Read-Only Proxy
  description: >
    Read-only proxy for Kalshi market data. This Custom GPT Action calls the
    Replit backend as a proxy — the backend holds RSA credentials and signs
    Kalshi API requests. The GPT never receives or stores any credentials.

    ALL endpoints are read-only and dry-run only:
      - No order placement, cancellation, or portfolio writes are exposed.
      - Every response includes `dry_run_only: true` and `can_execute: false`.
      - `x-openai-isConsequential: false` is set on every operation.

    Public market-data endpoints (markets, orderbook) do NOT require Kalshi
    auth credentials — they work immediately. Optional authenticated endpoints
    (portfolio balance/positions) require KALSHI_API_KEY_ID + KALSHI_PRIVATE_KEY
    to be configured on the server; the `/kalshi/health` endpoint reports
    `auth_configured` to indicate whether those are present.

    Supported weather cities: NYC, LA, MIA, CHI, AUS
    Station mapping (canonical, from Kalshi contract rule text):
      NYC → KNYC (Central Park)
      LA  → KLAX (Los Angeles Airport) — NOT KBUR
      MIA → KMIA (Miami International) — NOT KPBI
      CHI → KMDW (Chicago Midway)      — NOT KORD
      AUS → KAUS (Austin Bergstrom)
  version: "1.0.0"

# ── Server ────────────────────────────────────────────────────────────────────
# Replace the URL below with your live Replit HTTPS domain.
# The deployed domain is available in the REPLIT_DOMAINS environment variable
# (comma-separated list; use the first entry).
# Example: https://create-app-gregoryharper84.replit.app
servers:
  - url: https://create-app-gregoryharper84.replit.app
    description: Replit production (WOW Flask scoring API)

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:

  /kalshi/health:
    get:
      operationId: kalshiHealth
      x-openai-isConsequential: false
      summary: Proxy health + dry-run mode flags
      description: >
        Returns proxy status, auth configuration, and a quick liveness ping to
        the Kalshi public API. Use this to verify the proxy is running before
        making market data calls. Public — no API key required.
      responses:
        "200":
          description: Health check response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always true if this response is received
                  proxy_mode:
                    type: string
                    description: Always "read_only"
                  dry_run_only:
                    type: boolean
                    description: Always true — no execution possible
                  can_execute:
                    type: boolean
                    description: Always false
                  auth_configured:
                    type: boolean
                    description: >
                      Whether KALSHI_API_KEY_ID is set on the server.
                      Public market-data endpoints work without it.
                  kalshi_reachable:
                    type: boolean
                  kalshi_signal:
                    type: string
                    enum: [INVENTORY_READY, INVENTORY_EMPTY, KALSHI_UNREACHABLE]
                  kalshi_error:
                    type: string
                    nullable: true
                  flask_pid:
                    type: integer
                  flask_uptime_seconds:
                    type: number
                  checked_at:
                    type: string
                    format: date-time
                  execution_rule:
                    type: string
                    description: Always "DRY_RUN_ONLY_NO_LIVE_TRADING_NO_MARKET_ORDERS"

  /kalshi/markets:
    get:
      operationId: kalshiMarkets
      x-openai-isConsequential: false
      summary: Paginated Kalshi market search
      description: >
        Thin wrapper over the Kalshi public /markets endpoint. Stamps source,
        fetched_at, and dry_run_only on the response envelope. Use series_ticker
        to scope results to a specific series (recommended — unscoped pagination
        is dominated by MVE combo/parlay markets).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: series_ticker
          in: query
          required: false
          schema:
            type: string
          description: >
            Scope to a Kalshi series, e.g. KXHIGHCHI (Chicago daily high),
            KXMLBGAME (MLB game winner), KXWNBAGAME (WNBA game winner).
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: open
            enum: [open, closed, settled]
          description: Market status filter. Default is "open".
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Number of markets to return (max 100).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Pagination cursor from a previous response.
      responses:
        "200":
          description: Market listing with envelope metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  source:
                    type: string
                    description: Always "direct_api"
                  fetched_at:
                    type: string
                    format: date-time
                  dry_run_only:
                    type: boolean
                  can_execute:
                    type: boolean
                  markets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  market_count:
                    type: integer
                  cursor:
                    type: string
                    nullable: true
                  params:
                    type: object
                    additionalProperties: true
        "401":
          description: Missing or invalid API key

  /kalshi/orderbook/{ticker}:
    get:
      operationId: kalshiOrderbook
      x-openai-isConsequential: false
      summary: Normalized orderbook for a Kalshi market ticker
      description: >
        Fetches the live orderbook, normalizes it (YES/NO bid/ask, spread,
        liquidity grade), and applies a WOW freshness check. If the data is
        older than 10 minutes, freshness=STALE and ok=false. Always stamps
        source, fetched_at, and can_execute=false.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          description: >
            Kalshi market ticker, e.g. KXHIGHCHI-26JUL10-T85 or
            KXMLBGAME-25-NYY-BOS.
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: Orderbook depth (number of price levels per side).
        - name: force_refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Bypass the 2-minute process cache and fetch fresh data.
      responses:
        "200":
          description: >
            Normalized orderbook. ok=false + freshness=STALE means the data
            is older than 10 minutes. ok=false + error means fetch failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  ticker:
                    type: string
                  source:
                    type: string
                  fetched_at:
                    type: string
                    format: date-time
                  age_minutes:
                    type: number
                  freshness:
                    type: string
                    enum: [FRESH, STALE, UNKNOWN]
                  cached:
                    type: boolean
                    description: True if served from the 2-minute process cache
                  can_execute:
                    type: boolean
                    description: Always false
                  dry_run_only:
                    type: boolean
                    description: Always true
                  error:
                    type: string
                    nullable: true
                  orderbook:
                    type: object
                    description: Normalized orderbook from orderbook_normalizer
                    properties:
                      ticker:
                        type: string
                      best_yes_bid:
                        type: number
                        nullable: true
                      best_yes_ask:
                        type: number
                        nullable: true
                      best_no_bid:
                        type: number
                        nullable: true
                      best_no_ask:
                        type: number
                        nullable: true
                      yes_spread:
                        type: number
                        nullable: true
                      no_spread:
                        type: number
                        nullable: true
                      mid_price:
                        type: number
                        nullable: true
                      depth_within_1c:
                        type: integer
                      depth_within_2c:
                        type: integer
                      liquidity_grade:
                        type: string
                        enum: [A, B, C, D, F]
                      raw_level_count:
                        type: integer
        "401":
          description: Missing or invalid API key

  /kalshi/weather/highs/{city}:
    get:
      operationId: kalshiWeatherHighs
      x-openai-isConsequential: false
      summary: Open weather-high markets for a city
      description: >
        Returns all open NHIGH bracket markets for the given city's canonical
        Kalshi series. Stamps the NWS settlement station code used so callers
        can verify the correct station is active (KMDW not KORD, KMIA not KPBI,
        KLAX not KBUR). Rejects unsupported city codes with 400.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
            enum: [NYC, LA, MIA, CHI, AUS]
          description: >
            City code. Maps to canonical series:
              NYC → KXHIGHNY  (station KNYC)
              LA  → KXHIGHLAX (station KLAX)
              MIA → KXHIGHMIA (station KMIA)
              CHI → KXHIGHCHI (station KMDW)
              AUS → KXHIGHAUS (station KAUS)
      responses:
        "200":
          description: Open weather-high markets for the city
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  city:
                    type: string
                  series_ticker:
                    type: string
                    description: Kalshi series identifier (e.g. KXHIGHCHI)
                  nws_station_code:
                    type: string
                    description: >
                      NWS station code used for settlement
                      (KNYC/KLAX/KMIA/KMDW/KAUS)
                  settlement_station_name:
                    type: string
                  source:
                    type: string
                  fetched_at:
                    type: string
                    format: date-time
                  dry_run_only:
                    type: boolean
                  can_execute:
                    type: boolean
                  market_count:
                    type: integer
                  markets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "400":
          description: Unsupported city code
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
        "401":
          description: Missing or invalid API key

  /kalshi/evaluate/weather/{city}:
    get:
      operationId: kalshiEvaluateWeather
      x-openai-isConsequential: false
      summary: Dry-run WOW weather evaluation for a city
      description: >
        Fetches NWS forecast + live Kalshi markets, builds temperature brackets from
        tickers, and runs the WOW weather scoring pipeline (Gaussian pre-settlement;
        binary after NWS CLI FINAL). Always returns can_execute=false — read-only.
        For precise scoring use POST /wow/kalshi/weather/evaluate.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
            enum: [NYC, LA, MIA, CHI, AUS]
          description: City to evaluate (see /kalshi/weather/highs/{city} for details).
        - name: sigma_f
          in: query
          required: false
          schema:
            type: number
            default: 3.5
            minimum: 0.5
            maximum: 20.0
          description: >
            Gaussian sigma in °F for pre-settlement bracket scoring (TF-WX-16).
            Historical calibration: 2.5–6.0°F typical range. Default 3.5°F.
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            Target date YYYY-MM-DD. Defaults to today in the city's local
            timezone if omitted.
      responses:
        "200":
          description: >
            Dry-run weather evaluation result. ok=true even when data is
            unavailable — check terminal_label and weather_label for scoring
            outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  city:
                    type: string
                  series:
                    type: string
                  nws_station_code:
                    type: string
                  station_name:
                    type: string
                  date:
                    type: string
                    format: date
                  sigma_f:
                    type: number
                  forecast_high:
                    type: number
                    nullable: true
                    description: NWS forecast high temperature (°F)
                  forecast_source:
                    type: string
                  observed_high:
                    type: number
                    nullable: true
                    description: Observed high from NWS CLI (null until FINAL issued)
                  report_status:
                    type: string
                    description: >
                      NWS CLI status: FINAL | PRELIMINARY | NOT_YET_ISSUED | ERROR
                  revision_risk:
                    type: boolean
                  model_high:
                    type: number
                    nullable: true
                  scoring_mode:
                    type: string
                    enum: [binary_final_cli, gaussian_forecast, no_data]
                  forecast_horizon_hours:
                    type: number
                  weather_label:
                    type: string
                    description: >
                      Internal WOW weather label:
                      WEATHER_MODEL_READY | WEATHER_WATCH | WEATHER_SCOUT |
                      WEATHER_REJECT_DATA | WEATHER_REJECT_SETTLEMENT
                  terminal_label:
                    type: string
                    description: >
                      Final KALSHI_* terminal label:
                      KALSHI_PLAYABLE_LIMIT_ONLY | KALSHI_WATCH |
                      KALSHI_REJECT_NO_EDGE | KALSHI_REJECT_BAD_RULES |
                      KALSHI_DATA_UNOBTAINABLE | KALSHI_REJECT_UNCALIBRATED
                  brackets_scored:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  tickers_found:
                    type: array
                    items:
                      type: string
                  price_source:
                    type: string
                  price_age_minutes:
                    type: number
                    nullable: true
                  can_execute:
                    type: boolean
                    description: Always false
                  dry_run_only:
                    type: boolean
                    description: Always true
                  execution_rule:
                    type: string
                  note:
                    type: string
        "400":
          description: Unsupported city code
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
        "401":
          description: Missing or invalid API key

# ── Components ────────────────────────────────────────────────────────────────
components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Pass your SCORING_API_KEY value in the X-API-Key header.
        The /kalshi/health endpoint is public and does not require this key.

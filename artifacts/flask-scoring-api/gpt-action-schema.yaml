openapi: 3.1.0
info:
  title: WOW Scoring API
  description: Score player props and save them to the WOW Lobby. Call scorePick automatically whenever you finish analyzing a prop bet.
  version: 1.0.0

servers:
  - url: https://create-app-gregoryharper84.replit.app

paths:
  /gpt-score:
    post:
      operationId: scorePick
      x-openai-isConsequential: false
      summary: Score a player prop pick and save it to the WOW Lobby
      description: >
        Call after analyzing any player prop. Pass player, sport, prop, side (MORE/LESS), and line.
        Include optional fields: recent_avg, l5_hit_rate, l10_hit_rate, market_gap, role_score,
        matchup_rating, injury_flag, confidence. Pick is saved to the Lobby immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - player
                - sport
                - prop
                - side
                - line
              additionalProperties: true
              properties:
                player:
                  type: string
                  description: "Full player name, e.g. 'LeBron James'"
                sport:
                  type: string
                  description: "Sport name: NBA, MLB, NFL, NHL, NCAAF, NCAAB, Soccer, Tennis, Golf, MMA"
                prop:
                  type: string
                  description: "Prop type, e.g. 'rebounds', 'pitcher strikeouts', 'passing yards'"
                side:
                  type: string
                  enum: [MORE, LESS]
                  description: Pick direction — MORE (over) or LESS (under)
                line:
                  type: number
                  description: "The prop line value, e.g. 27.5"
                game_date:
                  type: string
                  description: >
                    The date the game is actually scheduled (YYYY-MM-DD).
                    IMPORTANT: only score picks for players with a confirmed
                    game on this date. If the player has no game today, do not
                    call this endpoint. Defaults to today if omitted.
                recent_avg:
                  type: number
                  description: Player's recent average for this stat (optional but recommended)
                matchup_rating:
                  type: number
                  description: Matchup difficulty rating 1-10 (optional)
                injury_flag:
                  type: number
                  description: "0 = healthy, 1 = questionable, 2 = probable out (optional)"
                pace_factor:
                  type: number
                  description: Game pace or usage rate factor (optional)
                confidence:
                  type: number
                  description: Your own 0-100 confidence in this pick (optional)
                l5_hit_rate:
                  type: number
                  description: Hit rate over last 5 games as decimal 0-1, e.g. 0.8 = 4/5 (optional)
                l10_hit_rate:
                  type: number
                  description: Hit rate over last 10 games as decimal 0-1 (optional)
                market_gap:
                  type: number
                  description: Market alignment 0-1, where 0.75+ = strong market support for this side (optional)
                role_score:
                  type: number
                  description: Role and usage stability 0-1, where 1 = locked starter/heavy usage (optional)
            example:
              player: Jacob Misiorowski
              sport: MLB
              prop: pitcher strikeouts
              side: MORE
              line: 5.5
              recent_avg: 8.2
              l5_hit_rate: 0.8
              l10_hit_rate: 0.86
              market_gap: 0.72
              role_score: 0.9
              matchup_rating: 6
              injury_flag: 0
              confidence: 74
              game_date: "2026-05-09"
      responses:
        "200":
          description: Pick scored and saved to the WOW Lobby
          content:
            application/json:
              schema:
                type: object
                properties:
                  wow_score:
                    type: number
                    description: WOW confidence score 0-100
                  signal:
                    type: string
                    description: Human-readable signal label
                  saved_to_lobby:
                    type: boolean
                  message:
                    type: string
                    description: Summary of the pick that was saved
                  player:
                    type: string
                  sport:
                    type: string
                  prop:
                    type: string
                  side:
                    type: string
                  line:
                    type: number
      security:
        - ApiKeyAuth: []

components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

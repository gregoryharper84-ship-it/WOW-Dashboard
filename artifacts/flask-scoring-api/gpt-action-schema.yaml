openapi: 3.1.0
info:
  title: WOW Scoring API
  description: Score player props and save them to the WOW Lobby. Call scoreProp automatically whenever you finish analyzing a prop bet.
  version: 1.0.0

servers:
  - url: https://create-app-gregoryharper84.replit.app

paths:
  /random-forest-score:
    post:
      operationId: scoreProp
      x-openai-isConsequential: false
      summary: Score a player prop and save it to the WOW Lobby
      description: >
        Call after analyzing any player prop. Pass player, sport, prop, side (MORE/LESS), and line.
        Include optional fields: recent_avg, l5_hit_rate, l10_hit_rate, market_gap, role_score,
        matchup_rating, injury_flag, confidence. Pick is saved to the Lobby immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - player
                - sport
                - prop
                - side
                - line
              additionalProperties: true
              properties:
                player:
                  type: string
                  description: "Full player name, e.g. 'LeBron James'"
                sport:
                  type: string
                  description: "Sport name: NBA, MLB, NFL, NHL, NCAAF, NCAAB, Soccer, Tennis, Golf, MMA"
                prop:
                  type: string
                  description: "Prop type, e.g. 'rebounds', 'pitcher strikeouts', 'passing yards'"
                side:
                  type: string
                  enum: [MORE, LESS]
                  description: Pick direction — MORE (over) or LESS (under)
                line:
                  type: number
                  description: "The prop line value, e.g. 27.5"
                game_date:
                  type: string
                  description: "Scheduled game date YYYY-MM-DD. Only score picks for confirmed games."
                recent_avg:
                  type: number
                  description: Player's recent average for this stat (optional but recommended)
                l5_hit_rate:
                  type: number
                  description: Hit rate over last 5 games as decimal 0-1, e.g. 0.8 = 4/5 (optional)
                l10_hit_rate:
                  type: number
                  description: Hit rate over last 10 games as decimal 0-1 (optional)
                market_gap:
                  type: number
                  description: Market alignment 0-1, where 0.75+ = strong market support (optional)
                role_score:
                  type: number
                  description: Role and usage stability 0-1, where 1 = locked starter/heavy usage (optional)
                matchup_rating:
                  type: number
                  description: Matchup difficulty rating 1-10 (optional)
                injury_flag:
                  type: number
                  description: "0 = healthy, 1 = questionable, 2 = probable out (optional)"
                pace_factor:
                  type: number
                  description: Game pace or usage rate factor (optional)
                confidence:
                  type: number
                  description: Your own 0-100 confidence in this pick (optional)
                environment:
                  type: string
                  enum: [test, live]
                  description: "Default: test. Pass 'live' only for real picks you want tracked in the live Lobby."
                features:
                  type: object
                  description: Optional nested object of analysis features (alternative to flat fields)
                  additionalProperties:
                    type: number
            example:
              player: Jacob Misiorowski
              sport: MLB
              prop: pitcher strikeouts
              side: MORE
              line: 5.5
              recent_avg: 8.2
              l5_hit_rate: 0.8
              l10_hit_rate: 0.86
              market_gap: 0.72
              role_score: 0.9
              matchup_rating: 6
              injury_flag: 0
              confidence: 74
              game_date: "2026-05-10"
      responses:
        "200":
          description: Pick scored and saved to the WOW Lobby
          content:
            application/json:
              schema:
                type: object
                properties:
                  wow_score:
                    type: number
                    description: WOW confidence score 0-100
                  signal:
                    type: string
                    description: 8-tier signal label
                  message:
                    type: string
                    description: One-sentence explanation of the score
                  saved_to_lobby:
                    type: boolean
                  can_approve_bets:
                    type: boolean
                  player:
                    type: string
                  sport:
                    type: string
                  prop:
                    type: string
                  side:
                    type: string
                  line:
                    type: number
                  features_received:
                    type: integer
      security:
        - ApiKeyAuth: []

  /gpt-score:
    post:
      operationId: scorePick
      x-openai-isConsequential: false
      summary: Alias for scoreProp — score a player prop and save it to the WOW Lobby
      description: >
        Identical to scoreProp. Call after analyzing any player prop. Pass player, sport, prop,
        side (MORE/LESS), line, and any available analysis fields. Pick is saved to the Lobby immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - player
                - sport
                - prop
                - side
                - line
              additionalProperties: true
              properties:
                player:
                  type: string
                sport:
                  type: string
                prop:
                  type: string
                side:
                  type: string
                  enum: [MORE, LESS]
                line:
                  type: number
                game_date:
                  type: string
                recent_avg:
                  type: number
                l5_hit_rate:
                  type: number
                l10_hit_rate:
                  type: number
                market_gap:
                  type: number
                role_score:
                  type: number
                matchup_rating:
                  type: number
                injury_flag:
                  type: number
                confidence:
                  type: number
                environment:
                  type: string
                  enum: [test, live]
                  description: "Default: test. Pass 'live' only for real picks."
      responses:
        "200":
          description: Pick scored and saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  wow_score:
                    type: number
                  signal:
                    type: string
                  message:
                    type: string
                  saved_to_lobby:
                    type: boolean
      security:
        - ApiKeyAuth: []

  /request-log:
    get:
      operationId: getRequestLog
      x-openai-isConsequential: false
      summary: Retrieve recent scoring history
      description: Returns the most recent scored picks. Supports filtering by player, sport, prop, side, and window (L5 or L10).
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [L5, L10]
          description: Return only the last 5 or 10 records
        - name: player
          in: query
          schema:
            type: string
          description: Filter by player name (partial match)
        - name: sport
          in: query
          schema:
            type: string
        - name: prop
          in: query
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum: [MORE, LESS, over, under, more, less]
          description: "Filter by side. Normalized automatically: MORE/over/more → MORE, LESS/under/less → LESS"
        - name: environment
          in: query
          schema:
            type: string
            enum: [test, live]
          description: "Filter by environment. Omit to see all."
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Log of recent scored picks
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  requests:
                    type: array
                    items:
                      type: object
      security:
        - ApiKeyAuth: []

  /stats:
    get:
      operationId: getStats
      x-openai-isConsequential: false
      summary: Aggregate stats for scored picks
      description: Returns hit rates, averages, and score distributions. Supports L5/L10 window and player/sport/prop filters.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [L5, L10]
        - name: player
          in: query
          schema:
            type: string
        - name: sport
          in: query
          schema:
            type: string
        - name: prop
          in: query
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum: [MORE, LESS, over, under, more, less]
          description: "Filter by side. Normalized automatically: MORE/over/more → MORE, LESS/under/less → LESS"
        - name: environment
          in: query
          schema:
            type: string
            enum: [test, live]
          description: "Filter by environment. Omit to see all."
      responses:
        "200":
          description: Aggregate scoring stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  window:
                    type: string
                  stats:
                    type: object
                    additionalProperties: true
      security:
        - ApiKeyAuth: []

  /leaderboard:
    get:
      operationId: getLeaderboard
      x-openai-isConsequential: false
      summary: Top scored picks ranked by WOW score
      description: Returns picks sorted by wow_score descending. Supports L5/L10 window, sport, prop, side filters, and today=1 for today only.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [L5, L10]
          default: L10
        - name: sport
          in: query
          schema:
            type: string
        - name: prop
          in: query
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum: [MORE, LESS, over, under, more, less]
          description: "Filter by side. Normalized automatically: MORE/over/more → MORE, LESS/under/less → LESS"
        - name: today
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = today's picks only"
        - name: environment
          in: query
          schema:
            type: string
            enum: [test, live]
          description: "Filter by environment. Omit to see all."
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Ranked pick leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                  window:
                    type: string
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        player:
                          type: string
                        sport:
                          type: string
                        prop:
                          type: string
                        side:
                          type: string
                        average_score:
                          type: number
                        latest_score:
                          type: number
                        rank:
                          type: integer
      security:
        - ApiKeyAuth: []

  /wow/espn/mlb/scoreboard:
    get:
      operationId: getEspnScoreboard
      x-openai-isConsequential: false
      summary: Get today's MLB schedule with probable pitchers (trimmed ESPN proxy)
      description: >
        Returns a GPT-safe (~2–4 KB) summary of today's MLB slate scraped from ESPN's
        public scoreboard API. Includes event_id, start_time, home/away team abbreviations,
        game status, and probable pitchers. Use this instead of calling ESPN directly —
        the raw ESPN payload is 300–400 KB and will cause a ResponseTooLargeError in any
        GPT Action. Pass dates=YYYYMMDD to target a specific date; omit for today.
      parameters:
        - name: dates
          in: query
          required: false
          schema:
            type: string
            example: "20260725"
          description: "Date in YYYYMMDD format. Defaults to today."
      responses:
        "200":
          description: Trimmed MLB scoreboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  source:
                    type: string
                    example: "espn_mlb_scoreboard_proxy"
                  espn_status:
                    type: string
                    example: "AVAILABLE"
                  dates:
                    type: string
                    example: "20260725"
                  game_count:
                    type: integer
                  games:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id:
                          type: string
                        start_time:
                          type: string
                          description: "ISO-8601 UTC start time"
                        home_team:
                          type: string
                          example: "LAD"
                        away_team:
                          type: string
                          example: "NYM"
                        status:
                          type: string
                          example: "STATUS_SCHEDULED"
                        status_detail:
                          type: string
                          example: "Scheduled"
                        status_short:
                          type: string
                          example: "7/25 - 1:10 PM EDT"
                        home_probable_pitcher:
                          type: string
                          nullable: true
                        away_probable_pitcher:
                          type: string
                          nullable: true
        "401":
          description: Unauthorized — missing or invalid API key
      security:
        - ApiKeyAuth: []

  /wow-daily-scan:
    post:
      operationId: runDailyScan
      x-openai-isConsequential: false
      summary: Run WOW daily scan and return completed results directly
      description: >
        Runs the full WOW data pipeline synchronously: pulls today's events and player
        props from The Odds API (TheRundown as backup), fetches ESPN player game logs,
        calculates exact-line L5/L10 hit rates and medians, pulls injury/status data,
        scores each prop using WOW v14.8+ rules, classifies as Market Verified Approved /
        Model Qualified / Conditional / Watch / Reject / Data Insufficient, saves all
        results to the database, and returns a compact classified summary directly.
        Response shape is identical to getScanSummary. Pass async=true to run in
        background and poll getScanSummary instead.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sports:
                  type: array
                  items:
                    type: string
                  description: "Sports to scan. Default: all. Example: [\"MLB\", \"WNBA\", \"NHL\"]"
                environment:
                  type: string
                  enum: [test, live]
                  description: "Default: live"
                limit_per_sport:
                  type: integer
                  description: "Max props to evaluate per sport. Default: 50"
                include_execution_report:
                  type: boolean
                  description: "Include execution_report block in response. Default: true"
                async:
                  type: boolean
                  description: "If true, starts scan in background and returns immediately with status=started. Default: false"
                date:
                  type: string
                  description: "Target date YYYY-MM-DD (accepted for compatibility, scan always uses today)"
                mode:
                  type: string
                  description: "Scan mode label (accepted for compatibility)"
                strict_board_lock:
                  type: boolean
                  description: "Accepted for compatibility"
                require_prizepicks_for_final:
                  type: boolean
                  description: "Accepted for compatibility"
                run_manual_l10_if_needed:
                  type: boolean
                  description: "Accepted for compatibility"
      responses:
        "200":
          description: Completed scan results — compact classified summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum: [completed, started, error]
                  run_date:
                    type: string
                  source_access_status:
                    type: object
                    additionalProperties:
                      type: string
                  execution_report:
                    type: object
                    additionalProperties: true
                  counts:
                    type: object
                    properties:
                      market_verified:  {type: integer}
                      model_qualified:  {type: integer}
                      conditional:      {type: integer}
                      watch:            {type: integer}
                      reject:           {type: integer}
                      data_insufficient: {type: integer}
                  market_verified:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  model_qualified:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  conditional:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  watch:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  reject:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  data_insufficient:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  final_approved_picks:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  execution_notes:
                    type: array
                    items:
                      type: string
      security:
        - ApiKeyAuth: []

  /scan-results/summary:
    get:
      operationId: getScanSummary
      x-openai-isConsequential: false
      summary: Get compact scan summary (use this — avoids GPT response size limits)
      description: >
        Returns a compact, GPT-friendly summary of the latest WOW daily scan.
        Excludes raw event payloads, market odds arrays, and full game logs.
        Returns only classified picks with key stats per prop.
        Use this endpoint instead of getScanResults to stay within GPT response size limits.
        Supports limit (default 10), category, and status filters.
      parameters:
        - name: run_date
          in: query
          schema:
            type: string
          description: "Date (YYYY-MM-DD). Defaults to today."
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Max items per category (default 10, max 50)
        - name: category
          in: query
          schema:
            type: string
            enum:
              - market_verified
              - model_qualified
              - conditional
              - watch
              - reject
              - data_insufficient
          description: Filter to a single category
        - name: status
          in: query
          schema:
            type: string
            enum: [completed, pending]
          description: Only return results if scan matches this status
      responses:
        "200":
          description: Compact scan summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum: [completed, pending]
                  run_date:
                    type: string
                  source_access_status:
                    type: object
                    additionalProperties:
                      type: string
                  execution_report:
                    type: object
                    properties:
                      daily_scan_executed:      {type: boolean}
                      get_events_called:        {type: boolean}
                      get_event_markets_called: {type: boolean}
                      get_event_odds_called:    {type: boolean}
                      l5_l10_called:            {type: boolean}
                      status_lineups_called:    {type: boolean}
                      projections_called:       {type: boolean}
                      final_approved_count:     {type: integer}
                      model_qualified_count:    {type: integer}
                      watch_count:              {type: integer}
                      reject_count:             {type: integer}
                  counts:
                    type: object
                    properties:
                      market_verified:  {type: integer}
                      model_qualified:  {type: integer}
                      conditional:      {type: integer}
                      watch:            {type: integer}
                      reject:           {type: integer}
                      data_insufficient: {type: integer}
                  market_verified:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  model_qualified:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  conditional:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  watch:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  reject:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  data_insufficient:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  final_approved_picks:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactProp'
                  execution_notes:
                    type: array
                    items:
                      type: string
      security:
        - ApiKeyAuth: []

  /scan-results:
    get:
      operationId: getScanResults
      x-openai-isConsequential: false
      summary: Retrieve persisted scan results from the database
      description: >
        Returns scan results saved by runDailyScan. Filter by date, classification,
        and sport. Use summary=1 to get only counts by classification without full rows.
        Defaults to today's date if run_date is not provided.
      parameters:
        - name: run_date
          in: query
          schema:
            type: string
          description: "Date to retrieve results for (YYYY-MM-DD). Defaults to today."
        - name: classification
          in: query
          schema:
            type: string
            enum:
              - "Market Verified Approved"
              - "Model Qualified — PrizePicks"
              - "Conditional"
              - "Watch"
              - "Reject"
              - "Data Insufficient"
              - "No Play"
          description: Filter by classification
        - name: sport
          in: query
          schema:
            type: string
          description: Filter by sport
        - name: summary
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = return only counts by classification, no full rows"
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_date:
                    type: string
                  count:
                    type: integer
                  summary:
                    type: object
                    additionalProperties:
                      type: integer
                  results:
                    type: array
                    items:
                      type: object
      security:
        - ApiKeyAuth: []

components:
  schemas:
    CompactProp:
      type: object
      description: Compact prop result for GPT consumption — no raw payloads or full arrays
      properties:
        player:
          type: string
          example: "A'ja Wilson"
        sport:
          type: string
          example: WNBA
        prop:
          type: string
          example: points
        side:
          type: string
          enum: [MORE, LESS]
        line:
          type: number
          example: 22.5
        platform:
          type: string
          nullable: true
          example: "The Odds API"
        model_probability:
          type: number
          nullable: true
          description: wow_score normalised to 0-1
          example: 0.78
        l5_hit_rate:
          type: number
          nullable: true
          example: 0.8
        l10_hit_rate:
          type: number
          nullable: true
          example: 0.7
        l10_median:
          type: number
          nullable: true
          example: 24.5
        final_label:
          type: string
          example: "Market Verified Approved"
        reason:
          type: string
          example: "Strong Signal — strong recent hit rate align with submitted side"
        failure_paths:
          type: array
          items:
            type: string
          maxItems: 3
          example: []
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

openapi: 3.1.0
info:
  title: WOW Odds Gateway
  version: 1.0.0
  description: >
    Secure odds and player-prop acquisition through the WOW backend.
    All requests must include the X-WOW-Action-Key header (configured
    under Authentication in the GPT Action editor).

servers:
  - url: https://create-app-gregoryharper84.replit.app

paths:
  /wow/odds/events:
    get:
      operationId: getOddsApiEvents
      security:
        - WowActionKey: []
      summary: Get upcoming or live events for a sport
      description: >
        Low-cost event discovery call. Uses the free key by default.
        Returns a list of events with IDs needed for subsequent market
        and odds calls.
      parameters:
        - name: sport
          in: query
          required: true
          description: >
            Odds API sport key, e.g. baseball_mlb, basketball_nba,
            americanfootball_nfl, basketball_wnba
          schema:
            type: string
        - name: commence_time_from
          in: query
          required: false
          description: ISO 8601 datetime — only return events starting at or after this time
          schema:
            type: string
        - name: commence_time_to
          in: query
          required: false
          description: ISO 8601 datetime — only return events starting at or before this time
          schema:
            type: string
        - name: include_rotation_numbers
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Event list and quota metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_key_tier:
                    type: string
                    enum: [free, paid]
                  requests_remaining:
                    type: string
                  requests_used:
                    type: string
                  request_cost:
                    type: string
                  quota_warning:
                    type: boolean
                    description: >
                      True when requests_remaining for this key tier has dropped
                      below the server-side threshold (default 50). Stop non-essential
                      calls immediately and notify the session operator.
                  quota_threshold:
                    type: integer
                    description: The remaining-count floor that triggers quota_warning
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "400":
          description: Missing required parameter
        "401":
          description: Invalid or missing X-WOW-Action-Key
        "502":
          description: Both Odds API key paths failed

  /wow/odds/event-markets:
    get:
      operationId: getOddsApiEventMarkets
      security:
        - WowActionKey: []
      summary: Get available sportsbook market keys for one event
      description: >
        Returns the list of market keys available for a specific event
        (e.g. h2h, spreads, totals, player_pass_tds). Use the market
        keys returned here as input to getOddsApiEventOdds.
        Uses the paid key by default.
      parameters:
        - name: sport
          in: query
          required: true
          schema:
            type: string
        - name: event_id
          in: query
          required: true
          description: Event ID from getOddsApiEvents
          schema:
            type: string
        - name: regions
          in: query
          required: false
          schema:
            type: string
            default: us
        - name: bookmakers
          in: query
          required: false
          description: Comma-separated bookmaker keys to filter results
          schema:
            type: string
      responses:
        "200":
          description: Available markets and quota metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_key_tier:
                    type: string
                    enum: [free, paid]
                  requests_remaining:
                    type: string
                  requests_used:
                    type: string
                  request_cost:
                    type: string
                  quota_warning:
                    type: boolean
                    description: >
                      True when requests_remaining for this key tier has dropped
                      below the server-side threshold (default 50). Stop non-essential
                      calls immediately and notify the session operator.
                  quota_threshold:
                    type: integer
                    description: The remaining-count floor that triggers quota_warning
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Missing required parameter
        "401":
          description: Invalid or missing X-WOW-Action-Key
        "502":
          description: Both Odds API key paths failed

  /wow/odds/event-odds:
    get:
      operationId: getOddsApiEventOdds
      security:
        - WowActionKey: []
      summary: Get exact odds for selected markets on one event
      description: >
        Returns two-way pricing from one or more sportsbooks for the
        specified markets. Use for exact no-vig consensus pricing needed
        by WOW acquisition gates. Uses the paid key by default.
      parameters:
        - name: sport
          in: query
          required: true
          schema:
            type: string
        - name: event_id
          in: query
          required: true
          description: Event ID from getOddsApiEvents
          schema:
            type: string
        - name: markets
          in: query
          required: true
          description: Comma-separated market keys, e.g. h2h,spreads,player_pass_tds
          schema:
            type: string
        - name: regions
          in: query
          required: false
          schema:
            type: string
            default: us
        - name: bookmakers
          in: query
          required: false
          description: Comma-separated bookmaker keys (e.g. draftkings,fanduel,betmgm)
          schema:
            type: string
        - name: odds_format
          in: query
          required: false
          schema:
            type: string
            enum:
              - american
              - decimal
            default: american
      responses:
        "200":
          description: Exact event odds and quota metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_key_tier:
                    type: string
                    enum: [free, paid]
                  requests_remaining:
                    type: string
                  requests_used:
                    type: string
                  request_cost:
                    type: string
                  quota_warning:
                    type: boolean
                    description: >
                      True when requests_remaining for this key tier has dropped
                      below the server-side threshold (default 50). Stop non-essential
                      calls immediately and notify the session operator.
                  quota_threshold:
                    type: integer
                    description: The remaining-count floor that triggers quota_warning
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Missing required parameter
        "401":
          description: Invalid or missing X-WOW-Action-Key
        "502":
          description: Both Odds API key paths failed

  /wow/odds/quota-status:
    get:
      operationId: getOddsApiQuotaStatus
      security:
        - WowActionKey: []
      summary: Check current Odds API quota without making a chargeable call
      description: >
        Returns the last-known requests_remaining and requests_used for each
        key tier (paid / free). Values are updated in-process after every
        successful /wow/odds/* call — no chargeable Odds API request is made.
        Call this at the start of a scoring session to confirm quota headroom
        before issuing market or odds requests.
      responses:
        "200":
          description: Current quota snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  quota_threshold:
                    type: integer
                    description: remaining-count floor below which quota_warning fires
                  quota_warning:
                    type: boolean
                    description: True when any key tier is below quota_threshold
                  tiers:
                    type: object
                    description: >
                      One key per tier ("paid", "free"). Each value contains
                      requests_remaining (int), requests_used (int),
                      updated_at (ISO-8601 UTC), quota_warning (bool).
                    additionalProperties:
                      type: object
                      properties:
                        requests_remaining:
                          type: integer
                        requests_used:
                          type: integer
                        updated_at:
                          type: string
                        quota_warning:
                          type: boolean
                  note:
                    type: string
        "401":
          description: Invalid or missing X-WOW-Action-Key

components:
  securitySchemes:
    WowActionKey:
      type: apiKey
      in: header
      name: X-WOW-Action-Key
      description: >
        GPT_ACTION_SECRET — configure in the GPT Action editor under
        Authentication → API Key, Header name: X-WOW-Action-Key.
        The server validates this header on every /wow/odds/* request.
        Never log or expose the value.

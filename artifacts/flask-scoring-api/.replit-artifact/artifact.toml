kind = "web"
previewPath = "/"
title = "WOW Scoring API"
version = "1.0.0"
id = "artifacts/flask-scoring-api"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 25643

[services.development]
run = "cd /home/runner/workspace/artifacts/flask-scoring-api && PORT=25643 python app.py"

[services.production]

[services.production.build]
args = ["bash", "/home/runner/workspace/artifacts/flask-scoring-api/build.sh"]

[services.production.run]
args = [
  "sh", "-c",
  "gunicorn --chdir /home/runner/workspace/artifacts/flask-scoring-api app:app --bind 0.0.0.0:${PORT:-8080} --workers 2 --timeout 120 --access-logfile -"
]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/health"

[services.env]
PORT = "25643"
BASE_PATH = "/"

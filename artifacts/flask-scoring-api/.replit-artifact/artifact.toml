kind = "web"
previewPath = "/"
title = "WOW Scoring API"
version = "1.0.0"
id = "artifacts/flask-scoring-api"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 25643
deploymentTarget = "autoscale"

[services.development]
run = "cd /home/runner/workspace/artifacts/flask-scoring-api && PORT=25643 python app.py"

[services.production]

[services.production.build]
args = ["bash", "/home/runner/workspace/artifacts/flask-scoring-api/build.sh"]

[services.production.run]
args = [
  "bash", "-c",
  "cd /home/runner/workspace/artifacts/flask-scoring-api && python pre_start.py && python -m gunicorn app:app --bind 0.0.0.0:25643 --workers 2 --timeout 240 --preload --config gunicorn_conf.py --access-logfile - --error-logfile -"
]

[services.production.run.env]
PORT = "25643"

[services.production.health.startup]
path = "/wow/engine/health"

[services.env]
PORT = "25643"
BASE_PATH = "/"

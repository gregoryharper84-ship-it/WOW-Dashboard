kind = "api"
previewPath = "/"
title = "WOW Scoring API"
version = "1.0.0"

[[services]]
localPort = 8000
name = "WOW Scoring API"
paths = ["/"]

[services.development]
run = "cd artifacts/flask-scoring-api && python app.py"

[services.production]

[services.production.build]
args = ["pip", "install", "-r", "artifacts/flask-scoring-api/requirements.txt"]

[services.production.run]
args = [
  "gunicorn",
  "--chdir", "artifacts/flask-scoring-api",
  "app:app",
  "--bind", "0.0.0.0:8000",
  "--workers", "2",
  "--timeout", "60",
  "--access-logfile", "-"
]

[services.production.run.env]
PORT = "8000"

[services.production.health.startup]
path = "/health"

kind = "api"
previewPath = "/"
title = "WOW Scoring API"
version = "1.0.0"

[[services]]
localPort = 8000
name = "WOW Scoring API"
paths = ["/"]

[services.development]
run = "cd artifacts/flask-scoring-api && python app.py"

[services.production]

[services.production.build]
args = ["pip", "install", "-r", "artifacts/flask-scoring-api/requirements.txt"]

[services.production.run]
args = [
  "sh", "-c",
  "cd artifacts/flask-scoring-api && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -"
]

[services.production.health.startup]
path = "/health"

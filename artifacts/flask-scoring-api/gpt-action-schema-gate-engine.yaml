openapi: 3.1.0
info:
  title: WOW Gate Engine v2
  description: >
    Governance handshake + gate-engine run for the WOW v16 scoring pipeline.

    MANDATORY call sequence before every run:
      1. GET /wow/engine/health         — confirm worker is alive (public, no key)
      2. GET /wow/governance/status     — obtain governance_hash (public, no key)
      3. GET /wow/stage2/health         — confirm schema_ready=true (public, no key)
      4. POST /gate-engine/run          — score rows (requires X-API-Key)

    The governance_hash from step 2 MUST be passed as expected_governance_hash
    in step 4. A missing or mismatched hash returns HTTP 409. Call
    /wow/governance/status to resync before retrying.

    LARGE-SLATE GUIDANCE (ResponseTooLargeError fix):
    For slates with more than ~6 rows, always pass response_mode="slim" in
    the request body. Slim mode strips verbose gate internals and compresses
    each row to a gate_summary while keeping every LLP-required decision field.
    Typical size reduction: 70–85% versus full mode. All terminal_labels,
    blockers, final_card, and summary fields are identical in both modes.

    Current engine: ENGINE v16.5, 9 active patches.
    Current hash:   2a74d11e20ee24526de6db9401f39b4a9228c0f46948d07cea72dc4a21111908
  version: "1.0.0"

servers:
  - url: https://create-app-gregoryharper84.replit.app

paths:

  /wow/engine/health:
    get:
      operationId: getWowEngineHealth
      x-openai-isConsequential: false
      summary: Ultra-lightweight liveness probe — returns 200 as soon as Flask is alive
      description: >
        Call FIRST before every session. Pure liveness probe — no DB, governance,
        or snapshot checks. Returns in milliseconds. Public, no key required.
        If ok=true, call getWowGovernanceStatus. For readiness detail use
        /wow/engine/ready; for cache warmup use /wow/engine/warmup.
      responses:
        "200":
          description: Worker is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always true when the worker is serving requests
                  service:
                    type: string
                    description: Always "wow-engine"
                  status:
                    type: string
                    description: Always "alive"

  /wow/engine/ready:
    get:
      operationId: getWowEngineReady
      x-openai-isConsequential: false
      summary: Deep readiness check — governance loaded, snapshot fresh, DB configured
      description: >
        Optional deeper readiness probe. Returns the same rich payload that
        /wow/engine/health used to return before the liveness/readiness split.
        Makes NO external HTTP calls — reads only in-process state.
        Public — no X-API-Key required.
      responses:
        "200":
          description: Detailed readiness state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  uptime_seconds:
                    type: number
                  worker_pid:
                    type: integer
                  governance:
                    type: object
                    properties:
                      loaded:
                        type: boolean
                      master_spec:
                        type: string
                      engine_version:
                        type: string
                      hash_prefix:
                        type: string
                        description: First 16 hex chars of governance hash + "…"
                      active_patches:
                        type: integer
                  snapshot:
                    type: object
                    properties:
                      snapshot_available:
                        type: boolean
                      snapshot_age_seconds:
                        type: number
                      snapshot_is_fresh:
                        type: boolean
                      snapshot_max_age:
                        type: integer
                  db_env_configured:
                    type: boolean
                  can_execute:
                    type: boolean
                    description: Always false — data/classification layer only

  /wow/engine/warmup:
    get:
      operationId: triggerWowEngineWarmup
      x-openai-isConsequential: false
      summary: Trigger lazy cache/governance warmup after cold start
      description: >
        Runs governance snapshot refresh and DB table DDL idempotently.
        Public, no key required. Cold-start sequence: (1) getWowEngineHealth
        → ok:true, (2) triggerWowEngineWarmup → snapshot:"refreshed",
        (3) getWowGovernanceStatus → capture governance_hash,
        (4) runWowGateEngineV2 → score rows.
      responses:
        "200":
          description: Warmup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  warmup:
                    type: object
                    properties:
                      snapshot:
                        type: string
                        description: '"refreshed" or "error: <msg>"'
                      db_table:
                        type: string
                        description: '"ready" or "error: <msg>"'

  /wow/governance/status:
    get:
      operationId: getWowGovernanceStatus
      x-openai-isConsequential: false
      summary: Returns the canonical governance hash and active patch list
      description: >
        Call SECOND, after getWowEngineHealth ok=true. Provides governance_hash
        — pass it verbatim as expected_governance_hash in runWowGateEngineV2.
        Public, no key required. Refreshes snapshot as a side effect. Always
        resync at start of each session; prior hash is invalid if changed.
      responses:
        "200":
          description: Current governance identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  master_spec_version:
                    type: string
                    description: e.g. "WOW-v16"
                  engine_code_version:
                    type: string
                    description: e.g. "v16.5"
                  governance_hash:
                    type: string
                    description: >
                      SHA-256 hex string. Pass this verbatim as
                      expected_governance_hash in runWowGateEngineV2.
                  patch_count:
                    type: integer
                  active_patch_ids:
                    type: array
                    items:
                      type: string
                  loaded_at:
                    type: string
                    format: date-time
                  effective_at:
                    type: string
                  status:
                    type: string
                    description: Always "ACTIVE"
                  can_execute:
                    type: boolean
                    description: Always false
                  source:
                    type: string
                    description: '"live" when snapshot refreshed successfully'
                  snapshot_metadata:
                    type: object
                    additionalProperties: true
                  patches:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /gate-engine/run:
    post:
      operationId: runWowGateEngineV2
      x-openai-isConsequential: false
      summary: Run the WOW v16 gate engine pipeline on a board of prop rows
      description: >
        Call THIRD after getWowGovernanceStatus. Mandatory fields:
        expected_governance_hash, session_id, research_run_id, as_of, rows.
        Wrong/missing hash → 409 GOVERNANCE_MISMATCH; resync and retry.
        Missing session/run/as_of → 409 RUN_INVALID. Data layer only —
        can_approve_bets=false, can_execute=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expected_governance_hash
                - session_id
                - research_run_id
                - as_of
                - rows
              properties:
                expected_governance_hash:
                  type: string
                  description: >
                    SHA-256 hex governance hash from getWowGovernanceStatus.
                    Must match the server's current hash exactly.
                session_id:
                  type: string
                  description: >
                    Stable identifier for this research session
                    (e.g. "session-2026-07-17-A"). Shared across multiple
                    runWowGateEngineV2 calls in the same session for
                    exposure ledger continuity.
                research_run_id:
                  type: string
                  description: >
                    Unique identifier for this specific run
                    (e.g. "rr-2026-07-17-001"). Changes each call.
                as_of:
                  type: string
                  format: date
                  description: >
                    Today's date in YYYY-MM-DD format. Must match the
                    actual current date — do not use a future or past date.
                rows:
                  type: array
                  description: Non-empty array of prop rows to score
                  items:
                    type: object
                    required:
                      - player
                      - sport
                      - prop_type
                      - line
                      - direction
                      - slate_date
                      - board_source
                      - game
                    properties:
                      player:
                        type: string
                        description: Full player name, e.g. "LeBron James"
                      sport:
                        type: string
                        description: >
                          Sport identifier: NBA, MLB, WNBA, NHL, NFL,
                          NCAAF, NCAAB, Soccer, Tennis, Golf, MMA
                      prop_type:
                        type: string
                        description: >
                          Prop category, e.g. "Points", "Rebounds",
                          "Pitcher Strikeouts", "Passing Yards"
                      line:
                        type: number
                        description: The prop line value, e.g. 27.5
                      direction:
                        type: string
                        enum: [MORE, LESS]
                        description: Pick direction — MORE (over) or LESS (under)
                      slate_date:
                        type: string
                        format: date
                        description: Game date YYYY-MM-DD
                      board_source:
                        type: string
                        description: >
                          Originating board, e.g. "PrizePicks", "Underdog",
                          "DraftKings", "FanDuel"
                      game:
                        type: string
                        description: Game matchup string, e.g. "LAL vs GSW"
                      market_line:
                        type: number
                        description: Sportsbook line for market comparison (optional)
                      row_id:
                        type: string
                        description: >
                          Caller-supplied stable row ID (optional). If omitted,
                          the engine generates one. Supply this when you need
                          to match enrichment keys to rows across calls.
                target_date:
                  type: string
                  format: date
                  description: >
                    Pipeline target date YYYY-MM-DD (optional, defaults to
                    today UTC). Must match slate_date in rows.
                enrichment:
                  type: object
                  description: >
                    Per-row enrichment keyed by row_id or "player:prop_type".
                    All fields are optional — supply what you have.
                  additionalProperties:
                    type: object
                    properties:
                      game_log:
                        type: array
                        items:
                          type: number
                        description: Last-N game log values for this stat
                      season_log:
                        type: array
                        items:
                          type: number
                      sportsbook_line:
                        type: number
                      best_available:
                        type: number
                      consensus_line:
                        type: number
                      clv_entry_price:
                        type: number
                        description: Opening price (American odds)
                      closing_price:
                        type: number
                      status_payload:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [ACTIVE, QUESTIONABLE, OUT, PROBABLE]
                          source:
                            type: string
                          dnp_risk:
                            type: boolean
                          minutes_restriction:
                            type: boolean
                      model_probability_ledger:
                        type: object
                        description: >
                          Stage 2 probability component ledger. Required for rank_eligible=true.
                          If present but incomplete the endpoint returns HTTP 422
                          PROB_LEDGER_INCOMPLETE — build the full structure or omit the field.

                          REQUIRED Stage 2 fields (all seven must be present and valid):
                            raw_probability        — float (0, 1) exclusive, model output before calibration
                            calibrated_probability — float (0, 1), post-calibration estimate
                            lower_bound            — float (0, 1), numeric lower confidence bound
                            upper_bound            — float (0, 1), numeric upper confidence bound
                                                     lower_bound ≤ calibrated_probability ≤ upper_bound
                            model_timestamp        — ISO-8601 string, when the model was built
                            source_snapshot_id     — string, links to llp_source_snapshots table
                            calibration_method     — string, e.g. "platt" or "isotonic"

                          REQUIRED components (all three must appear in the components array):
                            market_no_vig    weight 0.40–0.50  (no-vig sportsbook implied probability)
                            l10_distribution weight 0.25–0.35  (L10 distribution / median / hit rate)
                            role_usage       weight 0.10–0.20  (role / minutes / usage context)

                          OPTIONAL components (include only if you have quantified data):
                            l5_trend         weight −0.05 to +0.05  (±5% hard cap)
                            matchup_context  weight −0.05 to +0.05  (±3–5% if quantified)

                          BLOCKED components (weight must be 0 or omit entirely):
                            narrative / story / feeling / hunch — always blocked

                          Other fields in this object:
                            final_model_prob    — float, weighted sum of components (0–1)
                            confidence_interval — string display, e.g. "0.53–0.61"
                            uncertainty_haircut — float, e.g. 0.04
                            usable_probability  — float, final_model_prob minus haircut
                            calibration_status  — "CALIBRATED" | "UNCALIBRATED" | "PROXY_ONLY"
                            shrinkage_applied   — bool (required true when final_model_prob ≥ 0.60)
                            shrinkage_baseline  — string | null, e.g. "season" | "role_split"

                          SHRINKAGE RULE:
                            final_model_prob ≥ 0.60 requires shrinkage_applied=true on at least
                            one baseline (season, role_split, or market). Omitting shrinkage on a
                            high-confidence row forces calibration_status to UNCALIBRATED and adds
                            a 3% uncertainty buffer plus quarter-Kelly cap.

                          MINIMUM VALID EXAMPLE:
                            {
                              "components": [
                                {"name": "market_no_vig",    "weight": 0.45, "value": 0.54, "source": "draftkings_novig"},
                                {"name": "l10_distribution", "weight": 0.30, "value": 0.60, "source": "l10_hit_rate"},
                                {"name": "role_usage",       "weight": 0.15, "value": 0.55, "source": "minutes_share"}
                              ],
                              "final_model_prob":    0.568,
                              "confidence_interval": "0.52–0.61",
                              "uncertainty_haircut": 0.02,
                              "usable_probability":  0.548,
                              "calibration_status":  "CALIBRATED",
                              "shrinkage_applied":   false,
                              "shrinkage_baseline":  null,
                              "raw_probability":        0.572,
                              "calibrated_probability": 0.568,
                              "lower_bound":            0.52,
                              "upper_bound":            0.61,
                              "model_timestamp":        "2026-08-03T10:00:00Z",
                              "source_snapshot_id":     "snap-2026-08-03-nba-001",
                              "calibration_method":     "platt"
                            }
                        properties:
                          raw_probability:
                            type: number
                            description: Model output before calibration transform. Float in (0, 1) exclusive.
                          calibrated_probability:
                            type: number
                            description: Post-calibration estimate. Must satisfy lower_bound ≤ calibrated_probability ≤ upper_bound.
                          lower_bound:
                            type: number
                            description: Numeric lower confidence bound. Float in (0, 1) exclusive. Not a display string.
                          upper_bound:
                            type: number
                            description: Numeric upper confidence bound. Float in (0, 1) exclusive. lower_bound ≤ upper_bound.
                          model_timestamp:
                            type: string
                            description: ISO-8601 UTC timestamp when the model was built, e.g. "2026-08-03T10:00:00Z".
                          source_snapshot_id:
                            type: string
                            description: ID linking this estimate to the llp_source_snapshots table.
                          calibration_method:
                            type: string
                            description: How calibration was applied, e.g. "platt", "isotonic", "beta".
                          components:
                            type: array
                            description: Probability component entries. All three required components must be present.
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  description: Component name — one of market_no_vig, l10_distribution, role_usage, l5_trend, matchup_context.
                                weight:
                                  type: number
                                  description: Influence weight. market_no_vig 0.40–0.50, l10_distribution 0.25–0.35, role_usage 0.10–0.20, l5_trend ±0.05, matchup_context ±0.05.
                                value:
                                  type: number
                                  description: Component probability estimate (0–1).
                                source:
                                  type: string
                                  description: Data source label for this component.
                          final_model_prob:
                            type: number
                            description: Weighted sum of all components (0–1).
                          confidence_interval:
                            type: string
                            description: Display string, e.g. "0.53–0.61". Required for FINAL_APPROVED.
                          uncertainty_haircut:
                            type: number
                            description: Uncertainty buffer subtracted from final_model_prob, e.g. 0.04.
                          usable_probability:
                            type: number
                            description: final_model_prob minus uncertainty_haircut.
                          calibration_status:
                            type: string
                            enum: [CALIBRATED, UNCALIBRATED, PROXY_ONLY]
                            description: CALIBRATED requires all required components + shrinkage where needed. UNCALIBRATED adds 3% buffer, quarter-Kelly cap, blocks Power.
                          shrinkage_applied:
                            type: boolean
                            description: Must be true when final_model_prob ≥ 0.60.
                          shrinkage_baseline:
                            type: string
                            nullable: true
                            description: Baseline used for shrinkage, e.g. "season", "role_split", "market".
                record_entries:
                  type: boolean
                  description: >
                    If true, persist scored rows to the database for CLV
                    tracking. Default false.
                auto_enrich:
                  type: boolean
                  description: >
                    If true, auto-fetch market lines (Odds API) and
                    injury/status flags (ESPN) before running the pipeline.
                    Caller-supplied enrichment fields always win. Default false.
                response_mode:
                  type: string
                  enum: [full, slim]
                  default: full
                  description: >
                    Controls response payload size. Use "slim" for any slate
                    with more than ~6 rows to avoid ResponseTooLargeError.

                    full (default): complete prop_ledger with all gate internals.
                    Suitable for small slates (≤6 rows) or when the full audit
                    trail is needed.

                    slim: prop_ledger rows are compressed — each row's verbose
                    `gates` dict is replaced with a compact `gate_summary`
                    containing only status/result/decision fields per gate.
                    Verbose run-level reports (component_composite_report,
                    opportunity_state_report, acquisition_execution_report) are
                    omitted. All LLP-required fields are preserved:
                      - terminal_label, final_decision, blockers, warnings
                      - llp_label, llp_decision, rank_eligible
                      - calibrated_probability, event_key, event_status
                      - terminal_labels, final_card, summary (unchanged)
                      - data_status_ledger, market_validation_ledger (unchanged)
                      - injury_decision_ledger, clv_table (unchanged)
                    Typical response size reduction: 70–85%.
                    Recommended for: all MLB/NFL full-slate runs (≥6 rows).
                expected_patch_ids:
                  type: array
                  items:
                    type: string
                  description: >
                    Optional list of expected active patch IDs for additional
                    handshake verification. Omit unless you want strict patch
                    list matching.
                expected_master_spec_version:
                  type: string
                  description: >
                    Optional expected master spec version, e.g. "WOW-v16".
                    Omit unless you want strict version matching.
            example:
              expected_governance_hash: "2a74d11e20ee24526de6db9401f39b4a9228c0f46948d07cea72dc4a21111908"
              session_id: "session-2026-07-17-A"
              research_run_id: "rr-2026-07-17-001"
              as_of: "2026-07-17"
              rows:
                - player: "LeBron James"
                  sport: "NBA"
                  prop_type: "Points"
                  line: 27.5
                  direction: "MORE"
                  slate_date: "2026-07-17"
                  board_source: "PrizePicks"
                  game: "LAL vs GSW"
      responses:
        "200":
          description: >
            Scored pipeline result. Check terminal_labels per row for
            FINAL_APPROVED vs blocked outcomes. governance_handshake will
            be "GOVERNANCE_MATCH" on success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prop_ledger:
                    type: array
                    description: All rows with full gate audit trail
                    items:
                      type: object
                      additionalProperties: true
                  data_status_ledger:
                    type: array
                    description: Data availability status per row
                    items:
                      type: object
                      additionalProperties: true
                  terminal_labels:
                    type: array
                    description: Final label per row — check label and blockers
                    items:
                      type: object
                      properties:
                        row_id:
                          type: string
                        label:
                          type: string
                          description: >
                            e.g. FINAL_APPROVED, MODEL_QUALIFIED_HOLD,
                            CONDITIONAL_WATCH, WATCH, REJECT, RUN_INVALID
                        blockers:
                          type: array
                          items:
                            type: string
                  final_card:
                    type: array
                    description: Rows that reached FINAL_APPROVED
                    items:
                      type: object
                      additionalProperties: true
                  exposure_report:
                    type: object
                    additionalProperties: true
                  clv_table:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  summary:
                    type: object
                    description: Counts by terminal label
                    additionalProperties: true
                  governance_hash:
                    type: string
                    description: Server hash echoed back for verification
                  governance_handshake:
                    type: string
                    description: Always "GOVERNANCE_MATCH" on success
                  patch_ids_applied:
                    type: array
                    items:
                      type: string
                  can_approve_bets:
                    type: boolean
                    description: Always false
                  can_execute:
                    type: boolean
                    description: Always false
                  disclaimer:
                    type: string
                  session_id:
                    type: string
                  research_run_id:
                    type: string
                  as_of:
                    type: string
                  auto_enrichment_status:
                    type: object
                    nullable: true
                    additionalProperties: true
                  outright_winner_ledger:
                    type: array
                    description: >
                      Scored OUTRIGHT_WINNER / moneyline rows. Each entry exposes the full
                      WOW v16 Moneyline Architecture four-output contract. Runs after the
                      prop pipeline; can_execute=False unconditional on every entry.
                    items:
                      type: object
                      properties:
                        row_id:
                          type: string
                        sport:
                          type: string
                        team:
                          type: string
                        opponent:
                          type: string
                        terminal_label:
                          type: string
                          description: >
                            MODEL_QUALIFIED_HOLD (PROVISIONAL model), MONEY_QUALIFIED (ACTIVE + CLB>=0.55),
                            REJECT_TAIL_ONLY_UPSET, STALE_MODEL_INVALIDATED, DATA_CONTRACT_FAIL
                        probability_snapshot:
                          type: object
                          description: Immutable probability snapshot with four clean outputs.
                          properties:
                            independent_probability:
                              type: number
                              nullable: true
                              description: >
                                Sport-model probability (Elo, H2H, power ratings ONLY).
                                Zero sportsbook-price input. Cannot be substituted by odds.
                            calibrated_probability:
                              type: number
                              nullable: true
                              description: >
                                Bounded-shrinkage blend of independent + market no-vig.
                                Market enters HERE only (never upstream). Weight capped at 50%.
                            calibrated_probability_lower_bound:
                              type: number
                              nullable: true
                              description: >
                                Conservative floor accounting for sport volatility, sample size,
                                lineup certainty, model disagreement, source conflict, freshness.
                                USE THIS for candidate ranking — not raw probability.
                            calibrated_probability_upper_bound:
                              type: number
                              nullable: true
                            net_edge:
                              type: number
                              nullable: true
                              description: calibrated_probability minus market_no_vig. Downstream only.
                            snapshot_hash:
                              type: string
                              nullable: true
                            moneyline_architecture_layers:
                              type: object
                              description: >
                                Layer-by-layer observability from the 12-stage pipeline.
                                Keys: sport_model, simulation, failure_path, disagreement_audit,
                                calibration, classification, market_comparison, final_refresh,
                                slate_integrity.
                              properties:
                                sport_model:
                                  type: object
                                  description: Independent model (Elo/H2H/power). submodel_probs shows per-submodel point estimates.
                                simulation:
                                  type: object
                                  description: >
                                    Monte Carlo regime simulation. adjusted_prob is post-simulation independent probability.
                                    regime_distribution maps regime names to frequencies (0-1).
                                disagreement_audit:
                                  type: object
                                  description: >
                                    Cross-submodel disagreement. LOW=1x, MODERATE=1.15x, HIGH=1.35x uncertainty widening.
                                  properties:
                                    disagreement_grade:
                                      type: string
                                      enum: [LOW, MODERATE, HIGH]
                                    uncertainty_widening_factor:
                                      type: number
                                calibration:
                                  type: object
                                  description: >
                                    Dynamic calibration. market_weight <= 50%. Reports dynamic_uncertainty
                                    and all eight uncertainty components.
                                  properties:
                                    dynamic_uncertainty:
                                      type: number
                                    model_weight:
                                      type: number
                                    market_weight:
                                      type: number
                                    market_dependent_flag:
                                      type: boolean
                                classification:
                                  type: object
                                  description: >
                                    Lane (FAVORITE/UNDERDOG) determined by CLB only.
                                    Upset taxonomy: STRUCTURAL, VARIANCE_ASSISTED, TAIL_ONLY.
                                    TAIL_ONLY cannot qualify (REJECT_TAIL_ONLY_UPSET).
                                  properties:
                                    lane:
                                      type: string
                                      enum: [FAVORITE, UNDERDOG]
                                    upset_profile_type:
                                      type: string
                                    qualification_gate:
                                      type: string
                                market_comparison:
                                  type: object
                                  description: Exact no-vig comparison (stage 11, downstream only).
                        can_execute:
                          type: boolean
                          description: Always false
                        can_approve_bets:
                          type: boolean
                          description: Always false
                  outright_winner_contract_failures:
                    type: array
                    description: OUTRIGHT_WINNER rows that failed data-contract validation before scoring
                    items:
                      type: object
                      additionalProperties: true
                  outright_event_dedup_map:
                    type: object
                    description: >
                      dedup_key to list of original_row_ids. Same game submitted from multiple sportsbooks
                      is scored once; all source appearances preserved in platform_appearances.
                    additionalProperties:
                      type: array
                      items:
                        type: string
        "400":
          description: Missing or invalid rows array
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "422":
          description: >
            model_probability_ledger present but incomplete (Stage 2 schema
            violation). The ledger was supplied but is missing required fields
            or has out-of-bounds values. Fix the ledger and retry — or omit
            model_probability_ledger entirely to skip the prob_ledger gate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    description: Always "PROB_LEDGER_INCOMPLETE"
                  detail:
                    type: string
                    description: Human-readable summary of violations
                  violations:
                    type: array
                    items:
                      type: string
                    description: >
                      Per-violation strings. Prefix meanings:
                        missing:<field>       — required Stage 2 field absent
                        missing_component:<n> — required component not found
                        bound:<field>         — numeric value outside valid range
                        weight:<component>    — component weight outside bounds
                  affected_row_ids:
                    type: array
                    items:
                      type: string
                    description: row_id values for enrichment entries that failed
                  ok:
                    type: boolean
                    description: Always false
        "401":
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "409":
          description: >
            Governance handshake failed. Check error_code field:
              GOVERNANCE_MISMATCH      — wrong hash, call getWowGovernanceStatus to resync
              GOVERNANCE_UNAVAILABLE   — no snapshot, retry after backend recovers
              GOVERNANCE_CACHED_DEGRADED_RUN — snapshot used, ceiling capped at MODEL_QUALIFIED_HOLD
              RUN_INVALID_GOVERNANCE_MISMATCH — missing session_id / research_run_id / as_of
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                  detail:
                    type: string
                  ok:
                    type: boolean
                  retryable:
                    type: boolean
                  recovery_path:
                    type: string
                  governance_hash:
                    type: string
                    description: Current server hash (use this to resync)
                  retry_after_seconds:
                    type: integer
      security:
        - ApiKeyAuth: []

  /wow/stage2/health:
    get:
      operationId: getWowStage2Health
      x-openai-isConsequential: false
      summary: Stage 2 pipeline readiness — schema status and settlement worker stats
      description: >
        Returns Stage 2 data-pipeline health without any external I/O. Use to
        verify that all seven Stage 2 DB tables are initialised (schema_ready)
        and to inspect settlement-worker activity (last_success_tick, errors).

        Public endpoint — no API key required. Safe to call at any time.

        Key fields:
          schema_ready          — true once all 7 Stage 2 tables are created
          settlement_worker     — background grading daemon status
            .started            — thread has been launched
            .enabled            — SETTLEMENT_WORKER_DISABLED not set
            .ticks              — total polling cycles completed
            .props_graded       — cumulative prop-settlement rows graded
            .kalshi_graded      — cumulative Kalshi rows graded
            .last_tick          — ISO-8601 UTC timestamp of most recent tick
            .last_success_tick  — ISO-8601 UTC timestamp of last tick that graded ≥1 row
            .last_error         — last error string, or null
          can_execute           — always false (DRY_RUN_ONLY)
      responses:
        "200":
          description: Stage 2 health snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  schema_ready:
                    type: boolean
                  settlement_worker:
                    type: object
                    properties:
                      started:
                        type: boolean
                      enabled:
                        type: boolean
                      ticks:
                        type: integer
                      props_graded:
                        type: integer
                      kalshi_graded:
                        type: integer
                      errors:
                        type: integer
                      last_tick:
                        type: string
                        nullable: true
                      last_success_tick:
                        type: string
                        nullable: true
                      last_error:
                        type: string
                        nullable: true
                      interval_sec:
                        type: integer
                  can_execute:
                    type: boolean
                    description: Always false — DRY_RUN_ONLY_NO_LIVE_TRADING_NO_MARKET_ORDERS
                  execution_rule:
                    type: string

  /normalize-legs:
    post:
      operationId: normalizeLegs
      x-openai-isConsequential: false
      summary: Normalize raw OCR leg data into canonical rows the gate pipeline can score
      description: >
        Converts extracted leg data (from a slip screenshot or manual entry) into
        canonical NormalizedRow dicts by running a 9-step resolution pipeline:
        text normalisation → roster lookup → exact/fuzzy name match → team
        disambiguation → schedule lookup → stat key mapping → confidence stamping.

        Call this before /gate-engine/run when you have OCR-extracted or manually
        typed leg data that hasn't been canonicalized yet.

        Requires X-API-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - legs
              properties:
                legs:
                  type: array
                  description: >
                    Array of extracted legs. Each leg must have at minimum
                    player_name, sport, prop_type, side (MORE/LESS), and line_value.
                  items:
                    type: object
                    required:
                      - player_name
                      - sport
                      - prop_type
                      - side
                      - line_value
                    additionalProperties: true
                    properties:
                      leg_id:
                        type: string
                        description: Optional stable identifier (UUID recommended); auto-generated if omitted
                      player_name:
                        type: string
                        description: "Player name as OCR'd or typed, e.g. 'LeBron James'"
                      sport:
                        type: string
                        description: "Sport code: NBA, MLB, NFL, NHL, WNBA"
                      prop_type:
                        type: string
                        description: "Stat category as shown on the slip, e.g. 'points', 'hits', 'strikeouts'"
                      side:
                        type: string
                        description: "Direction: MORE, LESS, OVER, or UNDER"
                      line_value:
                        type: number
                        description: "The prop line, e.g. 27.5"
                      platform:
                        type: string
                        description: "Board platform: prizepicks, underdog, draftkings"
                      team:
                        type: string
                        description: Optional team hint to help disambiguation
                      ocr_confidence:
                        type: number
                        description: 0.0–1.0 OCR confidence estimate
                target_date:
                  type: string
                  description: "YYYY-MM-DD slate date for schedule lookup. Defaults to today."
                platform_hint:
                  type: string
                  description: "prizepicks | underdog | draftkings — used as default platform for all legs"
      responses:
        "200":
          description: Normalized rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  rows:
                    type: array
                    description: NormalizedRow objects, one per input leg
                    items:
                      type: object
                      properties:
                        leg_id:
                          type: string
                        player_id:
                          type: string
                          nullable: true
                        player_name_resolved:
                          type: string
                          nullable: true
                        sport:
                          type: string
                        stat_key:
                          type: string
                          nullable: true
                        line_value:
                          type: number
                          nullable: true
                        side:
                          type: string
                        team:
                          type: string
                          nullable: true
                        opponent:
                          type: string
                          nullable: true
                        game_time:
                          type: string
                          nullable: true
                        resolution_status:
                          type: string
                          description: "resolved | not_found | ambiguous | partial"
                        resolution_confidence:
                          type: number
                          nullable: true
                        matched_via:
                          type: string
                          nullable: true
                        flags:
                          type: array
                          items:
                            type: string
                  count:
                    type: integer
                  resolved:
                    type: integer
                    description: Number of legs with resolution_status == "resolved"
                  flagged:
                    type: integer
                    description: Number of legs that could not be fully resolved
        "422":
          description: Missing or malformed legs array
        "401":
          description: Missing or invalid X-API-Key
      security:
        - ApiKeyAuth: []

  /analyze-and-score:
    post:
      operationId: analyzeAndScore
      x-openai-isConsequential: false
      summary: Full slip pipeline — Vision extraction → normalize → enrich → gate engine → hit probability
      description: >
        One-call endpoint that runs the complete screenshot-to-scored-slip pipeline:

          Step A  Vision extraction   — Claude reads the slip image and extracts all legs
          Step B  Normalization       — player names, stat keys, teams resolved via roster lookup
          Step C  Auto enrichment     — Odds API market lines, ESPN injury status, game logs fetched
          Step D  Claude gap-fill     — unresolved players or missing data resolved via LLM search
          Step E  Gate pipeline       — full 22-gate WOW engine run per leg
          Step F  Hit probability     — MLB binomial formula / NBA–WNBA Poisson / Claude for others
          Step G  Explanation         — plain-English rationale per leg
          Step H  Expert review       — autonomous downgrade-only audit pass; any downgraded leg
                                        gets EXPERT_REVIEW_DOWNGRADE added to its flags and its
                                        terminal_label replaced; result in response.expert_audit

        Hard rule: hit_probability is null when no game log is available — the model never
        fabricates a value.

        Hard rule: expert review (Step H) is downgrade-only — it can make a verdict more
        conservative but never reinstate a killed leg or raise a confidence tier. Every slip's
        audit result is written to the slip_expert_review_log table; use GET /wow/slip-review-log
        to pull entries for batch postmortem.

        Requires X-API-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  description: >
                    Slip image as a base64-encoded string (with or without data URL prefix),
                    or a public HTTPS URL. JPEG, PNG, and WebP are all supported.
                platform_hint:
                  type: string
                  description: "prizepicks | underdog | draftkings — used to tune extraction prompt"
                  default: "prizepicks"
                user_id:
                  type: string
                  description: Optional user identifier for ledger tracking
                target_date:
                  type: string
                  description: "YYYY-MM-DD slate date. Defaults to today."
      responses:
        "200":
          description: Scored slip
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  slip_id:
                    type: string
                    description: Stable UUID for this scoring run
                  legs:
                    type: array
                    items:
                      type: object
                      properties:
                        leg_id:
                          type: string
                        player_name:
                          type: string
                        prop:
                          type: string
                          description: "Formatted prop string, e.g. 'PTS More 27.5'"
                        platform:
                          type: string
                        hit_probability:
                          type: number
                          nullable: true
                          description: >
                            P(hit) as 0.0–1.0. null when game log unavailable.
                            Use hit_probability_model to understand which formula was used.
                        hit_probability_model:
                          type: string
                          nullable: true
                          description: "mlb_formula_v2 | poisson_l_N | claude_estimate | bernoulli_hit_rate | no_data"
                        hit_probability_note:
                          type: string
                          nullable: true
                          description: One-sentence calibration note (inputs used, sample size, caveats)
                        terminal_label:
                          type: string
                          description: "WOW gate-engine terminal label, e.g. FINAL_APPROVED, MODEL_QUALIFIED_HOLD, LLP_REJECT"
                        confidence_tier:
                          type: string
                          nullable: true
                          description: "HIGH | MEDIUM | LOW | NONE"
                        edge_score:
                          type: number
                          nullable: true
                        explanation:
                          type: string
                          description: 2-3 sentence plain-English rationale for the evaluation
                        data_sources:
                          type: array
                          items:
                            type: string
                          description: "Sources used: odds_api, espn, nba_api, mlb_statsapi, balldontlie, claude_search"
                        flags:
                          type: array
                          items:
                            type: string
                          description: Any warning flags on this leg
                        resolution:
                          type: object
                          properties:
                            status:
                              type: string
                            confidence:
                              type: number
                              nullable: true
                            matched_via:
                              type: string
                              nullable: true
                        gate_trace:
                          type: array
                          description: First 10 gate results for this leg
                          items:
                            type: object
                            properties:
                              gate:
                                type: string
                              result:
                                type: string
                              reason:
                                type: string
                        probability:
                          type: object
                          description: >
                            Structured probability sub-object. calibrated_probability is
                            non-null only for ACTIVE models; PROVISIONAL models have
                            calibrated_probability=null and probability_publishable=false.
                          properties:
                            raw_probability:
                              type: number
                              nullable: true
                              description: Raw model output P(hit) 0–1 before calibration. null when no game log.
                            calibrated_probability:
                              type: number
                              nullable: true
                              description: >
                                Post-calibration P(hit). Non-null only for ACTIVE models.
                                PROVISIONAL models: null — never describe as calibrated.
                            calibrated_lower_bound:
                              type: number
                              nullable: true
                              description: Lower confidence bound (0–1). null when PROVISIONAL or data missing.
                            upper_bound:
                              type: number
                              nullable: true
                              description: Upper confidence bound (0–1). null when PROVISIONAL or data missing.
                            push_probability:
                              type: number
                              description: Probability of landing exactly on the line. 0.0 for most props.
                            calibration_status:
                              type: string
                              enum: [CALIBRATED, PROVISIONAL, UNAVAILABLE]
                              description: >
                                CALIBRATED — ACTIVE model with a real cohort calibration.
                                PROVISIONAL — model exists but lacks cohort calibration (NBA/WNBA).
                                UNAVAILABLE — probability is null (no game log or no model).
                            probability_publishable:
                              type: boolean
                              description: >
                                true only when model_status=ACTIVE and probability is non-null.
                                PROVISIONAL outputs are research-grade only — never describe as calibrated.
                            high_probability_qualified:
                              type: boolean
                              description: >
                                true when probability_publishable=true and raw_probability >= 0.65.
                                Signals a high-confidence hit candidate; still subject to gate-engine approval.
                        model:
                          type: object
                          description: Registry entry for the model used on this leg
                          properties:
                            model_id:
                              type: string
                              nullable: true
                              description: "e.g. mlb_binomial_v2, nba_poisson_v1"
                            model_version:
                              type: string
                              nullable: true
                            calibration_version:
                              type: string
                              nullable: true
                            status:
                              type: string
                              nullable: true
                              description: "ACTIVE | PROVISIONAL | NO_REGISTERED_MODEL"
                        backend:
                          type: object
                          description: >
                            Gate-engine classification metadata. Governs whether money-grade
                            actions are allowed and whether a provisional ceiling is in effect.
                          properties:
                            terminal_label:
                              type: string
                              description: Mirror of the top-level terminal_label for convenience
                            blockers:
                              type: array
                              items:
                                type: string
                              description: Blocker codes that prevented FINAL_APPROVED
                            power_eligibility:
                              type: boolean
                              description: Always false for screenshot-sourced slips
                            flex_eligibility:
                              type: boolean
                              description: true when terminal_label is in the flex-eligible label set and leg is resolvable
                            money_grade_allowed:
                              type: boolean
                              description: >
                                false when model_status=PROVISIONAL. A high numeric probability
                                on a PROVISIONAL model must NOT be treated as money-grade.
                                Check this flag before any stake-sizing logic.
                            model_ceiling:
                              type: string
                              nullable: true
                              description: >
                                "MODEL_QUALIFIED_HOLD" when model is PROVISIONAL (hard ceiling regardless
                                of numeric probability). null for ACTIVE models with no ceiling.
                        canonical_identity:
                          type: object
                          description: Resolved player and event identity
                          properties:
                            player_id:
                              type: string
                              nullable: true
                            player_name:
                              type: string
                            team:
                              type: string
                              nullable: true
                            opponent:
                              type: string
                              nullable: true
                            event_id:
                              type: string
                              nullable: true
                            event_start_time:
                              type: string
                              nullable: true
                        board:
                          type: object
                          description: Canonical board/prop details
                          properties:
                            platform:
                              type: string
                            prop_type:
                              type: string
                            line:
                              type: number
                              nullable: true
                            direction:
                              type: string
                              description: "MORE | LESS"
                            offer_type:
                              type: string
                              description: "standard | boosted | etc."
                            settlement_verified:
                              type: boolean
                              description: Always false for screenshot-sourced slips
                        evidence:
                          type: object
                          description: Data-sourcing status for key evidence types
                          properties:
                            game_log_status:
                              type: string
                              description: "RETRIEVED | MISSING"
                            market_status:
                              type: string
                              description: "RETRIEVED | MISSING"
                            role_timestamp:
                              type: string
                              nullable: true
                            web_fallback_used:
                              type: boolean
                              description: true when Claude search was used to resolve player or data
                            sources:
                              type: array
                              items:
                                type: string
                        risk:
                          type: object
                          description: Risk classification summary
                          properties:
                            role_risk:
                              type: string
                              description: "HIGH | MEDIUM | LOW | UNKNOWN"
                            failure_path_score:
                              type: number
                              nullable: true
                            market_conflict_status:
                              type: string
                              description: "NONE | CONFLICT | UNKNOWN"
                            correlation_tags:
                              type: array
                              items:
                                type: string
                        data_gaps:
                          type: array
                          description: >
                            Structured acquisition requests for fields the pipeline could not obtain.
                            The GPT MUST research ONLY the fields listed here — no other fields.
                            After retrieval, resubmit by injecting each field under the resubmission_key
                            path in the enrichment object and calling /analyze-and-score again.
                            Preserve source URLs and retrieval timestamps.
                            An empty array means the pipeline had everything it needed.
                          items:
                            type: object
                            properties:
                              field:
                                type: string
                                description: >
                                  Name of the missing field, e.g. "game_log", "sportsbook_line",
                                  "player_id_resolution". Research only this specific field.
                              required_for:
                                type: string
                                description: Which scoring capability this field unlocks
                              preferred_sources:
                                type: array
                                items:
                                  type: string
                                description: Ordered list of recommended data sources to try
                              minimum_records:
                                type: integer
                                nullable: true
                                description: Minimum number of records needed (e.g. 10 for game_log). null if not applicable.
                              accepted_format:
                                type: string
                                description: >
                                  How to format the value for resubmission, e.g.
                                  "list of floats [v1, v2, ...]" or "decimal odds float".
                              resubmission_key:
                                type: string
                                description: >
                                  Dot-path key for where to inject the retrieved value in the
                                  enrichment object, e.g. "enrichment.game_log" or
                                  "enrichment.sportsbook_line".
                  count:
                    type: integer
                  slip_summary:
                    type: object
                    properties:
                      correlation_risk:
                        type: string
                        description: "HIGH | MEDIUM | LOW — flags same-player or same-game stacking"
                      overall_recommendation:
                        type: string
                        description: Plain-English summary of the slip's overall evaluation
                      label_counts:
                        type: object
                        description: Count of legs per terminal label
                  source_status:
                    type: object
                    description: Per-data-source fetch status from auto enrichment
        "422":
          description: Missing or malformed image field
        "503":
          description: Anthropic API not configured
        "401":
          description: Missing or invalid X-API-Key
      security:
        - ApiKeyAuth: []

  /wow/slip-review-log:
    get:
      operationId: getSlipReviewLog
      x-openai-isConsequential: false
      summary: Retrieve expert-review audit log for batch postmortem
      description: >
        Returns audit log entries written by the autonomous expert-review pass
        (Step H) that runs after every /analyze-and-score call.

        Use this for periodic batch postmortem — compare pipeline verdicts against
        audit verdicts, review DOWNGRADED legs, and check EXPLANATION_OVERCONFIDENT /
        EXPLANATION_INCOMPLETE flags across a session.

        Requires X-API-Key.
      parameters:
        - name: slip_id
          in: query
          required: false
          schema:
            type: string
          description: Filter to a single slip UUID
        - name: verdict
          in: query
          required: false
          schema:
            type: string
            enum: [CONFIRMED, DOWNGRADED]
          description: Filter by audit verdict
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Max rows returned
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  total_count:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        slip_id:
                          type: string
                        reviewed_at:
                          type: string
                          description: ISO 8601 timestamp
                        audit_verdict:
                          type: string
                          description: "CONFIRMED | DOWNGRADED"
                        downgrade_count:
                          type: integer
                          description: Number of legs downgraded in this slip
                        leg_count:
                          type: integer
                        legs:
                          type: array
                          description: Per-leg audit results
                          items:
                            type: object
                            properties:
                              leg_id:
                                type: string
                              audit_result:
                                type: string
                                description: "CONFIRMED | DOWNGRADED"
                              original_label:
                                type: string
                              audit_label:
                                type: string
                                nullable: true
                                description: New label if downgraded
                              audit_reason:
                                type: string
                              explanation_flags:
                                type: array
                                items:
                                  type: string
                                description: "EXPLANATION_OVERCONFIDENT | EXPLANATION_INCOMPLETE"
                        correlation_audit:
                          type: object
                          properties:
                            pipeline_flag:
                              type: string
                            audit_flag:
                              type: string
                            escalated:
                              type: boolean
                        error:
                          type: string
                          nullable: true
                          description: Set if Claude was unavailable during review
        "401":
          description: Missing or invalid X-API-Key
        "500":
          description: Database error
      security:
        - ApiKeyAuth: []

components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Pass your SCORING_API_KEY value in the X-API-Key header.
        /wow/engine/health, /wow/governance/status, and /wow/stage2/health
        are public and do not require this key. /gate-engine/run, /normalize-legs,
        /analyze-and-score, and /wow/slip-review-log require it.
